name: Secret scan
on:
  push:
    branches-ignore: ["gh-readonly-queue/**"] # the merge queue runs on merge_group (RP-394)
  pull_request:
  merge_group:
permissions:
  contents: read
# Runs the gitleaks CLI (MIT) directly: gitleaks-action needs a paid licence
# for organisation repositories.
env:
  GITLEAKS_VERSION: 8.30.1
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      # Default rules plus .gitleaks.toml (fonts inlined as base64).
      - name: Scan full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # Font files are binary, which gitleaks skips; this refuses them by path.
      - name: No font files in history
        run: node scripts/check-no-fonts.ts
