name: Secret scan
on:
  # Push only on main: a PR branch is scanned once per push, by its pull_request
  # run (RP-395); the merge queue runs on merge_group (RP-394).
  push:
    branches: [main]
  pull_request:
  merge_group:
  # Every pushed branch, nightly (RP-678); by hand from the Actions tab too.
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Runs the gitleaks CLI (MIT) directly: gitleaks-action needs a paid licence
# for organisation repositories.
env:
  GITLEAKS_VERSION: 8.30.1
jobs:
  # The required check (main's ruleset names it "gitleaks"). It reads only the
  # commits this run adds (RP-678, RP-679): on 2026-10-18 a fake token in one
  # branch's history failed every open PR's scan and the queue's, because the
  # checkout fetches every branch and the scan read them all.
  gitleaks:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      # A pull request: its own commits. A queue entry: everything it would add to
      # main, from main's tip, because merge_group.base_sha already holds the
      # entries ahead and a green entry merges those too (as in ci.yml, RP-984).
      # main: its own history, no other branch.
      - name: Commits to scan
        id: range
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            merge_group) range="$(git rev-parse "refs/remotes/origin/${QUEUE_BASE#refs/heads/}")..$QUEUE_HEAD" ;;
            *) range=HEAD ;;
          esac
          echo "Scanning $range"
          echo "range=$range" >> "$GITHUB_OUTPUT"
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
      # Default rules plus .gitleaks.toml (fonts inlined as base64).
      - name: Scan this run's commits
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE" .
        env:
          RANGE: ${{ steps.range.outputs.range }}
      # The checks below run after an earlier one fails too, so one run lists every finding.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with: { node-version: 24 }
      # Font files are binary, which gitleaks skips; this refuses them by path,
      # and font data embedded in text, such as a Claude Design manifest (RP-962).
      - name: No fonts in this run's commits
        if: ${{ !cancelled() }}
        run: node scripts/check-no-fonts.ts --range "$RANGE"
        env:
          RANGE: ${{ steps.range.outputs.range }}
      # The pre-commit hook's token check (Atlassian, GitHub, Vercel, AWS, SendGrid, Basic auth, private keys),
      # so a commit made with the hook skipped or off is still refused (RP-1100). It reads only
      # the lines this run's commits add, and names each finding's file and line, never the token.
      - name: No tokens in this run's commits
        if: ${{ !cancelled() }}
        run: node scripts/check-secrets.ts --range "$RANGE"
        env:
          RANGE: ${{ steps.range.outputs.range }}

  # Not a required check: every pushed branch, whole history. The repo is public,
  # so a secret on any branch is already exposed: a red run here means rotate it,
  # not just delete it. Each finding names its commit, file and branches.
  every-branch:
    name: every branch (nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      # Without --log-opts, gitleaks reads every ref the checkout fetched: all branches.
      - name: Scan every branch
        run: |
          status=0
          ./gitleaks git --redact --verbose --exit-code 1 --report-format json --report-path findings.json . || status=$?
          if [ "$status" -ne 0 ] && [ -s findings.json ]; then
            echo "## Secret scan findings: rotate each secret, then remove it" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | [.Commit, .File, (.StartLine | tostring), .RuleID] | @tsv' findings.json |
              while IFS="$(printf '\t')" read -r commit file line rule; do
                branches="$(git branch -r --contains "$commit" --format='%(refname:lstrip=3)' | paste -sd ' ' -)"
                echo "::error file=$file,line=$line,title=gitleaks $rule::commit ${commit:0:9} on ${branches:-no branch}"
                echo "- \`$rule\` in \`$file:$line\`, commit \`${commit:0:9}\`, on: ${branches:-no branch}" >> "$GITHUB_STEP_SUMMARY"
              done
          fi
          exit "$status"
      # Runs after a secret finding too: a finding may stay open for days, until rotated.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with: { node-version: 24 }
      - name: No fonts on any branch
        if: ${{ !cancelled() }}
        run: node scripts/check-no-fonts.ts
