# The UAT Records container's deploy (RP-1042, ADR 0026): after each successful Deploy UAT
# (so the migration it needs has landed), build the worker image with the Thmanyah fonts,
# push it to Fly's registry and deploy it as the one machine of the Fly app FLY_RECORDS_APP
# (fly.records-uat.toml: Frankfurt, RECORD_SEALING=uat, WORKER_OUTBOX=records).
#
# The container's database and file-store secrets come from this `uat` environment
# (scripts/uat-deploy.ts records-env, piped into `flyctl secrets import`, never logged). The UAT
# sealing authority is the owner's own Fly secret: this workflow only checks that it is set,
# and never reads it. FLY_API_TOKEN is a deploy token for that one app.
#
# Owner setup (once): scripts/records-uat-wizard.sh.
name: Deploy UAT Records container
on:
  workflow_run:
    workflows: [Deploy UAT]
    types: [completed]
    branches: [main]
  # Redeploy main by hand (Actions > Deploy UAT Records container > Run workflow).
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # As in Deploy UAT: main only, and never an older commit over a newer one (runs can start
  # out of order, and an old run can be re-run).
  latest:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.head.outputs.version }}
    steps:
      - id: head
        env:
          VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          head=$(git ls-remote "$REPOSITORY" refs/heads/main | cut -f1)
          if [[ "$head" == "$VERSION" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at ${head:0:7}; its own run deploys it, not ${VERSION:0:7}."
          fi

  deploy:
    name: Deploy the Records container (environment uat)
    needs: latest
    if: needs.latest.outputs.version != ''
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 45
    # One at a time, never cancelled half way.
    concurrency:
      group: records-uat
      cancel-in-progress: false
    env:
      FLY_RECORDS_APP: ${{ vars.FLY_RECORDS_APP }}
      VERSION: ${{ needs.latest.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The uat environment has what the deploy needs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          missing=""
          for name in FLY_RECORDS_APP FLY_API_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these in the uat environment:$missing (scripts/records-uat-wizard.sh)"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Never reads them: only that the owner set both (their names alone are listed).
      - name: The UAT sealing authority is set on the Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          names=$(flyctl secrets list --app "$FLY_RECORDS_APP" --json | jq -r '.[].name // .[].Name')
          for name in UAT_SEALING_AUTHORITY_KEY UAT_SEALING_AUTHORITY_CERTIFICATE; do
            if ! grep -qx "$name" <<<"$names"; then
              echo "::error::$name is not set on $FLY_RECORDS_APP (scripts/records-uat-wizard.sh, stage 3)"
              exit 1
            fi
          done

      # Read-only key, read on the runner only, as in Deploy UAT. None: a warning, and IBM Plex Sans Arabic.
      - name: Thmanyah fonts
        env:
          FILE_STORE_ENDPOINT: ${{ vars.FILE_STORE_ENDPOINT }}
          FILE_STORE_REGION: auto
          BUILD_ASSETS_BUCKET: ${{ vars.BUILD_ASSETS_BUCKET }}
          FONTS_ACCESS_KEY_ID: ${{ secrets.FONTS_ACCESS_KEY_ID }}
          FONTS_SECRET_ACCESS_KEY: ${{ secrets.FONTS_SECRET_ACCESS_KEY }}
        run: |
          pnpm --filter @rabaed/api fonts:fetch
          shopt -s nocaseglob
          if ! compgen -G "packages/ui/fonts/thmanyah/thmanyahsans-*.woff2" >/dev/null; then
            echo "::warning::No Thmanyah fonts fetched; the records print in IBM Plex Sans Arabic."
          fi

      - name: Build the worker image and push it to Fly's registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          image="registry.fly.io/$FLY_RECORDS_APP:$VERSION"
          docker build --target worker --build-context fonts=packages/ui/fonts -t "$image" .
          flyctl auth docker
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # Staged: they apply with the deploy below. Each value is masked first (::add-mask::, so
      # nothing later in the log can show one, the derived database URL included), then the
      # lines go straight into flyctl: no echo, no tee, no file (Main 6, RP-1042).
      - name: The container's database and file-store secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_SUPERUSER_URL: ${{ secrets.DATABASE_SUPERUSER_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          FILE_STORE_ACCESS_KEY_ID: ${{ secrets.FILE_STORE_ACCESS_KEY_ID }}
          FILE_STORE_SECRET_ACCESS_KEY: ${{ secrets.FILE_STORE_SECRET_ACCESS_KEY }}
          FILE_STORE_ENDPOINT: ${{ vars.FILE_STORE_ENDPOINT }}
          PROJECT_FILES_BUCKET: ${{ vars.PROJECT_FILES_BUCKET }}
          UAT_WEB_URL: ${{ vars.UAT_WEB_URL }}
        run: |
          set -o pipefail
          lines=$(node scripts/uat-deploy.ts records-env)
          while IFS= read -r line; do
            value="${line#*=}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done <<<"$lines"
          printf '%s\n' "$lines" | flyctl secrets import --stage --app "$FLY_RECORDS_APP"

      # One machine (--ha=false): the outbox's skip-locked claim would allow two, but UAT needs one.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app "$FLY_RECORDS_APP" --config fly.records-uat.toml --image "$IMAGE" --ha=false --wait-timeout 600

      - name: The machine is running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          state=$(flyctl machine list --app "$FLY_RECORDS_APP" --json | jq -r '[.[] | select(.state == "started")] | length')
          if [ "$state" -lt 1 ]; then
            echo "::error::No machine of $FLY_RECORDS_APP is running; see flyctl logs --app $FLY_RECORDS_APP"
            exit 1
          fi
          echo "::notice::The Records container runs ${VERSION:0:7}."
