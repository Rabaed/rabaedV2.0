# Age UAT items (RP-922 comment 15225): by hand only. Runs the UAT tool's own code against Vercel
# UAT's database, never another: `uat:age` moves items back so they read Step Age N, and
# `uat:run-job` sends the daily digest or the weekly Step Age report now, through UAT's SendGrid.
# scripts/uat-guard.ts refuses anything but UAT's database (Supabase's pooler, rabaed_uat, inside
# GitHub Actions with RABAED_ENVIRONMENT=uat) and production everywhere. Dry run is on by default.
# The repository's run logs and step summaries are public, so (Main 6, 2026-10-31): every free-text
# input is read from the event file, never put in an env block; items must be Document Numbers, and
# anything else is masked and refused before a step prints anything; the member's email is masked;
# and the tool itself prints only Document Numbers, Step Ages and counts in GitHub Actions.
# Run it on main: Actions > Age UAT items > Run workflow.
name: Age UAT items
on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        required: true
        type: choice
        options: [age, digest, weekly-report]
      items:
        description: "age: Document Numbers, separated by commas (never a Subject: the run log is public)"
        required: false
        type: string
      weeks:
        description: "age: leave each item at this Step Age (1 to 52)"
        required: false
        type: string
      member:
        description: "digest or weekly-report: only this Member's email (empty: everyone the job would send to)"
        required: false
        type: string
      dry_run:
        description: Dry run (show what it would do; change and send nothing)
        required: true
        type: boolean
        default: true
permissions:
  contents: read
# An explicit bash adds -o pipefail (GitHub's default shell is `bash -e`, with none), so a failed aging or
# job run fails its step instead of ending with tee's status (RP-1208).
defaults:
  run:
    shell: bash

jobs:
  refused:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Run it on main; nothing was changed."
          exit 1

  run:
    name: Age UAT items (environment uat)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 15
    # Shared with Deploy UAT, Reset UAT and the Supabase gate: never two at once on UAT's database.
    concurrency:
      group: uat-database
      cancel-in-progress: false
    steps:
      # First, before any step prints anything. The inputs come from the event file, so no env block
      # shows them. The member's email is masked. Each item must be shaped like a Document Number
      # (scripts/uat-age.ts DOCUMENT_NUMBER); anything else is masked and the run stops here.
      - name: Check the inputs and mask them
        run: |
          # Before anything is echoed: one line each. A multi-line input (through the API or
          # `gh workflow run -f`) would print its later lines unmasked, and a line starting `::` would
          # be read as a workflow command. jq tests the value itself: $(...) drops trailing newlines.
          for key in items member weeks; do
            if jq -e --arg k "$key" '(.inputs[$k] // "") | test("[\r\n]")' "$GITHUB_EVENT_PATH" > /dev/null; then
              echo "::error::$key takes one line only; nothing was changed."
              exit 1
            fi
          done
          # A value is masked only from 8 characters: masking a short one ("2") would garble the
          # public log. So a short value is never printed: no message below shows an input.
          member="$(jq -r '.inputs.member // ""' "$GITHUB_EVENT_PATH")"
          if [ "${#member}" -ge 8 ]; then echo "::add-mask::$member"; fi
          items="$(jq -r '.inputs.items // ""' "$GITHUB_EVENT_PATH")"
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; s="${s%"${s##*[![:space:]]}"}"; printf '%s' "$s"; }
          refused=0
          IFS=',' read -ra list <<< "$items"
          for item in "${list[@]}"; do
            item="$(trim "$item")"
            if [ -z "$item" ]; then continue; fi
            if ! [[ "$item" =~ ^[A-Za-z0-9]+(-[A-Za-z0-9]+)+(\ [Rr]ev\ [0-9]+)?$ ]]; then
              if [ "${#item}" -ge 8 ]; then echo "::add-mask::$item"; fi
              refused=1
            fi
          done
          if [ "$refused" = "1" ]; then
            if [ "${#items}" -ge 8 ]; then echo "::add-mask::$items"; fi
            echo "::error::items takes Document Numbers only (the run log is public); nothing was changed."
            exit 1
          fi
          weeks="$(jq -r '.inputs.weeks // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$weeks" ] && ! [[ "$weeks" =~ ^[0-9]{1,2}$ ]]; then
            if [ "${#weeks}" -ge 8 ]; then echo "::add-mask::$weeks"; fi
            echo "::error::weeks is a whole number from 1 to 52; nothing was changed."
            exit 1
          fi
      - uses: actions/checkout@v7
        with: { ref: main, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run the UAT tool
        env:
          RABAED_ENVIRONMENT: uat
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_SUPERUSER_URL: ${{ secrets.DATABASE_SUPERUSER_URL }}
          DATABASE_MIGRATOR_PASSWORD: ${{ secrets.DATABASE_MIGRATOR_PASSWORD }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          UAT_WEB_URL: ${{ vars.UAT_WEB_URL }}
          # Only the choice and the box: their values are fixed words. Free text is read from the event file.
          COMMAND: ${{ inputs.command }}
          DRY_RUN: ${{ inputs.dry_run }}
        # The recipients' emails the tool might still print are masked by sed as well. The workflow's
        # defaults set shell: bash, which runs with pipefail, so the tool's exit code is the step's.
        run: |
          input() { jq -r --arg k "$1" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH"; }
          masked() { sed -E 's/[^[:space:]",:<>]+@[^[:space:]",:<>]+/<email>/g'; }
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; s="${s%"${s##*[![:space:]]}"}"; printf '%s' "$s"; }
          args=(--uat)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$COMMAND" = "age" ]; then
            IFS=',' read -ra list <<< "$(input items)"
            for item in "${list[@]}"; do
              item="$(trim "$item")"
              if [ -n "$item" ]; then args+=(--item "$item"); fi
            done
            node scripts/uat-age.ts --weeks "$(input weeks)" "${args[@]}" 2>&1 | masked | tee -a "$GITHUB_STEP_SUMMARY"
          else
            member="$(input member)"
            if [ -n "$member" ]; then args+=(--member "$member"); fi
            node scripts/uat-run-job.ts "$COMMAND" "${args[@]}" 2>&1 | masked | tee -a "$GITHUB_STEP_SUMMARY"
          fi
