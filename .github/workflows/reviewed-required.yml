name: Reviewed required
# A required check on the main ruleset (RP-606): fails while the PR has neither the
# `reviewed` label nor, on a PR that changes only docs, the `docs-only` label. It
# applies the same rule as `pnpm queue` (scripts/reviewed-required.ts), so a merge
# started from GitHub cannot skip the /code-review either.
# One job name, `reviewed-required`, on both events, so the merge queue runs it too.
# The code it runs is the default branch's, never the pull request's, and on a PR so is this file. On a PR it
# first waits for the head's reviewed-label run: that run removes a stale label with
# GITHUB_TOKEN, which starts no `unlabeled` run here.
# A draft PR passes with a note (RP-1018: a check red until the final review woke
# Auto-fix about 15 times on one draft). Marking it ready runs the check again, and
# a draft cannot be queued (one turned back to draft while queued is dropped in the queue).
# Since RP-1167 `reviewed` counts only when CI's reviewed-add added it, read from the PR's
# issue events, and the check fails while GitHub auto-merge is on; turning auto-merge on
# or off re-runs it.
# The label must exist in the repository: gh label create docs-only.
# pull_request_target: GitHub runs main's copy of this file for it (RP-1148 part A). On pull_request a PR ran
# its own copy, so it could rewrite its own required check. Nothing of the PR is checked out or run here:
# the job checks out the default branch and reads the PR through the API, with read-only permissions. A
# fork's PR runs too, and the script judges it (only docs-only can pass it). Under merge_group GitHub runs
# the merge commit's copy, which includes the PR's change; the script names the gate files a PR changes
# on both events (a warning until GATE_PATHS_BLOCK in scripts/reviewed-required.ts is turned on).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft, auto_merge_enabled, auto_merge_disabled]
  merge_group:
permissions: {}
concurrency:
  # A newer event on the same PR answers for the same head; the queue's entries each have their own ref.
  # The event in the name (RP-1148): a run of another event never cancels this one (a cancelled required check fails).
  group: reviewed-required-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reviewed-required:
    name: reviewed-required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # issues: the PR's issue events (who added `reviewed`, how it entered the queue). Its
    # pull-requests read already answers that endpoint (run 41187917270); this says so.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # The script merges before this workflow (RP-606), so a missing one is an error, never a pass.
      - name: Fail when the script is missing
        if: hashFiles('scripts/reviewed-required.ts') == ''
        run: |
          echo "::error::scripts/reviewed-required.ts is missing on the default branch; reviewed-required cannot check this PR"
          exit 1
      - name: Require the reviewed label
        run: node scripts/reviewed-required.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
