name: CI
on:
  # Push only on main (deploy-dev.yml follows it): a PR branch gets one run per
  # push, its pull_request run (RP-395). Merge queue branches run on
  # merge_group below; a push run there would cancel the queue's run (RP-394).
  push:
    branches: [main]
  pull_request:
  merge_group: # each queue entry, on its own gh-readonly-queue/main/... ref
  workflow_dispatch: # started by update-screenshots.yml after it commits new baselines
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Throwaway credentials for the CI-only database service.
env:
  DATABASE_SUPERUSER_URL: postgres://postgres:ci-only@localhost:5432/postgres
  DATABASE_MIGRATOR_URL: postgres://rabaed_migrator:ci-only@localhost:5432/rabaed
  DATABASE_APP_URL: postgres://rabaed_app:ci-only@localhost:5432/rabaed
  DATABASE_ADMIN_URL: postgres://rabaed_admin:ci-only@localhost:5432/rabaed

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabaed/web build
      # Like a fork's pull request, CI has no access to the private Thmanyah
      # fonts (RP-211): the build must still succeed, with the free fallback.
      - name: Built with the fallback Arabic font
        run: |
          grep -q "IBM Plex Sans Arabic" packages/ui/src/styles/arabic-font.css
          ! grep -q "Thmanyah" packages/ui/src/styles/arabic-font.css

  # The deploy runs the web image as the node user, able to write only .next
  # (Dockerfile). A crash at start-up there shows only as ECS's circuit
  # breaker, so build the image and start it as ECS does.
  web-image:
    name: web image starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build . --target web --load --tag rabaed-web:ci
      - name: Starts and answers the load balancer's health check
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=http://127.0.0.1:9 -e APP_VERSION=0000000 rabaed-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs web
          exit 1

  stories:
    name: story tests (behaviour, axe, screenshots)
    # Pinned so fonts and rendering match the committed screenshot baselines.
    runs-on: ubuntu-24.04
    steps:
      # PR code runs in this job: leave no credentials behind for it (RP-248).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabaed/ui exec playwright install --with-deps chromium
      # --update=new writes each missing reference and still fails its test; the
      # reporter records whether those are the only failures (RP-296).
      - id: stories
        run: pnpm test:stories --update=new --reporter=default --reporter=../../scripts/new-screenshots-reporter.ts
      - run: pnpm --filter @rabaed/ui build-storybook
      # The job still fails. On a pull request from a branch of this repository
      # (never a fork's), it uploads the new PNGs; after CI,
      # update-screenshots.yml commits them to the PR and re-runs CI (RP-395).
      # Never in the merge queue: nothing there commits screenshots (RP-394).
      - name: Collect the baselines of new stories
        id: new-baselines
        if: failure() && steps.stories.outcome == 'failure' && github.event_name != 'merge_group'
        env:
          SCREENSHOTS: packages/ui/test/__screenshots__
          VERDICT: packages/ui/.vitest/new-screenshots.json
          OUT: ${{ runner.temp }}/new-screenshots
          UPLOAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$(jq -r .onlyMissingReferences "$VERDICT" 2>/dev/null)" != true ]; then
            echo "Story tests failed for more than missing screenshot references."
            exit 0
          fi
          missing=$(jq -r .newBaselines "$VERDICT")
          changed=$(git status --porcelain --untracked-files=no -- "$SCREENSHOTS")
          new=$(git ls-files --others --exclude-standard -- "$SCREENSHOTS" | grep -c . || true)
          if [ -n "$changed" ] || [ "$new" != "$missing" ]; then
            echo "::warning::$missing missing references, but $new new files and these changed ones: $changed"
            exit 0
          fi
          echo "::notice::The only story test failures are $missing new stories without a screenshot baseline. On an open PR from a branch in this repository, the Update screenshots workflow commits them after CI and runs CI again; nothing to fix."
          if [ "$UPLOAD" = true ]; then
            mkdir -p "$OUT"
            (cd "$SCREENSHOTS" && git ls-files --others --exclude-standard -z . | xargs -0 cp --parents -t "$OUT")
            echo "staged=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the baselines of new stories
        if: failure() && steps.new-baselines.outputs.staged == 'true' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: new-screenshots
          path: ${{ runner.temp }}/new-screenshots
          if-no-files-found: error
          retention-days: 1
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: story-screenshot-diffs
          path: packages/ui/.vitest/attachments/
          if-no-files-found: ignore

  seam1:
    name: seam 1 (API as a Member)
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read } # actions: finds main's timing report (RP-321)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      # The same file store as docker-compose.yml: CI never calls AWS.
      files:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: ci-only
          RUSTFS_SECRET_KEY: ci-only-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://127.0.0.1:9000/health" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PROJECT_FILES_BUCKET: rabaed-project-files
      FILE_STORE_ENDPOINT: http://127.0.0.1:9000
      FILE_STORE_ACCESS_KEY_ID: ci-only
      FILE_STORE_SECRET_ACCESS_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:seam1 --reporter=default --reporter=json --outputFile.json=seam1-timing.json
      - if: always()
        uses: ./.github/actions/test-timing
        with: { title: "seam 1", report: seam1-timing.json, artifact: seam1-timing }

  seam2:
    name: seam 2 (database RLS)
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read } # actions: finds main's timing report (RP-321)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      # The global setup seeds the demo, whose MAR carries a file (RP-272).
      files:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: ci-only
          RUSTFS_SECRET_KEY: ci-only-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://127.0.0.1:9000/health" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PROJECT_FILES_BUCKET: rabaed-project-files
      FILE_STORE_ENDPOINT: http://127.0.0.1:9000
      FILE_STORE_ACCESS_KEY_ID: ci-only
      FILE_STORE_SECRET_ACCESS_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:seam2 --reporter=default --reporter=json --outputFile.json=seam2-timing.json
      - if: always()
        uses: ./.github/actions/test-timing
        with: { title: "seam 2", report: seam2-timing.json, artifact: seam2-timing }

  mail:
    name: mail (mailer against the catcher)
    runs-on: ubuntu-latest
    # The same catcher as docker-compose.yml: CI never sends real email.
    services:
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MAIL_CATCHER_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mail

  infra:
    name: infra (template assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:infra

  # Workflows keep the hardening rules review keeps finding: no persisted
  # credentials, no pull_request_target, no write token near fork code, third
  # party actions pinned to a SHA (RP-331). Only needs the repository files, so
  # it runs on every push and pull request, not only when workflows change:
  # a required check must always report.
  workflows-hardened:
    name: workflows hardened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-workflows.ts

  # A migration already on the base branch must stay byte-identical; only new
  # files are allowed (RP-287), and each must sort after every migration on the
  # base branch (RP-342). Pull requests only: a push has no base.
  migrations-immutable:
    name: migrations immutable
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/check-migrations-immutable.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  # A function, view or policy redefined both on the branch and on main must end
  # with a branch definition written after merging main's; no two migrations
  # share a timestamp (RP-337). A pull request checks out its merge ref, so the
  # branch and main sides come from the PR's head and base commits.
  migration-drift:
    name: migration drift and timestamps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/check-migration-drift.ts "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
