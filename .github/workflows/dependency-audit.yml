name: Dependency audit
# `pnpm audit` (RP-1023, RP-1032, RP-1070): known advisories in every package, dev dependencies
# included (why: scripts/dependency-audit.ts's header).
# Meant as a required check on main's ruleset ("pnpm audit", which the owner adds once this
# workflow is on main). The job fails on an advisory at high or above that
# `.audit-allowlist.json` does not list, with an error on the run and the PR's checks and a
# table in the job summary. An allow-listed one has a reason and a review date;
# an entry past its date, or no longer found, is a warning. It also fails when the audit
# could not run (a registry outage must not read as a clean audit).
#
# No `paths` filter: a required check must report on every PR and merge-group entry, or it
# stays pending (RP-984). scripts/dependency-audit-needed.ts decides whether this change can
# move the audit (the lockfile, any package.json, the allow-list, ...); when it can't, the
# audit steps are skipped and the job passes. The nightly run on main always audits:
# advisories are published against versions already merged, and a failure there is a red run
# on main.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # main's tip in the merge queue (base_ref), never the group's base_sha; the PR's base
      # otherwise; none on schedule and workflow_dispatch, which always audit.
      - id: needed
        run: node scripts/dependency-audit-needed.ts
        env:
          BASE: ${{ github.event.merge_group.base_ref || github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.needed.outputs.needed == 'true'
      # Reads pnpm-lock.yaml only: no install, so no package script runs. Every severity goes
      # into the JSON; the report splits it at --level. pnpm exits 1 on any finding and on a
      # failed request alike, so the report tells them apart.
      - name: pnpm audit
        if: steps.needed.outputs.needed == 'true'
        run: pnpm audit --json > audit.json || true
      - name: Report
        if: steps.needed.outputs.needed == 'true'
        run: node scripts/dependency-audit.ts audit.json --level high
