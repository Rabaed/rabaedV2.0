name: Dependency audit
# `pnpm audit --prod` (RP-1023): known advisories in the production dependencies.
# Not a required check, and reporting only: the job summary tables the findings,
# each one at high or above is a warning on the run, and the job passes. It fails
# only when the audit could not run. Making it required for lockfile changes waits
# for the existing high findings to be fixed or allow-listed with a reason.
#
# A `paths` filter is fine here because no ruleset requires this check; a required
# check needs ci.yml's `changes` job instead, or it stays pending (RP-984).
on:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - "**/package.json"
      - .github/workflows/dependency-audit.yml
      - scripts/dependency-audit.ts
  # main, nightly: advisories are published against versions already merged.
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: pnpm audit (reporting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # Reads pnpm-lock.yaml only: no install, so no package script runs. Every
      # severity goes into the JSON; the report splits it at --level. pnpm exits 1
      # on any finding and on a failed request alike, so the report tells them apart.
      - name: pnpm audit --prod
        run: pnpm audit --prod --json > audit.json || true
      - name: Report
        run: node scripts/dependency-audit.ts audit.json --level high
