name: Verify gate
# A required check on the main ruleset (RP-1094): fails unless the PR body holds a stamped
# `pnpm verify passed on <sha>:` line for its head, or for a commit only clean merges of main led
# to it from. It applies the same rule as `pnpm queue` (scripts/verify-gate.ts), so a PR added to
# the merge queue from GitHub cannot skip it (14 PRs merged without a valid line, retro 2026-10-29).
# One job name, `verify-gate`, on both events, so the merge queue runs it too.
# The code it runs is the default branch's, never the pull request's; the script fetches the PR's
# head itself and runs none of its code. Full history, so it can walk from the verified commit to
# the head and diff against origin/main (the queue's base_ref; merge_group.base_sha includes the
# entries ahead).
# `edited` runs it again when the body gets its verify line. A draft passes with a note (RP-1018);
# marking it ready runs the check again, and a draft cannot enter the merge queue.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  merge_group:
permissions: {}
concurrency:
  # A newer event on the same PR answers for the same PR; the queue's entries each have their own ref.
  group: verify-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-gate:
    name: verify-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # The script merged before this workflow (rule 3, #498), so a missing one is an error, never a pass.
      - name: Fail when the script is missing
        if: hashFiles('scripts/verify-gate.ts') == ''
        run: |
          echo "::error::scripts/verify-gate.ts is missing on the default branch; verify-gate cannot check this PR"
          exit 1
      - name: Require a stamped verify line
        run: node scripts/verify-gate.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
