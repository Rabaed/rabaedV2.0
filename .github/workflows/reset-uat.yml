# Reset UAT (RP-1043, ADR 0026): by hand only. Drops UAT's database, migrates it
# again from empty and seeds the demo (scripts/uat-deploy.ts demo reset, as
# deploy-dev.yml's reset_demo did). UAT keeps its data between deploys; this is
# the way back to the demo as seeded. Everything made on UAT since is lost.
# Run it on main: Actions > Reset UAT > Run workflow, typing `reset uat`.
# Role passwords are kept (DATABASE_ROLE_PASSWORDS=on-create): the apps keep
# logging in through Supavisor. Rotating a DATABASE_*_PASSWORD in `uat` needs a
# one-off ALTER ROLE as postgres first (RP-1043 comment 14538).
name: Reset UAT
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type `reset uat` to drop everything in UAT's database and seed the demo again
        required: true
        type: string
permissions:
  contents: read

jobs:
  # A run without the confirmation stops here, before it waits in the database's
  # group (where it would cancel a waiting deploy).
  refused:
    if: inputs.confirm != 'reset uat' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Run it on main, typing exactly \`reset uat\`; nothing was changed."
          exit 1

  reset:
    name: Reset UAT (environment uat)
    if: inputs.confirm == 'reset uat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 30
    # Shared with Deploy UAT and the Supabase gate: never two at once on UAT's database.
    concurrency:
      group: uat-database
      cancel-in-progress: false
    steps:
      # main as it is when the job runs (it may have waited behind a deploy), so the
      # database is migrated as far as the live apps expect.
      - uses: actions/checkout@v7
        with: { ref: main, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # With the api's own R2 key, the api the command builds stores the demo's
      # images, as the api stores anyone's (ADR 0007, RP-672).
      - name: Drop, migrate and seed the demo
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_SUPERUSER_URL: ${{ secrets.DATABASE_SUPERUSER_URL }}
          DATABASE_MIGRATOR_PASSWORD: ${{ secrets.DATABASE_MIGRATOR_PASSWORD }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          PROJECT_FILES_BUCKET: ${{ vars.PROJECT_FILES_BUCKET }}
          FILE_STORE_ENDPOINT: ${{ vars.FILE_STORE_ENDPOINT }}
          FILE_STORE_ACCESS_KEY_ID: ${{ secrets.FILE_STORE_ACCESS_KEY_ID }}
          FILE_STORE_SECRET_ACCESS_KEY: ${{ secrets.FILE_STORE_SECRET_ACCESS_KEY }}
        run: node scripts/uat-deploy.ts demo reset
      # Then, as rabaed_app: it cannot bypass row-level security or rewrite the audit trail.
      - name: Check the app role
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_SUPERUSER_URL: ${{ secrets.DATABASE_SUPERUSER_URL }}
          DATABASE_MIGRATOR_PASSWORD: ${{ secrets.DATABASE_MIGRATOR_PASSWORD }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
        run: |
          node scripts/uat-deploy.ts app-role-check
          echo "### UAT's demo was seeded again" >> "$GITHUB_STEP_SUMMARY"
