name: Reviewed add
# Adds the `reviewed` label when the PR's head has both a /code-review summary comment
# (`<!-- code-review: <sha> -->`, by a user with write access to the repo) and a passing verify:
# a stamped verify line in the body, or CI green on that exact head for a PR that changes none of
# CI's own files (RP-1118, RP-1190; owner's option b on RP-1098: no session labels its own PR).
# The rule is scripts/reviewed-add.ts; it waits for the head's reviewed-label run first,
# and re-runs the head's reviewed-required run, since a label added with GITHUB_TOKEN
# starts no `labeled` run.
# The script it runs is the default branch's, never the pull request's, and so is this file on every
# event it runs on. The script fetches the PR's head as data and runs none of its code. Full history,
# for the walk the script makes.
# pull_request_target: GitHub runs main's copy of this file for it (RP-1148 part A). On pull_request a PR
# ran its own copy, so it could rewrite what adds its `reviewed`. The job checks out only the default
# branch, and its write token never meets a fork's PR: the if: below skips one.
# A fork's PR is skipped here on pull_request_target and by the script on issue_comment.
# Not a required check (it must never be added to the main ruleset; it does not run on
# merge_group).
on:
  pull_request_target:
    # `edited`: the body gets its verify line. `synchronize`: a clean merge of main keeps both.
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    # The /code-review summary comment, posted by scripts/review-post.ts.
    types: [created, edited]
  # CI finished on a PR's head (RP-1190): CI green counts as the verify, so the script adds the
  # label then, and re-runs the head's verify-gate run, which ran before CI had finished.
  # workflow_run runs this file and the script from the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  reviewed-add:
    name: reviewed-add
    # A same-repo PR's events, and only comments that can change the answer: a marked
    # comment on a PR by a user, not a bot. Who counts is the script's call: it reads each
    # author's permission on the repo (write or admin), since `author_association` shows an
    # org member with a private membership as CONTRIBUTOR (RP-1159). Keep the marker and the
    # user check in step with `MARKER` and `isTrustedAuthor` there.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- code-review: ') &&
      github.event.comment.user.type == 'User') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # On the job, not the workflow: a skipped job (any other comment) never joins the group, so
    # it cannot replace a pending run that matters. One run per PR at a time; never cancelled,
    # since a run may be mid-way through adding the label, and two re-runs of one
    # reviewed-required run at once would fail. A CI run names its PR in pull_requests: empty for
    # a fork's (which the if: above skips), and now and then otherwise (a closed PR, a moved head),
    # when the script does nothing. Its head sha keys the group then.
    concurrency:
      group: reviewed-add-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Two waits of up to 1500 s each (the reviewed-label run, then the reviewed-required run).
    timeout-minutes: 60
    # The script's read of a comment author's permission (collaborators/{login}/permission)
    # needs only metadata: read, which every GITHUB_TOKEN has. actions: write is for the re-runs of
    # reviewed-required and verify-gate; it also covers reading the head's CI run and its jobs.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # The script merged before this workflow (rule 3, RP-1118 PR 1), so a missing one is an error, never a pass.
      - name: Fail when the script is missing
        if: hashFiles('scripts/reviewed-add.ts') == ''
        run: |
          echo "::error::scripts/reviewed-add.ts is missing on the default branch; reviewed-add cannot label this PR"
          exit 1
      - name: Add the reviewed label when the review and the verify (stamped line or CI green) name the head
        run: node scripts/reviewed-add.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
