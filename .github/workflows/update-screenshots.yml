# Commits story screenshot baselines, rendered on Linux, to a PR branch.
#
# Changed baselines: the "update-screenshots" label is the only way to ask for
# them from a PR (or, once this file is on main, run
#   gh workflow run update-screenshots.yml --ref <your-branch>
# by hand; that has no PR number, so it is keyed by the branch). A push never
# starts a render (RP-1199). Before, a push started one and the label another,
# and runs on the same PR cancelled each other; a baseline commit could also land
# while the PR was being verified (#577). Now there is one label run per PR at a
# time (the concurrency group below), asked for on purpose.
# The render job re-renders every baseline and the commit job commits them.
# The render job renders every story twice: a story whose two renders differ
# keeps its old baseline, and the unstable job fails naming it (RP-569).
# Then review the changed PNGs in the PR like any other change.
#
# The bot's push starts the PR's checks (RP-1121). With the workflow token it
# would start none (GitHub's rule), and the head would get no reviewed-label,
# reviewed-required or verify-gate run, so `pnpm queue` and the merge queue
# would wait forever. So the commit job pushes with a GitHub App installation
# token: an ordinary push, which starts every pull_request workflow on the new
# head. The reviewed label and the verify line carry over that one baseline
# commit (scripts/reviewed-label.ts: `baselineBotPush`, which needs the push's
# sender to be a bot, and `onlyCleanCommitsSince`). A push starts no render, so
# the bot's own commit never renders again.
# The App: repository variable SCREENSHOTS_APP_CLIENT_ID and secret
# SCREENSHOTS_APP_PRIVATE_KEY; the App has Contents read and write on this
# repository only (setup steps on RP-1121).
# Without them, or if the token cannot be made, it pushes with the workflow
# token and starts CI by hand as before; the head then gets no reviewed-label,
# reviewed-required or verify-gate run.
#
# New baselines need no step (RP-296). When CI's pull_request run fails for a
# PR from a branch of this repository and the stories job's only failures were
# missing references, that job uploads the new PNGs ("new-screenshots"). This
# workflow then runs on workflow_run, from main's copy of this file, and the
# commit job adds those PNGs. It never overwrites a baseline that exists, so a
# changed look still fails CI until the label is added, and any other failure
# uploads nothing. (CI runs on push only for main, so a PR branch's one CI run
# per push is its pull_request run; RP-395.)
# This path stays (RP-296), so a bot commit can still follow a push, in that one
# case: after a failed CI run it adds baselines for NEW stories only. That does not
# recreate #577: it never changes an existing baseline, so nothing a verify or a
# review looked at moves under it.
# A fork PR's run never reaches this path: find-new, which runs from main's
# copy of this file, requires the run's head repository to be this repository
# (a fork's pull_request run has the fork as its head repository). That is the
# guard; the stories job's own condition is not, since a fork's run uses the
# fork's ci.yml. The pull_request run renders the PR merged with its base, and
# the PNGs are committed onto the PR's head; if those differ in look, the CI
# run started after the commit fails and the label re-renders. Nor does the merge
# queue: its CI runs are merge_group, and nothing here ever pushes to a
# gh-readonly-queue/* branch (RP-394).
#
# The PR's code runs only in a job with a read-only token and no persisted
# credentials (render here, stories in ci.yml). The commit job holds the
# write token and never runs PR code: it only commits uploaded PNGs (RP-248).
name: Update screenshots
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
# An explicit bash adds -o pipefail: GitHub's default shell is `bash -e`, where `a | b` ends with b's status (RP-1208).
defaults:
  run:
    shell: bash
# Concurrency (RP-1199). A label run is keyed by the PR number,
# update-screenshots-<PR number>; a manual workflow_dispatch has no PR number, so
# it is keyed by the branch, update-screenshots-<branch>. The two can therefore run
# at once on one PR. That is safe: both re-render the same files, and a push to a
# branch that has moved is rejected, not forced. Manual runs are for branches
# without a PR. The workflow_run path (new baselines) has its own group,
# update-screenshots-new-<PR number, or the branch where there is none>.
# cancel-in-progress stays false: the commit job may be mid-push, and cancelling it
# would leave a baseline commit half done or never made. A second trigger waits
# instead, and replaces any other waiting run: at most one running and one waiting.
# That replacing is why there are two groups. A label run that is replaced never
# reaches its unlabel job, so the label would stay on and the request for all
# baselines would be lost. In the label's group only another label run can replace
# a waiting one, and the last of those removes the label. The two groups are safe
# together: the new-baselines run only adds PNGs that are missing (MODE new refuses
# to overwrite one, so after a label run has committed them it just fails with
# "already exist"), and a push to a branch that has moved is rejected, not forced.
# A run that would do nothing (any label but update-screenshots; a CI run find-new
# would skip, so the test below repeats find-new's conditions) gets a group of its
# own, so it can never replace a waiting run that matters; the jobs below skip it.
# A missing field is empty, not an error, so an empty pull_requests array falls
# through to the branch.
concurrency:
  group: >-
    update-screenshots-${{
    ((github.event_name == 'pull_request' && github.event.label.name != 'update-screenshots') ||
    (github.event_name == 'workflow_run' && !(
    github.event.workflow_run.conclusion == 'failure' &&
    github.event.workflow_run.event == 'pull_request' &&
    github.event.workflow_run.head_branch != 'main' &&
    !startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/') &&
    github.event.workflow_run.head_repository.full_name == github.repository)))
    && format('skipped-{0}', github.run_id)
    || github.event_name == 'workflow_run' && format('new-{0}',
    github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch)
    || github.event.pull_request.number
    || github.head_ref
    || github.ref_name }}
  cancel-in-progress: false

env:
  BRANCH: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  SCREENSHOTS: packages/ui/test/__screenshots__

jobs:
  # By hand (workflow_dispatch), or the label on a PR from a branch in this
  # repository: never a fork's PR, never main.
  render:
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.label.name == 'update-screenshots' &&
          github.event.pull_request.head.repo.full_name == github.repository))
    # Must match the stories job in ci.yml.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      # The stories whose two renders differed, one line each, as a JSON array (RP-569).
      refusal: ${{ steps.second.outputs.refusal }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabaed/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @rabaed/ui exec vitest run --update
      # RP-569: every story renders a second time, compared with the baseline its
      # first render just wrote. A story whose two renders differ would fail the
      # next CI run with its new baseline (fc18c1395), so its baseline is put back
      # as it was and is not committed; the refuse job then fails naming it.
      - id: second
        name: Render every story again and compare
        env:
          REPORTER: scripts/unstable-screenshots-reporter.ts
          RESULT: packages/ui/.vitest/unstable-screenshots.json
        run: |
          # Fail closed: a jq error in a pipe must stop the step, not commit an unstable baseline.
          set -o pipefail
          if [ ! -f "$REPORTER" ]; then
            echo "::notice::$REPORTER is not on this branch yet (merge main); skipping the second render."
            exit 0
          fi
          rm -f "$RESULT"
          pnpm --filter @rabaed/ui exec vitest run --reporter=default --reporter="../../$REPORTER" || true
          if ! jq -e '(.unstable | type) == "array" and (.otherFailures | type) == "array" and (.refusal | type) == "array"' "$RESULT" > /dev/null 2>&1; then
            echo "::error::The second render did not finish or wrote no readable result; see its log above. Nothing is committed."
            exit 1
          fi
          if [ "$(jq '.otherFailures | length' "$RESULT")" -gt 0 ]; then
            echo "::error::The second render failed for more than screenshots, so nothing is committed:"
            jq -r '.otherFailures[]' "$RESULT"
            exit 1
          fi
          # Keep each first render for the diffs artifact, then put the baseline back.
          mkdir -p packages/ui/.vitest/attachments/first-render
          jq -r '.unstable[].reference' "$RESULT" | while IFS= read -r file; do
            cp -- "$file" packages/ui/.vitest/attachments/first-render/ 2>/dev/null || true
            git checkout --quiet HEAD -- "$file" 2>/dev/null || rm -f -- "$file"
          done
          echo "refusal=$(jq -c '.refusal' "$RESULT")" >> "$GITHUB_OUTPUT"
      - name: Upload the unstable stories' two renders and diffs
        if: steps.second.outputs.refusal != '' && steps.second.outputs.refusal != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: unstable-screenshot-diffs
          path: packages/ui/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ env.SCREENSHOTS }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # A failed CI pull_request run of an open PR from a branch in this repository,
  # never a fork, main or a merge queue branch, whose stories job uploaded the
  # baselines of new stories.
  find-new:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != 'main' &&
      !startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "new-screenshots" and (.expired | not))] | length')
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
          if [ "$artifacts" -gt 0 ] && [ "$prs" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new baselines to commit ($artifacts artifacts, $prs open PRs)."
          fi

  commit:
    needs: [render, find-new]
    # The BRANCH expression again: env is not available in a job's if.
    if: >-
      !cancelled() &&
      !startsWith(github.event.workflow_run.head_branch || github.head_ref || github.ref_name, 'gh-readonly-queue/') &&
      (needs.render.result == 'success' || needs.find-new.outputs.found == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write # the flip-flop comment (RP-561)
    env:
      # "all" replaces every baseline (the label); "new" only adds missing ones (CI).
      MODE: ${{ github.event_name == 'workflow_run' && 'new' || 'all' }}
    steps:
      # RP-1121: a token whose push starts the PR's checks (see the header). Contents only;
      # it lives for this job. A failure here falls back to the workflow token.
      - id: app
        if: vars.SCREENSHOTS_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCREENSHOTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCREENSHOTS_APP_PRIVATE_KEY }}
          permission-contents: write
      # The commit the PNGs were rendered from: if the branch has moved since,
      # the push below is rejected rather than overwriting the newer commit.
      # keeps credentials: the push below needs them, and nothing here runs PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || needs.render.outputs.sha }}
          token: ${{ steps.app.outputs.token || github.token }}
          # Kept at full depth: the flip-flop check runs "git log origin/main..HEAD", which
          # needs the history down to the merge base, and its depth is not known up front
          # (a shallow fetch would list the whole branch as new commits).
          fetch-depth: 0 # (RP-561)
      - if: env.MODE == 'all'
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - if: env.MODE == 'new'
        uses: actions/download-artifact@v8
        with:
          name: new-screenshots
          path: ${{ runner.temp }}/screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The artifact came from a job that ran PR code: commit baselines only.
      - name: Only PNGs in the artifact
        run: |
          others=$(find "$RUNNER_TEMP/screenshots" -type f ! -name '*.png')
          if [ -n "$others" ]; then
            echo "::error::The artifact holds files other than PNGs:"
            echo "$others"
            exit 1
          fi
      - name: Place the baselines
        run: |
          if [ "$MODE" = all ]; then
            rm -rf "$SCREENSHOTS"
          else
            # A changed baseline must go through the label, so it gets reviewed.
            existing=$(cd "$RUNNER_TEMP/screenshots" && find . -type f -exec test -e "$GITHUB_WORKSPACE/$SCREENSHOTS/{}" \; -print)
            if [ -n "$existing" ]; then
              echo "::error::These baselines already exist; change them with the update-screenshots label:"
              echo "$existing"
              exit 1
            fi
          fi
          mkdir -p "$SCREENSHOTS"
          cp -R "$RUNNER_TEMP/screenshots/." "$SCREENSHOTS/"
      # RP-561: when the bot is about to change a baseline its own earlier commit
      # on this PR already changed, comment once on the PR (the commit is still
      # made below). The script comes from main, never from the PR's checkout:
      # this job holds a write token and runs no PR code. Until the script is on
      # main, or if anything here fails, the step only warns.
      - name: Check out main's scripts
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Check for a baseline that flip-flops
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BRANCH" in
            gh-readonly-queue/*) exit 0 ;;
          esac
          # Stage the new baselines: the script reads them with "git diff --cached".
          # This staging is kept (and repeated, harmlessly, by the commit step below).
          git add -A "$SCREENSHOTS"
          comment="$RUNNER_TEMP/flip-flop.md"
          rm -f "$comment"
          if [ ! -f trusted/scripts/screenshot-flip-flop.ts ]; then
            echo "::notice::screenshot-flip-flop.ts is not on main yet; skipping the check."
            exit 0
          fi
          node trusted/scripts/screenshot-flip-flop.ts "$comment" || { echo "::warning::The flip-flop check failed; committing anyway."; exit 0; }
          [ -f "$comment" ] || exit 0
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || { echo "::notice::No open PR for $BRANCH; not commenting."; exit 0; }
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- screenshot-flip-flop -->"))) | .id' | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$comment" > /dev/null || echo "::warning::Could not update the flip-flop comment."
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$comment" || echo "::warning::Could not post the flip-flop comment."
          fi
      - name: Commit changed baselines
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ env.MODE == 'new' && 'Add screenshot baselines for new stories' || 'Update story screenshot baselines' }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
        run: |
          case "$BRANCH" in
            gh-readonly-queue/*) echo "::error::$BRANCH is a merge queue branch; never commit to it."; exit 1 ;;
          esac
          git add -A "$SCREENSHOTS"
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "$MESSAGE"
            git push origin "HEAD:refs/heads/$BRANCH"
            if [ "$APP_TOKEN" = true ]; then
              echo "Pushed with the App's token: GitHub starts the PR's checks on the new head."
            else
              # Pushes made with the workflow token start no workflow; start CI explicitly.
              gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::Could not start CI; push any commit to re-run it."
              echo "::warning::Pushed with the workflow token, so the new head gets no reviewed-label, reviewed-required or verify-gate run. Set up the screenshot bot App (RP-1121); until then tell your Main, who closes and reopens the PR."
            fi
          fi

  # RP-569: fails when a story rendered differently twice. The render job put its
  # baseline back, so only the stable baselines reached the commit job. The lines
  # come from a job that ran PR code, so this job has no permissions, and each line
  # is printed behind its own ::error:: so none can start a workflow command.
  unstable:
    name: Refuse stories that render differently twice
    needs: [render, commit]
    if: >-
      !cancelled() &&
      needs.render.outputs.refusal != '' && needs.render.outputs.refusal != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          REFUSAL: ${{ needs.render.outputs.refusal }}
        run: |
          jq -r '.[]' <<< "$REFUSAL" | while IFS= read -r line; do
            echo "::error::${line//::/: :}"
          done
          echo "These stories' new baselines were left out of the commit: fix the story so it renders the same every time (docs/agents/ci-logs.md), then add the update-screenshots label again (a push starts no render)."
          exit 1

  unlabel:
    name: Remove the label so it can be added again
    needs: [render, commit]
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'update-screenshots'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label update-screenshots
