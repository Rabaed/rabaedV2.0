# Re-renders the story screenshot baselines on Linux and commits them to the
# PR branch. Use it when a PR changes the UI on purpose: add the
# "update-screenshots" label to the PR (or, once this file is on main, run
#   gh workflow run update-screenshots.yml --ref <your-branch>).
# Then review the changed PNGs in the PR like any other change.
#
# Baselines for new stories need neither: when the only story test failures
# are missing references, CI commits the new PNGs itself (the "commit new
# screenshot baselines" job in ci.yml, RP-296). A changed baseline still fails
# CI until this workflow re-renders it.
#
# The PR's code runs only in the render job, with a read-only token and no
# persisted credentials. The commit job holds the write token and never runs
# PR code: it only commits the baselines the render job uploaded (RP-248).
name: Update screenshots
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions: {}
concurrency:
  group: update-screenshots-${{ github.head_ref || github.ref_name }}

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  SCREENSHOTS: packages/ui/test/__screenshots__

jobs:
  render:
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.label.name == 'update-screenshots' &&
          github.event.pull_request.head.repo.full_name == github.repository))
    # Must match the stories job in ci.yml.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabaed/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @rabaed/ui exec vitest run --update
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ env.SCREENSHOTS }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  commit:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # The commit the render job rendered: if the branch has moved since,
      # the push below is rejected rather than overwriting the newer commit.
      # Credentials stay persisted for that push. Nothing here installs or
      # runs the app's code; the commit action, like this workflow file, comes
      # from the branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.render.outputs.sha }}
      - uses: ./.github/actions/commit-screenshots
        with:
          artifact: screenshots
          branch: ${{ env.BRANCH }}
          mode: all
          message: Update story screenshot baselines

  unlabel:
    name: Remove the label so it can be added again
    needs: [render, commit]
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'update-screenshots'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label update-screenshots
