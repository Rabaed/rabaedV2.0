# Re-renders the story screenshot baselines on Linux and commits them to the
# branch it runs on. Use it when a PR changes the UI on purpose:
#   gh workflow run update-screenshots.yml --ref <your-branch>
# Then review the changed PNGs in the PR like any other change.
name: Update screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update-screenshots-${{ github.ref }}

jobs:
  update:
    if: github.ref != 'refs/heads/main'
    # Must match the stories job in ci.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabaed/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @rabaed/ui exec vitest run --update
      - name: Commit changed baselines
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add packages/ui/test/__screenshots__
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update story screenshot baselines"
          git push origin "HEAD:$BRANCH"
          # Pushes made with the workflow token do not start CI; start it explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
