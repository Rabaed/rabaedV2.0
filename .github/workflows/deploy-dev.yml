name: Deploy dev
# Every merge to main that passes CI (build, tests, infra assertions) is
# deployed to dev: infrastructure → images → migrations → app (with Rabaed
# Admin, behind its own load balancer) → monitoring → smoke test → admin
# secret access check.
# A failed migration stops the deploy before the app changes; a version that
# never turns healthy is rolled back by ECS and fails the workflow. A version
# that turns healthy but then fails the smoke test or the app role check is
# rolled back here, to the last version that passed them, and fails the
# workflow too (RP-246). Dev is a demo environment: each deploy seeds the demo
# if it is missing, and a manual run can reset it (RP-213).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploy main by hand (Actions → Deploy dev → Run workflow), optionally
  # resetting the demo: the database is dropped, migrated and seeded again.
  workflow_dispatch:
    inputs:
      reset_demo:
        description: Reset the demo (drops everything in dev's database and seeds the demo again)
        type: boolean
        default: false
permissions:
  contents: read
# One deploy at a time, never cancelled half way. A newer merge waits; if
# several wait, only the newest runs.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # The environment to deploy. Every stack, repository and parameter name
  # comes from packages/infra/src/config.ts (the Names step), never from here.
  RABAED_ENV: dev

jobs:
  # CI runs can finish out of order; never deploy an older commit over a newer one.
  latest:
    # Needs the repository variables the AWS setup wizard records
    # (packages/infra/scripts/setup-aws-account.sh). The deploy role trusts
    # only the deploy job's environment, so nothing else could deploy anyway.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.head.outputs.version }}
    steps:
      - id: head
        env:
          VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          head=$(git ls-remote "$REPOSITORY" refs/heads/main | cut -f1)
          if [[ "$head" == "$VERSION" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $head; its own run deploys it."
          fi

  deploy:
    needs: latest
    if: needs.latest.outputs.version != ''
    runs-on: ubuntu-latest
    # The deploy role trusts only jobs in this environment, which admits only
    # main (setup wizard): no other job, workflow or branch can assume it.
    environment: dev
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.latest.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # NETWORK_STACK, …, SERVICES, IMAGE_REPOSITORY_PREFIX and LAST_GOOD_PARAMETER
      # (only this workflow writes it; the registry stack grants the deploy role access).
      - name: Names
        run: node packages/infra/bin/names.ts "$RABAED_ENV" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Infrastructure (network, database, image registry, storage)
        working-directory: packages/infra
        run: >-
          pnpm --silent cdk deploy -c "env=$RABAED_ENV" --exclusively --require-approval never --no-color --progress events
          "$NETWORK_STACK" "$DATA_STACK" "$REGISTRY_STACK" "$STORAGE_STACK"
          --outputs-file "$RUNNER_TEMP/infra.json"

      # The licensed Thmanyah fonts, uploaded by the setup wizard to the private
      # build assets bucket. This role may read only its fonts/ prefix. None
      # uploaded yet: the web build falls back to IBM Plex Sans Arabic. The
      # fonts never enter the repo or the workspace, only the web build.
      - name: Private fonts
        id: fonts
        run: |
          bucket=$(jq -r --arg s "$STORAGE_STACK" '.[$s].BuildAssetsBucket' "$RUNNER_TEMP/infra.json")
          dir="$RUNNER_TEMP/fonts/thmanyah"
          mkdir -p "$dir"
          # Retried: on the first deploy the grant was only just created.
          for attempt in 1 2 3 4 5 6; do
            aws s3 cp "s3://$bucket/fonts/thmanyah/" "$dir" --recursive --only-show-errors && break
            if (( attempt == 6 )); then echo "::error::cannot read the private fonts"; exit 1; fi
            sleep 10
          done
          # Names in any case, as the font switch accepts them (packages/ui/src/fonts/arabic-font.ts).
          shopt -s nocaseglob
          if compgen -G "$dir/thmanyahsans-*.woff2" >/dev/null; then
            echo "arabic_font=Thmanyah Sans" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Thmanyah fonts in the build assets bucket (setup wizard, last stage); Arabic falls back to IBM Plex Sans Arabic."
            echo "arabic_font=IBM Plex Sans Arabic" >> "$GITHUB_OUTPUT"
          fi

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags are immutable, so a commit's images are built once; a re-run reuses
      # them. The builds share their dependency layers in this builder.
      # Only web gets the fonts. The smoke test then expects the Arabic font
      # web was built with; a web image reused from an earlier run is only
      # checked for serving its fonts from our origin.
      - name: Build and push images
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ARABIC_FONT: ${{ steps.fonts.outputs.arabic_font }}
        run: |
          for service in $SERVICES; do
            repo="$IMAGE_REPOSITORY_PREFIX$service"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$VERSION" >/dev/null 2>&1; then
              echo "$repo:$VERSION already pushed"
              continue
            fi
            font_context=()
            if [[ "$service" == web ]]; then
              font_context=(--build-context "fonts=$RUNNER_TEMP/fonts")
              echo "arabic_font=$ARABIC_FONT" >> "$GITHUB_OUTPUT"
            fi
            docker buildx build . --target "$service" "${font_context[@]}" --platform linux/amd64 --tag "$REGISTRY/$repo:$VERSION" --push
          done
          rm -rf "$RUNNER_TEMP/fonts"

      - name: Migration task
        working-directory: packages/infra
        run: >-
          pnpm --silent cdk deploy -c "env=$RABAED_ENV" --exclusively --require-approval never --no-color --progress events
          "$MIGRATIONS_STACK" --parameters "ImageTag=$VERSION" --outputs-file "$RUNNER_TEMP/migrations.json"

      - name: Run migrations
        run: packages/infra/scripts/run-task.sh "$RUNNER_TEMP/migrations.json" "migrations (the app was not changed)"

      # Only demo environments have the demo password (packages/infra/src/config.ts).
      - name: Demo data
        id: demo
        env:
          RESET: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_demo }}
        run: |
          secret=$(jq -r --arg s "$MIGRATIONS_STACK" '.[$s].DemoPasswordSecret // empty' "$RUNNER_TEMP/migrations.json")
          if [[ -z "$secret" ]]; then echo "Not a demo environment."; exit 0; fi
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          action=ensure
          [[ "$RESET" == true ]] && action=reset
          packages/infra/scripts/run-task.sh "$RUNNER_TEMP/migrations.json" "demo $action" \
            /app/apps/api/node_modules/.bin/tsx /app/apps/api/src/cli/demo-environment.ts "$action"

      # The email sender comes from the setup wizard (a repository variable,
      # not in the repo). Until it is set, the App stack keeps its previous
      # value, empty at first: nothing may send email yet.
      - name: App
        id: app
        working-directory: packages/infra
        env:
          CERTIFICATE_ARN: ${{ vars.AWS_CERTIFICATE_ARN }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
        run: |
          mail=()
          if [[ -n "$MAIL_FROM_ADDRESS" ]]; then mail=(--parameters "MailFromAddress=$MAIL_FROM_ADDRESS"); fi
          pnpm --silent cdk deploy -c "env=$RABAED_ENV" --exclusively --require-approval never --no-color --progress events \
            "$APP_STACK" --parameters "ImageTag=$VERSION" --parameters "CertificateArn=$CERTIFICATE_ARN" "${mail[@]}" \
            --outputs-file "$RUNNER_TEMP/app.json"

      # Alarms on the app's load balancer, logs and database, and CloudTrail.
      - name: Monitoring
        working-directory: packages/infra
        run: >-
          pnpm --silent cdk deploy -c "env=$RABAED_ENV" --exclusively --require-approval never --no-color --progress events
          "$MONITORING_STACK"

      - name: Smoke test
        env:
          # The interim self-signed certificate (public, not secret), trusted
          # for this check only. Empty once dev has a real certificate.
          CERTIFICATE_PEM: ${{ vars.AWS_CERTIFICATE_PEM }}
          ARABIC_FONT: ${{ steps.images.outputs.arabic_font }}
          DEMO_SECRET: ${{ steps.demo.outputs.secret }}
        run: |
          if [[ -n "$CERTIFICATE_PEM" ]]; then
            printf '%s\n' "$CERTIFICATE_PEM" > "$RUNNER_TEMP/dev-ca.pem"
            export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/dev-ca.pem"
          fi
          export SMOKE_URL=$(jq -r --arg s "$APP_STACK" '.[$s].Url' "$RUNNER_TEMP/app.json")
          # Rabaed Admin answers on its own address, and the customer address serves none of it.
          export SMOKE_ADMIN_URL=$(jq -r --arg s "$APP_STACK" '.[$s].AdminUrl' "$RUNNER_TEMP/app.json")
          export SMOKE_VERSION="$VERSION"
          export SMOKE_ARABIC_FONT="$ARABIC_FONT"
          # In a demo environment, it also signs in as two demo people to check visibility.
          if [[ -n "$DEMO_SECRET" ]]; then
            SMOKE_DEMO_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$DEMO_SECRET" --query SecretString --output text)
            echo "::add-mask::$SMOKE_DEMO_PASSWORD"
            export SMOKE_DEMO_PASSWORD
          fi
          pnpm --filter @rabaed/infra smoke
          echo "### Deployed \`${VERSION:0:7}\` to $SMOKE_URL" >> "$GITHUB_STEP_SUMMARY"

      # ADR 0010: only Rabaed Admin's task role may read the password of
      # rabaed_admin, the role that bypasses row-level security. IAM is asked,
      # without reading the secret: the api's task role must be denied, and
      # Rabaed Admin's allowed (so the check can tell the two apart).
      - name: Admin secret access check
        run: |
          out() { jq -r --arg s "$APP_STACK" --arg k "$1" '.[$s][$k]' "$RUNNER_TEMP/app.json"; }
          secret=$(out AdminSecretArn)
          decision() {
            aws iam simulate-principal-policy --policy-source-arn "$1" --action-names secretsmanager:GetSecretValue \
              --resource-arns "$secret" --query 'EvaluationResults[0].EvalDecision' --output text
          }
          api=$(decision "$(out ApiTaskRoleArn)")
          admin=$(decision "$(out AdminTaskRoleArn)")
          echo "api task role: $api; Rabaed Admin task role: $admin"
          if [[ "$api" == allowed ]]; then echo "::error::The customer api's task role can read the admin secret"; exit 1; fi
          if [[ "$admin" != allowed ]]; then echo "::error::Rabaed Admin's task role cannot read the admin secret ($admin)"; exit 1; fi

      # As rabaed_app, inside the VPC: it cannot bypass row-level security or
      # rewrite the audit trail (packages/db/src/app-role-check.ts).
      - name: App role check
        run: >-
          packages/infra/scripts/run-task.sh "$RUNNER_TEMP/migrations.json" "app role check"
          ./node_modules/.bin/tsx src/check-app-role.ts

      # This version passed every check: it is what a later failed deploy rolls back to.
      - name: Record last good version
        id: record
        run: aws ssm put-parameter --name "$LAST_GOOD_PARAMETER" --value "$VERSION" --type String --overwrite >/dev/null

      # The app went live, then a later step failed (monitoring, smoke test,
      # admin secret access or app role check): put the last good version's images back; the job stays
      # red. Code only, not schema or the app stack's template (README step 9).
      # Not when recording itself failed: that version passed every check.
      - name: Roll back to the last good version
        if: failure() && steps.app.outcome == 'success' && steps.record.outcome == 'skipped'
        working-directory: packages/infra
        env:
          CERTIFICATE_ARN: ${{ vars.AWS_CERTIFICATE_ARN }}
        run: |
          if ! good=$(aws ssm get-parameter --name "$LAST_GOOD_PARAMETER" --query Parameter.Value --output text 2>"$RUNNER_TEMP/ssm.err"); then
            grep -q ParameterNotFound "$RUNNER_TEMP/ssm.err" || { cat "$RUNNER_TEMP/ssm.err" >&2; exit 1; }
            echo "::error::No version has passed the checks yet, so there is nothing to roll back to; dev stays on ${VERSION:0:7} until main is fixed."
            exit 1
          fi
          if [[ "$good" == "$VERSION" ]]; then
            echo "::error::${VERSION:0:7} passed the checks before, so it is itself the last good version; dev stays on it."
            exit 1
          fi
          for service in $SERVICES; do
            if ! aws ecr describe-images --repository-name "$IMAGE_REPOSITORY_PREFIX$service" --image-ids "imageTag=$good" >/dev/null 2>&1; then
              echo "::error::$IMAGE_REPOSITORY_PREFIX$service:$good is no longer in the registry; dev stays on ${VERSION:0:7}."
              exit 1
            fi
          done
          echo "::warning::${VERSION:0:7} failed its checks; rolling dev back to ${good:0:7}."
          pnpm --silent cdk deploy -c "env=$RABAED_ENV" --exclusively --require-approval never --no-color --progress events \
            "$APP_STACK" --parameters "ImageTag=$good" --parameters "CertificateArn=$CERTIFICATE_ARN"
          echo "### \`${VERSION:0:7}\` failed its checks; dev was rolled back to \`${good:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
