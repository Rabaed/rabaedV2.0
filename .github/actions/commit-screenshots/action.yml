# Commits story screenshot baselines from an artifact to a branch, then starts
# CI on it. Used by the commit jobs that hold the write token (RP-248, RP-296):
# they check out the commit the PNGs were rendered from (with credentials
# persisted for the push) and run no PR code apart from this action. The
# artifact came from a job that did run PR code, so only PNGs are committed.
name: Commit screenshot baselines
description: Commit the story screenshot baselines in an artifact and re-run CI
inputs:
  artifact:
    description: The artifact holding the PNGs, laid out as in packages/ui/test/__screenshots__
    required: true
  branch:
    description: The branch to push to
    required: true
  mode:
    description: >-
      "all" replaces every baseline with the artifact's; "new" only adds
      baselines that don't exist yet and fails if the artifact holds any other.
    required: true
  message:
    description: The commit message
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/screenshots
    - name: Only PNGs in the artifact
      shell: bash
      env:
        ARTIFACT: ${{ runner.temp }}/screenshots
      run: |
        others=$(find "$ARTIFACT" -type f ! -name '*.png')
        if [ -n "$others" ]; then
          echo "::error::The artifact holds files other than PNGs:"
          echo "$others"
          exit 1
        fi
    - name: Place the baselines
      shell: bash
      env:
        ARTIFACT: ${{ runner.temp }}/screenshots
        SCREENSHOTS: packages/ui/test/__screenshots__
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          all)
            rm -rf "$SCREENSHOTS"
            mkdir -p "$SCREENSHOTS"
            cp -R "$ARTIFACT/." "$SCREENSHOTS/"
            ;;
          new)
            # A changed baseline must go through the update-screenshots label, for review.
            existing=$(cd "$ARTIFACT" && find . -type f -exec test -e "$GITHUB_WORKSPACE/$SCREENSHOTS/{}" \; -print)
            if [ -n "$existing" ]; then
              echo "::error::These baselines already exist; change them with the update-screenshots label:"
              echo "$existing"
              exit 1
            fi
            mkdir -p "$SCREENSHOTS"
            cp -R "$ARTIFACT/." "$SCREENSHOTS/"
            ;;
          *)
            echo "::error::Unknown mode: $MODE"
            exit 1
            ;;
        esac
    - name: Commit and push
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCREENSHOTS: packages/ui/test/__screenshots__
        BRANCH: ${{ inputs.branch }}
        MESSAGE: ${{ inputs.message }}
      run: |
        git add -A "$SCREENSHOTS"
        if git diff --cached --quiet; then
          echo "Screenshots are already up to date."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          # Rejected, not forced, if the branch has moved since the checked-out commit.
          git push origin "HEAD:refs/heads/$BRANCH"
          # Pushes made with the workflow token do not start CI; start it explicitly.
          gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::Could not start CI; push any commit to re-run it."
        fi
