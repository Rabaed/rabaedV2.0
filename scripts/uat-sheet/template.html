<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabaed UAT – __ROUND__</title>
<style>
  :root {
    --bg:#f4f1ec; --card:#fff; --ink:#1c2230; --muted:#626b7d; --line:#e4e0d8; --soft:#faf8f5;
    --accent:#c8431f; --accent-ink:#a8330f; --accent-soft:#fdeee8; --navy:#1b2540; --navy-2:#2a3760;
    --pass:#1e7e45; --pass-soft:#e6f4ec; --fail:#b42318; --fail-soft:#fdecea; --blocked:#6941c6; --blocked-soft:#f0ebfb;
    --notrun:#5d6678; --notrun-soft:#eef0f4; --shadow:0 1px 2px rgba(28,34,48,.06), 0 4px 14px rgba(28,34,48,.06); --r:14px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 "Segoe UI", system-ui, -apple-system, Tahoma, Arial, sans-serif; }
  a { color:var(--accent-ink); }
  button, input, select, textarea { font:inherit; color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }

  /* Header with the overall progress */
  header.top { background:linear-gradient(135deg, var(--navy), var(--navy-2)); color:#fff; padding:22px 0 18px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { width:42px; height:42px; border-radius:11px; background:var(--accent); display:grid; place-items:center; font-weight:800; font-size:20px; box-shadow:0 4px 12px rgba(200,67,31,.35); }
  .brand h1 { margin:0; font-size:21px; line-height:1.25; }
  .brand .sub { color:#c7cfe2; font-size:13px; }
  .brand .grow { flex:1; }
  .ghost { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:10px; padding:7px 14px; cursor:pointer; }
  .ghost:hover { background:rgba(255,255,255,.16); }
  .overall { margin-top:16px; display:flex; align-items:center; gap:12px; font-size:13px; color:#dfe5f2; }
  .bar { flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; display:flex; }
  .bar span { height:100%; }
  .bar .p { background:#3fbf7f; } .bar .f { background:#ef6b5b; } .bar .b { background:#9b7bea; } .bar .n { background:#aab3c5; }

  main { padding:20px 0 90px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:14px; }
  .pad { padding:16px 18px; }

  /* Collapsible info cards (guide, people) */
  details.info > summary { list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:12px; font-weight:700; font-size:16px; }
  details.info > summary::-webkit-details-marker { display:none; }
  details.info > summary .ico { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-ink); font-size:15px; }
  details.info > summary .chev { margin-inline-start:auto; color:var(--muted); transition:transform .15s; }
  details.info[open] > summary .chev { transform:rotate(90deg); }
  [dir=rtl] .chev { display:inline-block; transform:scaleX(-1); }
  [dir=rtl] details.info[open] > summary .chev { transform:rotate(90deg); }
  .info .body { padding:0 18px 16px; }
  ol.guide { margin:0; padding:0; list-style:none; counter-reset:g; display:grid; gap:8px; }
  ol.guide li { counter-increment:g; display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; padding:9px 12px; background:var(--soft); border-radius:10px; }
  ol.guide li::before { content:counter(g); width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:1px; }
  .help { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .tableWrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table.people { border-collapse:collapse; width:100%; font-size:13px; }
  table.people th, table.people td { padding:8px 10px; text-align:start; vertical-align:top; border-bottom:1px solid var(--line); }
  table.people th { background:var(--soft); color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
  table.people tr:last-child td { border-bottom:0; }
  table.people tr.hl { background:#fff4ef; }
  .email { font-family:ui-monospace, Consolas, monospace; font-size:12px; white-space:nowrap; }
  .peopleMap { border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:12px; background:#fff; }
  .peopleMap svg { display:block; width:100%; height:auto; font-family:inherit; }
  .peopleMap a.person { text-decoration:none; cursor:pointer; }
  .peopleMap a.person:hover rect { filter:brightness(.95); }
  .peopleMap .t1 { font-size:14px; font-weight:700; } .peopleMap .t2 { font-size:12px; }
  .mini { padding:2px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:12px; cursor:pointer; }

  /* Toolbar */
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .field input, .field select { padding:8px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; min-width:150px; font-weight:400; color:var(--ink); }
  .field input:focus, .field select:focus, textarea:focus { outline:2px solid #f3b6a3; outline-offset:0; border-color:var(--accent); }
  .btn { padding:9px 15px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:600; font-size:14px; }
  .btn:hover { background:var(--soft); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(200,67,31,.25); }
  .btn.primary:hover { background:var(--accent-ink); }
  .spacer { flex:1; }
  #msg { font-size:13px; color:var(--pass); font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px; font-size:13px; background:var(--notrun-soft); }
  .chip b { font-size:15px; }
  .chip.pass { background:var(--pass-soft); color:var(--pass); } .chip.fail { background:var(--fail-soft); color:var(--fail); }
  .chip.blocked { background:var(--blocked-soft); color:var(--blocked); } .chip.owner { background:var(--accent-soft); color:var(--accent-ink); }

  /* Sections */
  details.section { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
  details.section > summary { list-style:none; cursor:pointer; padding:14px 18px; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section[open] > summary { border-bottom:1px solid var(--line); background:var(--soft); }
  .num { width:38px; height:38px; border-radius:11px; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:16px; }
  .section.owner .num { background:var(--accent); font-size:13px; }
  .section.done .num { background:var(--pass); }
  .stitle { font-weight:700; font-size:16px; }
  .smeta { font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:2px; }
  .sbar { height:6px; border-radius:99px; background:#ece8e1; overflow:hidden; display:flex; margin-top:7px; max-width:420px; }
  .sbar span { height:100%; } .sbar .p { background:var(--pass); } .sbar .f { background:var(--fail); } .sbar .b { background:var(--blocked); } .sbar .n { background:var(--notrun); }
  .sright { text-align:end; font-size:13px; color:var(--muted); white-space:nowrap; }
  .sright b { font-size:18px; color:var(--ink); }
  .scases { padding:14px; display:grid; gap:12px; background:#fbfaf8; }
  .snote { margin:0 4px; font-size:13px; color:var(--accent-ink); background:var(--accent-soft); padding:9px 12px; border-radius:10px; }

  /* A case */
  .case { background:#fff; border:1px solid var(--line); border-inline-start:5px solid #d9d4cb; border-radius:12px; display:grid; grid-template-columns:minmax(0,1fr) 360px; overflow:hidden; }
  .case.st-pass { border-inline-start-color:var(--pass); } .case.st-fail { border-inline-start-color:var(--fail); }
  .case.st-blocked { border-inline-start-color:var(--blocked); } .case.st-notrun { border-inline-start-color:var(--notrun); }
  .case.active { box-shadow:0 0 0 3px #f6c7b8; }
  .case .body { padding:14px 16px; min-width:0; }
  .case .rec { padding:14px 16px; border-inline-start:1px solid var(--line); background:var(--soft); }
  .case h3 { margin:0 0 6px; font-size:15.5px; line-height:1.4; }
  .cid { display:inline-block; font-family:ui-monospace, Consolas, monospace; font-size:12px; background:var(--navy); color:#fff; border-radius:6px; padding:1px 7px; margin-inline-end:6px; vertical-align:1px; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; font-size:12px; }
  .tag { padding:2px 8px; border-radius:6px; background:#eef0f4; color:#565f71; }
  .tag.need { background:#fdeee8; color:#a8330f; font-weight:600; } /* 6.2:1 */
  .tag a { color:inherit; }
  .lbl { font-weight:700; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 0 3px; }
  .who { font-size:14px; }
  ol.steps { margin:2px 0 4px; padding-inline-start:22px; }
  ol.steps li { margin:3px 0; }
  .exp { margin:2px 0 0; padding:9px 12px; background:var(--pass-soft); border-radius:9px; font-size:14px; }
  .note { margin:8px 0 0; padding:8px 11px; font-size:12.5px; color:#565f71; background:#faf8f5; border-inline-start:3px solid var(--line); border-radius:6px; }
  a.person { color:inherit; text-decoration:underline dotted; text-underline-offset:3px; }
  .status { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:10px; }
  .status button { padding:7px 4px; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; }
  .status button:hover { background:var(--soft); }
  .status button[aria-pressed=true].pass { background:var(--pass); color:#fff; border-color:var(--pass); }
  .status button[aria-pressed=true].fail { background:var(--fail); color:#fff; border-color:var(--fail); }
  .status button[aria-pressed=true].blocked { background:var(--blocked); color:#fff; border-color:var(--blocked); }
  .status button[aria-pressed=true].notrun { background:var(--notrun); color:#fff; border-color:var(--notrun); }
  .rec label { font-size:12px; color:var(--muted); font-weight:600; display:block; }
  .rec textarea { width:100%; min-height:84px; margin-top:4px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; resize:vertical; background:#fff; font-size:14px; }
  .drop { margin-top:9px; border:1.5px dashed #c9c2b6; border-radius:10px; padding:10px; font-size:12.5px; color:var(--muted); text-align:center; outline:none; cursor:pointer; background:#fff; }
  .drop:focus, .drop.over { border-color:var(--accent); background:#fff6f2; color:var(--accent-ink); }
  .shots { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .shot { position:relative; }
  .shot img { height:68px; max-width:118px; object-fit:cover; border:1px solid var(--line); border-radius:8px; display:block; cursor:zoom-in; }
  .shot button { position:absolute; top:-7px; inset-inline-end:-7px; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:13px; line-height:18px; cursor:pointer; }
  .saved { font-size:11.5px; color:var(--muted); margin-top:8px; min-height:15px; }
  .empty { padding:28px; text-align:center; color:var(--muted); }
  #lightbox { position:fixed; inset:0; background:rgba(15,19,30,.86); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
  #lightbox img { max-width:94vw; max-height:86vh; background:#fff; border-radius:8px; }
  #lightbox p { position:absolute; bottom:14px; color:#fff; font-size:13px; }
  @media (max-width: 920px) {
    .case { grid-template-columns:1fr; } .case .rec { border-inline-start:0; border-top:1px solid var(--line); }
    details.section > summary { grid-template-columns:auto 1fr; } .sright { grid-column:1 / -1; text-align:start; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo">R</div>
      <div class="grow">
        <h1><span data-t="title"></span></h1>
        <div class="sub">__ROUND__ · <span data-t="intro"></span> <span id="built"></span></div>
      </div>
      <button class="ghost" id="lang" type="button">العربية</button>
    </div>
    <div class="overall"><span id="overallText"></span><div class="bar" id="overallBar"></div></div>
  </div>
</header>
<main class="wrap">
  <details class="card info" id="guide" open>
    <summary><span class="ico">?</span><span data-t="startTitle"></span><span class="chev">›</span></summary>
    <div class="body"><ol class="guide" id="guideList"></ol></div>
  </details>
  <details class="card info" id="people">
    <summary><span class="ico">👥</span><span data-t="peopleTitle"></span><span class="chev">›</span></summary>
    <div class="body"><div id="peopleMap" class="peopleMap"></div><p class="help" data-t="peopleNote"></p><div class="tableWrap"><table class="people" id="peopleTable"></table></div></div>
  </details>
  <section class="card pad">
    <div class="toolbar">
      <label class="field"><span data-t="tester"></span><input type="text" id="tester" dir="auto"></label>
      <button class="btn primary" id="export" type="button" data-t="export"></button>
      <button class="btn" id="saveJson" type="button" data-t="saveJson"></button>
      <button class="btn" id="importBtn" type="button" data-t="importJson"></button>
      <button class="btn" id="mdBtn" type="button" data-t="mdBtn"></button>
      <input type="file" id="importFile" accept=".json" hidden>
      <span class="spacer"></span>
      <span id="msg" role="status"></span>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <label class="field"><span data-t="status"></span><select id="fStatus"></select></label>
      <label class="field"><span data-t="round"></span><select id="fRound"></select></label>
      <label class="field" style="flex:1 1 240px"><span data-t="search"></span><input type="search" id="fText" dir="auto" style="width:100%"></label>
    </div>
    <div class="chips" id="counts"></div>
  </section>
  <div id="sections"></div>
</main>
<div id="lightbox"><img alt=""><p></p></div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<script>/*__FFLATE__*/</script>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const now = () => new Date().toLocaleString("en-GB", { hour12: false });

// ---- Storage: IndexedDB, as screenshots are large. One database per round. ----
const DB_NAME = "rabaed-uat-sheet:" + DATA.round;
let db;
const entries = new Map(); // key -> { status, comment, shots: [id], at }
const shots = new Map(); // id -> { id, key, name, type, w, h, blob, url }
function openDb() {
  return new Promise((ok, no) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { const d = req.result; d.createObjectStore("entries"); d.createObjectStore("shots", { keyPath: "id" }); d.createObjectStore("meta"); };
    req.onsuccess = () => ok(req.result);
    req.onerror = () => no(req.error);
  });
}
const tx = (store, mode, fn) => new Promise((ok, no) => {
  const x = db.transaction(store, mode); const s = x.objectStore(store); const r = fn(s);
  x.oncomplete = () => ok(r && "result" in r ? r.result : undefined); x.onerror = () => no(x.error);
});
const all = (store) => new Promise((ok, no) => {
  const out = []; const req = db.transaction(store).objectStore(store).openCursor();
  req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } else ok(out); };
  req.onerror = () => no(req.error);
});
const entry = (key) => entries.get(key) ?? { status: "", comment: "", shots: [], at: "" };

async function saveEntry(key, e) {
  e.at = now(); entries.set(key, e);
  const card = document.querySelector(`.case[data-key="${key}"] .saved`);
  try { if (!db) throw new Error("no db"); await tx("entries", "readwrite", (s) => s.put(e, key)); if (card) card.textContent = t("saved") + " " + e.at; }
  catch { if (card) card.textContent = t("notSaved"); }
  progress();
}

// ---- Images: PNG or JPEG kept as is; anything else is redrawn as PNG. ----
function dims(blob) {
  return new Promise((ok, no) => { const u = URL.createObjectURL(blob); const img = new Image(); img.onload = () => { ok({ w: img.naturalWidth, h: img.naturalHeight, img }); URL.revokeObjectURL(u); }; img.onerror = no; img.src = u; });
}
async function normalise(file) {
  const { w, h, img } = await dims(file);
  if (file.type === "image/png" || file.type === "image/jpeg") return { blob: file, type: file.type, w, h };
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/png"));
  return { blob, type: "image/png", w, h };
}
// One change at a time per case, so two quick pastes don't both start from the old list.
const queues = new Map();
function queued(key, fn) {
  const p = (queues.get(key) ?? Promise.resolve()).then(fn);
  queues.set(key, p.catch(() => {}));
  return p;
}
const addShots = (key, files) => queued(key, () => addShotsNow(key, files));
const removeShot = (key, id) => queued(key, () => removeShotNow(key, id));
async function addShotsNow(key, files) {
  const e = entry(key);
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const n = await normalise(f);
      const id = key + ":" + Date.now() + ":" + Math.random().toString(36).slice(2, 7);
      const name = f.name && f.name !== "image.png" ? f.name : `${byKey.get(key).id}-${e.shots.length + 1}.${n.type === "image/jpeg" ? "jpg" : "png"}`;
      const rec = { id, key, name, type: n.type, w: n.w, h: n.h, blob: n.blob };
      if (db) await tx("shots", "readwrite", (s) => s.put(rec));
      shots.set(id, { ...rec, url: URL.createObjectURL(n.blob) });
      e.shots = [...e.shots, id];
    } catch { /* not an image this browser can read */ }
  }
  await saveEntry(key, e);
  drawShots(key);
}
async function removeShotNow(key, id) {
  const e = entry(key); e.shots = e.shots.filter((x) => x !== id);
  const s = shots.get(id); if (s) URL.revokeObjectURL(s.url); shots.delete(id);
  if (db) await tx("shots", "readwrite", (st) => st.delete(id));
  await saveEntry(key, e); drawShots(key);
}

// ---- Sections (RP-1204): the tester's cases by Part, numbered; the owner's cases last ----
const isOwner = (c) => c.needs.includes("owner");
const SECTIONS = (() => {
  const list = [];
  for (const c of cases.filter((x) => !isOwner(x))) {
    let s = list.find((x) => x.part === c.part);
    if (!s) { s = { id: "s-" + c.part, n: list.length + 1, part: c.part, name: PARTS[c.part] ?? { en: c.partName, ar: c.partName }, cases: [] }; list.push(s); }
    s.cases.push(c);
  }
  const owner = cases.filter(isOwner);
  if (owner.length) list.push({ id: "s-owner", n: 0, part: "OWNER", name: { en: "Cases the UAT owner runs", ar: "حالات يشغّلها مسؤول الاختبار" }, cases: owner });
  return list;
})();
const openSections = new Set();
const statusOf = (c) => entry(c.key).status || "unset";
function matches(c) {
  const r = $("fRound").value, s = $("fStatus").value, q = $("fText").value.trim().toLowerCase();
  return (!r || c.round === r) && (!s || statusOf(c) === s) &&
    (!q || [c.key, c.id, c.title, c.who, c.expected, ...c.steps, entry(c.key).comment].join(" ").toLowerCase().includes(q));
}
const filtering = () => Boolean($("fRound").value || $("fStatus").value || $("fText").value.trim());
const barHtml = (list, cls) => {
  const n = (s) => list.filter((c) => statusOf(c) === s).length, total = list.length || 1;
  return `<div class="${cls}">${[["p", "pass"], ["f", "fail"], ["b", "blocked"], ["n", "notrun"]].map(([k, s]) => `<span class="${k}" style="width:${(100 * n(s)) / total}%"></span>`).join("")}</div>`;
};
function sectionHead(s) {
  const done = s.cases.filter((c) => statusOf(c) !== "unset").length;
  const n = (st) => s.cases.filter((c) => statusOf(c) === st).length;
  const shown = filtering() ? s.cases.filter(matches).length : s.cases.length;
  const L = s.name[lang] ?? s.name.en;
  return `<div class="num">${s.n ? s.n : "👤"}</div>
    <div><div class="stitle">${s.n ? `${esc(t("section"))} ${s.n} · ` : ""}${esc(L)}</div>
      <div class="smeta"><span>${s.part === "OWNER" ? esc(t("ownerSection")) : esc(s.part)}</span><span>${s.cases.length} ${esc(t("cases"))}</span>
        ${filtering() ? `<span><b>${shown}</b> ${esc(t("search").toLowerCase())}</span>` : ""}
        ${["pass", "fail", "blocked"].filter((st) => n(st)).map((st) => `<span style="color:var(--${st})">${n(st)} ${esc(t(st))}</span>`).join("")}</div>
      ${barHtml(s.cases, "sbar")}</div>
    <div class="sright"><b>${done}</b> ${esc(t("of"))} ${s.cases.length} ${esc(t("done"))} <span class="chev">›</span></div>`;
}
function drawSections() {
  $("sections").innerHTML = SECTIONS.map((s) => {
    const open = openSections.has(s.id) || (filtering() && s.cases.some(matches));
    const done = s.cases.every((c) => statusOf(c) !== "unset");
    return `<details class="section${s.n ? "" : " owner"}${done ? " done" : ""}" id="${s.id}"${open ? " open" : ""}><summary>${sectionHead(s)}</summary><div class="scases"></div></details>`;
  }).join("");
  for (const s of SECTIONS) if ($(s.id).open) fillSection(s);
}
function fillSection(s) {
  const box = $(s.id).querySelector(".scases");
  const list = filtering() ? s.cases.filter(matches) : s.cases;
  box.innerHTML = (s.n ? "" : `<p class="snote">${esc(t("ownerNote"))}</p>`) + (list.length ? list.map(caseHtml).join("") : `<div class="empty">${esc(t("none"))}</div>`);
  list.forEach((c) => drawShots(c.key));
}
function progress() {
  // Header bar and chips: the tester's part; each open section's header too.
  const mine = cases.filter((c) => !isOwner(c));
  const n = (s) => mine.filter((c) => statusOf(c) === s).length;
  const done = mine.length - n("unset");
  $("overallText").textContent = `${t("overall")}: ${done} ${t("of")} ${mine.length}`;
  $("overallBar").outerHTML = barHtml(mine, "bar").replace('class="bar"', 'class="bar" id="overallBar"');
  $("counts").innerHTML = [...STATUSES, "unset"].map((s) => `<span class="chip ${s}"><b>${n(s)}</b>${esc(t(s))}</span>`).join("") +
    `<span class="chip owner"><b>${cases.length - mine.length}</b>${esc(t("ownerSection"))}</span>`;
  for (const s of SECTIONS) {
    const el = $(s.id); if (!el) continue;
    el.querySelector("summary").innerHTML = sectionHead(s);
    el.classList.toggle("done", s.cases.every((c) => statusOf(c) !== "unset"));

}

  const im = ev.target.closest("img[data-id]");
  if (im) { const lb = $("lightbox"); lb.querySelector("img").src = im.src; lb.querySelector("p").textContent = im.title; lb.style.display = "flex"; return; }
  if (ev.target.closest(".drop")) { $("pick").dataset.key = key; $("pick").click(); }
});
$("pick").addEventListener("change", async () => { const key = $("pick").dataset.key; if (key) await addShots(key, [...$("pick").files]); $("pick").value = ""; });
// A timer per case: typing in the next case never cancels this one's save.
const typing = new Map();
$("sections").addEventListener("input", (ev) => {
  const art = ev.target.closest(".case"); if (!art || ev.target.dataset.f !== "comment") return;
  const key = art.dataset.key, e = entry(key); e.comment = ev.target.value; entries.set(key, e);
  clearTimeout(typing.get(key)); typing.set(key, setTimeout(() => { typing.delete(key); saveEntry(key, e); }, 400));
});
$("sections").addEventListener("dragover", (ev) => { const d = ev.target.closest(".drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
$("sections").addEventListener("dragleave", (ev) => ev.target.closest(".drop")?.classList.remove("over"));
$("sections").addEventListener("drop", async (ev) => {
  const d = ev.target.closest(".drop"); if (!d) return;
  ev.preventDefault(); d.classList.remove("over");
  const key = d.closest(".case").dataset.key; setActive(key); await addShots(key, [...ev.dataTransfer.files]);
});
document.addEventListener("paste", async (ev) => {
  const files = [...(ev.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  // The case the paste is in, else the last one clicked if it is still on screen (not in a closed section or filtered away).
  const key = ev.target.closest?.(".case")?.dataset.key || (document.querySelector(`.case[data-key="${activeKey}"]`) ? activeKey : "");
  if (!key) return;
  ev.preventDefault(); await addShots(key, files);
});
document.addEventListener("click", async (ev) => {
  const copy = ev.target.closest?.("[data-copy]");
  if (copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = t("copied"); setTimeout(() => (copy.textContent = t("copy")), 1500); } catch {} return; }
  const a = ev.target.closest?.("a.person");
  if (a) {
    ev.preventDefault();
    $("people").open = true;
    const row = document.querySelector(a.getAttribute("href"));
    document.querySelectorAll("table.people tr.hl").forEach((r) => r.classList.remove("hl"));
    if (row) { row.classList.add("hl"); row.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
});
$("lightbox").addEventListener("click", () => ($("lightbox").style.display = "none"));
["fRound", "fStatus"].forEach((id) => $(id).addEventListener("change", () => { drawSections(); progress(); }));
let searching;
$("fText").addEventListener("input", () => { clearTimeout(searching); searching = setTimeout(() => { drawSections(); progress(); }, 200); });
$("lang").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; try { localStorage.setItem("rabaed-uat-sheet-lang", lang); } catch {} applyLang(); });
$("tester").addEventListener("input", () => { if (db) tx("meta", "readwrite", (s) => s.put($("tester").value, "tester")).catch(() => {}); });

function flash(m) { $("msg").textContent = m; setTimeout(() => ($("msg").textContent = ""), 6000); }
function download(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const fileTag = () => { const n = $("tester").value.trim(); return n ? n.replace(/[^\p{L}\p{N}]+/gu, "-") + "-" : ""; };
const roundTag = DATA.round.replace(/[^\p{L}\p{N}]+/gu, "-");
const sectionOf = (c) => SECTIONS.find((s) => s.cases.includes(c));
const sectionLabel = (c) => { const s = sectionOf(c); return s ? (s.n ? `${s.n}. ${s.name.en}` : s.name.en) : ""; };

// ---- Excel: Test Cases, Screenshots (pictures in their row), Summary ----
const EN = (s) => T.en[s || "unset"];
$("export").addEventListener("click", async () => {
  const tester = $("tester").value.trim(), when = now();
  const head = ["Section", "Key", "ID", "Part", "Round", "Title", "Sign in as", "Steps", "Expected result", "Needs", "Runs it", "UAT link", "Status", "Comment", "Screenshots", "Tester", "Updated"];
  const ordered = SECTIONS.flatMap((s) => s.cases);
  const table = [head, ...ordered.map((c) => {
    const e = entry(c.key);
    const names = e.shots.map((id) => shots.get(id)?.name).filter(Boolean);
    return [sectionLabel(c), c.key, c.id, c.part, c.round, c.title, c.who, c.steps.map((s, i) => `${i + 1}. ${s}`).join("\n"), c.expected,
      c.needs.join(", "), isOwner(c) ? "UAT owner" : "Tester", c.url,
      EN(e.status), e.comment, names.length ? `${names.length} on the Screenshots sheet: ${names.join(", ")}` : "", e.status || e.comment || names.length ? tester : "", e.at];
  })];
  const shotRows = [["Key", "ID", "File", "Screenshot"]], images = [], heights = {};
  for (const c of ordered) for (const id of entry(c.key).shots) {
    const s = shots.get(id); if (!s) continue;
    const scale = Math.min(1, 480 / s.w, 360 / s.h), w = Math.round(s.w * scale), h = Math.round(s.h * scale);
    const row = shotRows.length;
    shotRows.push([c.key, c.id, s.name, ""]);
    images.push({ row, col: 3, data: new Uint8Array(await s.blob.arrayBuffer()), ext: s.type === "image/jpeg" ? "jpeg" : "png", width: w, height: h, offsetX: 4, offsetY: 4 });
    heights[row] = Math.ceil((h + 8) * 0.75);
  }
  const n = (st) => cases.filter((c) => (entry(c.key).status || "") === st).length;
  const summary = [["Item", "Value"], ["Round", DATA.round], ["Tester", tester], ["Exported", when], ["Sheet built", DATA.built], ["Test Cases", cases.length],
    ["Pass", n("pass")], ["Fail", n("fail")], ["Blocked", n("blocked")], ["Not run", n("notrun")], ["Not set", n("")], ["Screenshots", images.length]];
  for (const s of SECTIONS) summary.push([s.n ? `Section ${s.n}: ${s.name.en}` : s.name.en, `${s.cases.filter((c) => statusOf(c) !== "unset").length} of ${s.cases.length} done`]);
  const bytes = buildXlsx([
    { name: "Test Cases", table, widths: [22, 9, 9, 6, 7, 40, 24, 60, 50, 16, 11, 28, 9, 50, 30, 14, 18] },
    { name: "Screenshots", table: shotRows, widths: [9, 9, 26, 70], rowHeights: heights, images },
    { name: "Summary", table: summary, widths: [40, 40] },
  ], fflate);
  download(`Rabaed-UAT-${roundTag}-${fileTag()}${stamp()}.xlsx`, new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  flash(t("exported"));
});

// ---- Markdown for an AI: the same cases, and the JSON to hand back (made by the generator) ----
$("mdBtn").addEventListener("click", () => {
  download(`Rabaed-UAT-${roundTag}.md`, new Blob([DATA.markdown ?? ""], { type: "text/markdown;charset=utf-8" }));
  flash(t("mdDone"));
});

// ---- JSON: the work and its screenshots, to move between machines (and what an AI hands back) ----
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
$("saveJson").addEventListener("click", async () => {
  const out = { sheet: "rabaed-uat-sheet", round: DATA.round, tester: $("tester").value, at: new Date().toISOString(), entries: {}, shots: [] };
  for (const [k, e] of entries) if (e.status || e.comment || e.shots.length) out.entries[k] = e;
  for (const s of shots.values()) out.shots.push({ id: s.id, key: s.key, name: s.name, type: s.type, w: s.w, h: s.h, data: b64(new Uint8Array(await s.blob.arrayBuffer())) });
  download(`Rabaed-UAT-${roundTag}-${fileTag()}${stamp()}.json`, new Blob([JSON.stringify(out)], { type: "application/json" }));
  flash(t("savedJson"));
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0]; $("importFile").value = ""; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (data.sheet !== "rabaed-uat-sheet") throw new Error(); } catch { flash(t("badJson")); return; }
  const known = new Set();
  for (const s of data.shots ?? []) {
    if (!byKey.has(s.key) || !s.id || !s.data) continue;
    try {
      const blob = new Blob([fromB64(s.data)], { type: s.type || "image/png" });
      const rec = { id: s.id, key: s.key, name: s.name || `${byKey.get(s.key).id}.png`, type: s.type || "image/png", w: s.w || 800, h: s.h || 600, blob };
      if (db) await tx("shots", "readwrite", (st) => st.put(rec));
      shots.set(s.id, { ...rec, url: URL.createObjectURL(blob) }); known.add(s.id);
    } catch { /* bad base64: skipped */ }
  }
  let n = 0;
  for (const [k, raw] of Object.entries(data.entries ?? {})) {
    if (!byKey.has(k)) continue;
    // Only the four statuses; a hand-made or AI-made file may hold anything.
    const e = { status: STATUSES.includes(raw.status) ? raw.status : "", comment: String(raw.comment ?? ""), shots: (raw.shots ?? []).filter((id) => shots.has(id) || known.has(id)), at: raw.at || now() };
    // Screenshots of the entry being replaced that the loaded one doesn't keep are removed, not left orphaned.
    for (const old of entry(k).shots) if (!e.shots.includes(old)) {
      const s = shots.get(old); if (s) URL.revokeObjectURL(s.url); shots.delete(old);
      if (db) await tx("shots", "readwrite", (st) => st.delete(old));
    }
    entries.set(k, e); n++;
    if (db) await tx("entries", "readwrite", (st) => st.put(e, k));
  }
  if (data.tester && !$("tester").value) $("tester").value = data.tester;
  drawSections(); progress(); flash(`${t("loaded")} ${n} ${t("cases")}`);
});

// ---- Start ----
(async () => {
  $("built").textContent = DATA.built;
  try { lang = localStorage.getItem("rabaed-uat-sheet-lang") === "ar" ? "ar" : "en"; } catch {}
  try {
    db = await openDb();
    for (const [k, e] of await all("entries")) entries.set(k, e);
    for (const [, s] of await all("shots")) shots.set(s.id, { ...s, url: URL.createObjectURL(s.blob) });
    const tester = await tx("meta", "readonly", (s) => s.get("tester"));
    if (tester) $("tester").value = tester;
  } catch { db = undefined; flash(T.en.notSaved); }
  applyLang();
})();
</script>
</body>
</html>
