t and Kanban headers use the GLOSSARY words: Stage not Status, Trade not Discipline, With not Current owner.\n\n### WF-15 Step Age dots count from the current Step\n\n- **Key:** `RP-808` · **Part:** WF · **Round:** 0 · **Needs:** setup, owner\n- **Sign in as:** Ali; Mohammed\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Precondition: ask the lane engineer to age two items (fixture AGE) by 1 and by 4 weeks.\n  2. Read the dots in the List, Kanban and item page for Ali and for Mohammed.\n- **Expected result:** Dots show 1 to 4+ weeks (4+ all red). For the holder's Company they count from the current Step; the other Company counts from when the item reached it. A Draft shows none. No due date appears.\n\n### PAR-01 Sign in, wrong password and sign out\n\n- **Key:** `RP-845` · **Part:** PAR · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Hafiz\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open lane 7 /en/sign-in.\n  2. Wrong password.\n  3. Right password (in .env.demo).\n  4. Sign out.\n  5. Open a Project URL while signed out.\n- **Expected result:** The wrong password gives one generic refusal. Sign-in opens Home. After sign-out a Project URL goes to sign-in. Cookies are per host (lane7.localhost).\n\n### PAR-02 Invite a Member and accept the invitation\n\n- **Key:** `RP-848` · **Part:** PAR · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Saeed (Authorized Person); a new person\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Members > Invite: a made-up .test email, name EN and AR, language.\n  2. Open the email in the mailbox and follow the link.\n  3. Set a password.\n- **Expected result:** The Member appears as invited, then active. The email arrives in the mailbox in the chosen language. The new Member belongs to TMC alone.\n\n### PKG-10 One grouped notification counts only what the reader sees\n\n- **Key:** `RP-693` · **Part:** PKG · **Round:** 1 · **Needs:** mail, owner\n- **Sign in as:** Ahmed (DCL engineer); Sara (Mechanical-only)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ali Submits a Package of five Electrical and three Mechanical items.\n  2. Read each engineer's bell and email in the mailbox.\n- **Expected result:** One notification per recipient: TMC Constructions Submitted PKG-nnn Name: n submittals, where n counts only what that person sees.\n\n### SIG-06 The record is sealed and a changed copy shows\n\n- **Key:** `RP-715` · **Part:** SIG · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open the PDF in Adobe Reader.\n  2. Change one byte of a copy and reopen.\n- **Expected result:** The original shows a seal that is present and intact; the signer is shown as unverified (lane 7 seals locally, RECORD_SEALING=local; Rabaed has no trusted certificate yet, ADR 0023). The changed copy shows the seal broken.\n\n### SIG-14 Record checks catch a bad PDF\n\n- **Key:** `RP-744` · **Part:** SIG · **Round:** 2 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ask a lane engineer to feed a broken record.\n- **Expected result:** A failed check alerts in Rabaed Admin instead of publishing; the item is not reopened.\n\n### IMP-12 A Rabaed Engineer imports for a Company\n\n- **Key:** `RP-869` · **Part:** IMP · **Round:** 5 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Admin)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. In Rabaed Admin pick the Project, the Participant, a default Member and a reason; run the import.\n  2. Hafiz opens the import.\n- **Expected result:** The Drafts are raised by the default Member; TMC's Members read Rabaed as who imported, never the Engineer's name; the reason is kept and the action logged.\n\n### NOT-03 Immediate email via the mailbox\n\n- **Key:** `RP-876` · **Part:** NOT · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open the mailbox.\n  2. Find the email for Step reached.\n- **Expected result:** Subject holds only the Document Number, Subject and what happened; body names the other Company by name only; links open the item; sent as the recipient may see it.\n\n### NOT-04 Email settings per group, Pause all, language\n\n- **Key:** `RP-879` · **Part:** NOT · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Profile & notification settings: set Step reached to Off, then Daily digest, then Immediately.\n  2. Pause all email.\n  3. Change the email language.\n- **Expected result:** Groups are Step reached me or my pool, Items I watch, Sent Back to my Participant, Weekly Step Age report; choices Off, Immediately, Daily digest. Paused email stops every email but the bell still fills. The weekly group is emailed on Sunday mornings.\n\n### NOT-05 Mute a Project\n\n- **Key:** `RP-882` · **Part:** NOT · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Mute Riyadh Gate Tower in the settings.\n  2. Hafiz sends a MAR to Ali.\n  3. Check bell and the mailbox.\n- **Expected result:** A muted Project sends no notifications or emails; the item still shows as Ali's under Need My Action.\n\n### NOT-06 Daily email digest\n\n- **Key:** `RP-886` · **Part:** NOT · **Round:** 0 · **Needs:** mail, job, owner\n- **Sign in as:** Ali (TMC PM); Yousef\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Set an email group to Daily digest.\n  2. Create events; ask the lane engineer to run the digest job (open question OQ-2).\n  3. Read the mailbox.\n- **Expected result:** One email per Member: subject names nothing; each entry names another Company only by name; an entry the Member can no longer see is left out; Yousef gets nothing of TMC's. Sent 07:00 Riyadh, Sunday to Thursday.\n\n### NOT-07 Weekly Step Age report\n\n- **Key:** `RP-888` · **Part:** NOT · **Round:** 0 · **Needs:** mail, job, setup, owner\n- **Sign in as:** Ali (TMC PM holding Assign); Yousef\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Setup first: give the tester's Position (Ahmed's on the Vercel UAT, Ali's on lane 7) Assign on Submittals. No demo Position holds Assign, so the report has no recipients until one does (RP-922). The report covers Submittals only, not WIRs.\n  2. Needs aged items (AGE fixture; the demo has only TWR-MAR-01-0002 and TWR-MAR-01-0003 Rev 1 open and numbered) and the lane engineer to run the job (OQ-2).\n  3. Read Ali and Yousef mail and open the link.\n- **Expected result:** Grouped 4+, 3, 2 and 1 weeks; lists only items the reader can open, never an un-numbered Draft; another Company by name only; Yousef lists only Beta Build items; an empty report is not sent; the link opens the List with the same filter.\n\n### NOT-10 Emails and the bell follow the Member's language\n\n- **Key:** `RP-896` · **Part:** NOT · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Faisal (Al Waha, Arabic)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Receive a notification and email as Faisal.\n- **Expected result:** The bell and email are in Arabic with Latin digits; Document Numbers read left to right.\n\n### NOT-11 A closed Project goes quiet\n\n- **Key:** `RP-900` · **Part:** NOT · **Needs:** mail, owner\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Close the Project.\n- **Expected result:** No bell entry or email of a closed Project; delivered ones stay readable. There is no close control yet.\n\n### I18N-02 Latin digits everywhere\n\n- **Key:** `RP-903` · **Part:** I18N · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Faisal (Arabic)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. In /ar read counts, dates, times, Step Age, Dashboard figures, emails and the PDF.\n- **Expected result:** Only Latin digits (0 to 9) appear; no Arabic-Indic digits. Dates are Gregorian; times Riyadh.\n\n### ADM-01 Sign in to Rabaed Admin with a password and an emailed code\n\n- **Key:** `RP-698` · **Part:** ADM · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Open Rabaed Admin (lane 7, port 4750) on its own address.\n  2. Enter email and password.\n  3. Read the 6-digit code from the mailbox.\n  4. Enter a wrong code, then the right one.\n- **Expected result:** A code is sent to the Engineer's email; a wrong code is refused; too many codes get a limit message; sign-in succeeds with the right code and a session cookie that is not the Company app's. Credentials of a Member of the Company app do not work here.\n\n### ADM-02 Onboard a Company (fixture UAT Owner Co)\n\n- **Key:** `RP-701` · **Part:** ADM · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Onboard a Company: legal names EN and AR, CR 9999000005, VAT 399990000000053, Authorized Person Reem UAT (a made-up .test email), language, a reason.\n  2. Open the invitation in the mailbox and accept as Reem.\n- **Expected result:** The Company and its Authorized Person are created and an invitation emailed; the action is logged with the reason; Reem signs in to the Company app. Needed for PAR-16.\n\n### ADM-03 Duplicate CR, VAT or email is refused\n\n- **Key:** `RP-703` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Onboard again with CR 9999000001.\n  2. Then a new CR with an existing email.\n- **Expected result:** Each conflict is refused naming what clashes (CR number, VAT number or email) and creates nothing.\n\n### ADM-04 Onboarding leads and closing a lead\n\n- **Key:** `RP-706` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer; Saeed\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Saeed (Project Admin) invites a CR number not on Rabaed (PAR-06 variant).\n  2. Engineer: Show leads (reason), then Close lead (reason).\n- **Expected result:** The CR shows as a lead with Project, Host Company, requested and state. Closing it takes it off the Engineer's list only; Saeed still sees his invitation pending. Both kinds of CR give Saeed the same answer.\n\n### ADM-05 Option Lists need a reason and never delete\n\n- **Key:** `RP-708` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Create an Option List with three levels.\n  2. Edit, retire an option (reason each time).\n- **Expected result:** Every edit needs a reason; a retired option stops being offered but stays where it was chosen.\n\n### ADM-06 Numbering for a Project from Admin\n\n- **Key:** `RP-710` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Numbering: enter a Project id and reason, show it.\n  2. Set a pattern, a Participant Code and a starting number.\n- **Expected result:** The same rules as the Project Admin's; every read and edit needs a reason; Participant Code 2 to 6 letters or digits, fixed once used.\n\n### ADM-07 Rabaed Default Workflows: save, publish, outcomes and Stages\n\n- **Key:** `RP-722` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Workflows: open MAR; Save draft; Publish with a reason.\n  2. Add an outcome and a Stage, rename and reorder them.\n- **Expected result:** The builder is the same as in Project Settings; every change is refused without a reason and logged. A new Version reaches only new items; an added outcome or Stage reaches only Projects created afterwards. No Member can open a Rabaed Default draft.\n\n### ADM-08 Publish is refused while Projects lack an outcome\n\n- **Key:** `RP-725` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Add an outcome to a Type's set; publish a Rabaed Default Version that uses it while the seeded Project lacks it.\n- **Expected result:** Refused with how many Projects and which outcomes or Stages, never which Projects or Companies; nothing publishes; the refusal is logged.\n\n### ADM-09 Admin is separate from the Company app\n\n- **Key:** `RP-726` · **Part:** ADM · **Round:** 0 · **Needs:** owner\n- **Sign in as:** Engineer; Hafiz\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Open an Admin URL on the web port and a web URL on the Admin port.\n  2. Sign out of one.\n- **Expected result:** Different addresses and cookies; the Company app never serves Admin pages.\n\n### ADM-10 An Engineer fixes a stuck Step\n\n- **Key:** `RP-729` · **Part:** ADM · **Needs:** owner\n- **Sign in as:** Engineer (Rabaed Engineer)\n- **Start at:** https://rabaed-uat-admin.vercel.app\n- **Steps:**\n  1. Open a MAR in Admin; reassign or reset the Step with a reason.\n- **Expected result:** The read and the action are logged with the reason; the Engineer never takes a Transition or changes a Workflow version.\n\n### UX-11 Sign-in, wrong password and accepting an invitation\n\n- **Key:** `RP-933` · **Part:** UX · **Round:** 0 · **Needs:** mail, setup, owner\n- **Sign in as:** A new invitee (fixture from PAR-02); Hafiz\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open sign-in EN and AR at 1366 and 375.\n  2. Wrong password, then right.\n  3. Open an invitation link and accept.\n- **Expected result:** Laid out as design/prompts/sign-in.md: one error for a wrong email or password, clear invitation steps, Arabic-first users land in Arabic.\n\n### VIS-16 Creation Date, Submission Date and saved times stay inside TMC\n\n- **Key:** `RP-788` · **Part:** VIS · **Round:** 0 · **Needs:** setup, owner\n- **Sign in as:** Actors: Hafiz, Ali (TMC). Observers: Ahmed, Mohammed (DCL)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Hafiz saves a Draft, sends it, Ali Submits.\n  2. Compare the item page and List for TMC and for DCL; look at the ids in the address bar and in links.\n  3. Check the order of un-numbered Drafts.\n  4. Needs AGE for the date checks.\n- **Expected result:** TMC sees Creation Date (when it got its number) and Submission Date; DCL sees only the Submission Date and no Creation Date in any form. Ids carry no time. Un-numbered Drafts come last, ordered by Subject. Answer times and Saved read the Creation Date or later; a Revision follows its own Creation Date. The stored earlier times are covered by the automated suite.\n\n### VIS-17 Step Age and With are counted per Company\n\n- **Key:** `RP-792` · **Part:** VIS · **Round:** 0 · **Needs:** setup, owner\n- **Sign in as:** Actors: Ali (TMC); Ahmed, Mohammed (DCL)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ali Submits.\n  2. Ahmed picks it up, sends to Manager, Mohammed Returns it to Ahmed.\n  3. Ali reads With, the Stage, Step Age and the workflow drawer.\n  4. Needs AGE: age the item 5 weeks inside TMC, then Submit.\n- **Expected result:** Ali sees With Design Consultants LLC and Step Age counted from the Submit, no reset, no internal move. DCL Step Age runs from when the item reached DCL (week 1), not the five weeks inside TMC; four weeks later it counts for DCL. No Step or person of the other Company appears.\n\n### VIS-21 Watch is private and ends when the viewer loses sight\n\n- **Key:** `RP-799` · **Part:** VIS · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Ali (TMC); Ahmed (DCL); Faisal (Al Waha)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ali, Ahmed and Faisal watch a MAR.\n  2. Read each page for any list or count of watchers.\n  3. Hind narrows Faisal off the MAR Trade.\n  4. Mohammed issues Code A.\n- **Expected result:** Each sees only their own Watching; no list or count of watchers. After narrowing Faisal gets no notification, in-app or email, of the Code.\n\n### VIS-22 Notifications and emails reach only Members who see the item\n\n- **Key:** `RP-801` · **Part:** VIS · **Round:** 0 · **Needs:** mail, owner\n- **Sign in as:** Actors: Mohammed (DCL). Must see: Hafiz (TMC raiser). Must NOT receive: Yousef (Beta Build), Sara (Mechanical-only)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Mohammed issues Code B on a TMC MAR.\n  2. Open the mailbox: the mail to Hafiz.\n  3. Look for any mail or bell entry for Yousef and for Sara.\n- **Expected result:** The subject of Hafiz's mail holds the Document Number, Subject and Code B only; Design Consultants is named as a Company and the final signer as the one person; no DCL internal step or Recommended Code. Yousef and Sara get nothing, in-app or email.\n\n### VIS-61 Derived values hide what the column hides\n\n- **Key:** `RP-916` · **Part:** VIS · **Round:** 0 · **Needs:** setup, owner\n- **Sign in as:** Yousef; Ahmed; Ali\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Filter, sort and page the List by Step Age and by Created date as Ahmed and Yousef while TMC has a long-lived Draft and aged items.\n  2. Inspect the item detail and exports.\n- **Expected result:** No filter, sort key, cursor or detail field reveals when TMC Draft was started or how long TMC worked on an item; Draft shows no Step Age to anyone.\n\n## Results to hand back (JSON)\n\nOne file. `entries` has one entry per case you ran, keyed by the case's key (`RP-nnn`):\n\n- `status`: `pass`, `fail`, `blocked` or `notrun`.\n- `comment`: what you saw.\n- `shots`: the ids of its screenshots in the `shots` list, or `[]`.\n\nEach screenshot in `shots` gives its `data` as base64 PNG or JPEG bytes. Leave `shots` empty if you send the pictures separately, named `\u003ccase ID>-\u003cn>.png`.\n\n```json\n{\n  \"sheet\": \"rabaed-uat-sheet\",\n  \"round\": \"System UAT with Ahmed\",\n  \"tester\": \"\u003cyour name>\",\n  \"at\": \"\u003cISO date and time, e.g. 2026-11-02T10:30:00Z>\",\n  \"entries\": {\n    \"RP-685\": {\n      \"status\": \"pass\",\n      \"comment\": \"Saved as a Draft, listed with No number yet.\",\n      \"shots\": []\n    },\n    \"RP-686\": {\n      \"status\": \"fail\",\n      \"comment\": \"What you saw, against the expected result.\",\n      \"shots\": [\n        \"RP-686:1\"\n      ]\n    }\n  },\n  \"shots\": [\n    {\n      \"id\": \"RP-686:1\",\n      \"key\": \"RP-686\",\n      \"name\": \"SUB-02-1.png\",\n      \"type\": \"image/png\",\n      \"w\": 1366,\n      \"h\": 768,\n      \"data\": \"\u003cthe PNG's bytes in base64, or leave shots empty>\"\n    }\n  ]\n}\n```\n\n","cases":[{"key":"RP-685","id":"SUB-01","title":"A new MAR is saved as a Draft","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer)","steps":["Projects > Riyadh Gate Tower - Phase 2 > Submittals > New Submittal > Material Approval Request.","Subject \"UAT SUB-01 Lighting Fixtures\", Trade Electrical Works, Location Tower 1 Floor 02, Manufacturer Philips, Approved supplier Najd Electrical Supplies, Description empty.","Save Draft."],"expected":"The Draft is listed in the Drafts Stage with \"No number yet\" and no Step Age dots. It is Hafiz's to edit. What other Companies see: VIS-01.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-688","id":"SUB-02","title":"Send for Review is refused while the Form is incomplete","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer)","steps":["Open the Draft from SUB-01.","Send for Review with Description and Datasheet (PDF) empty."],"expected":"Refused: the Form lists what is missing (\"2 fields need your attention: Description, Datasheet (PDF)\") and marks each field. Nothing moves; the item stays a Draft with no number.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-691","id":"SUB-03","title":"The MAR Form takes Items, totals and Documents","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer)","steps":["Fill Description, Model \"CoreLine Panel\", Specification section \"26 51 00\".","Under Items, Add row twice: \"Recessed panel\" 200 Pieces and \"Surface panel\" 40 Pieces.","Save and close, then open the Draft again from the list.","Add a PDF under Datasheet (PDF) and a JPEG with EXIF under Sample photo."],"expected":"The total reads 240. Save and close returns to the Submittals list. The Datasheet and Sample photo can be added once the Draft is saved; the photo shows the time and place from its EXIF. The Attachments and Links System Fields sit below the Form.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-694","id":"SUB-04","title":"Send for Review numbers the item and Ali holds it at once","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Hafiz: Send for Review on the complete Draft.","Ali: open it from the bell."],"expected":"The item gets the next Document Number in its sequence (for example TWR-MAR-01-0004), shown left to right. Ali is TMC's only PM, so it is his at once: \"With Ali Sonour - TMC Constructions\", no Pick up button. Ali's bell shows \"Step reached\" within seconds. Nothing outside TMC.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-697","id":"SUB-05","title":"A Return stays in Internal Review","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM); Hafiz (TMC engineer)","steps":["Ali: Return with the reason \"Add emergency duration\".","Hafiz opens the item."],"expected":"The item stays in the Internal Review Stage, now at the Contractor Engineer Step, keeps its Document Number and goes back to Hafiz (\"With Hafiz Hamdan - TMC Constructions\"); it is never a Draft again. The reason is in TMC's history marked internal. Step Age counts from the Return.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-700","id":"SUB-06","title":"Documents change until the Submit","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Hafiz: remove the Datasheet and add a corrected PDF.","Send for Review again.","Ali opens the item and its Documents."],"expected":"Hafiz can swap Documents while the item is in TMC. Ali sees the corrected PDF. Documents freeze at the Submit, not before.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-704","id":"SUB-07","title":"Submit with a Cover Note and an Internal Note","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM); Ahmed (DCL engineer)","steps":["Ali: Submit; Cover Note \"Panels for Level 2, as drawing E-201\"; Internal Note \"Quantities checked against the BOQ\"; confirm.","Ahmed opens the item."],"expected":"Stage is Pending Approval. TMC sees \"With Design Consultants LLC\", never a Consultant's name. Ahmed's history shows the Submit with the Cover Note by \"TMC Constructions\" (no person); the Internal Note is not there. The Submission Date is set.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-707","id":"SUB-08","title":"Pick up and Return to pool in the Consultant pool","part":"SUB","partName":"Submittals","round":"0","who":"Ahmed, Sara (DCL engineers); Mohammed (DCL manager)","steps":["Ahmed and Sara open the Submitted MAR.","Ahmed: Pick up.","Sara refreshes Need My Action and her bell.","Ahmed: Return to pool, then Pick up again."],"expected":"Both Engineers see \"not picked up yet: ...\" with both names; Mohammed is not in this pool and reads it read-only. After Pick up the item leaves Sara's Need My Action and her unread \"Step reached\" is withdrawn; Return to pool is offered because the pool has two Members and does not bring the notification back.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-709","id":"SUB-09","title":"The Consultant reads the Form and cannot edit it","part":"SUB","partName":"Submittals","round":"0","who":"Ahmed (DCL engineer)","steps":["After Pick up, read every Form section, open the Datasheet PDF and the Sample photo.","Try to change an answer."],"expected":"Every answer, the Items table and the total are shown read-only; Documents are frozen; the photo shows time and place. No edit control is offered (the Form is the raiser's).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-712","id":"SUB-10","title":"Send to Manager needs the verification","part":"SUB","partName":"Submittals","round":"0","who":"Ahmed (DCL engineer); Mohammed (DCL manager)","steps":["Ahmed: Send to Manager with the verification empty.","Answer Sample checked Yes, Matches specification No; leave the Verification note empty.","Write the note, set Recommended Code C and an Internal Note.","Confirm."],"expected":"Steps 1 and 2 are refused: the Verification note becomes required when Matches specification is No. After step 4 the item sits with Mohammed, the only Consultant Manager, at once. Ahmed's answers, Recommended Code and Internal Note are in DCL's history only, marked internal.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-716","id":"SUB-11","title":"Code A closes the item with the final verification","part":"SUB","partName":"Submittals","round":"0","who":"Mohammed (DCL manager)","steps":["Open the item; Approve A.","Check the Final verification pop-up is filled from Ahmed's reply; Remarks left empty.","Confirm."],"expected":"Remarks are optional with Code A. The item closes Approved, Code A, and accepts no more moves. Download PDF appears (SIG-02).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-718","id":"SUB-12","title":"Code B turns each comment into a Comment","part":"SUB","partName":"Submittals","round":"0","who":"Mohammed (DCL manager); Ali (TMC PM)","steps":["On a new Submitted MAR, Mohammed: Approve with Comments B with three comment rows and Remarks.","Ali opens the MAR and the Snag List."],"expected":"The MAR closes at Code B. Three Comment items are in the Snag List, raised by Design Consultants and Open with TMC. The MAR page reads \"Comments: 3 open / 0 closed\". Remarks are required with B.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-720","id":"SUB-13","title":"Code C needs Remarks and Return to Engineer works","part":"SUB","partName":"Submittals","round":"0","who":"Mohammed (DCL manager); Ahmed (DCL engineer)","steps":["Ahmed sends a MAR to Mohammed with Matches specification No.","Mohammed: Return to Engineer, reason \"Check the photometric report\".","Ahmed sends it again unchanged.","Mohammed: Revise and Resubmit C with Remarks empty, then with Remarks."],"expected":"Return to Engineer gives it back to Ahmed. Code C is refused until Remarks are written, then closes at C with its Remarks and final verification. TMC is offered Create Revision (SUB-15).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-723","id":"SUB-14","title":"Code D offers a replacement, not a Revision","part":"SUB","partName":"Submittals","round":"0","who":"Mohammed (DCL manager); Hafiz (TMC engineer)","steps":["Mohammed: Reject D with Remarks.","Hafiz opens the closed MAR and chooses Create replacement."],"expected":"The item closes at D. Hafiz is offered Create replacement (no Revision). The replacement is a new Draft with the same Subject, a Replaces Link to the rejected MAR, and gets a new Document Number with no Rev suffix at its first send.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-727","id":"SUB-15","title":"Create a Revision of a Code C item","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Open the MAR you took to Code C in SUB-13 (the seeded Cable tray risers item already has an open Rev 1, so it offers no new Revision) and Create Revision.","The Draft reads Revision 1, No number yet; change the Model, Save and close.","Open the Revision drop-down.","Send for Review and have Ali Submit it."],"expected":"The Draft starts with TMC's answers and the copied Datasheet. The drop-down lists the original and Revision 1 (no number yet); after the Submit it lists the number and the number Rev 1, each whole and left to right. Choosing the original shows its own answers, Code C, Remarks and history. A Revision uses no counter.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-730","id":"SUB-16","title":"Delete discards a Draft only","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer)","steps":["On a Draft that never left Draft, row menu > Delete, confirm.","On a numbered item look at its row menu."],"expected":"The confirm says nobody will see the Draft again, Hafiz included, and no number is lost; it leaves the list. A numbered item has no Delete (an issued item is never deleted).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-732","id":"SUB-17","title":"Duplicate copies only TMC's own work","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer)","steps":["On a closed MAR that Mohammed answered, row menu > Duplicate.","Open the new Draft."],"expected":"A new Draft with the Subject, TMC's own answers and the Documents and photos TMC uploaded, as new files. None of Design Consultants' verification, Remarks or notes. \"Duplicated from\" shows the original's number to TMC only.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-735","id":"SUB-18","title":"Download gives the item as it last arrived","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["On a Submitted MAR choose Download from the row menu as Ali, then as Mohammed.","Try Download on a Draft."],"expected":"Both get the same content: shared answers, shared moves by Company only, no Step, no person, no Internal Note. A Draft offers Download of its Working Copy.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-737","id":"SUB-19","title":"Related submittals and free Links open the other item","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz (TMC engineer)","steps":["Open \"Emergency lighting control panel - Tower 2\".","Links: open TWR-MAR-01-0001 from Related submittals and from the free Link.","On TWR-MAR-01-0001 scroll to Linked from."],"expected":"Each Link shows the Document Number (left to right) and Subject and opens the item; a Submitted item cannot be changed. Linked from on the exit signs lists the control panel. Linking notifies nobody.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-739","id":"SUB-20","title":"A SAR closed at Code A adds the supplier to the list","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz; Ali; Ahmed; Mohammed","steps":["Raise a Supplier Approval Request \"UAT SUB-20 Delta Cables\" (Electrical), send, Submit.","Ahmed picks up and sends to Manager; Mohammed: Approve A.","Project Settings > Approved Supplier List."],"expected":"The SAR runs 2 to 2 and closes. \"UAT SUB-20 Delta Cables\" is listed for Electrical, approved. A second SAR for the same name in other letter case adds no second entry. A MAR now offers it under Approved supplier.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-741","id":"SUB-21","title":"A DAR ends with the Owner's review","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz; Ali; Mohammed; Noura (Al Waha PM)","steps":["Raise a Document Approval Request \"UAT SUB-21 Cable schedule\", send, Ali Submits.","Mohammed recommends Code A to the Owner.","Noura opens it and chooses Confirm."],"expected":"Mohammed's Recommendation goes to Noura, who holds the Owner's review; Confirm issues Code A and closes the item. TMC sees it \"With Owner review\" until then (VIS-27).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-743","id":"SUB-22","title":"Watch and Unwatch","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM)","steps":["Open a Submitted MAR; note Watching (raiser and Submitter watch from the start).","Unwatch, then Watch again."],"expected":"The button flips between Watch and Watching. Nobody sees who else watches an item or how many.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-746","id":"SUB-23","title":"List: search, filters, Need My Action, sort and columns","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM)","steps":["Submittals List: search by Document Number, Subject, Type, Trade, Location.","Filter panel: pick several values for Type, Stage, With, Step Age, Submission Date.","Toggle Need My Action.","Sort by a column; Columns > move one > Save as my default; reload.","Group by Stage."],"expected":"Results match the filters; Stage counts match the rows; Need My Action keeps only items waiting on Ali (his own Drafts stay in view, uncounted); the saved columns come back after reload; the column header for the holder reads With.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-748","id":"SUB-24","title":"List export holds what the viewer sees","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM)","steps":["Export > what you see > CSV, then Excel.","Export the whole table.","Search first, then export.","Put =1+1 in the Subject of a Draft and export."],"expected":"Rows and columns equal the screen; the whole table adds every List field; under a search only the rows read so far; a cell that looks like a formula is written as text.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-753","id":"SUB-25","title":"Kanban: columns, counts and moving a card","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM)","steps":["Kanban: columns are the Stages with counts.","Drag a card, or use Move to, to a Stage Ali's Step allows.","Open the filter panel (Owner, Role, Created date)."],"expected":"Dropping or choosing a move opens the same Action Form as the item page; the card moves after confirm; a move that is not allowed is not offered. Internal Review shows TMC's own Steps with counts (Engineer, PM). The other Company is one lane by its name.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-755","id":"SUB-26","title":"Project Dashboard: Type cards and Activity Feed","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM)","steps":["Open the Project (Dashboard).","Click a number on a Type card."],"expected":"Type cards show counts over what Ali sees; each number opens the List with the same filter and the same count. The Activity Feed sits beside them; it lists Company names for other Companies and no person of theirs.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-757","id":"SUB-27","title":"Home: counts, Need My Action list, Recent activity","part":"SUB","partName":"Submittals","round":"0","who":"Ali (TMC PM)","steps":["Open Home.","Compare Active Projects, Need My Action, My Company 4+ weeks at step, My Company waiting with others and each Project card's submittal count with the Project's List."],"expected":"Every number equals the sum of the Project reads and opens the matching list; Drafts are never counted as Need My Action; Recent activity shows at most four entries.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-759","id":"SUB-28","title":"Activity Feed page","part":"SUB","partName":"Submittals","round":"0","who":"Mohammed (DCL manager)","steps":["Project > Activity Feed after some Submits and Codes."],"expected":"Entries read as events (submitted, returned, approved) with the Project; TMC appears by Company name only; no answers_changed or Document upload entries.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-761","id":"SUB-29","title":"No due dates, deadlines or SLAs anywhere","part":"SUB","partName":"Submittals","round":"0","who":"Hafiz; Mohammed","steps":["Visit Home, Projects, Dashboard, List, Kanban, item page and the emails in the mailbox, in EN and AR.","Search the page text for due, deadline, SLA, late and every other term GLOSSARY.md lists under Avoid for Step Age (and the Arabic equivalents)."],"expected":"Only Step Age dots (1 to 4+ weeks) show age. No due date, deadline or SLA appears. The List and Kanban headers use the GLOSSARY words: Stage not Status, Trade not Discipline, With not Current owner.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-763","id":"WF-01","title":"Every Member reads the Project Workflows","part":"WF","partName":"Workflows","round":"0","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["Project > Settings > Workflows.","Open the MAR Workflow and a published Version."],"expected":"The page lists which Workflow each Work Item Type runs, its Version and every published Version whole, with every Company's Steps and Returns. Neither can open the builder or see a draft.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-767","id":"WF-02","title":"View workflow on an item pins its Version","part":"WF","partName":"Workflows","round":"0","who":"Ali (TMC PM)","steps":["Open a Submitted MAR; click Workflow: name, Version n.","Switch map and list.","Open the same item as Ahmed and move it between DCL Steps."],"expected":"The drawer shows the Version the item is pinned to. Ali's own Steps are shown one by one; Design Consultants is one part marked With Design Consultants LLC. Ahmed sending to Mohammed changes nothing Ali reads.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-770","id":"WF-03","title":"Duplicate a Rabaed Default into the Project","part":"WF","partName":"Workflows","round":"0","who":"Saeed (TMC Authorized Person, Project Admin)","steps":["Settings > Workflows > duplicate the MAR Workflow as \"UAT MAR copy\".","Open it."],"expected":"A draft Version 1 of a new Project Workflow with no link to the original. Only Project Admins see it.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-773","id":"WF-04","title":"Builder: add a Step, connect, undo, auto-layout","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin)","steps":["Open the copy in the builder.","Drag a Step from the palette into a Stage band; connect two Steps by dragging from a dot.","Undo and redo (Ctrl+Z, Ctrl+Shift+Z).","Auto-layout; switch Curved and Orthogonal arrows.","Select a Transition: edit labels (EN and AR), kind, Screen."],"expected":"Edits autosave a moment later. The kind follows the publish checks (Submit across Participants, Return back within one). A connection onto empty canvas adds a New step. Auto-layout arranges Steps by route inside each Stage band; the arrow style is kept per viewer.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-777","id":"WF-05","title":"Validate reports problems and Publish needs a Change Note","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin)","steps":["In the copy, leave a Step with no way forward.","Validate.","Fix it, Publish with no Change Note, then with one."],"expected":"Validate counts the errors and selects the first; Publish lists what changed, the count of items that keep their Version and requires the Change Note. After publishing the builder stays open.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-779","id":"WF-06","title":"A new Version applies to new items only","part":"WF","partName":"Workflows","round":"0","who":"Saeed; Hafiz; Ali","steps":["Bind the published copy to MAR (Settings > Workflows > Use for MAR).","Hafiz raises a new MAR.","Open an older MAR."],"expected":"The new MAR runs the new Version; the older item keeps its Version and shows a notice that a later Version exists. Binding another Workflow reaches only items created afterwards.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-781","id":"WF-07","title":"Versions history shows Change Notes and running counts","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin); Hafiz","steps":["Open the Workflow's Versions page.","Compare two Versions."],"expected":"Newest first with date and Change Note; the N running figure counts only items the reader sees; Compare marks added, removed and changed. Hafiz sees Versions but no Change Note.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-783","id":"WF-08","title":"Exception for one Participant must not name it","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin)","steps":["Copy MAR as \"Beta Build MARs\" and try to bind it as an exception for Beta Build.","Rename it \"MARs, short route\" and bind it for Beta Build."],"expected":"The first is refused because the name holds a Participant's name. The second binds; Yousef's new MARs run it, TMC's do not. Others learn of no Participant.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-786","id":"WF-09","title":"Build a Workflow with a Send Back (fixture FX-SB)","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin)","steps":["Copy the MAR Workflow.","Add a Send Back from Consultant Engineer to the Contractor Draft Step; on the Draft Step set After a Send Back to Comment only (and a second copy to Edit the Form).","Validate, Publish, bind."],"expected":"It validates and publishes. If publish refuses the Send Back, record a Bug: VIS-15 and VIS-16 need this Workflow.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-790","id":"WF-10","title":"Drafts visible to: the author only","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin); Hafiz; Omar; Ali","steps":["In a copy, set the Draft Step to Drafts visible to the author only; publish and bind.","Hafiz saves a Draft.","Omar and Ali open the List and the item URL."],"expected":"Omar and Ali see no Draft, no count, and the 404 page; Hafiz sees and edits it. After Send for Review TMC reads it as before.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-793","id":"WF-11","title":"Transition rules: Restrict, Validate and Effects","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin)","steps":["In a copy open a Transition > Add rule.","Add Restrict by Position, a Validate with a message in EN and AR, an Effect Offer Assign to.","Test run the Workflow."],"expected":"Rules show under Condition with AND between Restrict rules; Test run opens each pop-up in test mode and saves nothing; a Transition whose Restrict fails is not offered.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-794","id":"WF-12","title":"Return goes to the author, not the other engineer","part":"WF","partName":"Workflows","round":"0","who":"Hafiz; Omar; Ali","steps":["Omar (Tower 2 only) and Hafiz both cover a Tower 2 item.","Hafiz sends a Tower 2 Draft for review.","Ali Returns it."],"expected":"It goes back to Hafiz, who sent it, not to Omar.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-796","id":"WF-13","title":"Stages and Outcomes pages","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Project Admin); Ali","steps":["Settings > Stages: rename a Stage, add one.","Settings > Outcomes.","As Ali open the same pages."],"expected":"Project Admin changes show in the Stage set, List and Kanban columns; Ali reads them and cannot change them. Another Project is unchanged.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-805","id":"WF-14","title":"Library: save, mark default, new Project copies it","part":"WF","partName":"Workflows","round":"0","who":"Saeed (Authorized Person)","steps":["Library > Workflows: Save a Project Workflow to the Library.","Mark it default for MAR.","Create a new Project."],"expected":"The Library copy has no link to the original; the new Project starts with a copy as its MAR Workflow, bound. A plain Member sees the Library read-only.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-808","id":"WF-15","title":"Step Age dots count from the current Step","part":"WF","partName":"Workflows","round":"0","who":"Ali; Mohammed","steps":["Precondition: ask the lane engineer to age two items (fixture AGE) by 1 and by 4 weeks.","Read the dots in the List, Kanban and item page for Ali and for Mohammed."],"expected":"Dots show 1 to 4+ weeks (4+ all red). For the holder's Company they count from the current Step; the other Company counts from when the item reached it. A Draft shows none. No due date appears.","needs":["setup","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-810","id":"WF-16","title":"Cancel from the raiser's Steps, only until the first Submit","part":"WF","partName":"Workflows","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Hafiz: new MAR \"UAT Cancel\", Save Draft, Cancel; confirm.","Make a second MAR, Send for Review; Ali opens it and Cancels.","Make a third, Submit it to DCL; look for Cancel as Ali and Hafiz."],"expected":"Cancel is offered at the Draft, the Contractor Engineer and the Internal Review Steps and asks for confirmation; the item goes to the Cancelled Stage with no outcome. Once Submitted, Cancel is no longer offered. A Revision never offers Cancel. Carried over from RP-463 B-09 (RP-490).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-812","id":"WF-17","title":"Assign to offers only },{"key":"RP-831","id":"FRM-07","title":"Documents freeze at the first Submit","part":"FRM","partName":"Forms and Screens","round":"0","who":"Hafiz; Ali; Ahmed","steps":["Hafiz adds and removes a Document in a Draft.","After Ali Submits, Hafiz opens the item.","Ahmed opens the Documents."],"expected":"Before the Submit Documents can change; after it they are frozen for everyone and cannot be removed. Ahmed opens them with a short-lived link.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-833","id":"FRM-08","title":"The Form belongs to the raiser; replies are Screens","part":"FRM","partName":"Forms and Screens","round":"0","who":"Ahmed; Mohammed; Hafiz","steps":["Ahmed Send to Manager: read the pop-up fields.","Mohammed Approve: read the Code pop-up.","Open the Form as Mohammed."],"expected":"Replies are pop-up Screens (verification, Recommended Code, final verification, Remarks); no Form field is editable by the Consultant. Fields a Screen marks internal never reach TMC.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-836","id":"FRM-09","title":"Screens: read, edit and publish in Project Settings","part":"FRM","partName":"Forms and Screens","round":"0","who":"Saeed (Project Admin); Ali","steps":["Settings > Screens: open Code reply.","Edit a copy, publish a new Version.","Start a MAR and take it to the Code; compare the pop-up."],"expected":"Every Member reads Screens; only Project Admins change them. An item already running keeps the Screen Version its Workflow Version pinned; new Workflow Versions pick the new one.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-839","id":"FRM-10","title":"Draft autosave shows Saved and survives a failed save","part":"FRM","partName":"Forms and Screens","round":"0","who":"Hafiz (TMC engineer)","steps":["Edit a Draft; watch the Saved time.","Go offline in the browser, edit, go online."],"expected":"The Saved time moves with each save. A failed save is shown clearly with a retry; no edit is lost.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-842","id":"FRM-11","title":"Member and Participant fields offer only what the filler may see","part":"FRM","partName":"Forms and Screens","round":"","who":"Hafiz (TMC engineer)","steps":["On an item with a member or participant field (if the Form offers one) open the choices."],"expected":"Only TMC's own Project Members and TMC and the Host Company are offered; other Companies' people never. After the Submit another Company reads the answer as TMC's name, no person.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-845","id":"PAR-01","title":"Sign in, wrong password and sign out","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Hafiz","steps":["Open lane 7 /en/sign-in.","Wrong password.","Right password (in .env.demo).","Sign out.","Open a Project URL while signed out."],"expected":"The wrong password gives one generic refusal. Sign-in opens Home. After sign-out a Project URL goes to sign-in. Cookies are per host (lane7.localhost).","needs":["owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-848","id":"PAR-02","title":"Invite a Member and accept the invitation","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Saeed (Authorized Person); a new person","steps":["Members > Invite: a made-up .test email, name EN and AR, language.","Open the email in the mailbox and follow the link.","Set a password."],"expected":"The Member appears as invited, then active. The email arrives in the mailbox in the chosen language. The new Member belongs to TMC alone.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-851","id":"PAR-03","title":"An email that belongs to another Company is refused without naming it","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Hind (Al Waha Authorized Person)","steps":["Members > Invite hafiz.hamdan@tmc.de :"Saeed (Project Admin)","steps":["Settings > Numbering: read the pattern and examples.","Set a Participant Code (2 to 6 letters or digits).","Save a pattern that leaves out the Participant Code."],"expected":"Examples use the Admin's real next numbers. A code in use cannot change. Leaving out the Participant Code is refused until the shared-counter warning is accepted.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-874","id":"PAR-11","title":"Show Inspections inside the Submittals tab","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Saeed (Project Admin)","steps":["Settings > Modules: choose Inside the Submittals tab.","Open Submittals and the Project tabs."],"expected":"The Inspections tab is hidden; WIRs show in the Submittals List and Kanban with WIR as one more Type. Switching back restores the tab. Only a Project Admin changes it.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-877","id":"PAR-12","title":"Approved Supplier List: add and withdraw by hand","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Saeed (Project Admin); Hafiz","steps":["Settings > Approved Supplier List: add a supplier for Mechanical; withdraw one.","Hafiz opens the list."],"expected":"Entries show name, Trade, Scope and status; a withdrawn one stays listed as withdrawn. Hafiz cannot add or withdraw. No source, person or time shows.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-880","id":"PAR-13","title":"Company Projects page","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Layla; Hafiz","steps":["Open Company Projects (sidebar)."],"expected":"Each Project the Company takes part in shows name, code, number, Host Company, the Company's own Project Role and own Project Members, and pending invitations. Never another Participant.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-883","id":"PAR-14","title":"Fixture FX-C2: narrow Beta Build to Tower 2","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Saeed (Project Admin); Yousef","steps":["Settings > Visibility: set Beta Build Location to Tower 2 only.","Yousef signs in."],"expected":"The change saves (Yousef holds nothing, so no Handover). Yousef sees only Tower 2 items from then on, and TMC is the only Contractor covering Tower 1, which the Snag scenarios need.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-885","id":"PAR-15","title":"Fixture FX-K1M: Sara covers Mechanical only","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Layla (DCL Authorized Person); Sara","steps":["Open Sara's Visibility (Participants > Members).","Set Trade to Mechanical only."],"expected":"Sara no longer sees Electrical items and leaves their pools (Handover first if she holds one). Ahmed still covers both. Later scenarios use Sara as the K1 Mechanical-only engineer.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-889","id":"PAR-16","title":"Fixture FX-OW: invite UAT Owner Co as Owner","part":"PAR","partName":"Participants and Visibility setup","round":"0","who":"Saeed (Project Admin); Reem UAT (Owner Co Authorized Person)","steps":["After ADM-02 onboards UAT Owner Co (CR 9999000005), Saeed invites that CR as Owner on Riyadh Gate Tower.","Reem accepts, grants Electrical and Mechanical, all Locations, and adds a PM Member (Sami UAT) with Position Project Manager."],"expected":"UAT Owner Co is a Participant with oversight over Submitted items it covers. Later Owner scenarios use it.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-892","id":"PKG-01","title":"Packages is a third view beside List and Kanban","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["Submittals > the view toggle.","Choose Packages."],"expected":"A Packages Kanban with three columns Open, In Progress and Done, each with a count; a New Package button for a Company that can build one; search and filters (Trade, owning Company). Matches packages.html except where spec RP-616 differs.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-895","id":"PKG-02","title":"Open a Package and number it","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["New Package: name EN and AR.","Open it."],"expected":"The Package is numbered PKG-001 (left to right, also in Arabic) beside TMC's name, Open, with no submittals. A second Package is PKG-002. Beta Build's first Package is also PKG-001.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-897","id":"PKG-03","title":"Add submittals from Drafts and review","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["Open an Open Package > Add items.","Pick two Drafts and one item in internal review.","Try to add an item already in another Package."],"expected":"Only TMC's own submittals Ali can see are offered, with search and a Trade filter. An item in another Package is marked and cannot be picked. A submittal belongs to at most one Package.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-898","id":"PKG-04","title":"While Open: remove, rename, delete","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["Remove one item.","Rename the Package.","Delete the Package."],"expected":"Remove and delete work only while Open; Delete says the Drafts stay, without a Package. Rename is allowed in every status.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-899","id":"PKG-05","title":"Submit Package is all or nothing","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["Add a Draft with a required field missing.","Open Submit Package."],"expected":"A not-ready list names each blocking item (for example required field Supplier missing) and links to it; Submit is disabled until the list is empty. Then one confirm submits every not-yet-submitted item; each gets its own Document Number. If any fails, none is submitted.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-901","id":"PKG-06","title":"Status runs Open, In Progress, Done","part":"PKG","partName":"Packages","round":"1","who":"Ali; Mohammed","steps":["Submit the Package.","Close the items at A, B, C and D over time.","Create a Revision for the Code C item and a replacement for D."],"expected":"In Progress as soon as anything is submitted. Done only when every latest submittal has closed at A, B or D; a Code C waits for its Revision, which joins the Package by itself; a later replacement or added submittal puts it back In Progress. The word is Done, never Closed.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-684","id":"PKG-07","title":"After Submit: add yes, remove no","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["In an In Progress Package add a submittal.","Try to remove one."],"expected":"Adding works; removing is not offered. Rename works and is recorded.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-687","id":"PKG-08","title":"The Package chip and filter on submittals","part":"PKG","partName":"Packages","round":"1","who":"Ali (TMC PM)","steps":["Open List and Kanban.","Use the Package filter.","Click the chip on a card and on the item page."],"expected":"Cards and the item page show PKG-001 with the name; the chip opens the Package page; the filter narrows List and Kanban. Package is not a Form field.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-690","id":"PKG-09","title":"Bulk Transition applies one Action Form to many","part":"PKG","partName":"Packages","round":"1","who":"Mohammed (DCL manager, with a Signature); a DCL Member without a Signature (fixture: remove one in the profile)","steps":["In an In Progress Package select two items waiting on Mohammed that offer the same Code Transition ( ion Form: TMC has no Stamp yet, ask its owner or Authorized Person; for Saeed, Add TMC's Stamp with an Add Stamp button. Only the viewer's own Company is named; nothing is written; nobody is notified.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-728","id":"SIG-11","title":"No Signature: the Add Signature pop-up","part":"SIG","partName":"Signing and Documental Record","round":"2","who":"Hafiz","steps":["With no Signature saved open any Transition."],"expected":"Add your Signature to act. Every action you confirm is signed with it. Add Signature goes to the profile and returns to the item with nothing typed lost; Cancel closes.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-731","id":"SIG-12","title":"Signature cards, Stamps, Review Comments, endings and Disclaimer","part":"SIG","partName":"Signing and Documental Record","round":"2","who":"Ali (TMC PM)","steps":["Download a record closed at A, then at C and at D.","Read the Signatures, Stamps and ending pages."],"expected":"One card per Transition on the path with Signature as it was then; the Stamp of every acting Company; Review Comments numbered; a Next step card with Code C (Revision n+1) or D (a new submittal replaces this one); an internal reviewer's card says Reviewed with no Code; the Disclaimer in Arabic and English.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-733","id":"SIG-13","title":"Appendix of Documents","part":"SIG","partName":"Signing and Documental Record","round":"2","who":"Ali (TMC PM)","steps":["Close a MAR with PDF and image Documents and one DWG.","Download the record."],"expected":"Shared PDF and image Documents follow as pages; other files are attached inside the PDF; a Company's internal Documents are not included.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-744","id":"SIG-14","title":"Record checks catch a bad PDF","part":"SIG","partName":"Signing and Documental Record","round":"2","who":"Engineer rdinary notifications inside Rabaed. A removed Member keeps the Project name and the records they signed; the Company keeps those its Members signed through its Authorized Person; open items of a withdrawn Participant are Cancelled.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-751","id":"SNG-01","title":"The Snag List tab: List, Kanban and empty state","part":"SNG","partName":"Snag List","round":"0","who":"Ali (TMC PM)","steps":["Project > Snag List.","Switch List and Kanban.","Use the Types chips (All, Snags, Comments), Stage, Trade, Company and search by number or Subject."],"expected":"Items are grouped by Stage with counts; type chips and Stage counts count only visible items; an empty list reads No snags. Nice work. Filters with no match say nothing you can see matches.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-752","id":"SNG-02","title":"The Consultant raises a Snag on the Contractor","part":"SNG","partName":"Snag List","round":"0","who":"Mohammed (DCL manager); Ali (TMC PM)","steps":["Needs FX-C2 (PAR-14).","Mohammed: Snag List > New Snag: Subject \"UAT SNG-02 Cable tray not bonded\", Description, Trade Electrical Works, Location Tower 1 Floor 02, a before photo.","Raise."],"expected":"The Snag is Open with TMC (the one Contractor covering Tower 1). With two Contractors covering the Location, Raise is refused with the plain This can not be handed over yet answer (RP-658 adds the pick).","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-754","id":"SNG-03","title":"Contractor moves the Snag through its Steps","part":"SNG","partName":"Snag List","round":"0","who":"Ali; Hafiz (TMC)","steps":["Open the Snag.","Start work, Put on hold, Resume work, back to Open where offered.","Read the Stage and Step Age as Mohammed."],"expected":"Moves are TMC's internal events: Stage shows In Progress or On Hold inside TMC; Design Consultants sees it Open with Step Age counted from when it reached TMC. A t and raise a Snag with the camera."],"expected":"Photo-first cards, filters in a sheet, large New button, the camera opens from Take photo; saved as you go.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-787","id":"SNG-14","title":"Pick the Contractor when two cover a Location","part":"SNG","partName":"Snag List","round":"3","who":"Mohammed (DCL manager)","steps":["Leave Beta Build covering Tower 1 as in the seed.","Raise a Snag on Tower 1."],"expected":"The Raise pop-up asks which Contractor; the other never sees it.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-789","id":"SNG-15","title":"Snag PDF report","part":"SNG","partName":"Snag List","round":"3","who":"Ali (TMC PM)","steps":["Snag List > Export PDF report."],"expected":"A PDF of the visible Snags with photos; no Snag the viewer cannot see.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-791","id":"INS-01","title":"Checklist Templates: create, edit into Version 2, retire","part":"INS","partName":"Inspections (WIR)","round":"0","who":"Saeed (Project Admin); Ali","steps":["Settings > Checklist Templates > New: name EN and AR, Trade, items with answers, comment and photo rules and Raise a Snag.","Save; edit and Save as Version 2.","Retire one.","Open as Ali."],"expected":"The two seeded templates (Concrete pour, Cable trays and containment) are listed per Trade with items, Version and availability. Saving makes the next Version and WIRs that copied an earlier one keep its items. Ali reads and cannot change.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-800","id":"INS-02","title":"Required links setting","part":"INS","partName":"Inspections (WIR)","round":"0","who":"Saeed (Project Admin); Hafiz","steps":["Settings > Required links: turn on Approved submittals required.","Hafiz tries to send a WIR without one."],"expected":"Every Member reads the setting; only a Project Admin changes it. With it on a WIR cannot leave ows checked, ready and left out; each bad row lists all its reasons (Subject empty, Type unknown, Trade not in this Project, Trade is outside your Visibility). Nothing is created yet.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-847","id":"IMP-05","title":"Confirm creates Drafts, all good rows or none","part":"IMP","partName":"Submittal Register Import","round":"0","who":"Hafiz (TMC engineer)","steps":["Confirm a preview with 8 good rows and 2 bad.","Open the Submittals List."],"expected":"Eight Drafts are created, raised by Hafiz, each No number yet; the two bad rows are left out and never created. A change in the Project after the preview gives Something in the Project changed, validate again.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-850","id":"IMP-06","title":"The result page and the Imports page","part":"IMP","partName":"Submittal Register Import","round":"0","who":"Hafiz; Ali","steps":["After confirming read the result: Drafts created, Left out, Open the Drafts.","Imports page.","Open the import.","Ali opens the same page."],"expected":"Imports are listed by file name only, with no time anywhere. The import page lists every row with its result; a created row links to its Draft only where the viewer sees that Draft. Ali, a colleague, reads the import after confirm (a preview before confirm is its importer's alone).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-852","id":"IMP-07","title":"Imported Drafts follow the Draft rules","part":"IMP","partName":"Submittal Register Import","round":"0","who":"Hafiz; Omar; Ali","steps":["Open an imported Draft.","Read its history as Hafiz."],"expected":"It is an ordinary Draft: Hafiz edits it, sends it, and it gets its number at the first send. Its created event, internal to TMC, names the import. Under author-only Drafts (WF-10) Omar and Ali cannot see it.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-857","id":"IMP-08","title":"Download the rows left out and import again","part":"IMP","partName":"Submittal Register Import","round":"5","who":"Hafiz (TMC engineer)","steps":["On the result press Download rejected rows.","Fix and import again."],"expected":"The file holds the left-out rows with a reason column; the second import is a new import.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-860","id":"IMP-09","title":"Unknown values are matched once per distinct value","part":"IMP","partName":"Submittal Register Import","round":"5","who":"Hafiz (TMC engineer)","steps":["Map a Trade column holding Elec. on 30 rows.","Match Elec. to Electrical Works once."],"expected":"The match applies to all 30 rows; the preview recounts.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-863","id":"IMP-10","title":"Assign to for imported Drafts","part":"IMP","partName":"Submittal Register Import","round":"5","who":"Hafiz; Ali","steps":["Assign Electrical rows to Hafiz and other rows to Ali, or use an email column.","Include a person who cannot create the Type."],"expected":"Drafts are raised by the importer by default; an assignee who cannot create the Type or does not cover the Trade makes that row bad.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-866","id":"IMP-11","title":"Packages from an import and saved mappings","part":"IMP","partName":"Submittal Register Import","round":"5","who":"Hafiz (TMC engineer)","steps":["Group rows into one new Package, then one per column value, then an existing Open Package; try an In Progress Package.","Save the mapping and reuse it."],"expected":"New Packages take the next PKG number; an In Progress or Done Package makes its rows bad; the mapping is kept for the Company only.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-869","id":"IMP-12","title":"A Rabaed Engineer imports for a Company","part":"IMP","partName":"Submittal Register Import","round":"5","who":"Engineer (Rabaed Admin)","s ne engineer to run the job (OQ-2).","Read Ali and Yousef mail and open the link."],"expected":"Grouped 4+, 3, 2 and 1 weeks; lists only items the reader can open, never an un-numbered Draft; another Company by name only; Yousef lists only Beta Build items; an empty report is not sent; the link opens the List with the same filter.","needs":["mail","job","setup","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-891","id":"NOT-08","title":"A Revision notifies when it gets its number","part":"NOT","partName":"Notifications","round":"0","who":"Hafiz; Ahmed","steps":["Hafiz creates a Revision and keeps it Draft.","Sends it for review.","After the Submit read Ahmed's bell."],"expected":"No revision_created notice while it is a Draft; it is sent when the Revision is numbered; Ahmed is told only after the Submit.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-894","id":"NOT-09","title":"Sent Back notifies only the Participant it went back to","part":"NOT","partName":"Notifications","round":"0","who":"Mohammed; Hafiz; Faisal","steps":["Needs FX-SB (WF-09).","Mohammed Sends Back a Submitted item."],"expected":"Hafiz and TMC Members who see it are told, with DCL named as a Company; Faisal is not told of internal moves.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-896","id":"NOT-10","title":"Emails and the bell follow the Member's language","part":"NOT","partName":"Notifications","round":"0","who":"Faisal (Al Waha, Arabic)","steps":["Receive a notification and email as Faisal."],"expected":"The bell and email are in Arabic with Latin digits; Document Numbers read left to right.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-900","id":"NOT-11","title":"A closed Project goes quiet","part":"NOT","partName":"Notifications","round":"","who":"Ali (TMC PM)","steps":["Close the Project."],"expected":"No bell entry or email of a closed Project; delivered ones stay readable. There is no close control yet.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-902","id":"I18N-01","title":"Switch language keeps the page and mirrors the layout","part":"I18N","partName":"Arabic, RTL and phone width","round":"0","who":"Faisal; Hafiz","steps":["On Home, List, Kanban and an item switch EN to AR with the language button, and open /ar URLs directly.","Switch back."],"expected":"The same page reloads in Arabic with RTL: sidebar, tables, filter panel, Kanban column order, arrows and breadcrumbs mirror. Nothing is cut off.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-903","id":"I18N-02","title":"Latin digits everywhere","part":"I18N","partName":"Arabic, RTL and phone width","round":"0","who":"Faisal (Arabic)","steps":["In /ar read counts, dates, times, Step Age, Dashboard figures, emails and the PDF."],"expected":"Only Latin digits (0 to 9) appear; no Arabic-Indic digits. Dates are Gregorian; times Riyadh.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-904","id":"I18N-03","title":"Document Numbers stay left to right","part":"I18N","partName":"Arabic, RTL and phone width","round":"0","who":"Faisal (Arabic)","steps":["In /ar open the List, an item, a Link, the Revision drop-down, a notification and the PDF."],"expected":"TWR-MAR-01-0003 Rev 1 reads left to right whole in every place, also inside Arabic text.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-906","id":"I18N-04","title":"Form labels and validation messages in Arabic","part":"I18N","partName":"Arabic, RTL and phone width","round":"0","who":"Hafiz (Arabic)","steps":["Open a MAR Form in /ar; leave Description empty and Send for Review."],"expected":"Field labels, section titles, Action Form words and the missing-fields message are Arabic; values typed in English are not translated.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-686","id":"I18N-05","title":"Rabaed opens in ://rabaed-uat-web.vercel.app/en"},{"key":"RP-698","id":"ADM-01","title":"Sign in to Rabaed Admin with a password and an emailed code","part":"ADM","partName":"Rabaed Admin","round":"0","who":"Engineer (Rabaed Engineer)","steps":["Open Rabaed Admin (lane 7, port 4750) on its own address.","Enter email and password.","Read the 6-digit code from the mailbox.","Enter a wrong code, then the right one."],"expected":"A code is sent to the Engineer's email; a wrong code is refused; too many codes get a limit message; sign-in succeeds with the right code and a session cookie that is not the Company app's. Credentials of a Member of the Company app do not work here.","needs":["mail","owner"],"url":"https://rabaed-uat-admin.vercel.app"},{"key":"RP-701","id":"ADM-02","title":"Onboard a Company (fixture UAT Owner Co)","part":"ADM","partName":"Rabaed Admin","round":"0","who":"Engineer (Rabaed Engineer)","steps":["Onboard a Company: legal names EN and AR, CR 9999000005, VAT 399990000000053, Authorized Person Reem UAT (a made-up .test email), language, a reason.","Open the invitation in the mailbox and accept as Reem."],"expected":"The Company and its Authorized Person are created and an invitation emailed; the action is logged with the reason; Reem signs in to the Company app. Needed for PAR-16.","needs":["mail","owner"],"url":"https://rabaed-uat-admin.vercel.app"},{"key":"RP-703","id":"ADM-03","title":"Duplicate CR, VAT or email is refused","part":"ADM","partName":"Rabaed Admin","round":"0","who":"Engineer (Rabaed Engineer)","steps":["Onboard again with CR 9999000001.","Then a new CR with an existing email."],"expected":"Each conflict is refused naming what clashes (CR number, VAT number or email) and creates nothing.","needs":["owner"],"url":"https://rabaed-uat-admin.vercel.app"},{"key":"RP-706","id":"ADM-04","title":"Onboarding leads and closing a lead","part":"ADM","partName":"Rabaed Admin","round":"0","who":"Engineer; Saeed","steps":["Saeed (Project Admin) invites a CR number used while Projects lack an outcome","part":"ADM","partName":"Rabaed Admin","round":"0","who":"Engineer (Rabaed Engineer)","steps":["Add an outcome to a Type's set; publish a Rabaed Default Version that uses it while the seeded Project lacks it."],"expected":"Refused with how many Projects and which outcomes or Stages, never which Projects or Companies; nothing publishes; the refusal is logged.","needs":["owner"],"url":"https://rabaed-uat-admin.vercel.app"},{"key":"RP-726","id":"ADM-09","title":"Admin is separate from the Company app","part":"ADM","partName":"Rabaed Admin","round":"0","who":"Engineer; Hafiz","steps":["Open an Admin URL on the web port and a web URL on the Admin port.","Sign out of one."],"expected":"Different addresses and cookies; the Company app never serves Admin pages.","needs":["owner"],"url":"https://rabaed-uat-admin.vercel.app"},{"key":"RP-729","id":"ADM-10","title":"An Engineer fixes a stuck Step","part":"ADM","partName":"Rabaed Admin","round":"","who":"Engineer (Rabaed Engineer)","steps":["Open a MAR in Admin; reassign or reset the Step with a reason."],"expected":"The read and the action are logged with the reason; the Engineer never takes a Transition or changes a Workflow version.","needs":["owner"],"url":"https://rabaed-uat-admin.vercel.app"},{"key":"RP-923","id":"UX-01","title":"App shell, sidebar and top bar match the design","part":"UX","partName":"UI and UX against the design","round":"0","who":"Hafiz (TMC engineer); Saeed (Project Admin)","steps":["Open Home at 1366 and 1920, EN and AR.","Open each sidebar entry and the member menu.","At 820 and 375 open the drawer."],"expected":"Matches saas-shell.html (and D:\\Artifacts\\Rabaed Responsive Anatomy.html for the drawer): sidebar entries of RP-405 decision 5 only (no Overdue, Payments, Subscriptions, Roles, theme toggle), Company name not a switcher, Arabic mirrored. UI issues and UX recommendations reported apart.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-
