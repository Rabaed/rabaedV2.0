ge, EN and AR.","Page back; open entries."],"expected":"Laid out as design/prompts/activity.md: entries worded from what happened, another Company by name only, newest first, paging that keeps its place.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-931","id":"UX-09","title":"Notifications page and the bell","part":"UX","partName":"UI and UX against the design","round":"0","who":"Ali","steps":["Open the bell, then the Notifications page, EN and AR.","Open an entry; Mark all as read."],"expected":"Laid out as design/prompts/notifications.md: unread state, grouping, the item it opens, empty state; the bell badge matches the unread count.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-932","id":"UX-10","title":"Profile and notification settings","part":"UX","partName":"UI and UX against the design","round":"0","who":"Ali","steps":["Open Profile, EN and AR.","Change language, email per group, Pause all, a Project mute."],"expected":"Laid out as profile-notification-settings.md: no In-app switch; each change confirms it saved; the language change keeps the page.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-933","id":"UX-11","title":"Sign-in, wrong password and accepting an invitation","part":"UX","partName":"UI and UX against the design","round":"0","who":"A new invitee (fixture from PAR-02); Hafiz","steps":["Open sign-in EN and AR at 1366 and 375.","Wrong password, then right.","Open an invitation link and accept."],"expected":"Laid out as design/prompts/sign-in.md: one error for a wrong email or password, clear invitation steps, Arabic-first users land in Arabic.","needs":["mail","setup","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-934","id":"UX-12","title":"Members, Participants and a Member Visibility page","part":"UX","partName":"UI and UX against the design","round":"0","who":"Saeed (Authorized Person, Project Admin)","steps":["Open My Company > Members and Participants.","Open a Participant and a Member Visibility page; narrow and save."],"expected":"Laid out as design/prompts/participants.md: Trades and Locations pickers usable with many values, the Visibility Gap warning readable, counts only of the viewer own Company.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-935","id":"UX-13","title":"Project Settings pages","part":"UX","partName":"UI and UX against the design","round":"0","who":"Saeed (Project Admin); Ali","steps":["Open each Settings page: Trades and Locations, Visibility, Modules, Stages, Outcomes, Required links, Approved suppliers, Checklist Templates, Screens.","Do one change on each as Saeed; open them as Ali."],"expected":"Every page uses the Settings template of the kit and project-settings.md: one layout, save and cancel in the same place, read-only state clear for Ali, Arabic mirrored.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-936","id":"UX-14","title":"Settings > Numbering","part":"UX","partName":"UI and UX against the design","round":"0","who":"Saeed; Ali","steps":["Open Numbering EN and AR.","Edit a pattern; read the preview and the shared-counter warning."],"expected":"Matches settings-numbering.html and D:\\Artifacts\\Rabaed Document Numbering.html: pattern builder, preview left to right, warning wording; Ali sees examples only.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-937","id":"UX-15","title":"Settings > Workflows, the builder and the Library","part":"UX","partName":"UI and UX against the design","round":"0","who":"Saeed (Project Admin)","steps":["Open Settings > Workflows, a Workflow, its Versions.","Open the builder: add a Step, connect, undo, auto-layout, Validate, Publish.","Open the Library."],"expected":"Matches settings-workflows.html with wf/, D:\\Artifacts\\Rabaed Settings Workflows.html and Rabaed Workflow Builder V2.html: canvas, Step panel, problems list, Change Note; usable at 1366.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-938","id":"UX-16","title":"Register Import wizard and Imports page","part":"UX","partName":"UI and UX against the design","round":"0","who":"Ali (TMC PM)","steps":["Run an import: upload, worksheet and header row, mapping, preview with bad rows, confirm.","Open the result page and the Imports page. EN and AR."],"expected":"Laid out as design/prompts/register-import.md, except that no import time is shown (visibility.md wins): each step says where you are, bad rows show every reason, confirm says how many Drafts.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-939","id":"UX-17","title":"Snag List on the desktop","part":"UX","partName":"UI and UX against the design","round":"0","who":"Ahmed (DCL engineer); Hafiz","steps":["Open the Snag List: List grouped by Stage, Kanban, type chips, filters, EN and AR."],"expected":"Matches snag-list.html: groups, chips, Step Age dots, filters; Comments from Code B shown as designed.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-940","id":"UX-18","title":"WIR request and on-site inspection on a phone","part":"UX","partName":"UI and UX against the design","round":"0","who":"Hafiz; Ahmed","steps":["At 375 (phone), raise a WIR and open it on site as Ahmed: checklist, photos, annotate, EN and AR."],"expected":"Laid out as inspection-on-phone.md: phone-first, large touch targets, camera first, annotate tools reachable with a thumb, nothing cut off.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-941","id":"UX-19","title":"Phone width for every built page","part":"UX","partName":"UI and UX against the design","round":"0","who":"Hafiz; Ali","steps":["At 375 and 820 open Home, Projects, List, Kanban, item page, New item, Notifications, Profile, Settings. EN and AR."],"expected":"Follows D:\\Artifacts\\Rabaed Responsive Anatomy.html and responsive.md: no page-level sideways scroll; tables and the Kanban scroll inside their region; the sidebar is a drawer; every action reachable.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-942","id":"UX-20","title":"Empty, loading and error states","part":"UX","partName":"UI and UX against the design","round":"0","who":"Hafiz; a new Member with no Projects","steps":["Visit each built page with no data, while loading (slow network), and with the api stopped for a moment."],"expected":"Every page has a designed empty state with a next step, a loading state with no layout jump, and an error that says what to do; the not-found page says nothing about the request.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-943","id":"UX-21","title":"Feedback after every action","part":"UX","partName":"UI and UX against the design","round":"0","who":"Hafiz; Ali; Mohammed","steps":["Save a Draft, take each Transition, upload, change a setting.","Watch for the confirmation, the disabled reason and the page update."],"expected":"Each action gives visible feedback (toast or inline), disabled buttons say why, the page updates without a reload, nothing is done twice on a double click.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-944","id":"UX-22","title":"Keyboard and screen reader basics","part":"UX","partName":"UI and UX against the design","round":"0","who":"Hafiz","steps":["Use the List, Kanban, item page, a Transition pop-up and the Form with the keyboard only.","Run an accessibility scan (the accessibility-tester agent, report only) on the same pages, EN and AR."],"expected":"Visible focus, logical focus order (mirrored in Arabic), pop-ups trap and return focus, every control has a label, text contrast at least WCAG AA. Findings reported as UI issues.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-945","id":"UX-23","title":"Packages view and Package page","part":"UX","partName":"UI and UX against the design","round":"1","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["Open the Packages view and a Package page, EN and AR, 1366 and 1920: cards, counts, item table, bulk bar, Comments section."],"expected":"Matches packages.html where spec RP-616 does not differ (the table of known differences in design/prompts/packages.md).","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-946","id":"UX-24","title":"Snag List on a phone","part":"UX","partName":"UI and UX against the design","round":"3","who":"Hafiz; Ahmed","steps":["At 375 open the Snag List, filters and a Snag; create one camera first."],"expected":"Matches snag-list-mobile.html: photo-first cards, bottom-sheet filters, camera-first create.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-947","id":"UX-25","title":"Add Signature, the no-Signature and no-Stamp pop-ups, Company logo and Stamp","part":"UX","partName":"UI and UX against the design","round":"2","who":"Hafiz; Saeed (Authorized Person)","steps":["Profile > Add Signature (draw, type, upload).","Take a Transition with no Signature; with a Company with no Stamp.","Company profile: logo and Stamp."],"expected":"Laid out as signature-and-stamp.md and its Claude Design screens (RP-665): clear what is missing and how to add it, EN and AR.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-948","id":"UX-26","title":"Documental Record and Working Copy read like the owner samples","part":"UX","partName":"UI and UX against the design","round":"2","who":"Ali; Mohammed","steps":["Download the Documental Record of a closed MAR and a Working Copy, EN and AR record language.","Compare with the owner samples of RP-151."],"expected":"Page 1, the Form body, Signature cards and appendix follow the samples where they agree with visibility.md and GLOSSARY.md; Latin digits; Document Numbers left to right; readable when printed.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-734","id":"VIS-01","title":"A new Draft and a MAR in internal review are TMC's alone","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz, Ali (TMC). Must NOT see: Yousef (Beta Build), Ahmed, Sara, Mohammed (DCL), Faisal, Noura (Al Waha), Owner PM (UAT Owner Co)","steps":["Hafiz saves a Draft MAR \"UAT VIS-01 Draft\".","Each observer: Submittals List, Kanban, Dashboard, Home, Activity Feed, bell, and search for the Subject; note every count.","Hafiz sends it for review (Ali holds it); repeat 2."],"expected":"Observers must NOT see the item in any List, Kanban, count, badge, Dashboard figure, search result, feed entry or notification, before or after the send. Their counts are unchanged by it.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-736","id":"VIS-02","title":"After the Submit only the covering Consultant and oversight see the MAR","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Ali. Must see: Ahmed (DCL Electrical), Faisal and Noura (Al Waha, oversight), Owner PM (UAT Owner Co). Must NOT see: Sara (Mechanical-only, FX-K1M), Yousef (Beta Build)","steps":["Ali Submits an Electrical MAR.","Check each person's List, pool, item URL."],"expected":"Ahmed sees it in the Step Pool; Faisal, Noura and the Owner PM see it read-only as oversight; Sara (Mechanical only) and Yousef (same Trade, other Contractor, V3) get the 404 page, no row and no count.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-738","id":"VIS-03","title":"Access follows the current grant, not the grant date","part":"VIS","partName":"Visibility","round":"0","who":"Layla (DCL Authorized Person); Sara","steps":["With Sara Mechanical-only and an Electrical MAR Submitted, Layla gives Sara Electrical again.","Sara opens the List.","Layla removes Electrical again."],"expected":"Sara sees the Electrical items from then on, including earlier ones; after removal she stops seeing them (E2 aside). Layla needs no Handover for a Step Sara does not hold.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-740","id":"VIS-04","title":"Recommended Code, Internal Notes and the verification note never reach TMC","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Ahmed, Mohammed (DCL). Must NOT see: Hafiz, Ali (TMC), Faisal, Noura (Al Waha)","steps":["Ali Submits with an Internal Note.","Ahmed Sends to Manager with a verification note, Recommended Code A and an Internal Note.","Before the Code, read the item history, Activity Feed, bell and List as Hafiz, Ali and Faisal.","Mohammed issues Code C with Remarks, a verification note and an Internal Note.","Read again."],"expected":"Before the Code TMC and Al Waha see no change at all: no reply, Recommended Code or Return. After it they read the Code, Remarks and final verification and that Mohammed issued it, never Ahmed's reply, a Recommended Code, an internal_answers entry or any Internal Note; the history numbering has no gap. K1 sees the Submit but never TMC's Internal Note. DCL reads all of its own.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-742","id":"VIS-05","title":"Code B Comments reach the reviewed item's raiser only","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Mohammed (DCL). Must NOT see: Yousef (Beta Build); Sara (Mechanical-only). Must see: Ali, Hafiz (TMC), Faisal (oversight)","steps":["Mohammed issues Code B with three comment rows on a TMC Electrical MAR.","Yousef: Snag List, counts, Kanban, and each Comment id.","Ali resolves one and Mohammed closes it.","Read the MAR's Comments line as Sara."],"expected":"Yousef sees none in the Snag List, counts or Kanban and gets 404 by id; Comments are Open with TMC, raised by DCL, seen by Faisal as oversight; Sara sees neither the MAR nor its Comments; TMC and DCL read 2 open / 1 closed.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-745","id":"VIS-06","title":"Chat is visible to every Participant that has the item","part":"VIS","partName":"Visibility","round":"","who":"Ali; Ahmed; Faisal","steps":["Ali posts in Chat on a Submitted MAR.","Ahmed and Faisal read it."],"expected":"Both read it; messages cannot be edited or deleted. Chat is not on the closed record.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-764","id":"VIS-07","title":"Only people who see a closed item can download its record","part":"VIS","partName":"Visibility","round":"0","who":"Must see: Ali, Ahmed, Faisal, Owner PM. Must NOT see: Yousef (Beta Build)","steps":["Mohammed closes a MAR.","Each person presses Download PDF on the item and from the List row; Yousef also requests the item id and the record URL directly."],"expected":"Ali, Ahmed, Faisal and the Owner PM download the same record; Yousef gets the plain 404 page everywhere and no row. A made-up id and an item whose record is not made yet give the same 404.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-766","id":"VIS-08","title":"The Record Data inside the PDF holds only what the pages print","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC)","steps":["Open the PDF's attachments and extract the Record Data XML.","Compare each value with the PDF text."],"expected":"Every value in the XML (Transitions on the path with name, Position, Company, times and hashes; Verification Code and link) is printed in the PDF; the XML holds no Internal Note, Recommended Code, Chat or Return.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-768","id":"VIS-09","title":"A Link to an item the viewer cannot see shows number and Subject only","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Omar (TMC, Tower 2 only); Mohammed (DCL); Yousef (Beta Build)","steps":["Hafiz's control panel MAR links the exit signs (Tower 1).","Omar opens Links, then the Link.","Open the exit signs' own URL as Omar.","Mohammed, who sees both, opens the Link.","Yousef tries to link the exit signs in his own Draft."],"expected":"Omar sees only the Document Number and Subject; the Link opens on its own page with only You are not allowed to see the details of this item; the response holds no item id and the item URL is 404. Mohammed gets the item. Yousef is never offered the exit signs.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-769","id":"VIS-10","title":"Linked from lists Submitted items by number and Subject only","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Mohammed (DCL); Ali, Hafiz (TMC)","steps":["Hafiz links his Draft MAR-2 to the Submitted MAR-1.","Mohammed reads MAR-1's Linked from.","Hafiz Submits MAR-2; read again.","Needs FX-C2: Mohammed raises a Snag that links MAR-1; Hafiz reads MAR-1's Linked from."],"expected":"MAR-2 is not listed while it is a Draft or in internal review, then appears. Hafiz sees Mohammed's item as number and Subject; opening it says he may not see its details; its answers, history and Documents stay hidden and its URL is 404.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-771","id":"VIS-11","title":"Link search never offers what the linker cannot see","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz; Yousef","steps":["As Hafiz search for an item to link.","As Yousef search for the same Subjects.","Via the API save a Link to a Beta Build item id from TMC."],"expected":"Hafiz is offered only Submitted items he sees in this Project: no Drafts, nothing in internal review, nothing of Beta Build, nothing from another Project. Yousef is never offered TMC's item. The saved Link is refused like a made-up id.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-772","id":"VIS-12","title":"A Revision Draft is hidden; the drop-down lists only what the viewer sees","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz (TMC). Must NOT see: Mohammed, Faisal","steps":["Hafiz creates Revision 1 of a Code C MAR and keeps it Draft.","Mohammed and Faisal open the original: drop-down, Links, and the Revision URL.","Hafiz Submits it.","Hafiz discards another Draft Revision and creates it again."],"expected":"Before the Submit the drop-down lists only the original, there is no Link to the Draft and its URL is 404. After it both Revisions are listed and the original shows its own answers, Documents and history. A discarded Revision never reaches Mohammed; the re-created one is Rev 1 again.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-775","id":"VIS-13","title":"A Revision moved to another Location: each oversight Member sees only theirs","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz (TMC); Faisal (Tower 1 only), Noura (Tower 2 only) after Hind narrows them","steps":["Hind narrows Faisal to Tower 1 and Noura to Tower 2 (fixture FX-OR).","Hafiz makes Rev 1 of a Tower 1 MAR, moves it to Tower 2, names the original in a link question and Submits it.","Both read the original, Rev 1, Links, Linked from and the drop-down."],"expected":"Faisal sees the original but no Link to Rev 1 and a drop-down with the original only; Noura sees Rev 1 with no Link, Linked from or link answer naming the original and a drop-down with Rev 1 only. Neither shows even a number or title of the other.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-776","id":"VIS-14","title":"After a Send Back (Comment only) everyone sees the item as it was","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz (TMC). Observers: Mohammed (DCL), Faisal, UAT Owner PM","steps":["Needs FX-SB (WF-09, Comment only).","Ahmed Sends a Submitted MAR Back.","Hafiz tries to change an answer, add a Document and a Link.","Observers read the item, Documents, Links and Link search.","Hafiz Submits again."],"expected":"Hafiz cannot change anything (Sent back for comment). Observers see the item exactly as at the Send Back; the item is still offered in Link search and in Linked from with the same number and Subject. After the new Submit they see everything.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-785","id":"VIS-15","title":"After a Send Back (Edit the Form) the raiser changes stay private","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz (TMC). Observers: Mohammed, Faisal (Tower 1 only), Noura (Tower 2 only), UAT Owner PM","steps":["Needs FX-SB with the Edit the Form setting and FX-OR.","Sent Back item at Tower 1: Hafiz changes an answer, adds a Document, a datasheet and a checklist photo, swaps a Link from X to Y, moves it to Tower 2.","Observers read it through List, Kanban, filters, search, item, Documents, Links, history, feed, bell.","Hafiz Submits again."],"expected":"Until the Submit observers see the item, Documents, Links, Trade, Location and Scopes as they were at the Send Back; new Documents are 404 to them; Faisal (Tower 1) keeps the item and Noura (Tower 2) does not see it; no history entry or notification shows a change. After the Submit the new values apply to everyone: Faisal loses it and Noura gains it.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-788","id":"VIS-16","title":"Creation Date, Submission Date and saved times stay inside TMC","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz, Ali (TMC). Observers: Ahmed, Mohammed (DCL)","steps":["Hafiz saves a Draft, sends it, Ali Submits.","Compare the item page and List for TMC and for DCL; look at the ids in the address bar and in links.","Check the order of un-numbered Drafts.","Needs AGE for the date checks."],"expected":"TMC sees Creation Date (when it got its number) and Submission Date; DCL sees only the Submission Date and no Creation Date in any form. Ids carry no time. Un-numbered Drafts come last, ordered by Subject. Answer times and Saved read the Creation Date or later; a Revision follows its own Creation Date. The stored earlier times are covered by the automated suite.","needs":["setup","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-792","id":"VIS-17","title":"Step Age and With are counted per Company","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Ali (TMC); Ahmed, Mohammed (DCL)","steps":["Ali Submits.","Ahmed picks it up, sends to Manager, Mohammed Returns it to Ahmed.","Ali reads With, the Stage, Step Age and the workflow drawer.","Needs AGE: age the item 5 weeks inside TMC, then Submit."],"expected":"Ali sees With Design Consultants LLC and Step Age counted from the Submit, no reset, no internal move. DCL Step Age runs from when the item reached DCL (week 1), not the five weeks inside TMC; four weeks later it counts for DCL. No Step or person of the other Company appears.","needs":["setup","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-795","id":"VIS-18","title":"Dashboard counts follow what the viewer may see","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz, Ali (TMC); Ahmed (DCL); Yousef (Beta Build)","steps":["Fresh seed, MAR card: note Ali, Ahmed and Yousef.","Hafiz saves two more Drafts and sends one for review.","Mohammed Codes C one Submitted MAR; Hafiz creates Rev 1 and keeps it Draft; compare the Revision line.","Compare again."],"expected":"Fresh seed: Ali Pending 2 (0002 and 0003 Rev 1, one per chain) and In preparation 1 (the seeded Draft); Ahmed Pending 2 and no In preparation figure; Yousef 0 of everything. After step 2 Ali In preparation 3 and Pending unchanged; Ahmed and Yousef unchanged. DCL card shows awaiting revision while TMC card shows Revision in progress; each chain counts once; Yousef Revision line holds nothing of TMC.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-797","id":"VIS-19","title":"List and Kanban counts, lanes and filters hide the other Company","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Ali (TMC); Ahmed, Mohammed (DCL); Yousef (Beta Build)","steps":["With a TMC item picked up by Mohammed and another in TMC internal review, Ali and Ahmed open the filter panel (Owner, Role, Created date) and the Kanban.","Yousef opens Kanban and List."],"expected":"Owner offers each viewer their own Company people and the other Company by name only; filtering by the other Company person finds nothing. Role offers only the viewer own Steps. The TMC Internal Review column names its Steps with counts; DCL sees none of them. Created date is the Creation Date for TMC and the Submission Date for DCL. Yousef counts cover only Beta Build items.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-798","id":"VIS-20","title":"Search finds nothing inside answers or replies","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC); Mohammed (DCL)","steps":["Mohammed issues a Code with Remarks containing the word zircon.","Ali and Mohammed search zircon in List and Kanban.","Search the owner name and a Floor name."],"expected":"No result for zircon: Search never reads answers or replies. Search by Document Number, Subject, Type, Trade, Location and the raiser Company works; an owner phrase finds the viewer own Company people and the other Company by name only.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-799","id":"VIS-21","title":"Watch is private and ends when the viewer loses sight","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC); Ahmed (DCL); Faisal (Al Waha)","steps":["Ali, Ahmed and Faisal watch a MAR.","Read each page for any list or count of watchers.","Hind narrows Faisal off the MAR Trade.","Mohammed issues Code A."],"expected":"Each sees only their own Watching; no list or count of watchers. After narrowing Faisal gets no notification, in-app or email, of the Code.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-801","id":"VIS-22","title":"Notifications and emails reach only Members who see the item","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Mohammed (DCL). Must see: Hafiz (TMC raiser). Must NOT receive: Yousef (Beta Build), Sara (Mechanical-only)","steps":["Mohammed issues Code B on a TMC MAR.","Open the mailbox: the mail to Hafiz.","Look for any mail or bell entry for Yousef and for Sara."],"expected":"The subject of Hafiz's mail holds the Document Number, Subject and Code B only; Design Consultants is named as a Company and the final signer as the one person; no DCL internal step or Recommended Code. Yousef and Sara get nothing, in-app or email.","needs":["mail","owner"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-804","id":"VIS-23","title":"Who holds an item: pool names stay inside the holding Company","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Ali, Hafiz (TMC); Ahmed, Sara, Mohammed (DCL)","steps":["Ali Submits a MAR: it waits in DCL pool of two Engineers.","Ali reads With on the item, List and Kanban.","Ahmed picks it up; Sara and Ali read again.","Mohammed issues Code B; the Comments wait in TMC pool."],"expected":"Ali reads With Design Consultants LLC and never the pool names, the holder or a Pick up event, in the item, List, Kanban, history, feed or notifications. DCL reads the pool names then the holder. Mohammed reads TMC by name only, even while the Comments wait in TMC pool.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-807","id":"VIS-24","title":"The Owner review: With Owner review and the Recommended Code","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Mohammed (DCL); Noura (Al Waha PM, holds the review); Hafiz, Ali (TMC); UAT Owner PM","steps":["Raise a DAR; Ali Submits; Mohammed recommends Code B with a table of comments to the Owner.","Hafiz and Ali read the item everywhere.","Noura Sends Back; Mohammed recommends C; Noura Confirms.","The UAT Owner PM reads the item at each step."],"expected":"While Noura reviews, TMC reads With Owner review (no Company name) in the List, search, Kanban lane, item, workflow map and weekly report, and no Code anywhere (not in History, feed, bell, Dashboard). Mohammed and Noura read the Recommended Code; the UAT Owner PM (Owner, not holder) reads none until it is issued. Confirm issues the Code for everyone; Comments with B come from Mohammed rows and are held by TMC; Code C offers a Revision.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-816","id":"VIS-25","title":"The workflow map folds the other Company into one block","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC); Ahmed, Mohammed (DCL); UAT Owner PM","steps":["Ali and the Owner PM open View workflow on a Submitted MAR.","Ahmed sends it to Mohammed.","Read the map again."],"expected":"Both read the whole Version with every Company Steps, but the item is With Design Consultants LLC over DCL part: no DCL Step is marked and the Ahmed to Mohammed move changes nothing they read. DCL sees Mohammed Step marked.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-819","id":"VIS-26","title":"Workflow authoring is 404 for everyone but the authors","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC PM, not Project Admin); Layla (DCL Authorized Person); Nasser (Project Admin of JCV only)","steps":["Each opens the builder URL of Tower Workflow and tries Duplicate, Save, Publish and Bind on it.","Nasser also tries a JCV Workflow URL pasted under the Tower Project."],"expected":"Every attempt gets the plain 404 naming nothing and changes nothing; a Rabaed Default is 404 in the builder to Project Admins; a made-up id gives the same 404. Binding to another Project Workflow or a Library Workflow is 404 for the Project Admin too.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-822","id":"VIS-27","title":"Draft Workflows and exception bindings are not public","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (Project Admin); Ali, Yousef, Ahmed","steps":["Saeed saves a draft of a Tower Workflow and a draft renaming a running Workflow.","Bind Beta Build MARs to an exception Workflow (WF-08).","Ali, Yousef and Ahmed open Settings > Workflows and the API."],"expected":"Nobody but the Project Admin reads a draft; the rename stays hidden until published; everyone reads published Versions whole. TMC and DCL read the exception Workflow as a definition but never its binding; only Yousef and the Project Admin learn which Participant it binds.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-825","id":"VIS-28","title":"A Company's Library is private until used on a Project","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (TMC Authorized Person); Layla (DCL); Hafiz; a Company on no shared Project","steps":["TMC saves a Workflow and a Form to its Library and marks a default.","Layla and Hafiz open Library and Settings.","Use it on Tower."],"expected":"DCL sees only its own Library; Hafiz lists TMC published Library Workflows read-only; nobody browses another Company Library; a Form appears to others only once used on Tower, and can then be copied; Library Workflow URLs of TMC are 404 to DCL.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-828","id":"VIS-29","title":"Change Notes and running counts never leak","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (Project Admin); Hafiz; Yousef","steps":["Publish with a Change Note naming Beta Build on an exception Workflow.","Hafiz and Yousef each raise a Draft.","Reopen the publish dialog and Versions."],"expected":"The Change Note naming a Participant on an exception is refused; N items keep their Version counts only the items the reader sees; only authors read Change Notes.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-832","id":"VIS-30","title":"Another Project or a non-admin cannot read or change Tower setup","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC PM, not Project Admin); Layla (DCL Authorized Person); Nasser (Project Admin of JCV)","steps":["Each opens Tower Settings: Scopes add, rename, deactivate; numbering counters; Workflow settings; Visibility.","Saeed (Project Admin) does the same."],"expected":"Ali, Layla and Nasser get the plain 404 for every change and for the numbering counters; the Scope is unchanged. Saeed can do them. Every Project Member reads Tower Trades, Scopes, Locations and published Workflows.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-834","id":"VIS-31","title":"A Participant never sees the list of other Participants","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz (TMC, not Project Admin); Ahmed (DCL); Saeed (Project Admin)","steps":["Hafiz and Ahmed open Company Projects and the Project Participants page.","Saeed opens the Participants.","Open Settings > Numbering as Hafiz and as Ahmed."],"expected":"Hafiz sees TMC own Participant, its role, its Project Members and the Host Company name; Ahmed sees DCL own Participant with Host Company TMC; neither lists the others. Saeed sees every Participant. Numbering shows each their own Participant with No code yet and no order number; Project Admin sees all orders.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-837","id":"VIS-32","title":"Pending invitations: one answer whatever the CR number","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (Project Admin); Layla (DCL Authorized Person); Hafiz","steps":["On a UAT Project invite a CR on Rabaed (DCL, 9999000003) and a made-up CR 9999000099.","Hafiz looks for DCL anywhere.","Layla opens Company Projects.","Saeed withdraws both invitations."],"expected":"Both invitations show on Saeed list by CR number only and read the same; Hafiz sees DCL nowhere; Layla sees only the invitation (Project name, Host Company, offered role); after the withdrawals both leave Saeed list in exactly the same way and DCL list too; nothing shows which CR number was on Rabaed.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-840","id":"VIS-33","title":"Member Visibility pages belong to their own Company","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz (TMC); Saeed (Project Admin); Layla (DCL Authorized Person)","steps":["Hafiz opens DCL Participant page and Ahmed Visibility page by URL.","Saeed does the same.","Layla, not yet a Project Member, opens her Participant page."],"expected":"Hafiz and Saeed get the 404 for DCL Member Visibility; Saeed does see DCL Participant grant. Layla sees only the Trades and Locations DCL covers (with the Locations above, such as Tower 1 > Floor 02) and the Scopes under those Trades, and nothing else of the Project.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-843","id":"VIS-34","title":"Narrowing has limits and Handover tells only counts across Companies","part":"VIS","partName":"Visibility","round":"0","who":"Layla (DCL Authorized Person); Saeed (Project Admin); Mohammed (DCL manager)","steps":["Layla gives Ahmed a Trade DCL does not have.","Mohammed holds an Electrical MAR at DCL review; Saeed narrows DCL off Electrical.","Saeed narrows DCL Locations from all to Tower 1 only, then widens DCL back to all."],"expected":"1) Rejected: a Member never covers more than the Participant. 2) Refused with only 1 Step of DCL needs a new holder first. Ask DCL to hand them over; never the Step, item or Member; nothing changes. 3) After narrowing, DCL engineers cover Tower 1 only; widening the Participant again does not widen them.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-846","id":"VIS-35","title":"Visibility Gap warnings show only what the viewer is entitled to","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (Project Admin); Layla (DCL Authorized Person)","steps":["DCL covers Mechanical but no DCL Member is granted it.","Saeed opens Settings > Visibility.","Layla opens her warnings."],"expected":"Saeed sees no gap and nothing of how DCL splits coverage; Layla is warned that no DCL Project Member covers Mechanical. Other Participants Members never count towards it.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-849","id":"VIS-36","title":"A refused Submit gives one answer for every reason","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC PM)","steps":["Submit an Electrical MAR when (a) no Consultant covers Electrical, (b) two Consultants cover it, (c) the covering Consultant has nobody with the Position. Set each up in Settings > Visibility and Positions."],"expected":"Submit is not offered and taking it gives the same answer in all three cases: This cannot be handed over yet: the next step has nobody to take it. Ask a Project Admin. Nothing names a Consultant or says which case it is.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-854","id":"VIS-37","title":"Documents and photos follow the item's visibility","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz (TMC). Must NOT see: Yousef (Beta Build), Ahmed (DCL, before the Submit), a TMC Member off the Project","steps":["Hafiz attaches a datasheet and a geotagged photo to a Draft MAR.","Each other person requests the Documents list, a download URL and tries to upload or remove, by the item page and by the API.","Ali Submits.","Ahmed and Yousef again."],"expected":"Before the Submit Yousef, Ahmed and the off-Project Member get the 404 (same as a made-up id) naming nothing. After it Ahmed sees and downloads the Documents and photo with time and place, and TMC as the uploader Company, not the engineer; Yousef still gets 404 for the list and the URLs.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-855","id":"VIS-38","title":"After the Submit only the Step holder changes anything","part":"VIS","partName":"Visibility","round":"0","who":"Ali (TMC PM); Hafiz; Ahmed","steps":["With the MAR at Consultant review, Hafiz and Ali try to save an answer, add a Document and edit a Link.","Ahmed tries to change an answer."],"expected":"All refused: after the Submit the Form is the raiser own and read-only to everyone but the raiser at a Step that lets it edit; the Consultant answers only in its reply Screen.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-858","id":"VIS-39","title":"Document Numbers and numbering counters do not reveal a rival volume","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz (TMC); Yousef (Beta Build); Ahmed (DCL); Saeed (Project Admin)","steps":["Hafiz and Yousef each raise and number three MARs.","Compare their numbers.","Saeed saves a pattern without the Participant Code.","Hafiz, Yousef and Ahmed open Settings > Numbering and the counter URLs."],"expected":"TMC numbers run 0001, 0002, 0003 with no gaps from Beta Build. The shared-counter pattern is refused until Saeed accepts the warning; then both share one count. Hafiz, Yousef and Ahmed see examples built from their own Participant with sequence 1 and a 404 for counters. Version history names the saver Company only to its own Members and the Project Admin; others read A Project Admin.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-861","id":"VIS-40","title":"A Code D replacement is invisible while it is a Draft","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz (TMC). Must NOT see: Mohammed (DCL), Faisal, UAT Owner PM","steps":["Mohammed rejects a MAR with Code D.","Hafiz creates the replacement and keeps it Draft.","The others read the rejected MAR Links, Linked from, History and search.","Hafiz sends and Ali Submits it."],"expected":"While it is a Draft nobody else reads anything of it and the rejected MAR Links and Linked from do not name it; it takes a new Document Number at its first send (no Rev). Once Submitted it appears in the rejected MAR Linked from by number and Subject and lists the rejected MAR under Links.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-865","id":"VIS-41","title":"The Handover list shows only the Authorized Person's own Company","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (TMC Authorized Person, not a Project Member in the seed); Omar (TMC); Layla (DCL Authorized Person); Hafiz, Mohammed","steps":["Hafiz holds two Tower 2 MARs at Contractor Engineer; Mohammed holds one at DCL review.","Saeed deactivates Hafiz and reads the Handover list.","Saeed picks Omar.","Saeed tries to deactivate Mohammed.","Layla deactivates Mohammed."],"expected":"Saeed lists only TMC Steps and Members. As he sees none of these items, each is listed as An item at \u003cStep> on \u003cProject>, with no Subject, Document Number or item id. Omar is the candidate; after the pick Omar sees and edits both. Deactivating Mohammed is 404 for Saeed, and no pick names another Company Step. For Layla the refusal (Mohammed is the only Manager) names only DCL own Step and the Project.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-868","id":"VIS-42","title":"Home sums only per-Project reads the Member already has","part":"VIS","partName":"Visibility","round":"0","who":"Yousef (Beta Build); Hafiz, Ali (TMC); Mohammed (DCL); Faisal (Al Waha)","steps":["With TMC items in every state (Draft, internal review, Submitted to DCL and OR, Sent Back, Code A, Code C Rev 1) open Home as each.","Compare each figure with that Member List and the Projects page."],"expected":"Yousef: Need My Action 0, 4+ weeks 0, no row or activity of TMC (TMC only as Host Company on the card). Hafiz Draft never counts or lists. Waiting with others counts TMC own items others hold (not Drafts, closed or Sent Back); DCL and OR count 0. Each Project card count equals that Member List count.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-872","id":"VIS-43","title":"Export, Download and Duplicate respect the viewer","part":"VIS","partName":"Visibility","round":"0","who":"Actors: Hafiz, Ali (TMC); Mohammed (DCL); Yousef (Beta Build); a signed-in stranger","steps":["With Drafts, a Submitted item picked up by Mohammed and a closed Code C item, Hafiz and Mohammed Export the List (also with a search).","Ali and Mohammed Download.","Mohammed tries Duplicate.","Yousef and the stranger try Download and Duplicate by id."],"expected":"Each export holds exactly that viewer rows and fields (Creation Date for TMC only; the owner is Mohammed to DCL and DCL by name to TMC); Download gives the same shared content to both; Duplicate is refused for Mohammed (one word for every reason) and 404 for Yousef and the stranger.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-875","id":"VIS-44","title":"Members page counts only the viewer own Company Projects","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (Authorized Person); Hafiz (plain Member); Layla","steps":["Saeed opens Members.","Hafiz opens it.","Layla opens hers."],"expected":"The Projects column counts each own Member active Projects (the same for Saeed and Hafiz, who read nothing but the count); never DCL people or Projects; DCL list holds DCL people only.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-878","id":"VIS-45","title":"The Approved Supplier List is Project-wide but hides its source","part":"VIS","partName":"Visibility","round":"0","who":"Yousef (Beta Build); Ahmed (DCL); Layla (DCL Authorized Person); Saeed","steps":["After a SAR closes at A (SUB-20), Yousef and Ahmed read the list and raise a MAR choosing the supplier.","Look for the SAR, its Links, who added it, when.","Layla and Nasser try to add, withdraw or read Tower list."],"expected":"Every Project Member reads name, Trade, Scope and status (a withdrawn one as withdrawn); never the SAR, its person, its time or its source; Yousef MAR answer reads the supplier name; Layla and Nasser (not Project Admins or not on Tower) get 404 and nothing changes.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-881","id":"VIS-46","title":"Inspections shown inside Submittals reveal nothing extra","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz, Ahmed (see the WIR); Yousef (Beta Build, other Trade or Location)","steps":["Saeed turns Inside the Submittals tab on (PAR-11).","A Submitted TMC WIR exists.","Each reads the Submittals List, counts, type filter, search, Kanban, Need My Action, Projects page count and the WIR URL."],"expected":"Hafiz and Ahmed see the WIR in all of them; Yousef sees it in none and gets 404 by id. The setting widens where own rows show, never which rows.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-884","id":"VIS-47","title":"Required links and Approved submittals reveal only definitions","part":"VIS","partName":"Visibility","round":"0","who":"Saeed (Project Admin); Hafiz; Ahmed; Nasser (JCV)","steps":["Saeed turns Approved submittals required on for Tower.","Nasser does the same on JCV.","Everyone reads Tower setting and tries to change it.","As Ahmed (Mechanical inspector) open a Tower WIR with a Link to an Electrical Code A MAR he cannot see."],"expected":"Every Tower Member reads which links are required, never JCV; nobody reads who set it or when; only Saeed changes it, others get 404. Ahmed (not covering the MAR Location) sees its Document Number and Subject only and cannot open it; the Project Admin gets its id.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-887","id":"VIS-48","title":"An annotated photo has exactly the readers of its original","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz (TMC); Ahmed (DCL); Yousef (Beta Build)","steps":["Hafiz annotates a photo on a MAR and Saves.","Ali Submits.","Ahmed lists and downloads both; Yousef requests the list, both URLs and an annotate call."],"expected":"TMC and DCL list and download both copies, the annotated linked to the original whose bytes are unchanged; Yousef gets 404 for everything, as for a made-up id; the file store refuses either file without a signed URL.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-890","id":"VIS-49","title":"A WIR Recommended Result or Code stays inside the Consultant","part":"VIS","partName":"Visibility","round":"4","who":"Ahmed, Mohammed (DCL); Hafiz, Ali (TMC); Faisal; Yousef","steps":["Ahmed sends a WIR to Mohammed recommending Failed (later: Code C) with an Internal Note; Mohammed Returns it; Ahmed sends it again; Mohammed issues the Code.","TMC and OR read history, feed, events."],"expected":"DCL reads the Recommended Code and Internal Note; TMC and OR read none of it before or after the issued Code, only the Code and the Manager shared reply; Yousef reads nothing of the WIR.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-893","id":"VIS-50","title":"A Snag raised on one Contractor is invisible to the other","part":"VIS","partName":"Visibility","round":"0","who":"Mohammed (DCL); Ali (TMC); Yousef (Beta Build, Tower 2 only after FX-C2)","steps":["Mohammed raises a Snag (Electrical, Tower 1, photos) and TMC moves it In Progress.","Yousef opens the Snag List, its counts, Kanban and filters (Company, Raised from, Comment Type), the Snag by id, history, Links and Documents."],"expected":"Yousef sees the Snag nowhere and the filters offer only his own Company; Raised from offers nothing; a Comment raised from a source Yousef cannot see is not named by number. By id everything is 404.","needs":["setup"],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-905","id":"VIS-51","title":"Snag Steps are shared only as Transitions","part":"VIS","partName":"Visibility","round":"0","who":"Hafiz (TMC); Mohammed (DCL)","steps":["TMC moves the Snag Start work and Resolve with a note.","Mohammed reads the history.","Mohammed holds Verify."],"expected":"Mohammed reads TMC Resolve and its note, never Start work, internal moves or who picked it up; TMC reads DCL Raise, never its Draft or who holds Verify.","needs":[],"url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-907","id":"VIS-52","titl function openDb() {
  return new Promise((ok, no) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { const d = req.result; d.createObjectStore("entries"); d.createObjectStore("shots", { keyPath: "id" }); d.createObjectStore("meta"); };
    req.onsuccess = () => ok(req.result);
    req.onerror = () => no(req.error);
  });
}
const tx = (store, mode, fn) => new Promise((ok, no) => {
  const x = db.transaction(store, mode); const s = x.objectStore(store); const r = fn(s);
  x.oncomplete = () => ok(r && "result" in r ? r.result : undefined); x.onerror = () => no(x.error);
});
const all = (store) => new Promise((ok, no) => {
  const out = []; const req = db.transaction(store).objectStore(store).openCursor();
  req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } else ok(out); };
  req.onerror = () => no(req.error);
});
const entry = (key) => entries.get(key) ?? { status: "", comment: "", shots: [], at: "" };

async function saveEntry(key, e) {
  e.at = now(); entries.set(key, e);
  const card = document.querySelector(`.case[data-key="${key}"] .saved`);
  try { if (!db) throw new Error("no db"); await tx("entries", "readwrite", (s) => s.put(e, key)); if (card) card.textContent = t("saved") + " " + e.at; }
  catch { if (card) card.textContent = t("notSaved"); }
  progress();
}

// ---- Images: PNG or JPEG kept as is; anything else is redrawn as PNG. ----
function dims(blob) {
  return new Promise((ok, no) => { const u = URL.createObjectURL(blob); const img = new Image(); img.onload = () => { ok({ w: img.naturalWidth, h: img.naturalHeight, img }); URL.revokeObjectURL(u); }; img.onerror = no; img.src = u; });
}
async function normalise(file) {
  const { w, h, img } = await dims(file);
  if (file.type === "image/png" || file.type === "image/jpeg") return { blob: file, type: file.type, w, h };
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/png"));
  return { blob, type: "image/png", w, h };
}
// One change at a time per case, so two quick pastes don't both start from the old list.
const queues = new Map();
function queued(key, fn) {
  const p = (queues.get(key) ?? Promise.resolve()).then(fn);
  queues.set(key, p.catch(() => {}));
  return p;
}
const addShots = (key, files) => queued(key, () => addShotsNow(key, files));
const removeShot = (key, id) => queued(key, () => removeShotNow(key, id));
async function addShotsNow(key, files) {
  const e = entry(key);
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const n = await normalise(f);
      const id = key + ":" + Date.now() + ":" + Math.random().toString(36).slice(2, 7);
      const name = f.name && f.name !== "image.png" ? f.name : `${byKey.get(key).id}-${e.shots.length + 1}.${n.type === "image/jpeg" ? "jpg" : "png"}`;
      const rec = { id, key, name, type: n.type, w: n.w, h: n.h, blob: n.blob };
      if (db) await tx("shots", "readwrite", (s) => s.put(rec));
      shots.set(id, { ...rec, url: URL.createObjectURL(n.blob) });
      e.shots = [...e.shots, id];
    } catch { /* not an image this browser can read */ }
  }
  await saveEntry(key, e);
  drawShots(key);
}
async function removeShotNow(key, id) {
  const e = entry(key); e.shots = e.shots.filter((x) => x !== id);
  const s = shots.get(id); if (s) URL.revokeObjectURL(s.url); shots.delete(id);
  if (db) await tx("shots", "readwrite", (st) => st.delete(id));
  await saveEntry(key, e); drawShots(key);
}

// ---- Sections (RP-1204): the tester's cases by Part, numbered; the owner's cases last ----
const isOwner = (c) => c.needs.includes("owner");
const SECTIONS = (() => {
  const list = [];
  for (const c of cases.filter((x) => !isOwner(x))) {
    let s = list.find((x) => x.part === c.part);
    if (!s) { s = { id: "s-" + c.part, n: list.length + 1, part: c.part, name: PARTS[c.part] ?? { en: c.partName, ar: c.partName }, cases: [] }; list.push(s); }
    s.cases.push(c);
  }
  const owner = cases.filter(isOwner);
  if (owner.length) list.push({ id: "s-owner", n: 0, part: "OWNER", name: { en: "Cases the UAT owner runs", ar: "حالات يشغّلها مسؤول الاختبار" }, cases: owner });
  return list;
})();
const openSections = new Set();
const statusOf = (c) => entry(c.key).status || "unset";
function matches(c) {
  const r = $("fRound").value, s = $("fStatus").value, q = $("fText").value.trim().toLowerCase();
  return (!r || c.round === r) && (!s || statusOf(c) === s) &&
    (!q || [c.key, c.id, c.title, c.who, c.expected, ...c.steps, entry(c.key).comment].join(" ").toLowerCase().includes(q));
}
const filtering = () => Boolean($("fRound").value || $("fStatus").value || $("fText").value.trim());
const barHtml = (list, cls) => {
  const n = (s) => list.filter((c) => statusOf(c) === s).length, total = list.length || 1;
  return `<div class="${cls}">${[["p", "pass"], ["f", "fail"], ["b", "blocked"], ["n", "notrun"]].map(([k, s]) => `<span class="${k}" style="width:${(100 * n(s)) / total}%"></span>`).join("")}</div>`;
};
function sectionHead(s) {
  const done = s.cases.filter((c) => statusOf(c) !== "unset").length;
  const n = (st) => s.cases.filter((c) => statusOf(c) === st).length;
  const shown = filtering() ? s.cases.filter(matches).length : s.cases.length;
  const L = s.name[lang] ?? s.name.en;
  return `<div class="num">${s.n ? s.n : "👤"}</div>
    <div><div class="stitle">${s.n ? `${esc(t("section"))} ${s.n} · ` : ""}${esc(L)}</div>
      <div class="smeta"><span>${s.part === "OWNER" ? esc(t("ownerSection")) : esc(s.part)}</span><span>${s.cases.length} ${esc(t("cases"))}</span>
        ${filtering() ? `<span><b>${shown}</b> ${esc(t("search").toLowerCase())}</span>` : ""}
        ${["pass", "fail", "blocked"].filter((st) => n(st)).map((st) => `<span style="color:var(--${st})">${n(st)} ${esc(t(st))}</span>`).join("")}</div>
      ${barHtml(s.cases, "sbar")}</div>
    <div class="sright"><b>${done}</b> ${esc(t("of"))} ${s.cases.length} ${esc(t("done"))} <span class="chev">›</span></div>`;
}
function drawSections() {
  $("sections").innerHTML = SECTIONS.map((s) => {
    const open = openSections.has(s.id) || (filtering() && s.cases.some(matches));
    const done = s.cases.every((c) => statusOf(c) !== "unset");
    return `<details class="section${s.n ? "" : " owner"}${done ? " done" : ""}" id="${s.id}"${open ? " open" : ""}><summary>${sectionHead(s)}</summary><div class="scases"></div></details>`;
  }).join("");
  for (const s of SECTIONS) if ($(s.id).open) fillSection(s);
}
function fillSection(s) {
  const box = $(s.id).querySelector(".scases");
  const list = filtering() ? s.cases.filter(matches) : s.cases;
  box.innerHTML = (s.n ? "" : `<p class="snote">${esc(t("ownerNote"))}</p>`) + (list.length ? list.map(caseHtml).join("") : `<div class="empty">${esc(t("none"))}</div>`);
  list.forEach((c) => drawShots(c.key));
}
function progress() {
  // Header bar and chips: the tester's part; each open section's header too.
  const mine = cases.filter((c) => !isOwner(c));
  const n = (s) => mine.filter((c) => statusOf(c) === s).length;
  const done = mine.length - n("unset");
  $("overallText").textContent = `${t("overall")}: ${done} ${t("of")} ${mine.length}`;
  $("overallBar").outerHTML = barHtml(mine, "bar").replace('class="bar"', 'class="bar" id="overallBar"');
  $("counts").innerHTML = [...STATUSES, "unset"].map((s) => `<span class="chip ${s}"><b>${n(s)}</b>${esc(t(s))}</span>`).join("") +
    `<span class="chip owner"><b>${cases.length - mine.length}</b>${esc(t("ownerSection"))}</span>`;
  for (const s of SECTIONS) {
    const el = $(s.id); if (!el) continue;
    el.querySelector("summary").innerHTML = sectionHead(s);
    el.classList.toggle("done", s.cases.every((c) => statusOf(c) !== "unset"));
  }
}

// ---- Who's who (RP-1204): the demo people, emails only ----
function drawPeople() {
  const L = (b) => b[lang] ?? b.en;
  $("peopleTable").innerHTML = `<thead><tr>${["pName", "pEmail", "pCompany", "pRole", "pPosition", "pUse"].map((k) => `<th>${esc(t(k))}</th>`).join("")}</tr></thead><tbody>` +
    PEOPLE.map((p) => `<tr id="p-${esc(p.key)}"><td><b>${esc(p.name)}</b></td>
      <td><span class="email" dir="ltr">${esc(p.email)}</span> <button class="mini" type="button" data-copy="${esc(p.email)}">${esc(t("copy"))}</button></td>
      <td>${esc(L(p.company))}</td><td>${esc(L(p.role))}</td><td>${esc(L(p.position))}</td><td>${esc(L(p.usedFor))}</td></tr>`).join("") + "</tbody>";
}
// A case's "Sign in as" line with each demo person's first name linking to their row (whole words, Latin names).
const linkPeople = (who) => {
  let html = esc(who);
  for (const p of PEOPLE) {
    if (p.key === "engineer") { html = html.replace(/\bRabaed Engineer\b/, `<a class="person" href="#p-engineer">Rabaed Engineer</a>`); continue; }
    const first = p.name.split(" ")[0];
    html = html.replace(new RegExp(`\\b${first}\\b(?![^<]*</a>)`), `<a class="person" href="#p-${p.key}">${first}</a>`);
  }
  return html;
};
function drawGuide() {
  const url = DATA.uatUrl + "/en", urlAr = DATA.uatUrl + "/ar";
  const link = (u) => `<a href="${esc(u)}" target="_blank" rel="noopener" dir="ltr">${esc(u)}</a>`;
  $("guideList").innerHTML = t("guide").map((line) => `<li><span>${esc(line).replace("{url}", link(url)).replace("{urlAr}", link(urlAr))}</span></li>`).join("");
}

// ---- A case ----
function caseHtml(c) {
  const e = entry(c.key);
  const needTags = [["owner", "needsOwner"], ["setup", "needsSetup"], ["job", "needsJob"], ["mail", "needsMail"]].filter(([n]) => c.needs.includes(n)).map(([, k]) => `<span class="tag need">${esc(t(k))}</span>`).join("");
  return `<article class="case st-${e.status || "unset"}" data-key="${esc(c.key)}">
    <div class="body">
      <h3 dir="auto"><span class="cid">${esc(c.id)}</span>${esc(c.title)}</h3>
      <div class="meta"><span class="tag">${esc(c.key)}</span>${c.round ? `<span class="tag">${esc(t("round"))} ${esc(c.round)}</span>` : ""}
        <span class="tag"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(t("open"))} ↗</a></span>${needTags}</div>
      ${c.who ? `<div class="lbl">${esc(t("who"))}</div><div class="who" dir="auto">${linkPeople(c.who)}</div>` : ""}
      ${c.steps.length ? `<div class="lbl">${esc(t("steps"))}</div><ol class="steps" dir="auto">${c.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
      ${c.expected ? `<div class="lbl">${esc(t("expected"))}</div><p class="exp" dir="auto">${esc(c.expected)}</p>` : ""}
      ${c.needs.includes("mail") ? `<p class="note" dir="auto">${esc(t("mailNote"))}</p>` : ""}
    </div>
    <div class="rec">
      <div class="status" role="group">${STATUSES.map((s) => `<button type="button" class="${s}" data-s="${s}" aria-pressed="${e.status === s}">${esc(t(s))}</button>`).join("")}</div>
      <label>${esc(t("comment"))}<textarea data-f="comment" dir="auto">${esc(e.comment)}</textarea></label>
      <div class="drop" tabindex="0">${esc(t("drop"))}</div>
      <div class="shots"></div>
      <div class="saved">${e.at ? esc(t("saved") + " " + e.at) : ""}</div>
    </div>
  </article>`;
}
function drawShots(key) {
  const box = document.querySelector(`.case[data-key="${key}"] .shots`);
  if (!box) return;
  box.innerHTML = entry(key).shots.map((id) => shots.get(id)).filter(Boolean)
    .map((s) => `<span class="shot"><img src="${s.url}" alt="${esc(s.name)}" title="${esc(s.name)}" data-id="${esc(s.id)}"><button type="button" data-rm="${esc(s.id)}" aria-label="${esc(t("remove"))}">×</button></span>`).join("");
}

// ---- Page ----
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  $("lang").textContent = lang === "ar" ? "English" : "العربية";
  fillFilters(); drawGuide(); drawPeople(); drawSections(); progress();
}
function fillFilters() {
  const opt = (sel, values, label) => {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${esc(t("all"))}</option>` + values.map((v) => `<option value="${esc(v)}">${esc(label ? label(v) : v)}</option>`).join("");
    sel.value = cur;
  };
  opt($("fRound"), [...new Set(cases.map((c) => c.round).filter(Boolean))].sort());
  opt($("fStatus"), [...STATUSES, "unset"], (s) => t(s));
}
$("sections").addEventListener("toggle", (ev) => {
  const d = ev.target; if (!d.matches?.("details.section")) return;
  const s = SECTIONS.find((x) => x.id === d.id); if (!s) return;
  if (d.open) { openSections.add(d.id); if (!d.querySelector(".case, .empty")) fillSection(s); } else openSections.delete(d.id);
}, true);

let activeKey = "";
const setActive = (key) => {
  if (activeKey === key) return;
  document.querySelector(".case.active")?.classList.remove("active");
  activeKey = key; document.querySelector(`.case[data-key="${key}"]`)?.classList.add("active");
};
$("sections").addEventListener("focusin", (ev) => { const a = ev.target.closest(".case"); if (a) setActive(a.dataset.key); });
$("sections").addEventListener("click", async (ev) => {
  const art = ev.target.closest(".case"); if (!art) return;
  const key = art.dataset.key; setActive(key);
  const sb = ev.target.closest("[data-s]");
  if (sb) {
    const e = entry(key); e.status = e.status === sb.dataset.s ? "" : sb.dataset.s;
    art.querySelectorAll("[data-s]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === e.status)));
    art.className = `case active st-${e.status || "unset"}`;
    await saveEntry(key, e); return;
  }
  const rm = ev.target.closest("[data-rm]"); if (rm) { await removeShot(key, rm.dataset.rm); return; }
  const im = ev.target.closest("img[data-id]");
  if (im) { const lb = $("lightbox"); lb.querySelector("img").src = im.src; lb.querySelector("p").textContent = im.title; lb.style.display = "flex"; return; }
  if (ev.target.closest(".drop")) { $("pick").dataset.key = key; $("pick").click(); }
});
$("pick").addEventListener("change", async () => { const key = $("pick").dataset.key; if (key) await addShots(key, [...$("pick").files]); $("pick").value = ""; });
// A timer per case: typing in the next case never cancels this one's save.
const typing = new Map();
$("sections").addEventListener("input", (ev) => {
  const art = ev.target.closest(".case"); if (!art || ev.target.dataset.f !== "comment") return;
  const key = art.dataset.key, e = entry(key); e.comment = ev.target.value; entries.set(key, e);
  clearTimeout(typing.get(key)); typing.set(key, setTimeout(() => { typing.delete(key); saveEntry(key, e); }, 400));
});
$("sections").addEventListener("dragover", (ev) => { const d = ev.target.closest(".drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
$("sections").addEventListener("dragleave", (ev) => ev.target.closest(".drop")?.classList.remove("over"));
$("sections").addEventListener("drop", async (ev) => {
  const d = ev.target.closest(".drop"); if (!d) return;
  ev.preventDefault(); d.classList.remove("over");
  const key = d.closest(".case").dataset.key; setActive(key); await addShots(key, [...ev.dataTransfer.files]);
});
document.addEventListener("paste", async (ev) => {
  const files = [...(ev.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  // The case the paste is in, else the last one clicked if it is still on screen (not in a closed section or filtered away).
  const key = ev.target.closest?.(".case")?.dataset.key || (document.querySelector(`.case[data-key="${activeKey}"]`) ? activeKey : "");
  if (!key) return;
  ev.preventDefault(); await addShots(key, files);
});
document.addEventListener("click", async (ev) => {
  const copy = ev.target.closest?.("[data-copy]");
  if (copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = t("copied"); setTimeout(() => (copy.textContent = t("copy")), 1500); } catch {} return; }
  const a = ev.target.closest?.("a.person");
  if (a) {
    ev.preventDefault();
    $("people").open = true;
    const row = document.querySelector(a.getAttribute("href"));
    document.querySelectorAll("table.people tr.hl").forEach((r) => r.classList.remove("hl"));
    if (row) { row.classList.add("hl"); row.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
});
$("lightbox").addEventListener("click", () => ($("lightbox").style.display = "none"));
["fRound", "fStatus"].forEach((id) => $(id).addEventListener("change", () => { drawSections(); progress(); }));
let searching;
$("fText").addEventListener("input", () => { clearTimeout(searching); searching = setTimeout(() => { drawSections(); progress(); }, 200); });
$("lang").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; try { localStorage.setItem("rabaed-uat-sheet-lang", lang); } catch {} applyLang(); });
$("tester").addEventListener("input", () => { if (db) tx("meta", "readwrite", (s) => s.put($("tester").value, "tester")).catch(() => {}); });

function flash(m) { $("msg").textContent = m; setTimeout(() => ($("msg").textContent = ""), 6000); }
function download(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const fileTag = () => { const n = $("tester").value.trim(); return n ? n.replace(/[^\p{L}\p{N}]+/gu, "-") + "-" : ""; };
const roundTag = DATA.round.replace(/[^\p{L}\p{N}]+/gu, "-");
const sectionOf = (c) => SECTIONS.find((s) => s.cases.includes(c));
const sectionLabel = (c) => { const s = sectionOf(c); return s ? (s.n ? `${s.n}. ${s.name.en}` : s.name.en) : ""; };

// ---- Excel: Test Cases, Screenshots (pictures in their row), Summary ----
const EN = (s) => T.en[s || "unset"];
$("export").addEventListener("click", async () => {
  const tester = $("tester").value.trim(), when = now();
  const head = ["Section", "Key", "ID", "Part", "Round", "Title", "Sign in as", "Steps", "Expected result", "Needs", "Runs it", "UAT link", "Status", "Comment", "Screenshots", "Tester", "Updated"];
  const ordered = SECTIONS.flatMap((s) => s.cases);
  const table = [head, ...ordered.map((c) => {
    const e = entry(c.key);
    const names = e.shots.map((id) => shots.get(id)?.name).filter(Boolean);
    return [sectionLabel(c), c.key, c.id, c.part, c.round, c.title, c.who, c.steps.map((s, i) => `${i + 1}. ${s}`).join("\n"), c.expected,
      c.needs.join(", "), isOwner(c) ? "UAT owner" : "Tester", c.url,
      EN(e.status), e.comment, names.length ? `${names.length} on the Screenshots sheet: ${names.join(", ")}` : "", e.status || e.comment || names.length ? tester : "", e.at];
  })];
  const shotRows = [["Key", "ID", "File", "Screenshot"]], images = [], heights = {};
  for (const c of ordered) for (const id of entry(c.key).shots) {
    const s = shots.get(id); if (!s) continue;
    const scale = Math.min(1, 480 / s.w, 360 / s.h), w = Math.round(s.w * scale), h = Math.round(s.h * scale);
    const row = shotRows.length;
    shotRows.push([c.key, c.id, s.name, ""]);
    images.push({ row, col: 3, data: new Uint8Array(await s.blob.arrayBuffer()), ext: s.type === "image/jpeg" ? "jpeg" : "png", width: w, height: h, offsetX: 4, offsetY: 4 });
    heights[row] = Math.ceil((h + 8) * 0.75);
  }
  const n = (st) => cases.filter((c) => (entry(c.key).status || "") === st).length;
  const summary = [["Item", "Value"], ["Round", DATA.round], ["Tester", tester], ["Exported", when], ["Sheet built", DATA.built], ["Test Cases", cases.length],
    ["Pass", n("pass")], ["Fail", n("fail")], ["Blocked", n("blocked")], ["Not run", n("notrun")], ["Not set", n("")], ["Screenshots", images.length]];
  for (const s of SECTIONS) summary.push([s.n ? `Section ${s.n}: ${s.name.en}` : s.name.en, `${s.cases.filter((c) => statusOf(c) !== "unset").length} of ${s.cases.length} done`]);
  const bytes = buildXlsx([
    { name: "Test Cases", table, widths: [22, 9, 9, 6, 7, 40, 24, 60, 50, 16, 11, 28, 9, 50, 30, 14, 18] },
    { name: "Screenshots", table: shotRows, widths: [9, 9, 26, 70], rowHeights: heights, images },
    { name: "Summary", table: summary, widths: [40, 40] },
  ], fflate);
  download(`Rabaed-UAT-${roundTag}-${fileTag()}${stamp()}.xlsx`, new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  flash(t("exported"));
});

// ---- Markdown for an AI: the same cases, and the JSON to hand back (made by the generator) ----
$("mdBtn").addEventListener("click", () => {
  download(`Rabaed-UAT-${roundTag}.md`, new Blob([DATA.markdown ?? ""], { type: "text/markdown;charset=utf-8" }));
  flash(t("mdDone"));
});

// ---- JSON: the work and its screenshots, to move between machines (and what an AI hands back) ----
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
$("saveJson").addEventListener("click", async () => {
  const out = { sheet: "rabaed-uat-sheet", round: DATA.round, tester: $("tester").value, at: new Date().toISOString(), entries: {}, shots: [] };
  for (const [k, e] of entries) if (e.status || e.comment || e.shots.length) out.entries[k] = e;
  for (const s of shots.values()) out.shots.push({ id: s.id, key: s.key, name: s.name, type: s.type, w: s.w, h: s.h, data: b64(new Uint8Array(await s.blob.arrayBuffer())) });
  download(`Rabaed-UAT-${roundTag}-${fileTag()}${stamp()}.json`, new Blob([JSON.stringify(out)], { type: "application/json" }));
  flash(t("savedJson"));
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0]; $("importFile").value = ""; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (data.sheet !== "rabaed-uat-sheet") throw new Error(); } catch { flash(t("badJson")); return; }
  const known = new Set();
  for (const s of data.shots ?? []) {
    if (!byKey.has(s.key) || !s.id || !s.data) continue;
    try {
      const blob = new Blob([fromB64(s.data)], { type: s.type || "image/png" });
      const rec = { id: s.id, key: s.key, name: s.name || `${byKey.get(s.key).id}.png`, type: s.type || "image/png", w: s.w || 800, h: s.h || 600, blob };
      if (db) await tx("shots", "readwrite", (st) => st.put(rec));
      shots.set(s.id, { ...rec, url: URL.createObjectURL(blob) }); known.add(s.id);
    } catch { /* bad base64: skipped */ }
  }
  let n = 0;
  for (const [k, raw] of Object.entries(data.entries ?? {})) {
    if (!byKey.has(k)) continue;
    // Only the four statuses; a hand-made or AI-made file may hold anything.
    const e = { status: STATUSES.includes(raw.status) ? raw.status : "", comment: String(raw.comment ?? ""), shots: (raw.shots ?? []).filter((id) => shots.has(id) || known.has(id)), at: raw.at || now() };
    // Screenshots of the entry being replaced that the loaded one doesn't keep are removed, not left orphaned.
    for (const old of entry(k).shots) if (!e.shots.includes(old)) {
      const s = shots.get(old); if (s) URL.revokeObjectURL(s.url); shots.delete(old);
      if (db) await tx("shots", "readwrite", (st) => st.delete(old));
    }
    entries.set(k, e); n++;
    if (db) await tx("entries", "readwrite", (st) => st.put(e, k));
  }
  if (data.tester && !$("tester").value) $("tester").value = data.tester;
  drawSections(); progress(); flash(`${t("loaded")} ${n} ${t("cases")}`);
});

// ---- Start ----
(async () => {
  $("built").textContent = DATA.built;
  try { lang = localStorage.getItem("rabaed-uat-sheet-lang") === "ar" ? "ar" : "en"; } catch {}
  try {
    db = await openDb();
    for (const [k, e] of await all("entries")) entries.set(k, e);
    for (const [, s] of await all("shots")) shots.set(s.id, { ...s, url: URL.createObjectURL(s.blob) });
    const tester = await tx("meta", "readonly", (s) => s.get("tester"));
    if (tester) $("tester").value = tester;
  } catch { db = undefined; flash(T.en.notSaved); }
  applyLang();
})();
</script>
</body>
</html>
