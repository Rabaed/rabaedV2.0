<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabaed UAT – System UAT with Ahmed</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5d6678; --line:#dde1e8; --accent:#c8431f; --navy:#16213a;
          --pass:#1e7e45; --fail:#b42318; --blocked:#6941c6; --notrun:#5d6678; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", Tahoma, Arial, sans-serif; }
  header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
  header h1 { margin:0; font-size:19px; flex:1 1 auto; }
  header p { margin:0; color:#c9d2e3; font-size:13px; width:100%; }
  header button { background:transparent; color:#fff; border-color:#3b4a6b; }
  main { padding:14px 20px 80px; max-width:1400px; margin:0 auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
  input, select, textarea, button { font:inherit; }
  input[type=text], input[type=search], select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; min-width:130px; }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:hover { filter:brightness(.96); }
  .counts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .count { border:1px solid var(--line); border-radius:6px; padding:4px 10px; font-size:13px; }
  .count b { font-size:16px; margin-inline-end:4px; }
  .help { font-size:13px; color:var(--muted); margin:6px 0 0; }
  .case { background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--line); border-radius:8px; margin-bottom:10px;
          display:grid; grid-template-columns:minmax(0,1fr) 360px; }
  .case.st-pass { border-inline-start-color:var(--pass); } .case.st-fail { border-inline-start-color:var(--fail); }
  .case.st-blocked { border-inline-start-color:var(--blocked); } .case.active { box-shadow:0 0 0 2px #f1b9a8; }
  .case .body { padding:10px 14px; min-width:0; }
  .case .rec { padding:10px 14px; border-inline-start:1px solid var(--line); background:#fafbfc; }
  .case h3 { margin:0 0 4px; font-size:15px; }
  .meta { font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 12px; margin-bottom:6px; }
  .meta code { color:var(--ink); }
  ol.steps { margin:4px 0 6px; padding-inline-start:20px; }
  .exp { margin:4px 0; }
  .lbl { font-weight:600; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .status { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .status button { padding:4px 10px; font-size:13px; }
  .status button[aria-pressed=true].pass { background:var(--pass); color:#fff; border-color:var(--pass); }
  .status button[aria-pressed=true].fail { background:var(--fail); color:#fff; border-color:var(--fail); }
  .status button[aria-pressed=true].blocked { background:var(--blocked); color:#fff; border-color:var(--blocked); }
  .status button[aria-pressed=true].notrun { background:var(--notrun); color:#fff; border-color:var(--notrun); }
  .rec textarea { width:100%; min-height:80px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; resize:vertical; }
  .drop { margin-top:8px; border:1px dashed #b8c0cc; border-radius:6px; padding:8px; font-size:12px; color:var(--muted); text-align:center; outline:none; }
  .drop:focus, .drop.over { border-color:var(--accent); background:#fff6f3; }
  .shots { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .shot { position:relative; }
  .shot img { height:72px; max-width:120px; object-fit:cover; border:1px solid var(--line); border-radius:4px; display:block; cursor:zoom-in; }
  .shot button { position:absolute; top:-6px; inset-inline-end:-6px; padding:0 6px; border-radius:10px; font-size:12px; line-height:18px; background:#fff; }
  .saved { font-size:11px; color:var(--muted); margin-top:6px; min-height:14px; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; align-items:center; justify-content:center; z-index:9; }
  #lightbox img { max-width:94vw; max-height:88vh; background:#fff; }
  #lightbox p { position:absolute; bottom:10px; color:#fff; font-size:13px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  @media (max-width: 900px) { .case { grid-template-columns:1fr; } .case .rec { border-inline-start:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1><span data-t="title"></span> – System UAT with Ahmed</h1>
  <button id="lang" type="button">العربية</button>
  <p><span data-t="intro"></span> <span id="built"></span></p>
</header>
<main>
  <section class="panel">
    <div class="row">
      <label><span data-t="tester"></span><input type="text" id="tester" dir="auto"></label>
      <button class="primary" id="export" type="button" data-t="export"></button>
      <button id="saveJson" type="button" data-t="saveJson"></button>
      <button id="importBtn" type="button" data-t="importJson"></button>
      <input type="file" id="importFile" accept=".json" hidden>
      <span id="msg" class="help" role="status"></span>
    </div>
    <p class="help" data-t="howto"></p>
  </section>
  <section class="panel">
    <div class="row">
      <label><span data-t="part"></span><select id="fPart"></select></label>
      <label><span data-t="round"></span><select id="fRound"></select></label>
      <label><span data-t="status"></span><select id="fStatus"></select></label>
      <label style="flex:1 1 220px"><span data-t="search"></span><input type="search" id="fText" dir="auto" style="width:100%"></label>
    </div>
    <div class="counts" id="counts"></div>
  </section>
  <div id="list"></div>
</main>
<div id="lightbox"><img alt=""><p></p></div>
<input type="file" id="pick" accept="image/*" multiple hidden>

<script>// The UAT test sheet's Excel (.xlsx) writer (RP-1163): SpreadsheetML zipped with fflate, with
// screenshots embedded as pictures anchored to their row. Plain JavaScript, so the generator
// inlines it into the sheet's HTML (it drops the word `export`) and the unit test imports it.

const MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const PKG_REL = "http://schemas.openxmlformats.org/package/2006/relationships";
const EMU_PER_PX = 9525;

function xmlEsc(s) {
  return String(s ?? "")
    // eslint-disable-next-line no-control-regex -- XML 1.0 forbids these characters, so a cell drops them.
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
    .replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

/** A column's letters: 0 is A, 26 is AA. */
function colName(i) {
  let s = "";
  let n = i + 1;
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function sheetXml(sheet, hasDrawing) {
  const heights = sheet.rowHeights ?? {};
  const rows = sheet.table
    .map((row, ri) => {
      const ht = heights[ri] ? ` ht="${heights[ri]}" customHeight="1"` : "";
      const cells = row
        .map((v, ci) => {
          const ref = colName(ci) + (ri + 1);
          const style = ri === 0 ? 1 : 2;
          return typeof v === "number"
            ? `<c r="${ref}" s="${style}"><v>${v}</v></c>`
            : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
        })
        .join("");
      return `<row r="${ri + 1}"${ht}>${cells}</row>`;
    })
    .join("");
  const last = colName(sheet.table[0].length - 1) + sheet.table.length;
  const cols = sheet.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("");
  return (
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${MAIN}" xmlns:r="${REL}">` +
    `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
    `<cols>${cols}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:${last}"/>` +
    (hasDrawing ? `<drawing r:id="rId1"/>` : "") +
    `</worksheet>`
  );
}

function drawingXml(images, firstId) {
  const anchors = images
    .map((img, i) => {
      const id = firstId + i;
      const cx = Math.round(img.width * EMU_PER_PX);
      const cy = Math.round(img.height * EMU_PER_PX);
      return (
        `<xdr:oneCellAnchor><xdr:from><xdr:col>${img.col}</xdr:col><xdr:colOff>${(img.offsetX ?? 0) * EMU_PER_PX}</xdr:colOff><xdr:row>${img.row}</xdr:row><xdr:rowOff>${(img.offsetY ?? 0) * EMU_PER_PX}</xdr:rowOff></xdr:from>` +
        `<xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${i + 2}" name="Screenshot ${id}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>` +
        `<xdr:blipFill><a:blip r:embed="rId${i + 1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>` +
        `<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`
      );
    })
    .join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${REL}">${anchors}</xdr:wsDr>`;
}

const STYLES =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${MAIN}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>` +
  `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF16213A"/><bgColor indexed="64"/></patternFill></fill></fills>` +
  `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>` +
  `<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs></styleSheet>`;

/**
 * The workbook's bytes. `sheets`: { name, table (rows of strings or numbers, the first the
 * header), widths, rowHeights? ({ rowIndex: points }), images? ([{ row, col, data: Uint8Array,
 * ext: "png" | "jpeg", width, height, offsetX?, offsetY? }], row and col 0-based, size in px) }.
 * `zip`: fflate's { zipSync, strToU8 }.
 */
function buildXlsx(sheets, zip) {
  const enc = (s) => zip.strToU8(s);
  const files = {};
  let mediaCount = 0;
  let drawingCount = 0;
  const overrides = [];
  sheets.forEach((sheet, si) => {
    const images = sheet.images ?? [];
    const hasDrawing = images.length > 0;
    files[`xl/worksheets/sheet${si + 1}.xml`] = enc(sheetXml(sheet, hasDrawing));
    overrides.push(`<Override PartName="/xl/worksheets/sheet${si + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    if (!hasDrawing) return;
    drawingCount += 1;
    const d = drawingCount;
    const first = mediaCount + 1;
    const rels = images.map((img, i) => {
      mediaCount += 1;
      const file = `image${mediaCount}.${img.ext === "jpeg" ? "jpeg" : "png"}`;
      files[`xl/media/${file}`] = img.data;
      return `<Relationship Id="rId${i + 1}" Type="${REL}/image" Target="../media/${file}"/>`;
    });
    files[`xl/drawings/drawing${d}.xml`] = enc(drawingXml(images, first));
    files[`xl/drawings/_rels/drawing${d}.xml.rels`] = enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}">${rels.join("")}</Relationships>`);
    files[`xl/worksheets/_rels/sheet${si + 1}.xml.rels`] = enc(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}"><Relationship Id="rId1" Type="${REL}/drawing" Target="../drawings/drawing${d}.xml"/></Relationships>`,
    );
    overrides.push(`<Override PartName="/xl/drawings/drawing${d}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
  });
  files["[Content_Types].xml"] = enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>` +
      `<Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${overrides.join("")}</Types>`,
  );
  files["_rels/.rels"] = enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
  );
  const names = sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("");
  const filters = sheets
    .map((s, i) => `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(s.name)}'!$A$1:$${colName(s.table[0].length - 1)}$${s.table.length}</definedName>`)
    .join("");
  files["xl/workbook.xml"] = enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${MAIN}" xmlns:r="${REL}"><sheets>${names}</sheets><definedNames>${filters}</definedNames></workbook>`);
  files["xl/_rels/workbook.xml.rels"] = enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}">` +
      sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("") +
      `<Relationship Id="rId${sheets.length + 1}" Type="${REL}/styles" Target="styles.xml"/></Relationships>`,
  );
  files["xl/styles.xml"] = enc(STYLES);
  return zip.zipSync(files, { level: 6 });
}

 Saving makes the next Version and WIRs that copied an earlier one keep its items. Ali reads and cannot change.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-800","id":"INS-02","title":"Required links setting","part":"INS","round":"0","who":"Saeed (Project Admin); Hafiz","steps":["Settings > Required links: turn on Approved submittals required.","Hafiz tries to send a WIR without one."],"expected":"Every Member reads the setting; only a Project Admin changes it. With it on a WIR cannot leave Draft without an Approved submittal and the form names the field.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-802","id":"INS-03","title":"Raise a WIR with a Checklist Template","part":"INS","round":"0","who":"Hafiz (TMC engineer)","steps":["New Submittal or Inspections > New > Work Inspection Request: Description, Trade Civil Works, Location, Checklist Template.","Look at the preview of items.","Change the Trade."],"expected":"Templates offered are the Trade's active ones, labelled As picked if later retired; changing the Trade clears the pick; before a Trade it says Choose a Trade first. The items are copied onto the WIR.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-803","id":"INS-04","title":"Approved submittals offers only Code A or B items","part":"INS","round":"0","who":"Hafiz (TMC engineer)","steps":["In the WIR open Approved submittals.","Search an item closed at C and one still open."],"expected":"Only items closed at Code A or B that Hafiz sees and that were Submitted are offered; a saved id outside that is refused like an unknown option.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-806","id":"INS-05","title":"The pick is fixed once the WIR is Submitted","part":"INS","round":"0","who":"Hafiz; Ali","steps":["Change the Checklist Template before the Submit.","After Ali Submits try to change it."],"expected":"Before the first Submit a new pick replaces the copy. After it, the pick and the copy are fixed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-809","id":"INS-06","title":"Annotate a photo; the original is kept","part":"INS","round":"0","who":"Hafiz (TMC engineer)","steps":["Add a photo to a Draft; open it and annotate (arrow, text label); Save.","Switch Annotated and Original.","Submit; Ahmed opens it."],"expected":"The annotated copy is saved beside the original, marked annotated; the original's bytes are unchanged; both download. After the Submit Ahmed reads both; a frozen original takes no new copy.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-811","id":"INS-07","title":"Inspections tab and the in-Submittals setting","part":"INS","round":"0","who":"Ali; Ahmed","steps":["Open the Inspections tab (List and Kanban).","Turn Inside the Submittals tab on (PAR-11) and open Submittals."],"expected":"The tab uses the Submittals pages and Stages. With the setting on, WIRs appear in the Submittals List, counts, type filter and Kanban for those who may see them.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-813","id":"INS-08","title":"The WIR runs to the Consultant and the Manager","part":"INS","round":"0","who":"Hafiz; Ali; Ahmed; Mohammed","steps":["Hafiz raises a Civil WIR, sends it; Ali Submits it.","Ahmed picks it up."],"expected":"The WIR numbers like a submittal and reaches the Consultant Engineer pool. The Consultant fills the checklist on site (INS-09).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-815","id":"INS-09","title":"The Engineer answers the checklist on site","part":"INS","round":"4","who":"Ahmed (DCL engineer)","steps":["At 375 px open the WIR: per item Pass, Fail or N/A, comment and photos.","Fail an item whose Checklist Template requires a comment and photo."],"expected":"Large segmented controls; on a Fail the comment and photo show required; a sticky summary like 18 Pass / 2 Fail / 1 N/A with progress; a failed item can raise a Snag (ticked by default).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-818","id":"INS-10","title":"Raise Snags from failed items","part":"INS","round":"4","who":"Ahmed; Mohammed; Hafiz","steps":["Fail two items, one with Raise a Snag unticked.","Mohammed issues any Code."],"expected":"Whatever the Code, each ticked failed item becomes a Snag raised by the Consultant for the Contractor, linked to the WIR.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-821","id":"INS-11","title":"The Manager proposes a Code from the checklist","part":"INS","round":"4","who":"Mohammed (DCL manager)","steps":["Open a WIR with one failed item and one with none."],"expected":"The pop-up pre-selects C when any item failed, else A; the Manager can change it; each pop-up lists the Snags that will be raised.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-824","id":"INS-12","title":"A WIR ends with a Review Code and a re-inspection Revision","part":"INS","round":"4","who":"Mohammed; Hafiz","steps":["Close WIRs at A, B (with comment rows), C and D.","Hafiz creates the Revision after C."],"expected":"A to D close like a submittal; B makes Comments; C offers a Revision as a re-inspection that copies the same checklist; D closes. No Passed or Failed result is shown for new WIRs.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-827","id":"INS-13","title":"The Contractor reads the checklist only after the Code","part":"INS","round":"4","who":"Hafiz; Ahmed","steps":["While Ahmed answers, Hafiz opens the WIR.","After the Code, again."],"expected":"Before Ahmed sends it to the Manager Hafiz reads none of the answers, comments or photos; after the Code he reads them. Ahmed's Recommended Code and Internal Note never reach Hafiz.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-830","id":"INS-14","title":"WIR shares Stages with submittals","part":"INS","round":"4","who":"Ali; Ahmed","steps":["With the WIR in Pending Approval open the Kanban."],"expected":"A WIR sits in the same column as a submittal at the same Stage.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-871","id":"NOT-01","title":"The bell, the Notifications page and Mark all as read","part":"NOT","round":"0","who":"Ali (TMC PM)","steps":["After SUB-04 look at the bell badge.","Open Notifications; open one entry.","Mark all as read."],"expected":"The badge counts unread; each entry reads Reached you at \u003cStep> and opens the item; Mark all as read clears the badge. In-app notifications are always sent: there is no in-app switch.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-873","id":"NOT-02","title":"Step reached and Submit notify the right people","part":"NOT","round":"0","who":"Ali; Ahmed; Sara; Mohammed","steps":["Ali Submits.","Check Ahmed's and Sara's bells and Mohammed's."],"expected":"Ahmed and Sara (the pool) are told; Mohammed is not until it reaches him; the text names TMC as a Company, never a person.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-876","id":"NOT-03","title":"Immediate email via Mailpit","part":"NOT","round":"0","who":"Ali (TMC PM)","steps":["Open Mailpit (lane 7).","Find the email for Step reached."],"expected":"Subject holds only the Document Number, Subject and what happened; body names the other Company by name only; links open the item; sent as the recipient may see it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-879","id":"NOT-04","title":"Email settings per group, Pause all, language","part":"NOT","round":"0","who":"Ali (TMC PM)","steps":["Profile & notification settings: set Step reached to Off, then Daily digest, then Immediately.","Pause all email.","Change the email language."],"expected":"Groups are Step reached me or my pool, Items I watch, Sent Back to my Participant, Weekly Step Age report; choices Off, Immediately, Daily digest. Paused email stops every email but the bell still fills. The weekly group is emailed on Sunday mornings.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-882","id":"NOT-05","title":"Mute a Project","part":"NOT","round":"0","who":"Ali (TMC PM)","steps":["Mute Riyadh Gate Tower in the settings.","Hafiz sends a MAR to Ali.","Check bell and Mailpit."],"expected":"A muted Project sends no notifications or emails; the item still shows as Ali's under Need My Action.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-886","id":"NOT-06","title":"Daily email digest","part":"NOT","round":"0","who":"Ali (TMC PM); Yousef","steps":["Set an email group to Daily digest.","Create events; ask the lane engineer to run the digest job (open question OQ-2).","Read Mailpit."],"expected":"One email per Member: subject names nothing; each entry names another Company only by name; an entry the Member can no longer see is left out; Yousef gets nothing of TMC's. Sent 07:00 Riyadh, Sunday to Thursday.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-888","id":"NOT-07","title":"Weekly Step Age report","part":"NOT","round":"0","who":"Ali (TMC PM holding Assign); Yousef","steps":["Needs aged items (AGE fixture) and the lane engineer to run the job (OQ-2).","Read Ali and Yousef mail and open the link."],"expected":"Grouped 4+, 3, 2 and 1 weeks; lists only items the reader can open, never an un-numbered Draft; another Company by name only; Yousef lists only Beta Build items; an empty report is not sent; the link opens the List with the same filter.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-891","id":"NOT-08","title":"A Revision notifies when it gets its number","part":"NOT","round":"0","who":"Hafiz; Ahmed","steps":["Hafiz creates a Revision and keeps it Draft.","Sends it for review.","After the Submit read Ahmed's bell."],"expected":"No revision_created notice while it is a Draft; it is sent when the Revision is numbered; Ahmed is told only after the Submit.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-894","id":"NOT-09","title":"Sent Back notifies only the Participant it went back to","part":"NOT","round":"0","who":"Mohammed; Hafiz; Faisal","steps":["Needs FX-SB (WF-09).","Mohammed Sends Back a Submitted item."],"expected":"Hafiz and TMC Members who see it are told, with DCL named as a Company; Faisal is not told of internal moves.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-896","id":"NOT-10","title":"Emails and the bell follow the Member's language","part":"NOT","round":"0","who":"Faisal (Al Waha, Arabic)","steps":["Receive a notification and email as Faisal."],"expected":"The bell and email are in Arabic with Latin digits; Document Numbers read left to right.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-900","id":"NOT-11","title":"A closed Project goes quiet","part":"NOT","round":"","who":"Ali (TMC PM)","steps":["Close the Project."],"expected":"No bell entry or email of a closed Project; delivered ones stay readable. There is no close control yet.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-845","id":"PAR-01","title":"Sign in, wrong password and sign out","part":"PAR","round":"0","who":"Hafiz","steps":["Open lane 7 /en/sign-in.","Wrong password.","Right password (in .env.demo).","Sign out.","Open a Project URL while signed out."],"expected":"The wrong password gives one generic refusal. Sign-in opens Home. After sign-out a Project URL goes to sign-in. Cookies are per host (lane7.localhost).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-848","id":"PAR-02","title":"Invite a Member and accept the invitation","part":"PAR","round":"0","who":"Saeed (Authorized Person); a new person","steps":["Members > Invite: a made-up .test email, name EN and AR, language.","Open the email in Mailpit and follow the link.","Set a password."],"expected":"The Member appears as invited, then active. The email arrives in Mailpit in the chosen language. The new Member belongs to TMC alone.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-851","id":"PAR-03","title":"An email that belongs to another Company is refused without naming it","part":"PAR","round":"0","who":"Hind (Al Waha Authorized Person)","steps":["Members > Invite hafiz.hamdan@tmc.demo.rabaed.test."],"expected":"Refused: the person is already registered on Rabaed with another Company. TMC is never named and nothing else about Hafiz shows. An email of Hind's own Company gives the ordinary already-a-Member answer.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-853","id":"PAR-04","title":"Create a Project","part":"PAR","round":"0","who":"Saeed (Project Creator)","steps":["Projects > New Project: name EN and AR, code UATP, role Contractor.","Open it."],"expected":"The Project appears with Project Number in TMC's own series; Saeed is its first Project Admin; Host Company is TMC.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-856","id":"PAR-05","title":"Trades, Locations and Scopes","part":"PAR","round":"0","who":"Saeed (Project Admin); Ali","steps":["Settings > Trades and Locations: add a Trade, a Zone, a Building, a Floor, a Scope and Sub-scope.","Ali opens the same page."],"expected":"Saeed adds; Ali reads Trades, Scopes and Locations and cannot add. Names show in EN and AR.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-859","id":"PAR-06","title":"Invite a Company by CR number and accept","part":"PAR","round":"0","who":"Saeed (Project Admin); Layla (DCL Authorized Person)","steps":["On a UAT Project invite CR 9999000003 as Consultant.","Layla: Company Projects shows the invitation (name, Host Company, offered role).","Accept."],"expected":"Until accepted, only Layla and the Project Admin see it; TMC's other Members do not. After accepting, DCL is a Participant in the role Consultant.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-862","id":"PAR-07","title":"Grant Participant Visibility and read the Visibility Gap warning","part":"PAR","round":"0","who":"Saeed (Project Admin)","steps":["Settings > Visibility: give the new Consultant Electrical only.","Remove all coverage of Mechanical from every Participant."],"expected":"The grant saves. A Visibility Gap warning names the value no active Participant covers. It is worked out from Participant grants alone.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-864","id":"PAR-08","title":"The Authorized Person adds a Member to the Project with a Position and Visibility","part":"PAR","round":"0","who":"Layla (DCL Authorized Person)","steps":["Participants > the Project > add a Member with Position Engineer.","Open the Member's Visibility and narrow to Mechanical only.","Try to give a Trade the Participant lacks."],"expected":"The Member joins the Project. Narrowing saves. A Trade DCL does not cover is rejected (a Member never covers more than their Company).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-867","id":"PAR-09","title":"Deactivate a Member: Handover first","part":"PAR","round":"0","who":"Saeed (Authorized Person)","steps":["Hafiz holds two Tower 2 MARs at Contractor Engineer (Omar covers Tower 2 as well) and one Tower 1 MAR (Omar does not cover it).","Saeed: Members > Deactivate Hafiz."],"expected":"The Handover dialog lists his open Steps and Drafts (Project, Document Number or No number yet, Subject, Step). The Tower 2 Steps pre-fill Omar as the single candidate. The Tower 1 Step has nobody else who can take it, so the change is refused with Nobody else can take \u003cStep> on \u003cProject>. Give someone the Position or Visibility first, naming only TMC's own Step and the Project; nothing saves until every Step has a new holder.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-870","id":"PAR-10","title":"Participant Codes and Numbering settings","part":"PAR","round":"0","who":"Saeed (Project Admin)","steps":["Settings > Numbering: read the pattern and examples.","Set a Participant Code (2 to 6 letters or digits).","Save a pattern that leaves out the Participant Code."],"expected":"Examples use the Admin's real next numbers. A code in use cannot change. Leaving out the Participant Code is refused until the shared-counter warning is accepted.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-874","id":"PAR-11","title":"Show Inspections inside the Submittals tab","part":"PAR","round":"0","who":"Saeed (Project Admin)","steps":["Settings > Modules: choose Inside the Submittals tab.","Open Submittals and the Project tabs."],"expected":"The Inspections tab is hidden; WIRs show in the Submittals List and Kanban with WIR as one more Type. Switching back restores the tab. Only a Project Admin changes it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-877","id":"PAR-12","title":"Approved Supplier List: add and withdraw by hand","part":"PAR","round":"0","who":"Saeed (Project Admin); Hafiz","steps":["Settings > Approved Supplier List: add a supplier for Mechanical; withdraw one.","Hafiz opens the list."],"expected":"Entries show name, Trade, Scope and status; a withdrawn one stays listed as withdrawn. Hafiz cannot add or withdraw. No source, person or time shows.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-880","id":"PAR-13","title":"Company Projects page","part":"PAR","round":"0","who":"Layla; Hafiz","steps":["Open Company Projects (sidebar)."],"expected":"Each Project the Company takes part in shows name, code, number, Host Company, the Company's own Project Role and own Project Members, and pending invitations. Never another Participant.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-883","id":"PAR-14","title":"Fixture FX-C2: narrow Beta Build to Tower 2","part":"PAR","round":"0","who":"Saeed (Project Admin); Yousef","steps":["Settings > Visibility: set Beta Build Location to Tower 2 only.","Yousef signs in."],"expected":"The change saves (Yousef holds nothing, so no Handover). Yousef sees only Tower 2 items from then on, and TMC is the only Contractor covering Tower 1, which the Snag scenarios need.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-885","id":"PAR-15","title":"Fixture FX-K1M: Sara covers Mechanical only","part":"PAR","round":"0","who":"Layla (DCL Authorized Person); Sara","steps":["Open Sara's Visibility (Participants > Members).","Set Trade to Mechanical only."],"expected":"Sara no longer sees Electrical items and leaves their pools (Handover first if she holds one). Ahmed still covers both. Later scenarios use Sara as the K1 Mechanical-only engineer.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-889","id":"PAR-16","title":"Fixture FX-OW: invite UAT Owner Co as Owner","part":"PAR","round":"0","who":"Saeed (Project Admin); Reem UAT (Owner Co Authorized Person)","steps":["After ADM-02 onboards UAT Owner Co (CR 9999000005), Saeed invites that CR as Owner on Riyadh Gate Tower.","Reem accepts, grants Electrical and Mechanical, all Locations, and adds a PM Member (Sami UAT) with Position Project Manager."],"expected":"UAT Owner Co is a Participant with oversight over Submitted items it covers. Later Owner scenarios use it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-892","id":"PKG-01","title":"Packages is a third view beside List and Kanban","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["Submittals > the view toggle.","Choose Packages."],"expected":"A Packages Kanban with three columns Open, In Progress and Done, each with a count; a New Package button for a Company that can build one; search and filters (Trade, owning Company). Matches packages.html except where spec RP-616 differs.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-895","id":"PKG-02","title":"Open a Package and number it","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["New Package: name EN and AR.","Open it."],"expected":"The Package is numbered PKG-001 (left to right, also in Arabic) beside TMC's name, Open, with no submittals. A second Package is PKG-002. Beta Build's first Package is also PKG-001.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-897","id":"PKG-03","title":"Add submittals from Drafts and review","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["Open an Open Package > Add items.","Pick two Drafts and one item in internal review.","Try to add an item already in another Package."],"expected":"Only TMC's own submittals Ali can see are offered, with search and a Trade filter. An item in another Package is marked and cannot be picked. A submittal belongs to at most one Package.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-898","id":"PKG-04","title":"While Open: remove, rename, delete","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["Remove one item.","Rename the Package.","Delete the Package."],"expected":"Remove and delete work only while Open; Delete says the Drafts stay, without a Package. Rename is allowed in every status.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-899","id":"PKG-05","title":"Submit Package is all or nothing","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["Add a Draft with a required field missing.","Open Submit Package."],"expected":"A not-ready list names each blocking item (for example required field Supplier missing) and links to it; Submit is disabled until the list is empty. Then one confirm submits every not-yet-submitted item; each gets its own Document Number. If any fails, none is submitted.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-901","id":"PKG-06","title":"Status runs Open, In Progress, Done","part":"PKG","round":"1","who":"Ali; Mohammed","steps":["Submit the Package.","Close the items at A, B, C and D over time.","Create a Revision for the Code C item and a replacement for D."],"expected":"In Progress as soon as anything is submitted. Done only when every latest submittal has closed at A, B or D; a Code C waits for its Revision, which joins the Package by itself; a later replacement or added submittal puts it back In Progress. The word is Done, never Closed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-684","id":"PKG-07","title":"After Submit: add yes, remove no","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["In an In Progress Package add a submittal.","Try to remove one."],"expected":"Adding works; removing is not offered. Rename works and is recorded.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-687","id":"PKG-08","title":"The Package chip and filter on submittals","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["Open List and Kanban.","Use the Package filter.","Click the chip on a card and on the item page."],"expected":"Cards and the item page show PKG-001 with the name; the chip opens the Package page; the filter narrows List and Kanban. Package is not a Form field.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-690","id":"PKG-09","title":"Bulk Transition applies one Action Form to many","part":"PKG","round":"1","who":"Mohammed (DCL manager, with a Signature); a DCL Member without a Signature (fixture: remove one in the profile)","steps":["In an In Progress Package select two items waiting on Mohammed that offer the same Code Transition (e.g. Code A).","Choose it; fill the Action Form once; confirm.","Repeat with an item that cannot take it.","As a DCL Member without a Signature, select two items waiting on them and take the same Code in bulk."],"expected":"With a Signature: one Action Form applies to each item (with Assign to if offered); each item is signed exactly as a single Transition is and gets its own event, Issued Code and Documental Record. All or nothing: if one item cannot take it nothing is done and the message names that item and why. Not offered unless every selected item offers the same Transition and Action Form. Without a Signature: the bulk Code is refused for all items, nothing is taken, and the reason (no Signature) is shown; there is no separate signing Step state. Owner decision 2026-10-19 (story 44 reworded on RP-616).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-693","id":"PKG-10","title":"One grouped notification counts only what the reader sees","part":"PKG","round":"1","who":"Ahmed (DCL engineer); Sara (Mechanical-only)","steps":["Ali Submits a Package of five Electrical and three Mechanical items.","Read each engineer's bell and email in Mailpit."],"expected":"One notification per recipient: TMC Constructions Submitted PKG-nnn Name: n submittals, where n counts only what that person sees.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-696","id":"PKG-11","title":"Comments show on the Package for information","part":"PKG","round":"1","who":"Ali (TMC PM)","steps":["After a Code B on an item of the Package open the Package Comments section."],"expected":"Comments raised from its submittals are listed with their Stage and the note that Comments are not part of the Package; they do not change its status.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-699","id":"PKG-12","title":"A Package is seen only through submittals the viewer sees","part":"PKG","round":"1","who":"Yousef; Ahmed; Sara","steps":["Ali builds a Package with Drafts only.","Look at Packages as Yousef, Ahmed and Sara.","After the Submit look again as Sara (Mechanical-only) and Ahmed."],"expected":"Another Company's Open Package is never shown (not its name, Drafts or count). After the Submit Ahmed sees all submittals of his Trades; Sara sees only the Mechanical ones and their counts; status shows as one word. Yousef sees nothing.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-702","id":"SIG-01","title":"Every Transition is confirmed in its pop-up","part":"SIG","round":"0","who":"Ali (TMC PM)","steps":["Open any Transition (Submit).","Look for a Sign button or checkbox.","Confirm."],"expected":"The pop-up keeps the Transition's own label; there is no separate signing step. Taking it without confirming (API without confirmed true) is refused not_confirmed. After confirm the history records who, from which Participant and when.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-705","id":"SIG-02","title":"Download PDF on a closed item makes the sealed record","part":"SIG","round":"0","who":"Ali (TMC PM)","steps":["Open a closed MAR (Code A) and press Download PDF.","Repeat right after the Code, before the worker finishes."],"expected":"A PDF downloads through a short-lived link. If the record is not made yet the page says it is not ready and to try again in a minute; no partial file.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-711","id":"SIG-03","title":"The tracer record prints title, outcome and approval flow","part":"SIG","round":"0","who":"Ali (TMC PM)","steps":["Open the downloaded PDF.","Check the title block, outcome and date, Verification Code, link, approval flow, footer."],"expected":"Type names and code, Subject, Project and Document Number (left to right, Rev included); the outcome with the date; the Verification Code and verification link; each Transition on the path with label, Member, Positions, Company, date and time (Riyadh time) and its content hash; Arabic then English; Latin digits; every page footed Issued electronically through Rabaed, Verification Code, page X of Y. (Page 1 and Form body come with SIG-08.)","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-713","id":"SIG-04","title":"The record names everyone on the path and leaves out the rest","part":"SIG","round":"0","who":"Ali (TMC PM); Mohammed","steps":["Take a MAR through Send for Review, a Return, a second send, Submit with Internal Note, Ahmed Send to Manager with Recommended Code C, Mohammed Code A.","Read the PDF."],"expected":"It names every Member who took a Transition on the path, TMC's and DCL's alike, with the first entry dated at the raiser's last send out of Draft (a Returned send is off the path). It holds no Return, Internal Note, Recommended Code, Chat or in-progress answer.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-714","id":"SIG-05","title":"A Code C, a Code D and a Cancelled item also close with a record","part":"SIG","round":"0","who":"Hafiz; Mohammed","steps":["Close one MAR at C, one at D.","Download both PDFs."],"expected":"Each closes with its record whatever the outcome; the outcome in the PDF matches the item.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-715","id":"SIG-06","title":"The record is sealed and a changed copy shows","part":"SIG","round":"0","who":"Ali (TMC PM)","steps":["Open the PDF in Adobe Reader.","Change one byte of a copy and reopen."],"expected":"The original shows a seal that is present and intact; the signer is shown as unverified (lane 7 seals locally, RECORD_SEALING=local; Rabaed has no trusted certificate yet, ADR 0023). The changed copy shows the seal broken.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-717","id":"SIG-07","title":"Add Signature in the profile (draw, type, upload)","part":"SIG","round":"2","who":"Hafiz","steps":["Profile > Add Signature: Draw with finger at 375 px, then Type, then Upload.","Save.","Replace it."],"expected":"Pen styles and colours, Clear and Undo; a preview as on a record; once saved the profile shows it with Replace and the note that records already made keep the Signature used then.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-719","id":"SIG-08","title":"Record page 1 and Form body","part":"SIG","round":"2","who":"Ali (TMC PM)","steps":["Download a record.","Read page 1: Companies, title block, parties, classification, final decision with chips and QR, reply, approval flow, then the Form."],"expected":"The layout matches form-engine section 6 items 1 to 9; tables and photos print as tables and a photo grid; Documents are listed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-721","id":"SIG-09","title":"Company logo and Stamp","part":"SIG","round":"2","who":"Saeed (Authorized Person); Hafiz","steps":["Company profile: upload a logo and a Stamp.","Hafiz opens the profile."],"expected":"Two cards, Logo (optional) and Stamp (required to act), with Replace and the note that records keep the one in force then; only the Authorized Person has the buttons. Without a logo records show the name.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-724","id":"SIG-10","title":"No Stamp: no Member can act","part":"SIG","round":"2","who":"Hafiz; Saeed","steps":["With TMC's Stamp missing, Hafiz opens Submit.","Saeed opens it."],"expected":"Before the Action Form: TMC has no Stamp yet, ask its owner or Authorized Person; for Saeed, Add TMC's Stamp with an Add Stamp button. Only the viewer's own Company is named; nothing is written; nobody is notified.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-728","id":"SIG-11","title":"No Signature: the Add Signature pop-up","part":"SIG","round":"2","who":"Hafiz","steps":["With no Signature saved open any Transition."],"expected":"Add your Signature to act. Every action you confirm is signed with it. Add Signature goes to the profile and returns to the item with nothing typed lost; Cancel closes.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-731","id":"SIG-12","title":"Signature cards, Stamps, Review Comments, endings and Disclaimer","part":"SIG","round":"2","who":"Ali (TMC PM)","steps":["Download a record closed at A, then at C and at D.","Read the Signatures, Stamps and ending pages."],"expected":"One card per Transition on the path with Signature as it was then; the Stamp of every acting Company; Review Comments numbered; a Next step card with Code C (Revision n+1) or D (a new submittal replaces this one); an internal reviewer's card says Reviewed with no Code; the Disclaimer in Arabic and English.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-733","id":"SIG-13","title":"Appendix of Documents","part":"SIG","round":"2","who":"Ali (TMC PM)","steps":["Close a MAR with PDF and image Documents and one DWG.","Download the record."],"expected":"Shared PDF and image Documents follow as pages; other files are attached inside the PDF; a Company's internal Documents are not included.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-744","id":"SIG-14","title":"Record checks catch a bad PDF","part":"SIG","round":"2","who":"Engineer (Rabaed)","steps":["Ask a lane engineer to feed a broken record."],"expected":"A failed check alerts in Rabaed Admin instead of publishing; the item is not reopened.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-747","id":"SIG-15","title":"Verification page","part":"SIG","round":"2","who":"Anyone (not signed in)","steps":["Scan the QR or open the link.","Type the Verification Code with and without the Document Number.","Drop a copy of the PDF."],"expected":"Genuine, Document Number, Subject, Project, outcome, sealed date, signers' names, Positions and Companies; no Documents, answers or live item. The code alone is refused like a wrong code; attempts are limited per visitor; a dropped copy is checked in the browser against the fingerprint, uploading nothing.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-749","id":"SIG-16","title":"Working Copy of an unfinished item","part":"SIG","round":"2","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["While a MAR is with DCL, request a Working Copy as Ali and as Mohammed.","Compare the two PDFs."],"expected":"Both Working Copies are the same: watermarked Not Final / غير نهائي (or the Project text), unsealed, no Verification Code, Companies by name only, no person, no Signature or Stamp. A Draft Working Copy is made only for Members who see the Draft.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-750","id":"SIG-17","title":"Distribution link and Signatory Access","part":"SIG","round":"2","who":"Ali (TMC PM); a removed signing Member","steps":["Use the record distribution link to send a closed record by the ordinary notification.","Remove a signing Member from the Project and open the records they signed.","Withdraw a Participant and open its Authorized Person records."],"expected":"The record reaches people only through ordinary notifications inside Rabaed. A removed Member keeps the Project name and the records they signed; the Company keeps those its Members signed through its Authorized Person; open items of a withdrawn Participant are Cancelled.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-751","id":"SNG-01","title":"The Snag List tab: List, Kanban and empty state","part":"SNG","round":"0","who":"Ali (TMC PM)","steps":["Project > Snag List.","Switch List and Kanban.","Use the Types chips (All, Snags, Comments), Stage, Trade, Company and search by number or Subject."],"expected":"Items are grouped by Stage with counts; type chips and Stage counts count only visible items; an empty list reads No snags. Nice work. Filters with no match say nothing you can see matches.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-752","id":"SNG-02","title":"The Consultant raises a Snag on the Contractor","part":"SNG","round":"0","who":"Mohammed (DCL manager); Ali (TMC PM)","steps":["Needs FX-C2 (PAR-14).","Mohammed: Snag List > New Snag: Subject \"UAT SNG-02 Cable tray not bonded\", Description, Trade Electrical Works, Location Tower 1 Floor 02, a before photo.","Raise."],"expected":"The Snag is Open with TMC (the one Contractor covering Tower 1). With two Contractors covering the Location, Raise is refused with the plain This can not be handed over yet answer (RP-658 adds the pick).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-754","id":"SNG-03","title":"Contractor moves the Snag through its Steps","part":"SNG","round":"0","who":"Ali; Hafiz (TMC)","steps":["Open the Snag.","Start work, Put on hold, Resume work, back to Open where offered.","Read the Stage and Step Age as Mohammed."],"expected":"Moves are TMC's internal events: Stage shows In Progress or On Hold inside TMC; Design Consultants sees it Open with Step Age counted from when it reached TMC. A send leaves it in TMC's Step Pool.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-756","id":"SNG-04","title":"Resolve with a note, Verify, Close or Return to Open","part":"SNG","round":"0","who":"Hafiz (TMC); Mohammed (DCL)","steps":["Hafiz: Resolve with a resolution note (required).","Mohammed: Return to Open with a reason.","Hafiz resolves again; Mohammed: Close."],"expected":"Mohammed holds Verify (the raiser). Return to Open goes back to TMC, who resolved it. Closed ends the Snag. Each side reads only the other's shared Transitions.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-758","id":"SNG-05","title":"A Contractor raises a Snag on itself","part":"SNG","round":"0","who":"Ali (TMC PM)","steps":["New Snag raised by TMC on its own work.","Move it through Start work, Resolve, Verify, Close."],"expected":"The raiser holds Draft and Verify, so TMC works and closes its own Snag; Design Consultants and Beta Build never see it (informing the Consultant is SNG-09).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-760","id":"SNG-06","title":"Comments from Code B live in the Snag List","part":"SNG","round":"0","who":"Ali (TMC PM)","steps":["After SUB-12 open the Comments.","Resolve one; Mohammed closes it.","Open the MAR."],"expected":"Each Comment shows Raised from (number, Subject, Code B), is held by TMC, and counts on the MAR: Comments 2 open / 1 closed after one closes. The photo thumbnail is the first photo the viewer may see.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-762","id":"SNG-07","title":"New offers no Comment type","part":"SNG","round":"0","who":"Ali (TMC PM)","steps":["Snag List > New."],"expected":"The menu offers Snag (and later Site Observation and Question) and not Comment; Comments only come from a Code B.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-765","id":"SNG-08","title":"Resolve with after photos","part":"SNG","round":"3","who":"Hafiz (TMC)","steps":["Open an Open Snag; add after photos before Resolve; Resolve."],"expected":"After photos sit with TMC until Resolve, then freeze and show beside the before photos in the record; a Send Back discards them.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-774","id":"SNG-09","title":"Informed Participants","part":"SNG","round":"3","who":"Hafiz; Mohammed","steps":["Raise a Snag and name Informed Participants."],"expected":"The named Participants are told and can read; others are not.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-778","id":"SNG-10","title":"Question and Site Observation Types","part":"SNG","round":"3","who":"Mohammed; Hafiz","steps":["New > Question; New > Site Observation."],"expected":"The Type chips appear; each has its own Form and Workflow; Questions have no reviewed item behind them; Site Observation is not called Violation.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-780","id":"SNG-11","title":"Snag detail page","part":"SNG","round":"3","who":"Hafiz; Mohammed","steps":["Open a Snag."],"expected":"Header with number, type, Stage and age; Raised from card; description; photos; actions only for the viewer; history. No due date.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-782","id":"SNG-12","title":"Bulk actions and exports","part":"SNG","round":"3","who":"Ali (TMC PM)","steps":["Select several Snags; reassign within TMC; Export Excel."],"expected":"Bulk applies within TMC only; the export holds exactly the visible rows.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-784","id":"SNG-13","title":"Snag List on a phone","part":"SNG","round":"3","who":"Hafiz","steps":["At 375 px open the Snag List and raise a Snag with the camera."],"expected":"Photo-first cards, filters in a sheet, large New button, the camera opens from Take photo; saved as you go.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-787","id":"SNG-14","title":"Pick the Contractor when two cover a Location","part":"SNG","round":"3","who":"Mohammed (DCL manager)","steps":["Leave Beta Build covering Tower 1 as in the seed.","Raise a Snag on Tower 1."],"expected":"The Raise pop-up asks which Contractor; the other never sees it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-789","id":"SNG-15","title":"Snag PDF report","part":"SNG","round":"3","who":"Ali (TMC PM)","steps":["Snag List > Export PDF report."],"expected":"A PDF of the visible Snags with photos; no Snag the viewer cannot see.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-685","id":"SUB-01","title":"A new MAR is saved as a Draft","part":"SUB","round":"0","who":"Hafiz (TMC engineer)","steps":["Projects > Riyadh Gate Tower - Phase 2 > Submittals > New Submittal > Material Approval Request.","Subject \"UAT SUB-01 Lighting Fixtures\", Trade Electrical Works, Location Tower 1 Floor 02, Manufacturer Philips, Approved supplier Najd Electrical Supplies, Description empty.","Save Draft."],"expected":"The Draft is listed in the Drafts Stage with \"No number yet\" and no Step Age dots. It is Hafiz's to edit. What other Companies see: VIS-01.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-688","id":"SUB-02","title":"Send for Review is refused while the Form is incomplete","part":"SUB","round":"0","who":"Hafiz (TMC engineer)","steps":["Open the Draft from SUB-01.","Send for Review with Description and Datasheet (PDF) empty."],"expected":"Refused: the Form lists what is missing (\"2 fields need your attention: Description, Datasheet (PDF)\") and marks each field. Nothing moves; the item stays a Draft with no number.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-691","id":"SUB-03","title":"The MAR Form takes Items, totals and Documents","part":"SUB","round":"0","who":"Hafiz (TMC engineer)","steps":["Fill Description, Model \"CoreLine Panel\", Specification section \"26 51 00\".","Under Items, Add row twice: \"Recessed panel\" 200 Pieces and \"Surface panel\" 40 Pieces.","Save and close, then open the Draft again from the list.","Add a PDF under Datasheet (PDF) and a JPEG with EXIF under Sample photo."],"expected":"The total reads 240. Save and close returns to the Submittals list. The Datasheet and Sample photo can be added once the Draft is saved; the photo shows the time and place from its EXIF. The Attachments and Links System Fields sit below the Form.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-694","id":"SUB-04","title":"Send for Review numbers the item and Ali holds it at once","part":"SUB","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Hafiz: Send for Review on the complete Draft.","Ali: open it from the bell."],"expected":"The item gets a Document Number (first in a fresh seed: TWR-MAR-01-0004) shown left to right. Ali is TMC's only PM, so it is his at once: \"With Ali Sonour - TMC Constructions\", no Pick up button. Ali's bell shows \"Step reached\" within seconds. Nothing outside TMC.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-697","id":"SUB-05","title":"A Return stays in Internal Review","part":"SUB","round":"0","who":"Ali (TMC PM); Hafiz (TMC engineer)","steps":["Ali: Return with the reason \"Add emergency duration\".","Hafiz opens the item."],"expected":"The item stays in the Internal Review Stage, now at the Contractor Engineer Step, keeps its Document Number and goes back to Hafiz (\"With Hafiz Hamdan - TMC Constructions\"); it is never a Draft again. The reason is in TMC's history marked internal. Step Age counts from the Return.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-700","id":"SUB-06","title":"Documents change until the Submit","part":"SUB","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Hafiz: remove the Datasheet and add a corrected PDF.","Send for Review again.","Ali opens the item and its Documents."],"expected":"Hafiz can swap Documents while the item is in TMC. Ali sees the corrected PDF. Documents freeze at the Submit, not before.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-704","id":"SUB-07","title":"Submit with a Cover Note and an Internal Note","part":"SUB","round":"0","who":"Ali (TMC PM); Ahmed (DCL engineer)","steps":["Ali: Submit; Cover Note \"Panels for Level 2, as drawing E-201\"; Internal Note \"Quantities checked against the BOQ\"; confirm.","Ahmed opens the item."],"expected":"Stage is Pending Approval. TMC sees \"With Design Consultants LLC\", never a Consultant's name. Ahmed's history shows the Submit with the Cover Note by \"TMC Constructions\" (no person); the Internal Note is not there. The Submission Date is set.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-707","id":"SUB-08","title":"Pick up and Return to pool in the Consultant pool","part":"SUB","round":"0","who":"Ahmed, Sara (DCL engineers); Mohammed (DCL manager)","steps":["Ahmed and Sara open the Submitted MAR.","Ahmed: Pick up.","Sara refreshes Need My Action and her bell.","Ahmed: Return to pool, then Pick up again."],"expected":"Both Engineers see \"not picked up yet: ...\" with both names; Mohammed is not in this pool and reads it read-only. After Pick up the item leaves Sara's Need My Action and her unread \"Step reached\" is withdrawn; Return to pool is offered because the pool has two Members and does not bring the notification back.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-709","id":"SUB-09","title":"The Consultant reads the Form and cannot edit it","part":"SUB","round":"0","who":"Ahmed (DCL engineer)","steps":["After Pick up, read every Form section, open the Datasheet PDF and the Sample photo.","Try to change an answer."],"expected":"Every answer, the Items table and the total are shown read-only; Documents are frozen; the photo shows time and place. No edit control is offered (the Form is the raiser's).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-712","id":"SUB-10","title":"Send to Manager needs the verification","part":"SUB","round":"0","who":"Ahmed (DCL engineer); Mohammed (DCL manager)","steps":["Ahmed: Send to Manager with the verification empty.","Answer Sample checked Yes, Matches specification No; leave the Verification note empty.","Write the note, set Recommended Code C and an Internal Note.","Confirm."],"expected":"Steps 1 and 2 are refused: the Verification note becomes required when Matches specification is No. After step 4 the item sits with Mohammed, the only Consultant Manager, at once. Ahmed's answers, Recommended Code and Internal Note are in DCL's history only, marked internal.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-716","id":"SUB-11","title":"Code A closes the item with the final verification","part":"SUB","round":"0","who":"Mohammed (DCL manager)","steps":["Open the item; Approve A.","Check the Final verification pop-up is filled from Ahmed's reply; Remarks left empty.","Confirm."],"expected":"Remarks are optional with Code A. The item closes Approved, Code A, and accepts no more moves. Download PDF appears (SIG-02).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-718","id":"SUB-12","title":"Code B turns each comment into a Comment","part":"SUB","round":"0","who":"Mohammed (DCL manager); Ali (TMC PM)","steps":["On a new Submitted MAR, Mohammed: Approve with Comments B with three comment rows and Remarks.","Ali opens the MAR and the Snag List."],"expected":"The MAR closes at Code B. Three Comment items are in the Snag List, raised by Design Consultants and Open with TMC. The MAR page reads \"Comments: 3 open / 0 closed\". Remarks are required with B.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-720","id":"SUB-13","title":"Code C needs Remarks and Return to Engineer works","part":"SUB","round":"0","who":"Mohammed (DCL manager); Ahmed (DCL engineer)","steps":["Ahmed sends a MAR to Mohammed with Matches specification No.","Mohammed: Return to Engineer, reason \"Check the photometric report\".","Ahmed sends it again unchanged.","Mohammed: Revise and Resubmit C with Remarks empty, then with Remarks."],"expected":"Return to Engineer gives it back to Ahmed. Code C is refused until Remarks are written, then closes at C with its Remarks and final verification. TMC is offered Create Revision (SUB-15).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-723","id":"SUB-14","title":"Code D offers a replacement, not a Revision","part":"SUB","round":"0","who":"Mohammed (DCL manager); Hafiz (TMC engineer)","steps":["Mohammed: Reject D with Remarks.","Hafiz opens the closed MAR and chooses Create replacement."],"expected":"The item closes at D. Hafiz is offered Create replacement (no Revision). The replacement is a new Draft with the same Subject, a Replaces Link to the rejected MAR, and gets a new Document Number with no Rev suffix at its first send.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-727","id":"SUB-15","title":"Create a Revision of a Code C item","part":"SUB","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Open the MAR you took to Code C in SUB-13 (the seeded Cable tray risers item already has an open Rev 1, so it offers no new Revision) and Create Revision.","The Draft reads Revision 1, No number yet; change the Model, Save and close.","Open the Revision drop-down.","Send for Review and have Ali Submit it."],"expected":"The Draft starts with TMC's answers and the copied Datasheet. The drop-down lists the original and Revision 1 (no number yet); after the Submit it lists the number and the number Rev 1, each whole and left to right. Choosing the original shows its own answers, Code C, Remarks and history. A Revision uses no counter.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-730","id":"SUB-16","title":"Delete discards a Draft only","part":"SUB","round":"0","who":"Hafiz (TMC engineer)","steps":["On a Draft that never left Draft, row menu > Delete, confirm.","On a numbered item look at its row menu."],"expected":"The confirm says nobody will see the Draft again, Hafiz included, and no number is lost; it leaves the list. A numbered item has no Delete (an issued item is never deleted).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-732","id":"SUB-17","title":"Duplicate copies only TMC's own work","part":"SUB","round":"0","who":"Hafiz (TMC engineer)","steps":["On a closed MAR that Mohammed answered, row menu > Duplicate.","Open the new Draft."],"expected":"A new Draft with the Subject, TMC's own answers and the Documents and photos TMC uploaded, as new files. None of Design Consultants' verification, Remarks or notes. \"Duplicated from\" shows the original's number to TMC only.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-735","id":"SUB-18","title":"Download gives the item as it last arrived","part":"SUB","round":"0","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["On a Submitted MAR choose Download from the row menu as Ali, then as Mohammed.","Try Download on a Draft."],"expected":"Both get the same content: shared answers, shared moves by Company only, no Step, no person, no Internal Note. A Draft offers nothing to download.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-737","id":"SUB-19","title":"Related submittals and free Links open the other item","part":"SUB","round":"0","who":"Hafiz (TMC engineer)","steps":["Open \"Emergency lighting control panel - Tower 2\".","Links: open TWR-MAR-01-0001 from Related submittals and from the free Link.","On TWR-MAR-01-0001 scroll to Linked from."],"expected":"Each Link shows the Document Number (left to right) and Subject and opens the item; a Submitted item cannot be changed. Linked from on the exit signs lists the control panel. Linking notifies nobody.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-739","id":"SUB-20","title":"A SAR closed at Code A adds the supplier to the list","part":"SUB","round":"0","who":"Hafiz; Ali; Ahmed; Mohammed","steps":["Raise a Supplier Approval Request \"UAT SUB-20 Delta Cables\" (Electrical), send, Submit.","Ahmed picks up and sends to Manager; Mohammed: Approve A.","Project Settings > Approved Supplier List."],"expected":"The SAR runs 2 to 2 and closes. \"UAT SUB-20 Delta Cables\" is listed for Electrical, approved. ort the whole table.","Search first, then export.","Put =1+1 in the Subject of a Draft and export."],"expected":"Rows and columns equal the screen; the whole table adds every List field; under a search only the rows read so far; a cell that looks like a formula is written as text.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-753","id":"SUB-25","title":"Kanban: columns, counts and moving a card","part":"SUB","round":"0","who":"Ali (TMC PM)","steps":["Kanban: columns are the Stages with counts.","Drag a card, or use Move to, to a Stage Ali's Step allows.","Open the filter panel (Owner, Role, Created date)."],"expected":"Dropping or choosing a move opens the same Action Form as the item page; the card moves after confirm; a move that is not allowed is not offered. Internal Review shows TMC's own Steps with counts (Engineer, PM). The other Company is one lane by its name.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-755","id":"SUB-26","title":"Project Dashboard: Type cards and Activity Feed","part":"SUB","round":"0","who":"Ali (TMC PM)","steps":["Open the Project (Dashboard).","Click a number on a Type card."],"expected":"Type cards show counts over what Ali sees; each number opens the List with the same filter and the same count. The Activity Feed sits beside them; it lists Company names for other Companies and no person of theirs.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-757","id":"SUB-27","title":"Home: counts, Need My Action list, Recent activity","part":"SUB","round":"0","who":"Ali (TMC PM)","steps":["Open Home.","Compare Active Projects, Need My Action, My Company 4+ weeks at step, My Company waiting with others and each Project card's submittal count with the Project's List."],"expected":"Every number equals the sum of the Project reads and opens the matching list; Drafts are never counted as Need My Action; Recent activity shows at most four entries.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-759","id":"SUB-28","title":"Activity Feed page","part":"SUB","round":"0","who":"Mohammed (DCL manager)","steps":["Project > Activity Feed after some Submits and Codes."],"expected":"Entries read as events (submitted, returned, approved) with the Project; TMC appears by Company name only; no answers_changed or Document upload entries.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-761","id":"SUB-29","title":"No due dates, deadlines or SLAs anywhere","part":"SUB","round":"0","who":"Hafiz; Mohammed","steps":["Visit Home, Projects, Dashboard, List, Kanban, item page and the emails in Mailpit, in EN and AR.","Search the page text for due, deadline, SLA, late and every other term GLOSSARY.md lists under Avoid for Step Age (and the Arabic equivalents)."],"expected":"Only Step Age dots (1 to 4+ weeks) show age. No due date, deadline or SLA appears. The List and Kanban headers use the GLOSSARY words: Stage not Status, Trade not Discipline, With not Current owner.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-923","id":"UX-01","title":"App shell, sidebar and top bar match the design","part":"UX","round":"0","who":"Hafiz (TMC engineer); Saeed (Project Admin)","steps":["Open Home at 1366 and 1920, EN and AR.","Open each sidebar entry and the member menu.","At 820 and 375 open the drawer."],"expected":"Matches saas-shell.html (and D:\\Artifacts\\Rabaed Responsive Anatomy.html for the drawer): sidebar entries of RP-405 decision 5 only (no Overdue, Payments, Subscriptions, Roles, theme toggle), Company name not a switcher, Arabic mirrored. UI issues and UX recommendations reported apart.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-924","id":"UX-02","title":"Home matches the design and reads at a glance","part":"UX","round":"0","who":"Ali (TMC PM)","steps":["Open Home at 1366 and 1920, EN and AR, with items in every state.","Follow each number and row."],"expected":"Matches the kit Home with RP-405 changes: Active Projects, Need My Action, 4+ weeks at their flow drawer","part":"UX","round":"0","who":"Hafiz; Ali; Mohammed","steps":["Open a MAR in Draft, in internal review, Submitted and closed, EN and AR.","Open every Transition pop-up (Send for Review, Submit with Cover Note, Return, Code A to D).","Open View workflow (map and list)."],"expected":"Laid out as design/prompts/work-item-page.md and workflow-view.html: header (Document Number left to right, Stage, With, Step Age), Form, Attachments and Links, history; each pop-up asks for confirmation and shows its Action Form; required fields and errors are clear.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-929","id":"UX-07","title":"New work item and the Form while filling it","part":"UX","round":"0","who":"Hafiz (TMC engineer)","steps":["New Submittal for each Type, EN and AR, 1366 and 375.","Fill, leave required fields empty, add Items rows, upload files and a photo, Save Draft."],"expected":"Laid out as new-work-item.md and form-template-brief.md: sections, field help, the Items table on a phone, upload progress, \"Saved\" indicator, the list of fields needing attention; nothing overlaps at 375.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-930","id":"UX-08","title":"Activity page","part":"UX","round":"0","who":"Ali; Mohammed","steps":["Open the Project Activity page, EN and AR.","Page back; open entries."],"expected":"Laid out as design/prompts/activity.md: entries worded from what happened, another Company by name only, newest first, paging that keeps its place.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-931","id":"UX-09","title":"Notifications page and the bell","part":"UX","round":"0","who":"Ali","steps":["Open the bell, then the Notifications page, EN and AR.","Open an entry; Mark all as read."],"expected":"Laid out as design/prompts/notifications.md: unread state, grouping, the item it opens, empty state; the bell badge matches the unread count.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-932","id":"UX-10"," art":"UX","round":"0","who":"Saeed; Ali","steps":["Open Numbering EN and AR.","Edit a pattern; read the preview and the shared-counter warning."],"expected":"Matches settings-numbering.html and D:\\Artifacts\\Rabaed Document Numbering.html: pattern builder, preview left to right, warning wording; Ali sees examples only.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-937","id":"UX-15","title":"Settings > Workflows, the builder and the Library","part":"UX","round":"0","who":"Saeed (Project Admin)","steps":["Open Settings > Workflows, a Workflow, its Versions.","Open the builder: add a Step, connect, undo, auto-layout, Validate, Publish.","Open the Library."],"expected":"Matches settings-workflows.html with wf/, D:\\Artifacts\\Rabaed Settings Workflows.html and Rabaed Workflow Builder V2.html: canvas, Step panel, problems list, Change Note; usable at 1366.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-938","id":"UX-16","title":"Register Import wizard and Imports page","part":"UX","round":"0","who":"Ali (TMC PM)","steps":["Run an import: upload, worksheet and header row, mapping, preview with bad rows, confirm.","Open the result page and the Imports page. EN and AR."],"expected":"Laid out as design/prompts/register-import.md, except that no import time is shown (visibility.md wins): each step says where you are, bad rows show every reason, confirm says how many Drafts.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-939","id":"UX-17","title":"Snag List on the desktop","part":"UX","round":"0","who":"Ahmed (DCL engineer); Hafiz","steps":["Open the Snag List: List grouped by Stage, Kanban, type chips, filters, EN and AR."],"expected":"Matches snag-list.html: groups, chips, Step Age dots, filters; Comments from Code B shown as designed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-940","id":"UX-18","title":"WIR request and on-site inspection on a phone","part":"UX","round":"0","who":"Hafiz; Ahmed","steps":["At 375 (phone), raise
