<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabaed UAT – System UAT with Ahmed</title>
<style>
  :root {
    --bg:#f4f1ec; --card:#fff; --ink:#1c2230; --muted:#626b7d; --line:#e4e0d8; --soft:#faf8f5;
    --accent:#c8431f; --accent-ink:#a8330f; --accent-soft:#fdeee8; --navy:#1b2540; --navy-2:#2a3760;
    --pass:#1e7e45; --pass-soft:#e6f4ec; --fail:#b42318; --fail-soft:#fdecea; --blocked:#6941c6; --blocked-soft:#f0ebfb;
    --notrun:#5d6678; --notrun-soft:#eef0f4; --shadow:0 1px 2px rgba(28,34,48,.06), 0 4px 14px rgba(28,34,48,.06); --r:14px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 "Segoe UI", system-ui, -apple-system, Tahoma, Arial, sans-serif; }
  a { color:var(--accent-ink); }
  button, input, select, textarea { font:inherit; color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }

  /* Header with the overall progress */
  header.top { background:linear-gradient(135deg, var(--navy), var(--navy-2)); color:#fff; padding:22px 0 18px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { width:42px; height:42px; border-radius:11px; background:var(--accent); display:grid; place-items:center; font-weight:800; font-size:20px; box-shadow:0 4px 12px rgba(200,67,31,.35); }
  .brand h1 { margin:0; font-size:21px; line-height:1.25; }
  .brand .sub { color:#c7cfe2; font-size:13px; }
  .brand .grow { flex:1; }
  .ghost { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:10px; padding:7px 14px; cursor:pointer; }
  .ghost:hover { background:rgba(255,255,255,.16); }
  .overall { margin-top:16px; display:flex; align-items:center; gap:12px; font-size:13px; color:#dfe5f2; }
  .bar { flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; display:flex; }
  .bar span { height:100%; }
  .bar .p { background:#3fbf7f; } .bar .f { background:#ef6b5b; } .bar .b { background:#9b7bea; } .bar .n { background:#aab3c5; }

  main { padding:20px 0 90px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:14px; }
  .pad { padding:16px 18px; }

  /* Collapsible info cards (guide, people) */
  details.info > summary { list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:12px; font-weight:700; font-size:16px; }
  details.info > summary::-webkit-details-marker { display:none; }
  details.info > summary .ico { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-ink); font-size:15px; }
  details.info > summary .chev { margin-inline-start:auto; color:var(--muted); transition:transform .15s; }
  details.info[open] > summary .chev { transform:rotate(90deg); }
  [dir=rtl] .chev { display:inline-block; transform:scaleX(-1); }
  [dir=rtl] details.info[open] > summary .chev { transform:rotate(90deg); }
  .info .body { padding:0 18px 16px; }
  ol.guide { margin:0; padding:0; list-style:none; counter-reset:g; display:grid; gap:8px; }
  ol.guide li { counter-increment:g; display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; padding:9px 12px; background:var(--soft); border-radius:10px; }
  ol.guide li::before { content:counter(g); width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:1px; }
  .help { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .tableWrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table.people { border-collapse:collapse; width:100%; font-size:13px; }
  table.people th, table.people td { padding:8px 10px; text-align:start; vertical-align:top; border-bottom:1px solid var(--line); }
  table.people th { background:var(--soft); color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
  table.people tr:last-child td { border-bottom:0; }
  table.people tr.hl { background:#fff4ef; }
  .email { font-family:ui-monospace, Consolas, monospace; font-size:12px; white-space:nowrap; }
  .mini { padding:2px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:12px; cursor:pointer; }

  /* Toolbar */
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .field input, .field select { padding:8px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; min-width:150px; font-weight:400; color:var(--ink); }
  .field input:focus, .field select:focus, textarea:focus { outline:2px solid #f3b6a3; outline-offset:0; border-color:var(--accent); }
  .btn { padding:9px 15px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:600; font-size:14px; }
  .btn:hover { background:var(--soft); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(200,67,31,.25); }
  .btn.primary:hover { background:var(--accent-ink); }
  .spacer { flex:1; }
  #msg { font-size:13px; color:var(--pass); font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px; font-size:13px; background:var(--notrun-soft); }
  .chip b { font-size:15px; }
  .chip.pass { background:var(--pass-soft); color:var(--pass); } .chip.fail { background:var(--fail-soft); color:var(--fail); }
  .chip.blocked { background:var(--blocked-soft); color:var(--blocked); } .chip.owner { background:var(--accent-soft); color:var(--accent-ink); }

  /* Sections */
  details.section { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
  details.section > summary { list-style:none; cursor:pointer; padding:14px 18px; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section[open] > summary { border-bottom:1px solid var(--line); background:var(--soft); }
  .num { width:38px; height:38px; border-radius:11px; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:16px; }
  .section.owner .num { background:var(--accent); font-size:13px; }
  .section.done .num { background:var(--pass); }
  .stitle { font-weight:700; font-size:16px; }
  .smeta { font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:2px; }
  .sbar { height:6px; border-radius:99px; background:#ece8e1; overflow:hidden; display:flex; margin-top:7px; max-width:420px; }
  .sbar span { height:100%; } .sbar .p { background:var(--pass); } .sbar .f { background:var(--fail); } .sbar .b { background:var(--blocked); } .sbar .n { background:var(--notrun); }
  .sright { text-align:end; font-size:13px; color:var(--muted); white-space:nowrap; }
  .sright b { font-size:18px; color:var(--ink); }
  .scases { padding:14px; display:grid; gap:12px; background:#fbfaf8; }
  .snote { margin:0 4px; font-size:13px; color:var(--accent-ink); background:var(--accent-soft); padding:9px 12px; border-radius:10px; }

  /* A case */
  .case { background:#fff; border:1px solid var(--line); border-inline-start:5px solid #d9d4cb; border-radius:12px; display:grid; grid-template-columns:minmax(0,1fr) 360px; overflow:hidden; }
  .case.st-pass { border-inline-start-color:var(--pass); } .case.st-fail { border-inline-start-color:var(--fail); }
  .case.st-blocked { border-inline-start-color:var(--blocked); } .case.st-notrun { border-inline-start-color:var(--notrun); }
  .case.active { box-shadow:0 0 0 3px #f6c7b8; }
  .case .body { padding:14px 16px; min-width:0; }
  .case .rec { padding:14px 16px; border-inline-start:1px solid var(--line); background:var(--soft); }
  .case h3 { margin:0 0 6px; font-size:15.5px; line-height:1.4; }
  .cid { display:inline-block; font-family:ui-monospace, Consolas, monospace; font-size:12px; background:var(--navy); color:#fff; border-radius:6px; padding:1px 7px; margin-inline-end:6px; vertical-align:1px; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; font-size:12px; }
  .tag { padding:2px 8px; border-radius:6px; background:#eef0f4; color:#565f71; }
  .tag.need { background:#fdeee8; color:#a8330f; font-weight:600; } /* 6.2:1 */
  .tag a { color:inherit; }
  .lbl { font-weight:700; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 0 3px; }
  .who { font-size:14px; }
  ol.steps { margin:2px 0 4px; padding-inline-start:22px; }
  ol.steps li { margin:3px 0; }
  .exp { margin:2px 0 0; padding:9px 12px; background:var(--pass-soft); border-radius:9px; font-size:14px; }
  .note { margin:8px 0 0; padding:8px 11px; font-size:12.5px; color:#565f71; background:#faf8f5; border-inline-start:3px solid var(--line); border-radius:6px; }
  a.person { color:inherit; text-decoration:underline dotted; text-underline-offset:3px; }
  .status { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:10px; }
  .status button { padding:7px 4px; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; }
  .status button:hover { background:var(--soft); }
  .status button[aria-pressed=true].pass { background:var(--pass); color:#fff; border-color:var(--pass); }
  .status button[aria-pressed=true].fail { background:var(--fail); color:#fff; border-color:var(--fail); }
  .status button[aria-pressed=true].blocked { background:var(--blocked); color:#fff; border-color:var(--blocked); }
  .status button[aria-pressed=true].notrun { background:var(--notrun); color:#fff; border-color:var(--notrun); }
  .rec label { font-size:12px; color:var(--muted); font-weight:600; display:block; }
  .rec textarea { width:100%; min-height:84px; margin-top:4px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; resize:vertical; background:#fff; font-size:14px; }
  .drop { margin-top:9px; border:1.5px dashed #c9c2b6; border-radius:10px; padding:10px; font-size:12.5px; color:var(--muted); text-align:center; outline:none; cursor:pointer; background:#fff; }
  .drop:focus, .drop.over { border-color:var(--accent); background:#fff6f2; color:var(--accent-ink); }
  .shots { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .shot { position:relative; }
  .shot img { height:68px; max-width:118px; object-fit:cover; border:1px solid var(--line); border-radius:8px; display:block; cursor:zoom-in; }
  .shot button { position:absolute; top:-7px; inset-inline-end:-7px; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:13px; line-height:18px; cursor:pointer; }
  .saved { font-size:11.5px; color:var(--muted); margin-top:8px; min-height:15px; }
  .empty { padding:28px; text-align:center; color:var(--muted); }
  #lightbox { position:fixed; inset:0; background:rgba(15,19,30,.86); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
  #lightbox img { max-width:94vw; max-height:86vh; background:#fff; border-radius:8px; }
  #lightbox p { position:absolute; bottom:14px; color:#fff; font-size:13px; }
  @media (max-width: 920px) {
    .case { grid-template-columns:1fr; } .case .rec { border-inline-start:0; border-top:1px solid var(--line); }
    details.section > summary { grid-template-columns:auto 1fr; } .sright { grid-column:1 / -1; text-align:start; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo">R</div>
      <div class="grow">
        <h1><span data-t="title"></span></h1>
        <div class="sub">System UAT with Ahmed · <span data-t="intro"></span> <span id="built"></span></div>
      </div>
      <button class="ghost" id="lang" type="button">العربية</button>
    </div>
    <div class="overall"><span id="overallText"></span><div class="bar" id="overallBar"></div></div>
  </div>
</header>
<main class="wrap">
  <details class="card info" id="guide" open>
    <summary><span class="ico">?</span><span data-t="startTitle"></span><span class="chev">›</span></summary>
    <div class="body"><ol class="guide" id="guideList"></ol></div>
  </details>
  <details class="card info" id="people">
    <summary><span class="ico">👥</span><span data-t="peopleTitle"></span><span class="chev">›</span></summary>
    <div class="body"><p class="help" data-t="peopleNote"></p><div class="tableWrap"><table class="people" id="peopleTable"></table></div></div>
  </details>
  <section class="card pad">
    <div class="toolbar">
      <label class="field"><span data-t="tester"></span><input type="text" id="tester" dir="auto"></label>
      <button class="btn primary" id="export" type="button" data-t="export"></button>
      <button class="btn" id="saveJson" type="button" data-t="saveJson"></button>
      <button class="btn" id="importBtn" type="button" data-t="importJson"></button>
      <button class="btn" id="mdBtn" type="button" data-t="mdBtn"></button>
      <input type="file" id="importFile" accept=".json" hidden>
      <span class="spacer"></span>
      <span id="msg" role="status"></span>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <label class="field"><span data-t="status"></span><select id="fStatus"></select></label>
      <label class="field"><span data-t="round"></span><select id="fRound"></select></label>
      <label class="field" style="flex:1 1 240px"><span data-t="search"></span><input type="search" id="fText" dir="auto" style="width:100%"></label>
    </div>
    <div class="chips" id="counts"></div>
  </section>
  <div id="sections"></div>
</main>
<div id="lightbox"><img alt=""><p></p></div>
<input type="file" id="pick" accept="image/*" multiple hidden>

<script>// The UAT test sheet's Excel (.xlsx) writer (RP-1163): SpreadsheetML zipped with fflate, with
// screenshots embedded as pictures anchored to their row. Plain JavaScript, so the generator
// inlines it into the sheet's HTML (it drops the word `export`) and the unit test imports it.

const MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const PKG_REL = "http://schemas.openxmlformats.org/package/2006/relationships";
const EMU_PER_PX = 9525;

function xmlEsc(s) {
  return String(s ?? "")
    // eslint-disable-next-line no-control-regex -- XML 1.0 forbids these characters, so a cell drops them.
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
    .replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

/** A column's letters: 0 is A, 26 is AA. */
function colName(i) {
  let s = "";
  let n = i + 1;
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function sheetXml(sheet, hasDrawing) {
  const heights = sheet.rowHeights ?? {};
  const rows = sheet.table
    .map((row, ri) => {
      const ht = heights[ri] ? ` ht="${heights[ri]}" customHeight="1"` : "";
      const cells = row
        .map((v, ci) => {
          const ref = colName(ci) + (ri + 1);
          const style = ri === 0 ? 1 : 2;
          return typeof v === "number"
            ? `<c r="${ref}" s="${style}"><v>${v}</v></c>`
            : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
        })
        .join("");
      return `<row r="${ri + 1}"${ht}>${cells}</row>`;
    })
    .join("");
  const last = colName(sheet.table[0].length - 1) + sheet.table.length;
  const cols = sheet.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("");
  return (
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${MAIN}" xmlns:r="${REL}">` +
    `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
    `<cols>${cols}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:${last}"/>` +
    (hasDrawing ? `<drawing r:id="rId1"/>` : "") +
    `</worksheet>`
  );
}

function drawingXml(images, firstId) {
  const anchors = images
    .map((img, i) => {
      const id = firstId + i;
      const cx = Math.round(img.width * EMU_PER_PX);
      const cy = Math.round(img.height * EMU_PER_PX);
      return (
        `<xdr:oneCellAnchor><xdr:from><xdr:col>${img.col}</xdr:col><xdr:colOff>${(img.offsetX ?? 0) * EMU_PER_PX}</xdr:colOff><xdr:row>${img.row}</xdr:row><xdr:rowOff>${(img.offsetY ?? 0) * EMU_PER_PX}</xdr:rowOff></xdr:from>` +
        `<xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${i + 2}" name="Screenshot ${id}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>` +
        `<xdr:blipFill><a:blip r:embed="rId${i + 1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>` +
        `<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`
      );
    })
    .join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${REL}">${anchors}</xdr:wsDr>`;
}

const STYLES =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${MAIN}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>` +
  `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF16213A"/><bgColor indexed="64"/></patternFill></fill></fills>` +
  `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>` +
  `<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs></styleSheet>`;

/**
 * The workbook's bytes. `sheets`: { name, table (rows of strings or numbers, the first the
 * header), widths, rowHeights? ({ rowIndex: points }), images? ([{ row, col, data: Uint8Array,
 * ext: "png" | "jpeg", width, height, offsetX?, offsetY? }], row and col 0-based, size in px) }.
 * `zip`: fflate's { zipSync, strToU8 }.
 */
function buildXlsx(sheets, zip) {
  const enc = (s) => zip.strToU8(s);
  const files = {};
  let mediaCount = 0;
  let drawingCount = 0;
  const overrides = [];
  sheets.forEach((sheet, si) => {
    const images = sheet.images ?? [];
    const hasDrawing = images.length > 0;
    files[`xl/worksheets/sheet${si + 1}.xml`] = enc(sheetXml(sheet, hasDrawing));
    overrides.push(`<Override PartName="/xl/worksheets/sheet${si + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    if (!hasDrawing) return;
    drawingCount += 1;
    const d = drawingCount;
    const first = mediaCount + 1;
    const rels = images.map((img, i) => {
      mediaCount += 1;
      const file = `image${mediaCount}.${img.ext === "jpeg" ? "jpeg" : "png"}`;
      files[`xl/media/${file}`] = img.data;
      return `<Relationship Id="rId${i + 1}" Type="${REL}/image" Target="../media/${file}"/>`;
    });
    files[`xl/drawings/drawing${d}.xml`] = enc(drawingXml(images, first));
    files[`xl/drawings/_rels/drawing${d}.xml.rels`] = enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}">${rels.join("")}</Relationships>`);
    files[`xl/worksheets/_rels/sheet${si + 1}.xml.rels`] = enc(
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}"><Relationship Id="rId1" Type="${REL}/drawing" Target="../drawings/drawing${d}.xml"/></Relationships>`,
    );
    overrides.push(`<Override PartName="/xl/drawings/drawing${d}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
  });
  files["[Content_Types].xml"] = enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>` +
      `<Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${overrides.join("")}</Types>`,
  );
  files["_rels/.rels"] = enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
  );
  const names = sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("");
  const filters = sheets
    .map((s, i) => `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(s.name)}'!$A$1:$${colName(s.table[0].length - 1)}$${s.table.length}</definedName>`)
    .join("");
  files["xl/workbook.xml"] = enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${MAIN}" xmlns:r="${REL}"><sheets>${names}</sheets><definedNames>${filters}</definedNames></workbook>`);
  files["xl/_rels/workbook.xml.rels"] = enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${PKG_REL}">` +
      sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("") +
      `<Relationship Id="rId${sheets.length + 1}" Type="${REL}/styles" Target="styles.xml"/></Relationships>`,
  );
  files["xl/styles.xml"] = enc(STYLES);
  return zip.zipSync(files, { level: 6 });
}
</script>

ecord","ar":"يعطي رمز المراجعة (A وB وC وD) ويوقّع السجل الوثائقي"}},{"key":"layla","name":"Layla Mansour","email":"layla.mansour@designconsultants.demo.rabaed.test","company":{"en":"Design Consultants LLC","ar":"المصممون الاستشاريون ذ.م.م"},"role":{"en":"Consultant","ar":"الاستشاري"},"position":{"en":"Authorized Person","ar":"المفوّض"},"usedFor":{"en":"Design Consultants' Company Profile and Members","ar":"ملف شركة المصممون الاستشاريون وأعضاؤها"}},{"key":"faisal","name":"Faisal Al Otaibi","email":"faisal.alotaibi@alwaha.demo.rabaed.test","company":{"en":"Al Waha PMC","ar":"الواحة لإدارة المشاريع"},"role":{"en":"Owner Representative, Electrical, everywhere","ar":"ممثل المالك، الكهرباء، كل المواقع"},"position":{"en":"Engineer (uses Arabic)","ar":"مهندس (يستخدم العربية)"},"usedFor":{"en":"The Arabic cases","ar":"حالات اللغة العربية"}},{"key":"noura","name":"Noura Al Harbi","email":"noura.alharbi@alwaha.demo.rabaed.test","company":{"en":"Al Waha PMC","ar":"الواحة لإدارة المشاريع"},"role":{"en":"Owner Representative","ar":"ممثل المالك"},"position":{"en":"Project Manager (uses Arabic)","ar":"مديرة المشروع (تستخدم العربية)"},"usedFor":{"en":"Holds the Owner's review; Arabic cases","ar":"تتولى مراجعة المالك؛ حالات اللغة العربية"}},{"key":"hind","name":"Hind Al Mutairi","email":"hind.almutairi@alwaha.demo.rabaed.test","company":{"en":"Al Waha PMC","ar":"الواحة لإدارة المشاريع"},"role":{"en":"Owner Representative","ar":"ممثل المالك"},"position":{"en":"Authorized Person","ar":"المفوّض"},"usedFor":{"en":"Al Waha's Company Profile and Members","ar":"ملف شركة الواحة وأعضاؤها"}},{"key":"engineer","name":"Rabaed Engineer","email":"engineer@rabaed.demo.rabaed.test","company":{"en":"Rabaed","ar":"رابض"},"role":{"en":"Rabaed Admin","ar":"Rabaed Admin"},"position":{"en":"Rabaed Engineer","ar":"مهندس رابض"},"usedFor":{"en":"Rabaed Admin cases (ADM): the UAT owner runs these","ar":"حالات Rabaed Admin (ADM): يشغّلها مسؤول الاختبار"}}],"parts":{"SUB":{"en":"Submittals","ar":"التقديمات"},"WF":{"en":"Workflows","ar":"سير العمل"},"FRM":{"en":"Forms and Screens","ar":"النماذج والشاشات"},"PAR":{"en":"Participants and Visibility setup","ar":"المشاركون وإعداد الرؤية"},"PKG":{"en":"Packages","ar":"الحزم"},"SIG":{"en":"Signing and Documental Record","ar":"التوقيع والسجل الوثائقي"},"SNG":{"en":"Snag List","ar":"قائمة الملاحظات"},"INS":{"en":"Inspections (WIR)","ar":"الفحوصات (WIR)"},"IMP":{"en":"Submittal Register Import","ar":"استيراد سجل التقديمات"},"NOT":{"en":"Notifications","ar":"الإشعارات"},"I18N":{"en":"Arabic, RTL and phone width","ar":"العربية والاتجاه من اليمين وعرض الهاتف"},"ADM":{"en":"Rabaed Admin","ar":"Rabaed Admin"},"UX":{"en":"UI and UX against the design","ar":"الواجهة وتجربة الاستخدام مقابل التصميم"},"VIS":{"en":"Visibility","ar":"الرؤية"}},"markdown":"# Rabaed UAT test sheet: System UAT with Ahmed\n\nBuilt 2026-11-01. 262 Test Cases. The UAT: https://rabaed-uat-web.vercel.app/en (English) and https://rabaed-uat-web.vercel.app/ar (Arabic).\n\n## How to use this file\n\n1. Open the UAT and sign in as the person each case names under **Sign in as** (see Who's who). The owner gives you each sign-in; this file holds no passwords. Use one private browser window per person, so each sees only their own Company's work.\n2. Work section by section, case by case. Do the **Steps**, compare with the **Expected result**, and decide: `pass`, `fail`, `blocked` (could not test it) or `notrun`.\n3. On `fail` or `blocked`, write what you saw in the comment, in English or Arabic, and keep a screenshot.\n4. Skip the last section, the cases the UAT owner runs, unless the owner asks you to run them.\n5. Hand back your results as **one JSON file** in the format at the end of this file. Open the HTML sheet, press **Load work (.json)**, then **Export to Excel**, and send the .xlsx to the owner. Or send the .json itself.\n6. Demo data only: never type real names, phone numbers or documents.\n\nIf you are an AI helping the tester: keep the case keys (`RP-nnn`) exactly as written, use only the four status values, and never invent a result for a case the tester did not run. Leave it out, or use `notrun`.\n\n## Who's who\n\n| Name | Sign-in email | Company | On the Project | Position | Used for |\n|---|---|---|---|---|---|\n| Saeed Al Qahtani | `saeed.alqahtani@tmc.demo.rabaed.test` | TMC Constructions | Contractor and Project Admin | Authorized Person | Company Profile (logo, Stamp), Members, invitations, Project Settings |\n| Hafiz Hamdan | `hafiz.hamdan@tmc.demo.rabaed.test` | TMC Constructions | Contractor, Electrical, everywhere | Engineer | Raises Drafts and sends them for review; Snags; the phone cases |\n| Ali Sonour | `ali.sonour@tmc.demo.rabaed.test` | TMC Constructions | Contractor, Electrical, everywhere | Project Manager | Reviews Hafiz's Drafts and Submits to the Consultant; Packages; the List and Dashboard |\n| Omar Al Harbi | `omar.alharbi@tmc.demo.rabaed.test` | TMC Constructions | Contractor, Electrical, Tower 2 only | Engineer | Visibility narrowed to one Location: sees Tower 2 only |\n| Yousef Karim | `yousef.karim@betabuild.demo.rabaed.test` | Beta Build | Contractor, Electrical, everywhere | Engineer | A second Contractor on the same Project: must never see TMC's work |\n| Nasser Al Dosari | `nasser.aldosari@betabuild.demo.rabaed.test` | Beta Build | Beta Build's own Project, Jeddah Corniche Villas | Authorized Person | Not on Riyadh Gate Tower: must get the not-found page there |\n| Ahmed bin Said | `ahmed.binsaid@designconsultants.demo.rabaed.test` | Design Consultants LLC | Consultant, Electrical and Mechanical | Engineer | Reviews submittals for the Consultant (a demo person, not you) |\n| Sara | `sara@designconsultants.demo.rabaed.test` | Design Consultants LLC | Consultant, Electrical and Mechanical | Engineer | A second Consultant engineer: pools and pick-up |\n| Mohammed Al Shamsi | `mohammed.alshamsi@designconsultants.demo.rabaed.test` | Design Consultants LLC | Consultant, Electrical and Mechanical | Manager | Gives the Review Code (A, B, C, D) and signs the Documental Record |\n| Layla Mansour | `layla.mansour@designconsultants.demo.rabaed.test` | Design Consultants LLC | Consultant | Authorized Person | Design Consultants' Company Profile and Members |\n| Faisal Al Otaibi | `faisal.alotaibi@alwaha.demo.rabaed.test` | Al Waha PMC | Owner Representative, Electrical, everywhere | Engineer (uses Arabic) | The Arabic cases |\n| Noura Al Harbi | `noura.alharbi@alwaha.demo.rabaed.test` | Al Waha PMC | Owner Representative | Project Manager (uses Arabic) | Holds the Owner's review; Arabic cases |\n| Hind Al Mutairi | `hind.almutairi@alwaha.demo.rabaed.test` | Al Waha PMC | Owner Representative | Authorized Person | Al Waha's Company Profile and Members |\n| Rabaed Engineer | `engineer@rabaed.demo.rabaed.test` | Rabaed | Rabaed Admin | Rabaed Engineer | Rabaed Admin cases (ADM): the UAT owner runs these |\n\n## 1. Submittals (28 cases)\n\n### SUB-01 A new MAR is saved as a Draft\n\n- **Key:** `RP-685` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Projects > Riyadh Gate Tower - Phase 2 > Submittals > New Submittal > Material Approval Request.\n  2. Subject \"UAT SUB-01 Lighting Fixtures\", Trade Electrical Works, Location Tower 1 Floor 02, Manufacturer Philips, Approved supplier Najd Electrical Supplies, Description empty.\n  3. Save Draft.\n- **Expected result:** The Draft is listed in the Drafts Stage with \"No number yet\" and no Step Age dots. It is Hafiz's to edit. What other Companies see: VIS-01.\n\n### SUB-02 Send for Review is refused while the Form is incomplete\n\n- **Key:** `RP-688` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open the Draft from SUB-01.\n  2. Send for Review with Description and Datasheet (PDF) empty.\n- **Expected result:** Refused: the Form lists what is missing (\"2 fields need your attention: Description, Datasheet (PDF)\") and marks each field. Nothing moves; the item stays a Draft with no number.\n\n### SUB-03 The MAR Form takes Items, totals and Documents\n\n- **Key:** `RP-691` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Fill Description, Model \"CoreLine Panel\", Specification section \"26 51 00\".\n  2. Under Items, Add row twice: \"Recessed panel\" 200 Pieces and \"Surface panel\" 40 Pieces.\n  3. Save and close, then open the Draft again from the list.\n  4. Add a PDF under Datasheet (PDF) and a JPEG with EXIF under Sample photo.\n- **Expected result:** The total reads 240. Save and close returns to the Submittals list. The Datasheet and Sample photo can be added once the Draft is saved; the photo shows the time and place from its EXIF. The Attachments and Links System Fields sit below the Form.\n\n### SUB-04 Send for Review numbers the item and Ali holds it at once\n\n- **Key:** `RP-694` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer); Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Hafiz: Send for Review on the complete Draft.\n  2. Ali: open it from the bell.\n- **Expected result:** The item gets the next Document Number in its sequence (for example TWR-MAR-01-0004), shown left to right. Ali is TMC's only PM, so it is his at once: \"With Ali Sonour - TMC Constructions\", no Pick up button. Ali's bell shows \"Step reached\" within seconds. Nothing outside TMC.\n\n### SUB-05 A Return stays in Internal Review\n\n- **Key:** `RP-697` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Ali (TMC PM); Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ali: Return with the reason \"Add emergency duration\".\n  2. Hafiz opens the item.\n- **Expected result:** The item stays in the Internal Review Stage, now at the Contractor Engineer Step, keeps its Document Number and goes back to Hafiz (\"With Hafiz Hamdan - TMC Constructions\"); it is never a Draft again. The reason is in TMC's history marked internal. Step Age counts from the Return.\n\n### SUB-06 Documents change until the Submit\n\n- **Key:** `RP-700` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer); Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Hafiz: remove the Datasheet and add a corrected PDF.\n  2. Send for Review again.\n  3. Ali opens the item and its Documents.\n- **Expected result:** Hafiz can swap Documents while the item is in TMC. Ali sees the corrected PDF. Documents freeze at the Submit, not before.\n\n### SUB-07 Submit with a Cover Note and an Internal Note\n\n- **Key:** `RP-704` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Ali (TMC PM); Ahmed (DCL engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ali: Submit; Cover Note \"Panels for Level 2, as drawing E-201\"; Internal Note \"Quantities checked against the BOQ\"; confirm.\n  2. Ahmed opens the item.\n- **Expected result:** Stage is Pending Approval. TMC sees \"With Design Consultants LLC\", never a Consultant's name. Ahmed's history shows the Submit with the Cover Note by \"TMC Constructions\" (no person); the Internal Note is not there. The Submission Date is set.\n\n### SUB-08 Pick up and Return to pool in the Consultant pool\n\n- **Key:** `RP-707` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Ahmed, Sara (DCL engineers); Mohammed (DCL manager)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ahmed and Sara open the Submitted MAR.\n  2. Ahmed: Pick up.\n  3. Sara refreshes Need My Action and her bell.\n  4. Ahmed: Return to pool, then Pick up again.\n- **Expected result:** Both Engineers see \"not picked up yet: ...\" with both names; Mohammed is not in this pool and reads it read-only. After Pick up the item leaves Sara's Need My Action and her unread \"Step reached\" is withdrawn; Return to pool is offered because the pool has two Members and does not bring the notification back.\n\n### SUB-09 The Consultant reads the Form and cannot edit it\n\n- **Key:** `RP-709` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Ahmed (DCL engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. After Pick up, read every Form section, open the Datasheet PDF and the Sample photo.\n  2. Try to change an answer.\n- **Expected result:** Every answer, the Items table and the total are shown read-only; Documents are frozen; the photo shows time and place. No edit control is offered (the Form is the raiser's).\n\n### SUB-10 Send to Manager needs the verification\n\n- **Key:** `RP-712` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Ahmed (DCL engineer); Mohammed (DCL manager)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ahmed: Send to Manager with the verification empty.\n  2. Answer Sample checked Yes, Matches specification No; leave the Verification note empty.\n  3. Write the note, set Recommended Code C and an Internal Note.\n  4. Confirm.\n- **Expected result:** Steps 1 and 2 are refused: the Verification note becomes required when Matches specification is No. After step 4 the item sits with Mohammed, the only Consultant Manager, at once. Ahmed's answers, Recommended Code and Internal Note are in DCL's history only, marked internal.\n\n### SUB-11 Code A closes the item with the final verification\n\n- **Key:** `RP-716` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Mohammed (DCL manager)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open the item; Approve A.\n  2. Check the Final verification pop-up is filled from Ahmed's reply; Remarks left empty.\n  3. Confirm.\n- **Expected result:** Remarks are optional with Code A. The item closes Approved, Code A, and accepts no more moves. Download PDF appears (SIG-02).\n\n### SUB-12 Code B turns each comment into a Comment\n\n- **Key:** `RP-718` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Mohammed (DCL manager); Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. On a new Submitted MAR, Mohammed: Approve with Comments B with three comment rows and Remarks.\n  2. Ali opens the MAR and the Snag List.\n- **Expected result:** The MAR closes at Code B. Three Comment items are in the Snag List, raised by Design Consultants and Open with TMC. The MAR page reads \"Comments: 3 open / 0 closed\". Remarks are required with B.\n\n### SUB-13 Code C needs Remarks and Return to Engineer works\n\n- **Key:** `RP-720` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Mohammed (DCL manager); Ahmed (DCL engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ahmed sends a MAR to Mohammed with Matches specification No.\n  2. Mohammed: Return to Engineer, reason \"Check the photometric report\".\n  3. Ahmed sends it again unchanged.\n  4. Mohammed: Revise and Resubmit C with Remarks empty, then with Remarks.\n- **Expected result:** Return to Engineer gives it back to Ahmed. Code C is refused until Remarks are written, then closes at C with its Remarks and final verification. TMC is offered Create Revision (SUB-15).\n\n### SUB-14 Code D offers a replacement, not a Revision\n\n- **Key:** `RP-723` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Mohammed (DCL manager); Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Mohammed: Reject D with Remarks.\n  2. Hafiz opens the closed MAR and chooses Create replacement.\n- **Expected result:** The item closes at D. Hafiz is offered Create replacement (no Revision). The replacement is a new Draft with the same Subject, a Replaces Link to the rejected MAR, and gets a new Document Number with no Rev suffix at its first send.\n\n### SUB-15 Create a Revision of a Code C item\n\n- **Key:** `RP-727` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer); Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open the MAR you took to Code C in SUB-13 (the seeded Cable tray risers item already has an open Rev 1, so it offers no new Revision) and Create Revision.\n  2. The Draft reads Revision 1, No number yet; change the Model, Save and close.\n  3. Open the Revision drop-down.\n  4. Send for Review and have Ali Submit it.\n- **Expected result:** The Draft starts with TMC's answers and the copied Datasheet. The drop-down lists the original and Revision 1 (no number yet); after the Submit it lists the number and the number Rev 1, each whole and left to right. Choosing the original shows its own answers, Code C, Remarks and history. A Revision uses no counter.\n\n### SUB-16 Delete discards a Draft only\n\n- **Key:** `RP-730` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. On a Draft that never left Draft, row menu > Delete, confirm.\n  2. On a numbered item look at its row menu.\n- **Expected result:** The confirm says nobody will see the Draft again, Hafiz included, and no number is lost; it leaves the list. A numbered item has no Delete (an issued item is never deleted).\n\n### SUB-17 Duplicate copies only TMC's own work\n\n- **Key:** `RP-732` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. On a closed MAR that Mohammed answered, row menu > Duplicate.\n  2. Open the new Draft.\n- **Expected result:** A new Draft with the Subject, TMC's own answers and the Documents and photos TMC uploaded, as new files. None of Design Consultants' verification, Remarks or notes. \"Duplicated from\" shows the original's number to TMC only.\n\n### SUB-18 Download gives the item as it last arrived\n\n- **Key:** `RP-735` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Ali (TMC PM); Mohammed (DCL manager)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. On a Submitted MAR choose Download from the row menu as Ali, then as Mohammed.\n  2. Try Download on a Draft.\n- **Expected result:** Both get the same content: shared answers, shared moves by Company only, no Step, no person, no Internal Note. A Draft offers Download of its Working Copy.\n\n### SUB-19 Related submittals and free Links open the other item\n\n- **Key:** `RP-737` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz (TMC engineer)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open \"Emergency lighting control panel - Tower 2\".\n  2. Links: open TWR-MAR-01-0001 from Related submittals and from the free Link.\n  3. On TWR-MAR-01-0001 scroll to Linked from.\n- **Expected result:** Each Link shows the Document Number (left to right) and Subject and opens the item; a Submitted item cannot be changed. Linked from on the exit signs lists the control panel. Linking notifies nobody.\n\n### SUB-20 A SAR closed at Code A adds the supplier to the list\n\n- **Key:** `RP-739` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz; Ali; Ahmed; Mohammed\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Raise a Supplier Approval Request \"UAT SUB-20 Delta Cables\" (Electrical), send, Submit.\n  2. Ahmed picks up and sends to Manager; Mohammed: Approve A.\n  3. Project Settings > Approved Supplier List.\n- **Expected result:** The SAR runs 2 to 2 and closes. \"UAT SUB-20 Delta Cables\" is listed for Electrical, approved. A second SAR for the same name in other letter case adds no second entry. A MAR now offers it under Approved supplier.\n\n### SUB-21 A DAR ends with the Owner's review\n\n- **Key:** `RP-741` · **Part:** SUB · **Round:** 0\n- **Sign in as:** Hafiz; Ali; Mohammed; Noura (Al Waha PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. t at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Settings > Visibility: set Beta Build Location to Tower 2 only.\n  2. Yousef signs in.\n- **Expected result:** The change saves (Yousef holds nothing, so no Handover). Yousef sees only Tower 2 items from then on, and TMC is the only Contractor covering Tower 1, which the Snag scenarios need.\n\n### PAR-15 Fixture FX-K1M: Sara covers Mechanical only\n\n- **Key:** `RP-885` · **Part:** PAR · **Round:** 0\n- **Sign in as:** Layla (DCL Authorized Person); Sara\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open Sara's Visibility (Participants > Members).\n  2. Set Trade to Mechanical only.\n- **Expected result:** Sara no longer sees Electrical items and leaves their pools (Handover first if she holds one). Ahmed still covers both. Later scenarios use Sara as the K1 Mechanical-only engineer.\n\n### PAR-16 Fixture FX-OW: invite UAT Owner Co as Owner\n\n- **Key:** `RP-889` · **Part:** PAR · **Round:** 0\n- **Sign in as:** Saeed (Project Admin); Reem UAT (Owner Co Authorized Person)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. After ADM-02 onboards UAT Owner Co (CR 9999000005), Saeed invites that CR as Owner on Riyadh Gate Tower.\n  2. Reem accepts, grants Electrical and Mechanical, all Locations, and adds a PM Member (Sami UAT) with Position Project Manager.\n- **Expected result:** UAT Owner Co is a Participant with oversight over Submitted items it covers. Later Owner scenarios use it.\n\n## 5. Packages (11 cases)\n\n### PKG-01 Packages is a third view beside List and Kanban\n\n- **Key:** `RP-892` · **Part:** PKG · **Round:** 1\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Submittals > the view toggle.\n  2. Choose Packages.\n- **Expected result:** A Packages Kanban with three columns Open, In Progress and Done, each with a count; a New Package button for a Company that can build one; search and ubmits every not-yet-submitted item; each gets its own Document Number. If any fails, none is submitted.\n\n### PKG-06 Status runs Open, In Progress, Done\n\n- **Key:** `RP-901` · **Part:** PKG · **Round:** 1\n- **Sign in as:** Ali; Mohammed\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Submit the Package.\n  2. Close the items at A, B, C and D over time.\n  3. Create a Revision for the Code C item and a replacement for D.\n- **Expected result:** In Progress as soon as anything is submitted. Done only when every latest submittal has closed at A, B or D; a Code C waits for its Revision, which joins the Package by itself; a later replacement or added submittal puts it back In Progress. The word is Done, never Closed.\n\n### PKG-07 After Submit: add yes, remove no\n\n- **Key:** `RP-684` · **Part:** PKG · **Round:** 1\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. In an In Progress Package add a submittal.\n  2. Try to remove one.\n- **Expected result:** Adding works; removing is not offered. Rename works and is recorded.\n\n### PKG-08 The Package chip and filter on submittals\n\n- **Key:** `RP-687` · **Part:** PKG · **Round:** 1\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open List and Kanban.\n  2. Use the Package filter.\n  3. Click the chip on a card and on the item page.\n- **Expected result:** Cards and the item page show PKG-001 with the name; the chip opens the Package page; the filter narrows List and Kanban. Package is not a Form field.\n\n### PKG-09 Bulk Transition applies one Action Form to many\n\n- **Key:** `RP-690` · **Part:** PKG · **Round:** 1 · **Needs:** setup\n- **Sign in as:** Mohammed (DCL manager, with a Signature); a DCL Member without a Signature (fixture: remove one in the profile)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. In an In Progress Package select two items waiting on Mohammed that offer the same Code Transition (e.g. Code A).\n  2. Choose it; fill the Action Form once; confirm.\n  3. Repeat with an item that cannot take it.\n  4. As a DCL Member without a Signature, select two items waiting on them and take the same Code in bulk.\n- **Expected result:** With a Signature: one Action Form applies to each item (with Assign to if offered); each item is signed exactly as a single Transition is and gets its own event, Issued Code and Documental Record. All or nothing: if one item cannot take it nothing is done and the message names that item and why. Not offered unless every selected item offers the same Transition and Action Form. Without a Signature: the bulk Code is refused for all items, nothing is taken, and the reason (no Signature) is shown; there is no separate signing Step state. Owner decision 2026-10-19 (story 44 reworded on RP-616).\n\n### PKG-11 Comments show on the Package for information\n\n- **Key:** `RP-696` · **Part:** PKG · **Round:** 1\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. After a Code B on an item of the Package open the Package Comments section.\n- **Expected result:** Comments raised from its submittals are listed with their Stage and the note that Comments are not part of the Package; they do not change its status.\n\n### PKG-12 A Package is seen only through submittals the viewer sees\n\n- **Key:** `RP-699` · **Part:** PKG · **Round:** 1\n- **Sign in as:** Yousef; Ahmed; Sara\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Ali builds a Package with Drafts only.\n  2. Look at Packages as Yousef, Ahmed and Sara.\n  3. After the Submit look again as Sara (Mechanical-only) and Ahmed.\n- **Expected result:** Another Company's Open Package is never shown (not its name, Drafts or count). After the Submit Ahmed sees all submittals of his Trades; Sara sees only the Mechanical ones and their counts; status shows as one word. Yousef sees nothing.\n\n## 6. Signing and Documental Record (15 cases)\n\n### SIG-01 Every Transition is confirmed in its pop-up\n\n- **Key:** `RP-702` · **Part:** SIG · **Round:** 0\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open any Transition (Submit).\n  2. Look for a Sign button or checkbox.\n  3. Confirm.\n- **Expected result:** The pop-up keeps the Transition's own label; there is no separate signing step. Taking it without confirming (API without confirmed true) is refused not_confirmed. After confirm the history records who, from which Participant and when.\n\n### SIG-02 Download PDF on a closed item makes the sealed record\n\n- **Key:** `RP-705` · **Part:** SIG · **Round:** 0\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open a closed MAR (Code A) and press Download PDF.\n  2. Repeat right after the Code, before the worker finishes.\n- **Expected result:** A PDF downloads through a short-lived link. If the record is not made yet the page says it is not ready and to try again in a minute; no partial file.\n\n### SIG-03 The tracer record prints title, outcome and approval flow\n\n- **Key:** `RP-711` · **Part:** SIG · **Round:** 0\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Open the downloaded PDF.\n  2. Check the title block, outcome and date, Verification Code, link, approval flow, footer.\n- **Expected result:** Type names and code, Subject, Project and Document Number (left to right, Rev included); the outcome with the date; the Verification Code and verification link; each Transition on the path with label, Member, Positions, Company, date and time (Riyadh time) and its content hash; Arabic then English; Latin digits; every page footed Issued electronically through Rabaed, Verification Code, page X of Y. (Page 1 and Form body come with SIG-08.)\n\n### SIG-04 The record names everyone on the path and leaves out the rest\n\n- **Key:** `RP-713` · **Part:** SIG · **Round:** 0\n- **Sign in as:** Ali (TMC PM); Mohammed\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Take a MAR through Send for Review, a Return, a second send, Submit with Internal Note, Ahmed Send to Manager with Recommended Code C, Mohammed Code A.\n  2. Read the PDF.\n- **Expected result:** It names every Member who took a Transition on the path, TMC's and DCL's alike, with the first entry dated at the raiser's last send out of Draft (a Returned send is off the path). It holds no Return, Internal Note, Recommended Code, Chat or in-progress answer.\n\n### SIG-05 A Code C, a Code D and a Cancelled item also close with a record\n\n- **Key:** `RP-714` · **Part:** SIG · **Round:** 0\n- **Sign in as:** Hafiz; Mohammed\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Close one MAR at C, one at D.\n  2. Download both PDFs.\n- **Expected result:** Each closes with its record whatever the outcome; the outcome in the PDF matches the item.\n\n### SIG-07 Add Signature in the profile (draw, type, upload)\n\n- **Key:** `RP-717` · **Part:** SIG · **Round:** 2\n- **Sign in as:** Hafiz\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Profile > Add Signature: Draw with finger at 375 px, then Type, then Upload.\n  2. Save.\n  3. Replace it.\n- **Expected result:** Pen styles and colours, Clear and Undo; a preview as on a record; once saved the profile shows it with Replace and the note that records already made keep the Signature used then.\n\n### SIG-08 Record page 1 and Form body\n\n- **Key:** `RP-719` · **Part:** SIG · **Round:** 2\n- **Sign in as:** Ali (TMC PM)\n- **Start at:** https://rabaed-uat-web.vercel.app/en\n- **Steps:**\n  1. Download a record.\n  2. Read page 1: Companies, title block, parties, classification, final decision with chips and QR, reply, approval flow, then the Form.\n- **Expected r
