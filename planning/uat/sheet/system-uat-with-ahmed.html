e accessibility-tester agent, report only) on the same pages, EN and AR."],"expected":"Visible focus, logical focus order (mirrored in Arabic), pop-ups trap and return focus, every control has a label, text contrast at least WCAG AA. Findings reported as UI issues.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-945","id":"UX-23","title":"Packages view and Package page","part":"UX","round":"1","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["Open the Packages view and a Package page, EN and AR, 1366 and 1920: cards, counts, item table, bulk bar, Comments section."],"expected":"Matches packages.html where spec RP-616 does not differ (the table of known differences in design/prompts/packages.md).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-946","id":"UX-24","title":"Snag List on a phone","part":"UX","round":"3","who":"Hafiz; Ahmed","steps":["At 375 open the Snag List, filters and a Snag; create one camera first."],"expected":"Matches snag-list-mobile.html: photo-first cards, bottom-sheet filters, camera-first create.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-947","id":"UX-25","title":"Add Signature, the no-Signature and no-Stamp pop-ups, Company logo and Stamp","part":"UX","round":"2","who":"Hafiz; Saeed (Authorized Person)","steps":["Profile > Add Signature (draw, type, upload).","Take a Transition with no Signature; with a Company with no Stamp.","Company profile: logo and Stamp."],"expected":"Laid out as signature-and-stamp.md and its Claude Design screens (RP-665): clear what is missing and how to add it, EN and AR.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-948","id":"UX-26","title":"Documental Record and Working Copy read like the owner samples","part":"UX","round":"2","who":"Ali; Mohammed","steps":["Download the Documental Record of a closed MAR and a Working Copy, EN and AR record language.","Compare with the owner samples of RP-151."],"expected":"Page 1, the Form body, Signature cards and appendix follow the samples where they agree with visibility.md and GLOSSARY.md; Latin digits; Document Numbers left to right; readable when printed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-734","id":"VIS-01","title":"A new Draft and a MAR in internal review are TMC's alone","part":"VIS","round":"0","who":"Actors: Hafiz, Ali (TMC). Must NOT see: Yousef (Beta Build), Ahmed, Sara, Mohammed (DCL), Faisal, Noura (Al Waha), Owner PM (UAT Owner Co)","steps":["Hafiz saves a Draft MAR \"UAT VIS-01 Draft\".","Each observer: Submittals List, Kanban, Dashboard, Home, Activity Feed, bell, and search for the Subject; note every count.","Hafiz sends it for review (Ali holds it); repeat 2."],"expected":"Observers must NOT see the item in any List, Kanban, count, badge, Dashboard figure, search result, feed entry or notification, before or after the send. Their counts are unchanged by it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-736","id":"VIS-02","title":"After the Submit only the covering Consultant and oversight see the MAR","part":"VIS","round":"0","who":"Actors: Ali. Must see: Ahmed (DCL Electrical), Faisal and Noura (Al Waha, oversight), Owner PM (UAT Owner Co). Must NOT see: Sara (Mechanical-only, FX-K1M), Yousef (Beta Build)","steps":["Ali Submits an Electrical MAR.","Check each person's List, pool, item URL."],"expected":"Ahmed sees it in the Step Pool; Faisal, Noura and the Owner PM see it read-only as oversight; Sara (Mechanical only) and Yousef (same Trade, other Contractor, V3) get the 404 page, no row and no count.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-738","id":"VIS-03","title":"Access follows the current grant, not the grant date","part":"VIS","round":"0","who":"Layla (DCL Authorized Person); Sara","steps":["With Sara Mechanical-only and an Electrical MAR Submitted, Layla gives Sara Electrical again.","Sara opens the List.","Layla removes Electrical again."],"expected":"Sara sees the Electrical items from then on, including earlier ones; after removal she stops seeing them (E2 aside). Layla needs no Handover for a Step Sara does not hold.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-740","id":"VIS-04","title":"Recommended Code, Internal Notes and the verification note never reach TMC","part":"VIS","round":"0","who":"Actors: Ahmed, Mohammed (DCL). Must NOT see: Hafiz, Ali (TMC), Faisal, Noura (Al Waha)","steps":["Ali Submits with an Internal Note.","Ahmed Sends to Manager with a verification note, Recommended Code A and an Internal Note.","Before the Code, read the item history, Activity Feed, bell and List as Hafiz, Ali and Faisal.","Mohammed issues Code C with Remarks, a verification note and an Internal Note.","Read again."],"expected":"Before the Code TMC and Al Waha see no change at all: no reply, Recommended Code or Return. After it they read the Code, Remarks and final verification and that Mohammed issued it, never Ahmed's reply, a Recommended Code, an internal_answers entry or any Internal Note; the history numbering has no gap. K1 sees the Submit but never TMC's Internal Note. DCL reads all of its own.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-742","id":"VIS-05","title":"Code B Comments reach the reviewed item's raiser only","part":"VIS","round":"0","who":"Actors: Mohammed (DCL). Must NOT see: Yousef (Beta Build); Sara (Mechanical-only). Must see: Ali, Hafiz (TMC), Faisal (oversight)","steps":["Mohammed issues Code B with three comment rows on a TMC Electrical MAR.","Yousef: Snag List, counts, Kanban, and each Comment id.","Ali resolves one and Mohammed closes it.","Read the MAR's Comments line as Sara."],"expected":"Yousef sees none in the Snag List, counts or Kanban and gets 404 by id; Comments are Open with TMC, raised by DCL, seen by Faisal as oversight; Sara sees neither the MAR nor its Comments; TMC and DCL read 2 open / 1 closed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-745","id":"VIS-06","title":"Chat is visible to every Participant that has the item","part":"VIS","round":"","who":"Ali; Ahmed; Faisal","steps":["Ali posts in Chat on a Submitted MAR.","Ahmed and Faisal read it."],"expected":"Both read it; messages cannot be edited or deleted. Chat is not on the closed record.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-764","id":"VIS-07","title":"Only people who see a closed item can download its record","part":"VIS","round":"0","who":"Must see: Ali, Ahmed, Faisal, Owner PM. Must NOT see: Yousef (Beta Build)","steps":["Mohammed closes a MAR.","Each person presses Download PDF on the item and from the List row; Yousef also requests the item id and the record URL directly."],"expected":"Ali, Ahmed, Faisal and the Owner PM download the same record; Yousef gets the plain 404 page everywhere and no row. A made-up id and an item whose record is not made yet give the same 404.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-766","id":"VIS-08","title":"The Record Data inside the PDF holds only what the pages print","part":"VIS","round":"0","who":"Ali (TMC)","steps":["Open the PDF's attachments and extract the Record Data XML.","Compare each value with the PDF text."],"expected":"Every value in the XML (Transitions on the path with name, Position, Company, times and hashes; Verification Code and link) is printed in the PDF; the XML holds no Internal Note, Recommended Code, Chat or Return.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-768","id":"VIS-09","title":"A Link to an item the viewer cannot see shows number and Subject only","part":"VIS","round":"0","who":"Actors: Omar (TMC, Tower 2 only); Mohammed (DCL); Yousef (Beta Build)","steps":["Hafiz's control panel MAR links the exit signs (Tower 1).","Omar opens Links, then the Link.","Open the exit signs' own URL as Omar.","Mohammed, who sees both, opens the Link.","Yousef tries to link the exit signs in his own Draft."],"expected":"Omar sees only the Document Number and Subject; the Link opens on its own page with only You are not allowed to see the details of this item; the response holds no item id and the item URL is 404. Mohammed gets the item. Yousef is never offered the exit signs.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-769","id":"VIS-10","title":"Linked from lists Submitted items by number and Subject only","part":"VIS","round":"0","who":"Actors: Mohammed (DCL); Ali, Hafiz (TMC)","steps":["Hafiz links his Draft MAR-2 to the Submitted MAR-1.","Mohammed reads MAR-1's Linked from.","Hafiz Submits MAR-2; read again.","Needs FX-C2: Mohammed raises a Snag that links MAR-1; Hafiz reads MAR-1's Linked from."],"expected":"MAR-2 is not listed while it is a Draft or in internal review, then appears. Hafiz sees Mohammed's item as number and Subject; opening it says he may not see its details; its answers, history and Documents stay hidden and its URL is 404.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-771","id":"VIS-11","title":"Link search never offers what the linker cannot see","part":"VIS","round":"0","who":"Hafiz; Yousef","steps":["As Hafiz search for an item to link.","As Yousef search for the same Subjects.","Via the API save a Link to a Beta Build item id from TMC."],"expected":"Hafiz is offered only Submitted items he sees in this Project: no Drafts, nothing in internal review, nothing of Beta Build, nothing from another Project. Yousef is never offered TMC's item. The saved Link is refused like a made-up id.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-772","id":"VIS-12","title":"A Revision Draft is hidden; the drop-down lists only what the viewer sees","part":"VIS","round":"0","who":"Actors: Hafiz (TMC). Must NOT see: Mohammed, Faisal","steps":["Hafiz creates Revision 1 of a Code C MAR and keeps it Draft.","Mohammed and Faisal open the original: drop-down, Links, and the Revision URL.","Hafiz Submits it.","Hafiz discards another Draft Revision and creates it again."],"expected":"Before the Submit the drop-down lists only the original, there is no Link to the Draft and its URL is 404. After it both Revisions are listed and the original shows its own answers, Documents and history. A discarded Revision never reaches Mohammed; the re-created one is Rev 1 again.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-775","id":"VIS-13","title":"A Revision moved to another Location: each oversight Member sees only theirs","part":"VIS","round":"0","who":"Actors: Hafiz (TMC); Faisal (Tower 1 only), Noura (Tower 2 only) after Hind narrows them","steps":["Hind narrows Faisal to Tower 1 and Noura to Tower 2 (fixture FX-OR).","Hafiz makes Rev 1 of a Tower 1 MAR, moves it to Tower 2, names the original in a link question and Submits it.","Both read the original, Rev 1, Links, Linked from and the drop-down."],"expected":"Faisal sees the original but no Link to Rev 1 and a drop-down with the original only; Noura sees Rev 1 with no Link, Linked from or link answer naming the original and a drop-down with Rev 1 only. Neither shows even a number or title of the other.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-776","id":"VIS-14","title":"After a Send Back (Comment only) everyone sees the item as it was","part":"VIS","round":"0","who":"Actors: Hafiz (TMC). Observers: Mohammed (DCL), Faisal, UAT Owner PM","steps":["Needs FX-SB (WF-09, Comment only).","Ahmed Sends a Submitted MAR Back.","Hafiz tries to change an answer, add a Document and a Link.","Observers read the item, Documents, Links and Link search.","Hafiz Submits again."],"expected":"Hafiz cannot change anything (Sent back for comment). Observers see the item exactly as at the Send Back; the item is still offered in Link search and in Linked from with the same number and Subject. After the new Submit they see everything.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-785","id":"VIS-15","title":"After a Send Back (Edit the Form) the raiser changes stay private","part":"VIS","round":"0","who":"Actors: Hafiz (TMC). Observers: Mohammed, Faisal (Tower 1 only), Noura (Tower 2 only), UAT Owner PM","steps":["Needs FX-SB with the Edit the Form setting and FX-OR.","Sent Back item at Tower 1: Hafiz changes an answer, adds a Document, a datasheet and a checklist photo, swaps a Link from X to Y, moves it to Tower 2.","Observers read it through List, Kanban, filters, search, item, Documents, Links, history, feed, bell.","Hafiz Submits again."],"expected":"Until the Submit observers see the item, Documents, Links, Trade, Location and Scopes as they were at the Send Back; new Documents are 404 to them; Faisal (Tower 1) keeps the item and Noura (Tower 2) does not see it; no history entry or notification shows a change. After the Submit the new values apply to everyone: Faisal loses it and Noura gains it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-788","id":"VIS-16","title":"Creation Date, Submission Date and saved times stay inside TMC","part":"VIS","round":"0","who":"Actors: Hafiz, Ali (TMC). Observers: Ahmed, Mohammed (DCL)","steps":["Hafiz saves a Draft, sends it, Ali Submits.","Compare the item page and List for TMC and for DCL; look at the ids in the address bar and in links.","Check the order of un-numbered Drafts.","Needs AGE for the date checks."],"expected":"TMC sees Creation Date (when it got its number) and Submission Date; DCL sees only the Submission Date and no Creation Date in any form. Ids carry no time. Un-numbered Drafts come last, ordered by Subject. Answer times and Saved read the Creation Date or later; a Revision follows its own Creation Date. The stored earlier times are covered by the automated suite.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-792","id":"VIS-17","title":"Step Age and With are counted per Company","part":"VIS","round":"0","who":"Actors: Ali (TMC); Ahmed, Mohammed (DCL)","steps":["Ali Submits.","Ahmed picks it up, sends to Manager, Mohammed Returns it to Ahmed.","Ali reads With, the Stage, Step Age and the workflow drawer.","Needs AGE: age the item 5 weeks inside TMC, then Submit."],"expected":"Ali sees With Design Consultants LLC and Step Age counted from the Submit, no reset, no internal move. DCL Step Age runs from when the item reached DCL (week 1), not the five weeks inside TMC; four weeks later it counts for DCL. No Step or person of the other Company appears.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-795","id":"VIS-18","title":"Dashboard counts follow what the viewer may see","part":"VIS","round":"0","who":"Hafiz, Ali (TMC); Ahmed (DCL); Yousef (Beta Build)","steps":["Fresh seed, MAR card: note Ali, Ahmed and Yousef.","Hafiz saves two more Drafts and sends one for review.","Mohammed Codes C one Submitted MAR; Hafiz creates Rev 1 and keeps it Draft; compare the Revision line.","Compare again."],"expected":"Fresh seed: Ali Pending 2 (0002 and 0003 Rev 1, one per chain) and In preparation 1 (the seeded Draft); Ahmed Pending 2 and no In preparation figure; Yousef 0 of everything. After step 2 Ali In preparation 3 and Pending unchanged; Ahmed and Yousef unchanged. DCL card shows awaiting revision while TMC card shows Revision in progress; each chain counts once; Yousef Revision line holds nothing of TMC.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-797","id":"VIS-19","title":"List and Kanban counts, lanes and filters hide the other Company","part":"VIS","round":"0","who":"Actors: Ali (TMC); Ahmed, Mohammed (DCL); Yousef (Beta Build)","steps":["With a TMC item picked up by Mohammed and another in TMC internal review, Ali and Ahmed open the filter panel (Owner, Role, Created date) and the Kanban.","Yousef opens Kanban and List."],"expected":"Owner offers each viewer their own Company people and the other Company by name only; filtering by the other Company person finds nothing. Role offers only the viewer own Steps. The TMC Internal Review column names its Steps with counts; DCL sees none of them. Created date is the Creation Date for TMC and the Submission Date for DCL. Yousef counts cover only Beta Build items.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-798","id":"VIS-20","title":"Search finds nothing inside answers or replies","part":"VIS","round":"0","who":"Ali (TMC); Mohammed (DCL)","steps":["Mohammed issues a Code with Remarks containing the word zircon.","Ali and Mohammed search zircon in List and Kanban.","Search the owner name and a Floor name."],"expected":"No result for zircon: Search never reads answers or replies. Search by Document Number, Subject, Type, Trade, Location and the raiser Company works; an owner phrase finds the viewer own Company people and the other Company by name only.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-799","id":"VIS-21","title":"Watch is private and ends when the viewer loses sight","part":"VIS","round":"0","who":"Ali (TMC); Ahmed (DCL); Faisal (Al Waha)","steps":["Ali, Ahmed and Faisal watch a MAR.","Read each page for any list or count of watchers.","Hind narrows Faisal off the MAR Trade.","Mohammed issues Code A."],"expected":"Each sees only their own Watching; no list or count of watchers. After narrowing Faisal gets no notification, in-app or email, of the Code.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-801","id":"VIS-22","title":"Notifications and emails reach only Members who see the item","part":"VIS","round":"0","who":"Actors: Mohammed (DCL). Must see: Hafiz (TMC raiser). Must NOT receive: Yousef (Beta Build), Sara (Mechanical-only)","steps":["Mohammed issues Code B on a TMC MAR.","Open Mailpit: the mail to Hafiz.","Look for any mail or bell entry for Yousef and for Sara."],"expected":"The subject of Hafiz's mail holds the Document Number, Subject and Code B only; Design Consultants is named as a Company and the final signer as the one person; no DCL internal step or Recommended Code. Yousef and Sara get nothing, in-app or email.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-804","id":"VIS-23","title":"Who holds an item: pool names stay inside the holding Company","part":"VIS","round":"0","who":"Actors: Ali, Hafiz (TMC); Ahmed, Sara, Mohammed (DCL)","steps":["Ali Submits a MAR: it waits in DCL pool of two Engineers.","Ali reads With on the item, List and Kanban.","Ahmed picks it up; Sara and Ali read again.","Mohammed issues Code B; the Comments wait in TMC pool."],"expected":"Ali reads With Design Consultants LLC and never the pool names, the holder or a Pick up event, in the item, List, Kanban, history, feed or notifications. DCL reads the pool names then the holder. Mohammed reads TMC by name only, even while the Comments wait in TMC pool.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-807","id":"VIS-24","title":"The Owner review: With Owner review and the Recommended Code","part":"VIS","round":"0","who":"Actors: Mohammed (DCL); Noura (Al Waha PM, holds the review); Hafiz, Ali (TMC); UAT Owner PM","steps":["Raise a DAR; Ali Submits; Mohammed recommends Code B with a table of comments to the Owner.","Hafiz and Ali read the item everywhere.","Noura Sends Back; Mohammed recommends C; Noura Confirms.","The UAT Owner PM reads the item at each step."],"expected":"While Noura reviews, TMC reads With Owner review (no Company name) in the List, search, Kanban lane, item, workflow map and weekly report, and no Code anywhere (not in History, feed, bell, Dashboard). Mohammed and Noura read the Recommended Code; the UAT Owner PM (Owner, not holder) reads none until it is issued. Confirm issues the Code for everyone; Comments with B come from Mohammed rows and are held by TMC; Code C offers a Revision.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-816","id":"VIS-25","title":"The workflow map folds the other Company into one block","part":"VIS","round":"0","who":"Ali (TMC); Ahmed, Mohammed (DCL); UAT Owner PM","steps":["Ali and the Owner PM open View workflow on a Submitted MAR.","Ahmed sends it to Mohammed.","Read the map again."],"expected":"Both read the whole Version with every Company Steps, but the item is With Design Consultants LLC over DCL part: no DCL Step is marked and the Ahmed to Mohammed move changes nothing they read. DCL sees Mohammed Step marked.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-819","id":"VIS-26","title":"Workflow authoring is 404 for everyone but the authors","part":"VIS","round":"0","who":"Ali (TMC PM, not Project Admin); Layla (DCL Authorized Person); Nasser (Project Admin of JCV only)","steps":["Each opens the builder URL of Tower Workflow and tries Duplicate, Save, Publish and Bind on it.","Nasser also tries a JCV Workflow URL pasted under the Tower Project."],"expected":"Every attempt gets the plain 404 naming nothing and changes nothing; a Rabaed Default is 404 in the builder to Project Admins; a made-up id gives the same 404. Binding to another Project Workflow or a Library Workflow is 404 for the Project Admin too.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-822","id":"VIS-27","title":"Draft Workflows and exception bindings are not public","part":"VIS","round":"0","who":"Saeed (Project Admin); Ali, Yousef, Ahmed","steps":["Saeed saves a draft of a Tower Workflow and a draft renaming a running Workflow.","Bind Beta Build MARs to an exception Workflow (WF-08).","Ali, Yousef and Ahmed open Settings > Workflows and the API."],"expected":"Nobody but the Project Admin reads a draft; the rename stays hidden until published; everyone reads published Versions whole. TMC and DCL read the exception Workflow as a definition but never its binding; only Yousef and the Project Admin learn which Participant it binds.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-825","id":"VIS-28","title":"A Company's Library is private until used on a Project","part":"VIS","round":"0","who":"Saeed (TMC Authorized Person); Layla (DCL); Hafiz; a Company on no shared Project","steps":["TMC saves a Workflow and a Form to its Library and marks a default.","Layla and Hafiz open Library and Settings.","Use it on Tower."],"expected":"DCL sees only its own Library; Hafiz lists TMC published Library Workflows read-only; nobody browses another Company Library; a Form appears to others only once used on Tower, and can then be copied; Library Workflow URLs of TMC are 404 to DCL.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-828","id":"VIS-29","title":"Change Notes and running counts never leak","part":"VIS","round":"0","who":"Saeed (Project Admin); Hafiz; Yousef","steps":["Publish with a Change Note naming Beta Build on an exception Workflow.","Hafiz and Yousef each raise a Draft.","Reopen the publish dialog and Versions."],"expected":"The Change Note naming a Participant on an exception is refused; N items keep their Version counts only the items the reader sees; only authors read Change Notes.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-832","id":"VIS-30","title":"Another Project or a non-admin cannot read or change Tower setup","part":"VIS","round":"0","who":"Ali (TMC PM, not Project Admin); Layla (DCL Authorized Person); Nasser (Project Admin of JCV)","steps":["Each opens Tower Settings: Scopes add, rename, deactivate; numbering counters; Workflow settings; Visibility.","Saeed (Project Admin) does the same."],"expected":"Ali, Layla and Nasser get the plain 404 for every change and for the numbering counters; the Scope is unchanged. Saeed can do them. Every Project Member reads Tower Trades, Scopes, Locations and published Workflows.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-834","id":"VIS-31","title":"A Participant never sees the list of other Participants","part":"VIS","round":"0","who":"Hafiz (TMC, not Project Admin); Ahmed (DCL); Saeed (Project Admin)","steps":["Hafiz and Ahmed open Company Projects and the Project Participants page.","Saeed opens the Participants.","Open Settings > Numbering as Hafiz and as Ahmed."],"expected":"Hafiz sees TMC own Participant, its role, its Project Members and the Host Company name; Ahmed sees DCL own Participant with Host Company TMC; neither lists the others. Saeed sees every Participant. Numbering shows each their own Participant with No code yet and no order number; Project Admin sees all orders.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-837","id":"VIS-32","title":"Pending invitations: one answer whatever the CR number","part":"VIS","round":"0","who":"Saeed (Project Admin); Layla (DCL Authorized Person); Hafiz","steps":["On a UAT Project invite a CR on Rabaed (DCL, 9999000003) and a made-up CR 9999000099.","Hafiz looks for DCL anywhere.","Layla opens Company Projects.","Saeed withdraws both invitations."],"expected":"Both invitations show on Saeed list by CR number only and read the same; Hafiz sees DCL nowhere; Layla sees only the invitation (Project name, Host Company, offered role); after the withdrawals both leave Saeed list in exactly the same way and DCL list too; nothing shows which CR number was on Rabaed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-840","id":"VIS-33","title":"Member Visibility pages belong to their own Company","part":"VIS","round":"0","who":"Hafiz (TMC); Saeed (Project Admin); Layla (DCL Authorized Person)","steps":["Hafiz opens DCL Participant page and Ahmed Visibility page by URL.","Saeed does the same.","Layla, not yet a Project Member, opens her Participant page."],"expected":"Hafiz and Saeed get the 404 for DCL Member Visibility; Saeed does see DCL Participant grant. Layla sees only the Trades and Locations DCL covers (with the Locations above, such as Tower 1 > Floor 02) and the Scopes under those Trades, and nothing else of the Project.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-843","id":"VIS-34","title":"Narrowing has limits and Handover tells only counts across Companies","part":"VIS","round":"0","who":"Layla (DCL Authorized Person); Saeed (Project Admin); Mohammed (DCL manager)","steps":["Layla gives Ahmed a Trade DCL does not have.","Mohammed holds an Electrical MAR at DCL review; Saeed narrows DCL off Electrical.","Saeed narrows DCL Locations from all to Tower 1 only, then widens DCL back to all."],"expected":"1) Rejected: a Member never covers more than the Participant. 2) Refused with only 1 Step of DCL needs a new holder first. Ask DCL to hand them over; never the Step, item or Member; nothing changes. 3) After narrowing, DCL engineers cover Tower 1 only; widening the Participant again does not widen them.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-846","id":"VIS-35","title":"Visibility Gap warnings show only what the viewer is entitled to","part":"VIS","round":"0","who":"Saeed (Project Admin); Layla (DCL Authorized Person)","steps":["DCL covers Mechanical but no DCL Member is granted it.","Saeed opens Settings > Visibility.","Layla opens her warnings."],"expected":"Saeed sees no gap and nothing of how DCL splits coverage; Layla is warned that no DCL Project Member covers Mechanical. Other Participants Members never count towards it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-849","id":"VIS-36","title":"A refused Submit gives one answer for every reason","part":"VIS","round":"0","who":"Ali (TMC PM)","steps":["Submit an Electrical MAR when (a) no Consultant covers Electrical, (b) two Consultants cover it, (c) the covering Consultant has nobody with the Position. Set each up in Settings > Visibility and Positions."],"expected":"Submit is not offered and taking it gives the same answer in all three cases: This cannot be handed over yet: the next step has nobody to take it. Ask a Project Admin. Nothing names a Consultant or says which case it is.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-854","id":"VIS-37","title":"Documents and photos follow the item's visibility","part":"VIS","round":"0","who":"Actors: Hafiz (TMC). Must NOT see: Yousef (Beta Build), Ahmed (DCL, before the Submit), a TMC Member off the Project","steps":["Hafiz attaches a datasheet and a geotagged photo to a Draft MAR.","Each other person requests the Documents list, a download URL and tries to upload or remove, by the item page and by the API.","Ali Submits.","Ahmed and Yousef again."],"expected":"Before the Submit Yousef, Ahmed and the off-Project Member get the 404 (same as a made-up id) naming nothing. After it Ahmed sees and downloads the Documents and photo with time and place, and TMC as the uploader Company, not the engineer; Yousef still gets 404 for the list and the URLs.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-855","id":"VIS-38","title":"After the Submit only the Step holder changes anything","part":"VIS","round":"0","who":"Ali (TMC PM); Hafiz; Ahmed","steps":["With the MAR at Consultant review, Hafiz and Ali try to save an answer, add a Document and edit a Link.","Ahmed tries to change an answer."],"expected":"All refused: after the Submit the Form is the raiser own and read-only to everyone but the raiser at a Step that lets it edit; the Consultant answers only in its reply Screen.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-858","id":"VIS-39","title":"Document Numbers and numbering counters do not reveal a rival volume","part":"VIS","round":"0","who":"Hafiz (TMC); Yousef (Beta Build); Ahmed (DCL); Saeed (Project Admin)","steps":["Hafiz and Yousef each raise and number three MARs.","Compare their numbers.","Saeed saves a pattern without the Participant Code.","Hafiz, Yousef and Ahmed open Settings > Numbering and the counter URLs."],"expected":"TMC numbers run 0001, 0002, 0003 with no gaps from Beta Build. The shared-counter pattern is refused until Saeed accepts the warning; then both share one count. Hafiz, Yousef and Ahmed see examples built from their own Participant with sequence 1 and a 404 for counters. Version history names the saver Company only to its own Members and the Project Admin; others read A Project Admin.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-861","id":"VIS-40","title":"A Code D replacement is invisible while it is a Draft","part":"VIS","round":"0","who":"Actors: Hafiz (TMC). Must NOT see: Mohammed (DCL), Faisal, UAT Owner PM","steps":["Mohammed rejects a MAR with Code D.","Hafiz creates the replacement and keeps it Draft.","The others read the rejected MAR Links, Linked from, History and search.","Hafiz sends and Ali Submits it."],"expected":"While it is a Draft nobody else reads anything of it and the rejected MAR Links and Linked from do not name it; it takes a new Document Number at its first send (no Rev). Once Submitted it appears in the rejected MAR Linked from by number and Subject and lists the rejected MAR under Links.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-865","id":"VIS-41","title":"The Handover list shows only the Authorized Person's own Company","part":"VIS","round":"0","who":"Saeed (TMC Authorized Person, not a Project Member in the seed); Omar (TMC); Layla (DCL Authorized Person); Hafiz, Mohammed","steps":["Hafiz holds two Tower 2 MARs at Contractor Engineer; Mohammed holds one at DCL review.","Saeed deactivates Hafiz and reads the Handover list.","Saeed picks Omar.","Saeed tries to deactivate Mohammed.","Layla deactivates Mohammed."],"expected":"Saeed lists only TMC Steps and Members. As he sees none of these items, each is listed as An item at \u003cStep> on \u003cProject>, with no Subject, Document Number or item id. Omar is the candidate; after the pick Omar sees and edits both. Deactivating Mohammed is 404 for Saeed, and no pick names another Company Step. For Layla the refusal (Mohammed is the only Manager) names only DCL own Step and the Project.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-868","id":"VIS-42","title":"Home sums only per-Project reads the Member already has","part":"VIS","round":"0","who":"Yousef (Beta Build); Hafiz, Ali (TMC); Mohammed (DCL); Faisal (Al Waha)","steps":["With TMC items in every state (Draft, internal review, Submitted to DCL and OR, Sent Back, Code A, Code C Rev 1) open Home as each.","Compare each figure with that Member List and the Projects page."],"expected":"Yousef: Need My Action 0, 4+ weeks 0, no row or activity of TMC (TMC only as Host Company on the card). Hafiz Draft never counts or lists. Waiting with others counts TMC own items others hold (not Drafts, closed or Sent Back); DCL and OR count 0. Each Project card count equals that Member List count.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-872","id":"VIS-43","title":"Export, Download and Duplicate respect the viewer","part":"VIS","round":"0","who":"Actors: Hafiz, Ali (TMC); Mohammed (DCL); Yousef (Beta Build); a signed-in stranger","steps":["With Drafts, a Submitted item picked up by Mohammed and a closed Code C item, Hafiz and Mohammed Export the List (also with a search).","Ali and Mohammed Download.","Mohammed tries Duplicate.","Yousef and the stranger try Download and Duplicate by id."],"expected":"Each export holds exactly that viewer rows and fields (Creation Date for TMC only; the owner is Mohammed to DCL and DCL by name to TMC); Download gives the same shared content to both; Duplicate is refused for Mohammed (one word for every reason) and 404 for Yousef and the stranger.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-875","id":"VIS-44","title":"Members page counts only the viewer own Company Projects","part":"VIS","round":"0","who":"Saeed (Authorized Person); Hafiz (plain Member); Layla","steps":["Saeed opens Members.","Hafiz opens it.","Layla opens hers."],"expected":"The Projects column counts each own Member active Projects (the same for Saeed and Hafiz, who read nothing but the count); never DCL people or Projects; DCL list holds DCL people only.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-878","id":"VIS-45","title":"The Approved Supplier List is Project-wide but hides its source","part":"VIS","round":"0","who":"Yousef (Beta Build); Ahmed (DCL); Layla (DCL Authorized Person); Saeed","steps":["After a SAR closes at A (SUB-20), Yousef and Ahmed read the list and raise a MAR choosing the supplier.","Look for the SAR, its Links, who added it, when.","Layla and Nasser try to add, withdraw or read Tower list."],"expected":"Every Project Member reads name, Trade, Scope and status (a withdrawn one as withdrawn); never the SAR, its person, its time or its source; Yousef MAR answer reads the supplier name; Layla and Nasser (not Project Admins or not on Tower) get 404 and nothing changes.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-881","id":"VIS-46","title":"Inspections shown inside Submittals reveal nothing extra","part":"VIS","round":"0","who":"Hafiz, Ahmed (see the WIR); Yousef (Beta Build, other Trade or Location)","steps":["Saeed turns Inside the Submittals tab on (PAR-11).","A Submitted TMC WIR exists.","Each reads the Submittals List, counts, type filter, search, Kanban, Need My Action, Projects page count and the WIR URL."],"expected":"Hafiz and Ahmed see the WIR in all of them; Yousef sees it in none and gets 404 by id. The setting widens where own rows show, never which rows.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-884","id":"VIS-47","title":"Required links and Approved submittals reveal only definitions","part":"VIS","round":"0","who":"Saeed (Project Admin); Hafiz; Ahmed; Nasser (JCV)","steps":["Saeed turns Approved submittals required on for Tower.","Nasser does the same on JCV.","Everyone reads Tower setting and tries to change it.","As Ahmed (Mechanical inspector) open a Tower WIR with a Link to an Electrical Code A MAR he cannot see."],"expected":"Every Tower Member reads which links are required, never JCV; nobody reads who set it or when; only Saeed changes it, others get 404. Ahmed (not covering the MAR Location) sees its Document Number and Subject only and cannot open it; the Project Admin gets its id.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-887","id":"VIS-48","title":"An annotated photo has exactly the readers of its original","part":"VIS","round":"0","who":"Hafiz (TMC); Ahmed (DCL); Yousef (Beta Build)","steps":["Hafiz annotates a photo on a MAR and Saves.","Ali Submits.","Ahmed lists and downloads both; Yousef requests the list, both URLs and an annotate call."],"expected":"TMC and DCL list and download both copies, the annotated linked to the original whose bytes are unchanged; Yousef gets 404 for everything, as for a made-up id; the file store refuses either file without a signed URL.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-890","id":"VIS-49","title":"A WIR Recommended Result or Code stays inside the Consultant","part":"VIS","round":"4","who":"Ahmed, Mohammed (DCL); Hafiz, Ali (TMC); Faisal; Yousef","steps":["Ahmed sends a WIR to Mohammed recommending Failed (later: Code C) with an Internal Note; Mohammed Returns it; Ahmed sends it again; Mohammed issues the Code.","TMC and OR read history, feed, events."],"expected":"DCL reads the Recommended Code and Internal Note; TMC and OR read none of it before or after the issued Code, only the Code and the Manager shared reply; Yousef reads nothing of the WIR.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-893","id":"VIS-50","title":"A Snag raised on one Contractor is invisible to the other","part":"VIS","round":"0","who":"Mohammed (DCL); Ali (TMC); Yousef (Beta Build, Tower 2 only after FX-C2)","steps":["Mohammed raises a Snag (Electrical, Tower 1, photos) and TMC moves it In Progress.","Yousef opens the Snag List, its counts, Kanban and filters (Company, Raised from, Comment Type), the Snag by id, history, Links and Documents."],"expected":"Yousef sees the Snag nowhere and the filters offer only his own Company; Raised from offers nothing; a Comment raised from a source Yousef cannot see is not named by number. By id everything is 404.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-905","id":"VIS-51","title":"Snag Steps are shared only as Transitions","part":"VIS","round":"0","who":"Hafiz (TMC); Mohammed (DCL)","steps":["TMC moves the Snag Start work and Resolve with a note.","Mohammed reads the history.","Mohammed holds Verify."],"expected":"Mohammed reads TMC Resolve and its note, never Start work, internal moves or who picked it up; TMC reads DCL Raise, never its Draft or who holds Verify.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-907","id":"VIS-52","title":"A Snag stays with the Contractor that holds it","part":"VIS","round":"0","who":"Ali (TMC); Yousef (Beta Build); Mohammed (DCL)","steps":["Mohammed raises a Snag on Tower 1.","Saeed widens Beta Build to cover Tower 1 too.","TMC resolves it; Mohammed Returns it to Open."],"expected":"Every move including the Return stays with TMC; Yousef never sees the Snag by id or in the Snag List; a new Raise on a Location both cover is refused.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-908","id":"VIS-53","title":"A Snag a Contractor raises on itself is invisible to the others","part":"VIS","round":"0","who":"Ali (TMC); Mohammed (DCL); Yousef","steps":["Ali raises a Snag on TMC itself and takes it to Closed.","Mohammed and Yousef look in the Snag List and by id at every Step."],"expected":"Neither sees it at any Step from Draft to Closed; not by id, history or Workflow map; no count changes.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-909","id":"VIS-54","title":"Raised-from counts include only items the viewer sees","part":"VIS","round":"0","who":"Ali (TMC PM); an Electrical-only TMC engineer; Yousef","steps":["Mohammed raises a Snag on Tower 1 and two Snags are linked raised from it, one Electrical and one Mechanical.","Each reads the source Snags line.","Mohammed raises a Snag at a Location only Yousef covers."],"expected":"The PM counts 2 open; the Electrical-only engineer sees the Mechanical Snag nowhere and counts 1; a discarded Draft is never counted; Yousef counts only Snags he sees.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-910","id":"VIS-55","title":"Checklist Templates are Project definitions; copies follow the WIR","part":"VIS","round":"0","who":"Saeed (Project Admin); Hafiz; Ahmed; Yousef; Nasser","steps":["Saeed creates and edits a Checklist Template; Nasser keeps one on JCV.","Everyone reads Tower templates and tries to change them.","Hafiz picks a Checklist Template on a WIR; Saeed edits it; Hafiz Submits."],"expected":"Every Tower Member reads Tower templates, nobody reads who wrote or retired them or when, and never JCV; only Saeed changes them; the WIR copy is read by TMC only until the Submit, then by DCL, still Version 1 items; Yousef reads no row.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-911","id":"VIS-56","title":"A Register Import is its Company's alone","part":"VIS","round":"0","who":"Hafiz, Ali (TMC); Yousef, Nasser (Beta Build); Ahmed, Mohammed (DCL); Faisal","steps":["Hafiz uploads and previews a register.","Ali tries to read the preview.","Hafiz confirms.","Everyone opens the Imports page and the import by id."],"expected":"Before confirm only Hafiz reads the preview. After it every TMC Member reads the import, its file name, mapping and rows; Beta Build, DCL and Al Waha see an empty Imports page and the 404 for the import and its confirm; none of its Drafts; no import time anywhere.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-912","id":"VIS-57","title":"The Activity Feed names other Companies only by name","part":"VIS","round":"0","who":"Yousef (Beta Build); Ahmed, Mohammed (DCL); Ali (TMC)","steps":["After a Submit, a Pick up, an internal Send to Manager, a Return and a Code, each person opens Project > Activity Feed and Dashboard Recent activity."],"expected":"Ali sees TMC people and DCL by name only; Ahmed sees DCL people and TMC by name only; nobody sees the other Company internal events, Internal Notes, Recommended Codes, answers_changed or Document uploads; Yousef sees only Beta Build items. No setup changes appear.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-913","id":"VIS-58","title":"Direct URLs and ids give the same 404 page, never a 403","part":"VIS","round":"0","who":"Nasser (JCV); Yousef; Hafiz","steps":["Nasser opens a Tower Project, Submittals list and item URL; then a made-up id for each.","Yousef opens a TMC item id and a TMC Comment id.","Compare status, page and wording.","Make the web app and API calls for the same."],"expected":"The pages are identical for existing-hidden and made-up (one heading, We can not find this page, a Projects button); the API answers byte-identical 404s; nothing says whether the item exists. IDs are random and cannot be guessed.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-914","id":"VIS-59","title":"Errors and refusals never name another item or Company","part":"VIS","round":"0","who":"Yousef (Beta Build); Hafiz","steps":["Yousef submits a link to a TMC id, picks a hidden Member id through the API, opens a Link page by a TMC Link id, and saves a Form with a hidden reference.","Read every error text and API body."],"expected":"All refusals are the plain, uniform answer; no title, number or Company of another item appears in an error, toast or log shown to the Member.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-915","id":"VIS-60","title":"Rabaed Default Workflows are readable by all and name no Company","part":"VIS","round":"0","who":"Hafiz; Nasser","steps":["Both open the list of Rabaed Default Workflows for a submittal Type."],"expected":"Both read the same eight Workflows with names and Versions and the one the Type runs marked; they name no Project, Company or item; a Project binding reaches that Project only.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-916","id":"VIS-61","title":"Derived values hide what the column hides","part":"VIS","round":"0","who":"Yousef; Ahmed; Ali","steps":["Filter, sort and page the List by Step Age and by Created date as Ahmed and Yousef while TMC has a long-lived Draft and aged items.","Inspect the item detail and exports."],"expected":"No filter, sort key, cursor or detail field reveals when TMC Draft was started or how long TMC worked on an item; Draft shows no Step Age to anyone.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-917","id":"VIS-62","title":"Files Module and Pins on shared Drawings","part":"VIS","round":"","who":"Mohammed; Yousef","steps":["Open Files; open a shared floor plan with Pins."],"expected":"Work Item folders only for visible items; Pins only of visible items. Not built yet.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-918","id":"VIS-63","title":"Removed Members, withdrawn Participants and closed Projects","part":"VIS","round":"","who":"Removed engineer; Layla; Any Member","steps":["Remove a signing engineer from the Project.","Withdraw DCL.","Close the Project."],"expected":"E2: the removed Member keeps the Project name and the records they signed; DCL Authorized Person sees only the records DCL Members signed; open items of a withdrawn Participant are Cancelled; a closed Project is read-only with E2 records available.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-919","id":"VIS-64","title":"Another Project is invisible both ways","part":"VIS","round":"0","who":"Hafiz (TMC); a Member of another seeded Project","steps":["As Hafiz note an item id of Riyadh Gate Tower.","Sign in as a Member who is not on that Project (or Hafiz on a Project he is not on): open Projects, Home, search, the item URL and the Project URL."],"expected":"Neither sees the other Project in Projects, Home counts, search or notifications; both URLs give the one not-found page (404, never 403). Carried over from RP-463 A-11 (RP-474).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-763","id":"WF-01","title":"Every Member reads the Project Workflows","part":"WF","round":"0","who":"Ali (TMC PM); Mohammed (DCL manager)","steps":["Project > Settings > Workflows.","Open the MAR Workflow and a published Version."],"expected":"The page lists which Workflow each Work Item Type runs, its Version and every published Version whole, with every Company's Steps and Returns. Neither can open the builder or see a draft.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-767","id":"WF-02","title":"View workflow on an item pins its Version","part":"WF","round":"0","who":"Ali (TMC PM)","steps":["Open a Submitted MAR; click Workflow: name, Version n.","Switch map and list.","Open the same item as Ahmed and move it between DCL Steps."],"expected":"The drawer shows the Version the item is pinned to. Ali's own Steps are shown one by one; Design Consultants is one part marked With Design Consultants LLC. Ahmed sending to Mohammed changes nothing Ali reads.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-770","id":"WF-03","title":"Duplicate a Rabaed Default into the Project","part":"WF","round":"0","who":"Saeed (TMC Authorized Person, Project Admin)","steps":["Settings > Workflows > duplicate the MAR Workflow as \"UAT MAR copy\".","Open it."],"expected":"A draft Version 1 of a new Project Workflow with no link to the original. Only Project Admins see it.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-773","id":"WF-04","title":"Builder: add a Step, connect, undo, auto-layout","part":"WF","round":"0","who":"Saeed (Project Admin)","steps":["Open the copy in the builder.","Drag a Step from the palette into a Stage band; connect two Steps by dragging from a dot.","Undo and redo (Ctrl+Z, Ctrl+Shift+Z).","Auto-layout; switch Curved and Orthogonal arrows.","Select a Transition: edit labels (EN and AR), kind, Screen."],"expected":"Edits autosave a moment later. The kind follows the publish checks (Submit across Participants, Return back within one). A connection onto empty canvas adds a New step. Auto-layout arranges Steps by route inside each Stage band; the arrow style is kept per viewer.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-777","id":"WF-05","title":"Validate reports problems and Publish needs a Change Note","part":"WF","round":"0","who":"Saeed (Project Admin)","steps":["In the copy, leave a Step with no way forward.","Validate.","Fix it, Publish with no Change Note, then with one."],"expected":"Validate counts the errors and selects the first; Publish lists what changed, the count of items that keep their Version and requires the Change Note. After publishing the builder stays open.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-779","id":"WF-06","title":"A new Version applies to new items only","part":"WF","round":"0","who":"Saeed; Hafiz; Ali","steps":["Bind the published copy to MAR (Settings > Workflows > Use for MAR).","Hafiz raises a new MAR.","Open an older MAR."],"expected":"The new MAR runs the new Version; the older item keeps its Version and shows a notice that a later Version exists. Binding another Workflow reaches only items created afterwards.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-781","id":"WF-07","title":"Versions history shows Change Notes and running counts","part":"WF","round":"0","who":"Saeed (Project Admin); Hafiz","steps":["Open the Workflow's Versions page.","Compare two Versions."],"expected":"Newest first with date and Change Note; the N running figure counts only items the reader sees; Compare marks added, removed and changed. Hafiz sees Versions but no Change Note.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-783","id":"WF-08","title":"Exception for one Participant must not name it","part":"WF","round":"0","who":"Saeed (Project Admin)","steps":["Copy MAR as \"Beta Build MARs\" and try to bind it as an exception for Beta Build.","Rename it \"MARs, short route\" and bind it for Beta Build."],"expected":"The first is refused because the name holds a Participant's name. The second binds; Yousef's new MARs run it, TMC's do not. Others learn of no Participant.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-786","id":"WF-09","title":"Build a Workflow with a Send Back (fixture FX-SB)","part":"WF","round":"0","who":"Saeed (Project Admin)","steps":["Copy the MAR Workflow.","Add a Send Back from Consultant Engineer to the Contractor Draft Step; on the Draft Step set After a Send Back to Comment only (and a second copy to Edit the Form).","Validate, Publish, bind."],"expected":"It validates and publishes. If publish refuses the Send Back, record a Bug: VIS-15 and VIS-16 need this Workflow.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-790","id":"WF-10","title":"Drafts visible to: the author only","part":"WF","round":"0","who":"Saeed (Project Admin); Hafiz; Omar; Ali","steps":["In a copy, set the Draft Step to Drafts visible to the author only; publish and bind.","Hafiz saves a Draft.","Omar and Ali open the List and the item URL."],"expected":"Omar and Ali see no Draft, no count, and the 404 page; Hafiz sees and edits it. After Send for Review TMC reads it as before.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-793","id":"WF-11","title":"Transition rules: Restrict, Validate and Effects","part":"WF","round":"0","who":"Saeed (Project Admin)","steps":["In a copy open a Transition > Add rule.","Add Restrict by Position, a Validate with a message in EN and AR, an Effect Offer Assign to.","Test run the Workflow."],"expected":"Rules show under Condition with AND between Restrict rules; Test run opens each pop-up in test mode and saves nothing; a Transition whose Restrict fails is not offered.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-794","id":"WF-12","title":"Return goes to the author, not the other engineer","part":"WF","round":"0","who":"Hafiz; Omar; Ali","steps":["Omar (Tower 2 only) and Hafiz both cover a Tower 2 item.","Hafiz sends a Tower 2 Draft for review.","Ali Returns it."],"expected":"It goes back to Hafiz, who sent it, not to Omar.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-796","id":"WF-13","title":"Stages and Outcomes pages","part":"WF","round":"0","who":"Saeed (Project Admin); Ali","steps":["Settings > Stages: rename a Stage, add one.","Settings > Outcomes.","As Ali open the same pages."],"expected":"Project Admin changes show in the Stage set, List and Kanban columns; Ali reads them and cannot change them. Another Project is unchanged.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-805","id":"WF-14","title":"Library: save, mark default, new Project copies it","part":"WF","round":"0","who":"Saeed (Authorized Person)","steps":["Library > Workflows: Save a Project Workflow to the Library.","Mark it default for MAR.","Create a new Project."],"expected":"The Library copy has no link to the original; the new Project starts with a copy as its MAR Workflow, bound. A plain Member sees the Library read-only.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-808","id":"WF-15","title":"Step Age dots count from the current Step","part":"WF","round":"0","who":"Ali; Mohammed","steps":["Precondition: ask the lane engineer to age two items (fixture AGE) by 1 and by 4 weeks.","Read the dots in the List, Kanban and item page for Ali and for Mohammed."],"expected":"Dots show 1 to 4+ weeks (4+ all red). For the holder's Company they count from the current Step; the other Company counts from when the item reached it. A Draft shows none. No due date appears.","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-810","id":"WF-16","title":"Cancel from the raiser's Steps, only until the first Submit","part":"WF","round":"0","who":"Hafiz (TMC engineer); Ali (TMC PM)","steps":["Hafiz: new MAR \"UAT Cancel\", Save Draft, Cancel; confirm.","Make a second MAR, Send for Review; Ali opens it and Cancels.","Make a third, Submit it to DCL; look for Cancel as Ali and Hafiz."],"expected":"Cancel is offered at the Draft, the Contractor Engineer and the Internal Review Steps and asks for confirmation; the item goes to the Cancelled Stage with no outcome. Once Submitted, Cancel is no longer offered. A Revision never offers Cancel. Carried over from RP-463 B-09 (RP-490).","url":"https://rabaed-uat-web.vercel.app/en"},{"key":"RP-812","id":"WF-17","title":"Assign to offers only your own Company's Members","part":"WF","round":"0","who":"Saeed (Project Admin); Hafiz; Ali","steps":["Saeed: in the Project's MAR Workflow (fixture FX-SB copy) add Assign to on Send for Review and on Submit; publish.","Hafiz: new MAR, Send for Review, open Assign to.","Ali: Submit, open Assign to."],"expected":"Hafiz is offered only TMC Members who may hold the Contractor PM Step; Ali only TMC Members (never a DCL engineer by name; the Consultant is one Participant). A pick it could not have offered is refused like a made-up one. Carried over from RP-463 B-06 (RP-487).","url":"https://rabaed-uat-web.vercel.app/en"}]};

        open: "افتح على بيئة الاختبار", comment: "ملاحظة", drop: "الصق لقطة شاشة هنا (Ctrl+V)، أو اسحب الصور، أو انقر لاختيار ملفات",
        remove: "إزالة", saved: "حُفظ", notSaved: "تعذّر الحفظ في هذا المتصفح: استخدم حفظ العمل (.json)", none: "لا توجد حالة اختبار تطابق التصفية.",
        exported: "نُزّل ملف Excel.", savedJson: "حُفظ العمل بصيغة .json.", loaded: "حُمّل العمل:", cases: "حالة",
        badJson: "هذا الملف ليس ملف عمل من هذه الورقة.",
        howto: "اختر حالة لكل حالة اختبار، واكتب ما رأيت، وأضف لقطات الشاشة (الصقها بـ Ctrl+V في الحالة التي تعمل عليها، أو اسحبها، أو اختر ملفات). يُحفظ كل شيء في هذا المتصفح أولًا بأول، فإغلاق التبويب لا يُضيّع شيئًا. عند الانتهاء اضغط تصدير إلى Excel وأرسل ملف .xlsx. للانتقال إلى جهاز آخر احفظ العمل (.json) هناك وحمّله هنا. بيانات تجريبية فقط: لا تكتب أسماء أو مستندات حقيقية." },
};
let lang = "en";
const t = (k) => T[lang][k] ?? T.en[k] ?? k;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const now = () => new Date().toLocaleString("en-GB", { hour12: false });
const cases = DATA.cases;
const byKey = new Map(cases.map((c) => [c.key, c]));

// ---- Storage: IndexedDB, as screenshots are large. One database per round. ----
const DB_NAME = "rabaed-uat-sheet:" + DATA.round;
let db;
const entries = new Map(); // key -> { status, comment, shots: [id], at }
const shots = new Map(); // id -> { id, key, name, type, w, h, blob, url }
function openDb() {
  return new Promise((ok, no) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { const d = req.result; d.createObjectStore("entries"); d.createObjectStore("shots", { keyPath: "id" }); d.createObjectStore("meta"); };
    req.onsuccess = () => ok(req.result);
    req.onerror = () => no(req.error);
  });
}
const tx = (store, mode, fn) => new Promise((ok, no) => {
  const x = db.transaction(store, mode); const s = x.objectStore(store); const r = fn(s);
  x.oncomplete = () => ok(r && "result" in r ? r.result : undefined); x.onerror = () => no(x.error);
});
const all = (store) => new Promise((ok, no) => {
  const out = []; const req = db.transaction(store).objectStore(store).openCursor();
  req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } else ok(out); };
  req.onerror = () => no(req.error);
});
const entry = (key) => entries.get(key) ?? { status: "", comment: "", shots: [], at: "" };

async function saveEntry(key, e) {
  e.at = now(); entries.set(key, e);
  const card = document.querySelector(`.case[data-key="${key}"] .saved`);
  try { if (!db) throw new Error("no db"); await tx("entries", "readwrite", (s) => s.put(e, key)); if (card) card.textContent = t("saved") + " " + e.at; }
  catch { if (card) card.textContent = t("notSaved"); }
  counts();
}

// ---- Images: PNG or JPEG kept as is; anything else is redrawn as PNG. ----
function dims(blob) {
  return new Promise((ok, no) => { const u = URL.createObjectURL(blob); const img = new Image(); img.onload = () => { ok({ w: img.naturalWidth, h: img.naturalHeight, img }); URL.revokeObjectURL(u); }; img.onerror = no; img.src = u; });
}
async function normalise(file) {
  const { w, h, img } = await dims(file);
  if (file.type === "image/png" || file.type === "image/jpeg") return { blob: file, type: file.type, w, h };
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/png"));
  return { blob, type: "image/png", w, h };
}
async function addShots(key, files) {
  const e = entry(key);
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const n = await normalise(f);
      const id = key + ":" + Date.now() + ":" + Math.random().toString(36).slice(2, 7);
      const name = f.name && f.name !== "image.png" ? f.name : `${byKey.get(key).id}-${e.shots.length + 1}.${n.type === "image/jpeg" ? "jpg" : "png"}`;
      const rec = { id, key, name, type: n.type, w: n.w, h: n.h, blob: n.blob };
      if (db) await tx("shots", "readwrite", (s) => s.put(rec));
      shots.set(id, { ...rec, url: URL.createObjectURL(n.blob) });
      e.shots = [...e.shots, id];
    } catch { /* not an image this browser can read */ }
  }
  await saveEntry(key, e);
  drawShots(key);
}
async function removeShot(key, id) {
  const e = entry(key); e.shots = e.shots.filter((x) => x !== id);
  const s = shots.get(id); if (s) URL.revokeObjectURL(s.url); shots.delete(id);
  if (db) await tx("shots", "readwrite", (st) => st.delete(id));
  await saveEntry(key, e); drawShots(key);
}

// ---- Page ----
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  $("lang").textContent = lang === "ar" ? "English" : "العربية";
  fillFilters(); render();
}
function fillFilters() {
  const opt = (sel, values, label) => {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${esc(t("all"))}</option>` + values.map((v) => `<option value="${esc(v)}">${esc(label ? label(v) : v)}</option>`).join("");
    sel.value = cur;
  };
  opt($("fPart"), [...new Set(cases.map((c) => c.part))].sort());
  opt($("fRound"), [...new Set(cases.map((c) => c.round).filter(Boolean))].sort());
  opt($("fStatus"), [...STATUSES, "unset"], (s) => t(s));
}
function visible() {
  const p = $("fPart").value, r = $("fRound").value, s = $("fStatus").value, q = $("fText").value.trim().toLowerCase();
  return cases.filter((c) => {
    const st = entry(c.key).status || "unset";
    return (!p || c.part === p) && (!r || c.round === r) && (!s || st === s) &&
      (!q || [c.key, c.id, c.title, c.who, c.expected, ...c.steps, entry(c.key).comment].join(" ").toLowerCase().includes(q));
  });
}
function counts() {
  const n = (s) => cases.filter((c) => (entry(c.key).status || "unset") === s).length;
  $("counts").innerHTML = [...STATUSES, "unset"].map((s) => `<span class="count"><b>${n(s)}</b>${esc(t(s))}</span>`).join("") +
    `<span class="count"><b>${cases.length}</b>${esc(t("all"))}</span>`;
}
function caseHtml(c) {
  const e = entry(c.key);
  return `<article class="case st-${e.status || "unset"}" data-key="${esc(c.key)}">
    <div class="body">
      <h3 dir="auto"><code>${esc(c.id)}</code> ${esc(c.title)}</h3>
      <div class="meta"><span><code>${esc(c.key)}</code></span><span>${esc(t("part"))} ${esc(c.part)}</span>${c.round ? `<span>${esc(t("round"))} ${esc(c.round)}</span>` : ""}
        <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(t("open"))}</a></div>
      ${c.who ? `<div><span class="lbl">${esc(t("who"))}</span> <span dir="auto">${esc(c.who)}</span></div>` : ""}
      ${c.steps.length ? `<div class="lbl">${esc(t("steps"))}</div><ol class="steps" dir="auto">${c.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
      ${c.expected ? `<div class="lbl">${esc(t("expected"))}</div><p class="exp" dir="auto">${esc(c.expected)}</p>` : ""}
    </div>
    <div class="rec">
      <div class="status" role="group">${STATUSES.map((s) => `<button type="button" class="${s}" data-s="${s}" aria-pressed="${e.status === s}">${esc(t(s))}</button>`).join("")}</div>
      <label>${esc(t("comment"))}<textarea data-f="comment" dir="auto">${esc(e.comment)}</textarea></label>
      <div class="drop" tabindex="0">${esc(t("drop"))}</div>
      <div class="shots"></div>
      <div class="saved">${e.at ? esc(t("saved") + " " + e.at) : ""}</div>
    </div>
  </article>`;
}
function drawShots(key) {
  const box = document.querySelector(`.case[data-key="${key}"] .shots`);
  if (!box) return;
  box.innerHTML = entry(key).shots.map((id) => shots.get(id)).filter(Boolean)
    .map((s) => `<span class="shot"><img src="${s.url}" alt="${esc(s.name)}" title="${esc(s.name)}" data-id="${esc(s.id)}"><button type="button" data-rm="${esc(s.id)}" aria-label="${esc(t("remove"))}">×</button></span>`).join("");
}
function render() {
  const list = visible();
  $("list").innerHTML = list.length ? list.map(caseHtml).join("") : `<div class="empty">${esc(t("none"))}</div>`;
  list.forEach((c) => drawShots(c.key));
  counts();
}

let activeKey = "";
const setActive = (key) => {
  if (activeKey === key) return;
  document.querySelector(".case.active")?.classList.remove("active");
  activeKey = key; document.querySelector(`.case[data-key="${key}"]`)?.classList.add("active");
};
$("list").addEventListener("focusin", (ev) => { const a = ev.target.closest(".case"); if (a) setActive(a.dataset.key); });
$("list").addEventListener("click", async (ev) => {
  const art = ev.target.closest(".case"); if (!art) return;
  const key = art.dataset.key; setActive(key);
  const sb = ev.target.closest("[data-s]");
  if (sb) {
    const e = entry(key); e.status = e.status === sb.dataset.s ? "" : sb.dataset.s;
    art.querySelectorAll("[data-s]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === e.status)));
    art.className = `case active st-${e.status || "unset"}`;
    await saveEntry(key, e); return;
  }
  const rm = ev.target.closest("[data-rm]"); if (rm) { await removeShot(key, rm.dataset.rm); return; }
  const im = ev.target.closest("img[data-id]");
  if (im) { const lb = $("lightbox"); lb.querySelector("img").src = im.src; lb.querySelector("p").textContent = im.title; lb.style.display = "flex"; return; }
  if (ev.target.closest(".drop")) { $("pick").dataset.key = key; $("pick").click(); }
});
$("pick").addEventListener("change", async () => { const key = $("pick").dataset.key; if (key) await addShots(key, [...$("pick").files]); $("pick").value = ""; });
let typing;
$("list").addEventListener("input", (ev) => {
  const art = ev.target.closest(".case"); if (!art || ev.target.dataset.f !== "comment") return;
  const key = art.dataset.key, e = entry(key); e.comment = ev.target.value; entries.set(key, e);
  clearTimeout(typing); typing = setTimeout(() => saveEntry(key, e), 400);
});
$("list").addEventListener("dragover", (ev) => { const d = ev.target.closest(".drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
$("list").addEventListener("dragleave", (ev) => ev.target.closest(".drop")?.classList.remove("over"));
$("list").addEventListener("drop", async (ev) => {
  const d = ev.target.closest(".drop"); if (!d) return;
  ev.preventDefault(); d.classList.remove("over");
  const key = d.closest(".case").dataset.key; setActive(key); await addShots(key, [...ev.dataTransfer.files]);
});
document.addEventListener("paste", async (ev) => {
  const files = [...(ev.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  const key = ev.target.closest?.(".case")?.dataset.key || activeKey;
  if (!key) return;
  ev.preventDefault(); await addShots(key, files);
});
$("lightbox").addEventListener("click", () => ($("lightbox").style.display = "none"));
["fPart", "fRound", "fStatus"].forEach((id) => $(id).addEventListener("change", render));
$("fText").addEventListener("input", render);
$("lang").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; try { localStorage.setItem("rabaed-uat-sheet-lang", lang); } catch {} applyLang(); });
$("tester").addEventListener("input", () => { if (db) tx("meta", "readwrite", (s) => s.put($("tester").value, "tester")).catch(() => {}); });

function flash(m) { $("msg").textContent = m; setTimeout(() => ($("msg").textContent = ""), 6000); }
function download(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const fileTag = () => { const n = $("tester").value.trim(); return n ? n.replace(/[^\p{L}\p{N}]+/gu, "-") + "-" : ""; };
const roundTag = DATA.round.replace(/[^\p{L}\p{N}]+/gu, "-");

// ---- Excel: Test Cases, Screenshots (pictures in their row), Summary ----
const EN = (s) => T.en[s || "unset"];
$("export").addEventListener("click", async () => {
  const tester = $("tester").value.trim(), when = now();
  const head = ["Key", "ID", "Part", "Round", "Title", "Sign in as", "Steps", "Expected result", "UAT link", "Status", "Comment", "Screenshots", "Tester", "Updated"];
  const table = [head, ...cases.map((c) => {
    const e = entry(c.key);
    const names = e.shots.map((id) => shots.get(id)?.name).filter(Boolean);
    return [c.key, c.id, c.part, c.round, c.title, c.who, c.steps.map((s, i) => `${i + 1}. ${s}`).join("\n"), c.expected, c.url,
      EN(e.status), e.comment, names.length ? `${names.length} on the Screenshots sheet: ${names.join(", ")}` : "", e.status || e.comment || names.length ? tester : "", e.at];
  })];
  const shotRows = [["Key", "ID", "File", "Screenshot"]], images = [], heights = {};
  for (const c of cases) for (const id of entry(c.key).shots) {
    const s = shots.get(id); if (!s) continue;
    const scale = Math.min(1, 480 / s.w, 360 / s.h), w = Math.round(s.w * scale), h = Math.round(s.h * scale);
    const row = shotRows.length;
    shotRows.push([c.key, c.id, s.name, ""]);
    images.push({ row, col: 3, data: new Uint8Array(await s.blob.arrayBuffer()), ext: s.type === "image/jpeg" ? "jpeg" : "png", width: w, height: h, offsetX: 4, offsetY: 4 });
    heights[row] = Math.ceil((h + 8) * 0.75);
  }
  const n = (st) => cases.filter((c) => (entry(c.key).status || "") === st).length;
  const summary = [["Item", "Value"], ["Round", DATA.round], ["Tester", tester], ["Exported", when], ["Sheet built", DATA.built], ["Test Cases", cases.length],
    ["Pass", n("pass")], ["Fail", n("fail")], ["Blocked", n("blocked")], ["Not run", n("notrun")], ["Not set", n("")], ["Screenshots", images.length]];
  const bytes = buildXlsx([
    { name: "Test Cases", table, widths: [9, 9, 6, 7, 40, 24, 60, 50, 28, 9, 50, 30, 14, 18] },
    { name: "Screenshots", table: shotRows, widths: [9, 9, 26, 70], rowHeights: heights, images },
    { name: "Summary", table: summary, widths: [16, 40] },
  ], fflate);
  download(`Rabaed-UAT-${roundTag}-${fileTag()}${stamp()}.xlsx`, new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  flash(t("exported"));
});

// ---- JSON: the work and its screenshots, to move between machines ----
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
$("saveJson").addEventListener("click", async () => {
  const out = { sheet: "rabaed-uat-sheet", round: DATA.round, tester: $("tester").value, at: new Date().toISOString(), entries: {}, shots: [] };
  for (const [k, e] of entries) if (e.status || e.comment || e.shots.length) out.entries[k] = e;
  for (const s of shots.values()) out.shots.push({ id: s.id, key: s.key, name: s.name, type: s.type, w: s.w, h: s.h, data: b64(new Uint8Array(await s.blob.arrayBuffer())) });
  download(`Rabaed-UAT-${roundTag}-${fileTag()}${stamp()}.json`, new Blob([JSON.stringify(out)], { type: "application/json" }));
  flash(t("savedJson"));
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0]; $("importFile").value = ""; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (data.sheet !== "rabaed-uat-sheet") throw new Error(); } catch { flash(t("badJson")); return; }
  for (const s of data.shots ?? []) {
    if (!byKey.has(s.key)) continue;
    const blob = new Blob([fromB64(s.data)], { type: s.type });
    const rec = { id: s.id, key: s.key, name: s.name, type: s.type, w: s.w, h: s.h, blob };
    if (db) await tx("shots", "readwrite", (st) => st.put(rec));
    shots.set(s.id, { ...rec, url: URL.createObjectURL(blob) });
  }
  let n = 0;
  for (const [k, e] of Object.entries(data.entries ?? {})) {
    if (!byKey.has(k)) continue;
    entries.set(k, e); n++;
    if (db) await tx("entries", "readwrite", (st) => st.put(e, k));
  }
  if (data.tester && !$("tester").value) $("tester").value = data.tester;
  render(); flash(`${t("loaded")} ${n} ${t("cases")}`);
});

// ---- Start ----
(async () => {
  $("built").textContent = DATA.built;
  try { lang = localStorage.getItem("rabaed-uat-sheet-lang") === "ar" ? "ar" : "en"; } catch {}
  try {
    db = await openDb();
    for (const [k, e] of await all("entries")) entries.set(k, e);
    for (const [, s] of await all("shots")) shots.set(s.id, { ...s, url: URL.createObjectURL(s.blob) });
    const tester = await tx("meta", "readonly", (s) => s.get("tester"));
    if (tester) $("tester").value = tester;
  } catch { db = undefined; flash(T.en.notSaved); }
  applyLang();
})();
</script>
</body>
</html>
