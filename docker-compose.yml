# Local development database, mail catcher and file store. Credentials here are local-only placeholders
# (see .env.example); real environments never use them.
# COMPOSE_PROJECT_NAME and POSTGRES_PORT come from .env, so each worktree gets its own
# container, volume and port (see "Several worktrees at once" in README.md).
name: ${COMPOSE_PROJECT_NAME:-rabaed}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the services send, so local runs never send real email
  # (packages/mailer). Read them at http://127.0.0.1:${MAILPIT_PORT}; the
  # mailer posts to the same port's API. No volume: the mail is throwaway.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The S3-compatible store Documents' files go to locally (apps/api file-store.ts),
  # so local runs and tests never call AWS; in AWS it is the Project files bucket.
  # The api creates the bucket on start. Keys are local-only placeholders (.env.example).
  files:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${FILE_STORE_ACCESS_KEY_ID:-rabaed-local}
      RUSTFS_SECRET_KEY: ${FILE_STORE_SECRET_ACCESS_KEY:-local-dev-only}
    ports:
      - "127.0.0.1:${FILE_STORE_PORT:-9000}:9000"
    volumes:
      - files-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  files-data:
