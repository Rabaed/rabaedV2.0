# Local development database. Credentials here are local-only placeholders
# (see .env.example); real environments never use them.
# COMPOSE_PROJECT_NAME and POSTGRES_PORT come from .env, so each worktree gets its own
# container, volume and port (see "Several worktrees at once" in README.md).
name: ${COMPOSE_PROJECT_NAME:-rabaed}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
