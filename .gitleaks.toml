# gitleaks: the default rules, plus one of our own. Run by secret-scan.yml.
[extend]
useDefault = true

# A font inlined into CSS, HTML or JS as a base64 data URL. Font files themselves
# are binary, which gitleaks skips: scripts/check-no-fonts.ts refuses those by path,
# and also font data embedded in a Claude Design export's manifest, which this rule
# misses (RP-962). Strip an export's fonts with `pnpm design:strip-fonts <in> <out>`.
# The licensed Thmanyah fonts come only from the private build assets bucket (RP-211).
[[rules]]
id = "inlined-font"
description = "Font inlined as base64; fonts are never committed (Thmanyah is licensed)"
regex = '''data:(?:font/|application/(?:font-|x-font-?))[a-z0-9.+-]*(?:;[a-z0-9=-]+)*;base64,[A-Za-z0-9+/]{16}'''
keywords = ["base64"]

# RP-157's seam-1 test once held a made-up verification link token as a literal
# (commit 0b8f5f4be); it was never a secret, and the test now builds it at run time.
# Only the default generic-api-key rule, and only in that one file.
[[allowlists]]
description = "RP-157: a made-up verification token in the verification test"
targetRules = ["generic-api-key"]
paths = ['''^apps/api/test/verification\.test\.ts$''']

# RP-1048's UAT case FRM-09 once held a made-up Screen key as a literal
# (`key: "uat_frm09_denied"`, commit f2bb3777d); it was never a secret, and the case
# now builds it at run time. Only the default generic-api-key rule, only that value.
[[allowlists]]
description = "RP-1048: a made-up Screen key in the UAT case FRM-09"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''uat_frm09_denied''']
paths = ['''^planning/uat/round-0/cases/FRM\.ts$''']

# RP-1100's secret-scan test once spelled out the curl shape it guards against
# (`curl -u someone@example.com:` before a fake token built at run time, commit
# 2e80acaf9); it was never a secret, and the test now builds the curl from parts.
# Only the default curl-auth-user rule, only that made-up address, only that file.
[[allowlists]]
description = "RP-1100: a made-up curl user in the secret-scan test"
targetRules = ["curl-auth-user"]
condition = "AND"
regexTarget = "line"
regexes = ['''someone@example\.com''']
paths = ['''^scripts/check-secrets\.test\.ts$''']
