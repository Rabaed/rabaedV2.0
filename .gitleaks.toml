# gitleaks: the default rules, plus one of our own. Run by secret-scan.yml.
[extend]
useDefault = true

# A font inlined into CSS, HTML or JS as a base64 data URL. Font files themselves
# are binary, which gitleaks skips: scripts/check-no-fonts.ts refuses those by path,
# and also font data embedded in a Claude Design export's manifest, which this rule
# misses (RP-962). Strip an export's fonts with `pnpm design:strip-fonts <in> <out>`.
# The licensed Thmanyah fonts come only from the private build assets bucket (RP-211).
[[rules]]
id = "inlined-font"
description = "Font inlined as base64; fonts are never committed (Thmanyah is licensed)"
regex = '''data:(?:font/|application/(?:font-|x-font-?))[a-z0-9.+-]*(?:;[a-z0-9=-]+)*;base64,[A-Za-z0-9+/]{16}'''
keywords = ["base64"]
