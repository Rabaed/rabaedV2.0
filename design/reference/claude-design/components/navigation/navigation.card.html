<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:#f6f7f9;padding:24px;font-family:var(--font-ui)}.rb-tabs::-webkit-scrollbar{display:none}
.f{background:#fff;border:1px solid #e7e9ed;border-radius:14px;overflow:hidden;margin-bottom:14px}
.cap{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9aa0ad;margin:0 0 8px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs } = window.RabaedDesignSystem_a8093d;
const EN=['Overview','Submittals','Packages','Daily Site Report','Snag List','Approved Suppliers','Files','Activity','Settings'];
const AR=['نظرة عامة','التقديمات','الحزم','تقرير الموقع اليومي','قائمة الملاحظات','الموردون المعتمدون','الملفات','النشاط','الإعدادات'];
const ICONS=['chart','document','clipboard','document','flag','clipboard','folder','document','settings'];
const mk=l=>l.map((label,i)=>({label,value:String(i),icon:ICONS[i]}));
function Bar({labels,dir}){const [v,setV]=React.useState('1');
 return <div dir={dir} style={{fontFamily:dir==='rtl'?'var(--font-arabic)':'var(--font-ui)'}}><div className="f"><Tabs items={mk(labels)} value={v} onChange={setV}/></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<>
 <p className="cap">English · LTR</p><Bar labels={EN} dir="ltr"/>
 <p className="cap">Arabic · RTL</p><Bar labels={AR} dir="rtl"/>
</>);
</script>
</body>
</html>
