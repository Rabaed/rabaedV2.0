<!-- @dsCard group="Components" viewport="960x860" name="Core — Buttons, Badges, Tags, Avatars" subtitle="Compact utility buttons (all states) · tonal badges & tags · EN + AR" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:#fff;padding:22px 24px;font-family:var(--font-ui);color:#1f2430}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9aa0ad;margin:0 0 10px}
.sect{margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cols>div[dir=rtl]{font-family:var(--font-arabic)}
table{border-collapse:collapse}th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#9aa0ad;text-align:start;padding:0 6px 6px}
td{padding:4px 5px;white-space:nowrap}td.rl{font-size:12px;font-weight:600;color:#6a6e7a;padding-inline-end:10px}
table{width:100%;table-layout:auto}
.lang{font-size:12px;font-weight:600;color:#3a3f4b;margin-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Tag, Avatar, Icon } = window.RabaedDesignSystem_a8093d;
const HOV={primary:'#e84c2e',secondary:'#e4e6ea',tertiary:'#eff0f2',danger:'#d63b40'};
const PRS={primary:'#d1492f',secondary:'#d8dbe0',tertiary:'#e4e6ea',danger:'#bf3136'};
const T={en:{st:['Default','Hover','Pressed','Focus','Loading','Disabled'],v:{primary:'Submit',secondary:'Save draft',tertiary:'Cancel',danger:'Reject'},add:'Add Submittal',exp:'Export'},
 ar:{st:['افتراضي','تمرير','ضغط','تركيز','تحميل','معطّل'],v:{primary:'إرسال',secondary:'حفظ كمسودة',tertiary:'إلغاء',danger:'رفض'},add:'إضافة تقديم',exp:'تصدير'}};
function Matrix({lang}){const t=T[lang];
 return <table><thead><tr><th></th>{t.st.map(s=><th key={s}>{s}</th>)}</tr></thead><tbody>
 {['primary','secondary','tertiary','danger'].map(v=><tr key={v}><td className="rl">{v}</td>
  <td><Button variant={v}>{t.v[v]}</Button></td>
  <td><Button variant={v} style={{background:HOV[v]}}>{t.v[v]}</Button></td>
  <td><Button variant={v} style={{background:PRS[v],transform:'scale(.98)'}}>{t.v[v]}</Button></td>
  <td><Button variant={v} style={{boxShadow:'0 0 0 2px #fff, 0 0 0 4px #3b6fd8'}}>{t.v[v]}</Button></td>
  <td><Button variant={v} loading>{t.v[v]}</Button></td>
  <td><Button variant={v} disabled>{t.v[v]}</Button></td>
 </tr>)}</tbody></table>}
function Extras({lang}){const t=T[lang];return <div className="row" style={{marginTop:10}}>
 <Button size="sm">S</Button><Button>M</Button><Button size="lg">L</Button>
 <Button iconLeft={<Icon name="add" size={16}/>}>{t.add}</Button>
 <Button variant="secondary" iconLeft={<Icon name="download" size={16}/>}>{t.exp}</Button>
 <IconButton icon="add" variant="primary" label="Add"/><IconButton icon="filter" variant="secondary" label="Filter"/><IconButton icon="more-vertical" label="More"/><IconButton icon="trash" variant="danger" label="Delete"/>
</div>}
const ST=[['neutral','Draft','مسودة'],['info','Internal Review','مراجعة داخلية'],['warning','Revised & Resubmitted','معاد تقديمها'],['pending','Pending Approval','بانتظار الاعتماد'],['success','Approved','معتمدة'],['danger','Rejected','مرفوضة'],['neutral','Cancelled','ملغاة']];
function Chips({lang}){const ar=lang==='ar';return <>
 <div className="row" style={{marginBottom:8}}>{ST.map(([tn,e,a],i)=><Badge key={i} tone={tn} dot>{ar?a:e}</Badge>)}</div>
 <div className="row" style={{marginBottom:8}}>
  <Badge tone="success" variant="solid"><Icon name="check" size={14}/>Code A</Badge>
  <Badge tone="success"><Icon name="check" size={14}/>Code B</Badge>
  <Badge tone="warning"><Icon name="refresh" size={14}/>Code C</Badge>
  <Badge tone="danger" variant="solid"><Icon name="circle-x" size={14}/>Code D</Badge>
  <Badge tone="brand">R2</Badge>
 </div>
 <div className="row" style={{marginBottom:8}}>{['CV','AR','EL','ME','SU'].map(c=><Tag key={c} code={c} lang={lang}/>)}</div>
 <div className="row">{['MAR','SAR','DAR','DAS','NPD'].map(c=><Tag key={c} code={c}/>)}
  <span style={{width:12}}/>
  <Avatar name="Mohamed Alhalees" size={28}/><Avatar name="Hala Abdullah" size={28}/><Avatar name="Naif Al Harithi" size={28} status="online"/>
 </div>
</>}
function Demo(){return <div>
 <div className="sect"><p className="lbl">Buttons · Compact utility · all states</p>
  <div className="lang">English · LTR</div><Matrix lang="en"/><Extras lang="en"/>
  <div className="lang" style={{marginTop:16}}>عربي · RTL</div><div dir="rtl" style={{fontFamily:'var(--font-arabic)'}}><Matrix lang="ar"/><Extras lang="ar"/></div>
 </div>
 <div className="sect"><p className="lbl">Badges · codes · disciplines · document types · Tonal tints</p>
  <div className="cols"><div><div className="lang">English · LTR</div><Chips lang="en"/></div><div dir="rtl"><div className="lang">عربي · RTL</div><Chips lang="ar"/></div></div>
 </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
