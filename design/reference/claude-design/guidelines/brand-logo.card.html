<!-- @dsCard group="Brand" viewport="700x230" name="Logo" subtitle="Bilingual lockup + mark · on light and espresso" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 0; font-family: var(--font-ui); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; height: 230px; }
  .cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .light { background: var(--surface-page); }
  .dark { background: var(--espresso); }
  .lockup { display:flex; align-items:center; gap:24px; }
  .tag { position:absolute; top:12px; font-size: var(--fs-notes); font-weight:600; letter-spacing: var(--ls-wide); text-transform:uppercase; }
  .cell { position: relative; }
</style></head>
<body>
<div class="grid">
  <div class="cell light">
    <span class="tag" style="color:var(--text-muted)">On light</span>
    <img src="../assets/brand/rabaed-logo-full.svg" height="56" alt="Rabaed logo">
    <img src="../assets/brand/rabaed-mark.svg" height="44" alt="Rabaed mark">
  </div>
  <div class="cell dark">
    <span class="tag" style="color:rgba(255,255,255,.55)">On espresso</span>
    <img src="../assets/brand/rabaed-logo-full.svg" height="56" alt="Rabaed logo">
    <img src="../assets/brand/rabaed-mark.svg" height="44" alt="Rabaed mark">
  </div>
</div>
</body></html>
