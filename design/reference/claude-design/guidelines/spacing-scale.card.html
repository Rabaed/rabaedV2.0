<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid · 2 → 64" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px; font-family: var(--font-ui); display:flex; flex-direction:column; gap:10px; }
  .r { display:flex; align-items:center; gap:14px; }
  .bar { background: var(--tomato-300); height: 14px; border-radius: 3px; }
  .n { width: 120px; font-size: var(--fs-caption); color: var(--text-muted); }
  .n b { color: var(--text-heading); font-weight: var(--fw-semibold); }
</style></head>
<body>
  <div class="r"><span class="n"><b>space-2</b> · 4px</span><span class="bar" style="width:4px"></span></div>
  <div class="r"><span class="n"><b>space-4</b> · 8px</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="n"><b>space-6</b> · 12px</span><span class="bar" style="width:12px"></span></div>
  <div class="r"><span class="n"><b>space-8</b> · 16px</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="n"><b>space-12</b> · 24px</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="n"><b>space-16</b> · 32px</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="n"><b>space-24</b> · 48px</span><span class="bar" style="width:48px"></span></div>
  <div class="r"><span class="n"><b>space-32</b> · 64px</span><span class="bar" style="width:64px"></span></div>
</body></html>
