<!-- @dsCard group="Colors" viewport="700x180" name="Accent · Warm · Neutrals" subtitle="Naples Yellow + Orange ramps and the gray scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; font-family: var(--font-ui); display:flex; flex-direction:column; gap:16px; }
  .grp { display:flex; flex-direction:column; gap:8px; }
  .lbl { font-size: var(--fs-notes); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wide); text-transform: uppercase; color: var(--text-muted); }
  .ramp { display: flex; gap: 6px; }
  .b { flex:1; height: 40px; border-radius: var(--radius-xs); }
</style></head>
<body>
<div class="grp"><span class="lbl">Naples Yellow</span><div class="ramp">
  <div class="b" style="background:var(--naples-100)"></div>
  <div class="b" style="background:var(--naples-300)"></div>
  <div class="b" style="background:var(--naples-500)"></div>
  <div class="b" style="background:var(--naples-700)"></div>
  <div class="b" style="background:var(--naples-800)"></div>
</div></div>
<div class="grp"><span class="lbl">Orange (logo gradient partner)</span><div class="ramp">
  <div class="b" style="background:var(--orange-100)"></div>
  <div class="b" style="background:var(--orange-200)"></div>
  <div class="b" style="background:var(--orange-300)"></div>
  <div class="b" style="background:var(--orange-500)"></div>
  <div class="b" style="background:var(--orange-600)"></div>
</div></div>
<div class="grp"><span class="lbl">Neutral grays</span><div class="ramp">
  <div class="b" style="background:var(--gray-50);border:1px solid var(--border-subtle)"></div>
  <div class="b" style="background:var(--gray-100)"></div>
  <div class="b" style="background:var(--gray-200)"></div>
  <div class="b" style="background:var(--gray-300)"></div>
  <div class="b" style="background:var(--gray-400)"></div>
  <div class="b" style="background:var(--gray-500)"></div>
  <div class="b" style="background:var(--gray-600)"></div>
  <div class="b" style="background:var(--gray-700)"></div>
  <div class="b" style="background:var(--gray-800)"></div>
  <div class="b" style="background:var(--gray-900)"></div>
</div></div>
</body></html>
