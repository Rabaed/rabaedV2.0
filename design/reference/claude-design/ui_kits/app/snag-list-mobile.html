<!-- @dsCard group="App" viewport="1000x900" name="Snag List (mobile)" subtitle="Photo-first cards · swipe Resolve/Hold · filter sheet · camera → pin → title → assign · detail" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabaed — Snag List · Mobile</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="list/list.css">
<link rel="stylesheet" href="plan/plan.css">
<link rel="stylesheet" href="plan/mobile.css">
<link rel="stylesheet" href="snag/snag.css">
<style>
.scr{background:var(--ui-canvas)}.sm-root{position:absolute;inset:0;padding-top:54px;display:flex;flex-direction:column}
.sm-hd{display:flex;align-items:center;gap:10px;padding:6px 12px 8px;background:var(--ui-surface);border-bottom:1px solid var(--ui-border-2)}
.sm-hd>div{flex:1;min-width:0}.sm-hd b{display:block;font-size:17px}.sm-hd small{font-size:12px;color:var(--ui-muted)}
.sm-hd .m-btn{background:var(--ui-surface-2)}
.sm-hint{display:flex;align-items:center;gap:6px;padding:0 16px 8px;font-size:12px;color:var(--ui-muted)}
.sm-list{flex:1;overflow:auto;padding:0 12px 120px;display:flex;flex-direction:column;gap:10px}
.sm-sw{position:relative;border-radius:16px;overflow:hidden;flex:none}
.sm-acts{position:absolute;inset:0;display:flex;justify-content:flex-end}.sm-acts button{width:75px;border:0;color:#fff;font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.sm-acts .ti{font-size:22px}
.sm-card{position:relative;display:flex;gap:12px;padding:10px;background:var(--ui-surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--ui-border);transition:transform .2s;touch-action:pan-y;cursor:pointer}
.sm-card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.sm-card .r1{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ui-muted);font-weight:700}
.sm-card b{font-size:15px;line-height:1.3}.sm-card .r2{display:flex;align-items:center;gap:8px}.sm-card small{font-size:12px;color:var(--ui-muted)}
.sm-ph{width:86px;flex:none;border-radius:12px;background:repeating-linear-gradient(135deg,var(--ui-press) 0 8px,var(--ui-surface-2) 8px 16px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ui-faint);font-size:20px}
.sm-det .sm-ph,.sm-det>.sm-ph{width:100%}.sm-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sm-ph span{position:absolute;bottom:4px;inset-inline-end:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:0 5px;font:700 11px var(--font-ui)}
.sm-det{flex:1;overflow:auto;padding:14px 16px 110px;display:flex;flex-direction:column;gap:12px}.sm-det h2{margin:0;font-size:20px;line-height:1.3}.sm-det p{margin:0;font-size:14px;line-height:1.55;color:var(--ui-text-2)}.sm-det .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sm-scrim{position:absolute;inset:0;background:var(--ui-overlay);z-index:21}
.sm-steps{display:flex;gap:4px;margin-top:4px}.sm-steps i{width:22px;height:4px;border-radius:2px;background:var(--ui-border)}.sm-steps i.on{background:var(--btn-pri)}
.sm-draft{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--tone-green-fg);white-space:nowrap}
.sm-plan{position:relative;aspect-ratio:3/2;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--ui-border);background:#fff;cursor:crosshair}.sm-plan .dwg{position:absolute;inset:0;width:100%;height:100%}
.sm-plan .mp{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--btn-pri);box-shadow:0 0 0 3px #fff,0 0 0 8px rgba(249,87,56,.3)}
.m-type.on{background:var(--tone-tomato-tint)}
</style>
</head>
<body>
<div class="mwrap"><div class="phone"><div class="scr" id="scr"></div></div><div class="demo" id="demo"></div></div>
<script src="shell/shell.js"></script>
<script src="plan/data.js"></script>
<script src="snag/data.js"></script>
<script src="snag/snag.js"></script>
<script src="snag/mobile.js"></script>
<script>SM.all()</script>
</body>
</html>
