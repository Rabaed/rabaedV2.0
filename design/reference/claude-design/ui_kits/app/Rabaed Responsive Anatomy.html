  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.thmanyah.com; see assets/fonts/thmanyah/LICENSE.pdf). */\n@font-face{font-family:\"Thmanyah Sans\";src:url(\"2336c171-7da7-472f-b016-637e34d5953c\") format(\"woff2\");font-weight:300;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Sans\";src:url(\"6f5dd029-c69d-41be-bc4d-1abbeafe99ef\") format(\"woff2\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Sans\";src:url(\"9bb59d12-20f2-44a7-b12b-d57478ab530b\") format(\"woff2\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Sans\";src:url(\"6908b438-dcfc-4617-8f2e-e8c9774d1efd\") format(\"woff2\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Sans\";src:url(\"a16de197-8684-485f-9cb0-331f182a2561\") format(\"woff2\");font-weight:900;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Display\";src:url(\"349535e3-a70b-404f-a8db-cfc8e228bef8\") format(\"woff2\");font-weight:300;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Display\";src:url(\"ccad992d-5d6c-471c-8195-5333aa8a6c05\") format(\"woff2\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Display\";src:url(\"605b1bd4-4568-49f3-bd58-67c336e81de6\") format(\"woff2\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Display\";src:url(\"d6955b6f-6012-4ebd-ba41-835320a07815\") format(\"woff2\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Display\";src:url(\"a0f871b0-7c81-47b5-be4f-07254aaa97a9\") format(\"woff2\");font-weight:900;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Text\";src:url(\"63c9370e-396b-45c9-aa75-5fa372883fd3\") format(\"woff2\");font-weight:300;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Text\";src:url(\"1320c599-50d3-4f4a-a044-670d4de2531f\") format(\"woff2\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Text\";src:url(\"146f08e4-0bfc-40f2-9e69-c281a1989caa\") format(\"woff2\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Text\";src:url(\"40d8e626-26d2-468b-b0b3-15219b58daab\") format(\"woff2\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Thmanyah Serif Text\";src:url(\"984e82a5-5c5a-46cd-944f-01dcce4f3fa4\") format(\"woff2\");font-weight:900;font-style:normal;font-display:swap}\n\n\n/* ============================================================\n   Rabaed — Color tokens\n   Primary  : Tomato  (#F95738)   — dominant brand colour\n   Secondary: Delft Blue (#3D405B) — complements / ink\n   Accent   : Naples Yellow (#F4D35E)\n   Warm     : Orange  (#EE964B)   — gradient partner to Tomato\n   Values lifted from the Rabaed Figma variable collection.\n   ============================================================ */\n\n:root {\n  /* ---- Base neutrals ---- */\n  --white: #ffffff;\n  --black: #121212;\n\n  /* ---- Primary · Tomato ---- */\n  --tomato-50:  #fff4f1;\n  --tomato-100: #feddd7;\n  --tomato-200: #fdc3b7;\n  --tomato-300: #fca898;\n  --tomato-400: #fb8d78;\n  --tomato-500: #fa7258;\n  --tomato-600: #f95738; /* ◀ brand primary */\n  --tomato-700: #d1492f;\n  --tomato-800: #a93b26;\n  --tomato-900: #7e2c1d;\n\n  /* ---- Secondary · Delft Blue ---- */\n  --delft-50:  #eff0f3;\n  --delft-100: #dcdee4;\n  --delft-200: #a8abbe;\n  --delft-300: #80849d;\n  --delft-400: #696f8c;\n  --delft-500: #525677;\n  --delft-600: #3d405b; /* ◀ secondary base */\n  --delft-700: #33364c;\n  --delft-800: #2a2d40;\n  --delft-900: #20212f;\n\n  /* ---- Accent · Naples Yellow ---- */\n  --naples-100: #fdf6df;\n  --naples-300: #f8e192;\n  --naples-500: #f4d35e; /* ◀ accent base */\n  --naples-700: #cdb14f;\n  --naples-800: #a68f40;\n\n  /* ---- Warm · Orange (logo gradient partner) ---- */\n  --orange-100: #fceadb;\n  --orange-200: #f9d9be;\n  --orange-300: #f6c8a1;\n  --orange-500: #f1a768;\n  --orange-600: #ee964b;\n\n  /* ---- Neutral grays ---- */\n  --gray-50:  #f7f7f7;\n  --gray-100: #f2f2f2;\n  --gray-200: #e8e8e8;\n  --gray-300: #dddddd; /* default border / divider */\n  --gray-400: #d2d2d2;\n  --gray-500: #c8c8c8;\n  --gray-600: #9f9f9f;\n  --gray-700: #818181;\n  --gray-800: #626262;\n  --gray-900: #1e1e1e;\n\n  /* ---- Espresso (marketing \"enterprise\" section) ---- */\n  --espresso: #2a1610;\n  --espresso-deep: #1f150f;\n\n  /* ---- Semantic · status ---- */\n  /* Success — a clean, fresh green. Lighter variant (#27b86e, hue ~146°,\n     airy & bright) chosen over the deeper #15a35c after side-by-side. */\n  --success-50:  #eefbf3;\n  --success-100: #dff6e7;\n  --success-200: #bfeccf;  /* tint border (approved card edge) */\n  --success-400: #54cd8a;\n  --success-500: #2fc079;\n  --success-600: #27b86e;  /* ◀ lighter fresh green base — pills, checks, dots */\n  --success-700: #1a9a57;  /* text on light */\n  --success-800: #15803f;\n\n  --danger-100: #f7d4d8;\n  --danger-500: #dd495c;\n  --danger-600: #d81212; /* NCR / reject red */\n\n  --info-500: #0085ff;   /* active / link blue */\n  --blue-action:      #2f6fe0;  /* process blue — \"Pending Approval\" */\n  --blue-action-tint: #e9f0fc;\n\n  --warning-500: #ee964b;\n\n  /* ---- Tonal hue set (chips · status · codes) ----\n     One harmonised set: every hue has a tint (bg), fg (text on tint) and\n     solid (dots, solid pills). Same lightness/chroma across hues. */\n  --tone-green-tint:#e6f7ee;  --tone-green-fg:#16874f;  --tone-green-solid:#27b86e;\n  --tone-amber-tint:#fdf3dc;  --tone-amber-fg:#9a6206;  --tone-amber-solid:#e9a23b;\n  --tone-red-tint:#fdebea;    --tone-red-fg:#c8322b;    --tone-red-solid:#e5484d;\n  --tone-blue-tint:#e8f0fd;   --tone-blue-fg:#2f62c9;   --tone-blue-solid:#3b6fd8;\n  --tone-violet-tint:#f0ecfe; --tone-violet-fg:#6547d6; --tone-violet-solid:#7a5af0;\n  --tone-cyan-tint:#e2f5f8;   --tone-cyan-fg:#0f7688;   --tone-cyan-solid:#1aa3b8;\n  --tone-orange-tint:#fdeee2; --tone-orange-fg:#b8560f; --tone-orange-solid:#ee964b;\n  --tone-gray-tint:#eff0f2;   --tone-gray-fg:#555a66;   --tone-gray-solid:#6a6e7a;\n  --tone-tomato-tint:#fff1ec; --tone-tomato-fg:#c9432a; --tone-tomato-solid:#f95738;\n\n  /* ---- Discipline chips (5 distinct hues) ---- */\n  --chip-cv-bg:var(--tone-amber-tint);  --chip-cv-fg:var(--tone-amber-fg);   /* CV Civil */\n  --chip-ar-bg:var(--tone-violet-tint); --chip-ar-fg:var(--tone-violet-fg);  /* AR Architecture */\n  --chip-el-bg:var(--tone-cyan-tint);   --chip-el-fg:var(--tone-cyan-fg);    /* EL Electrical */\n  --chip-me-bg:var(--tone-green-tint);  --chip-me-fg:var(--tone-green-fg);   /* ME Mechanical */\n  --chip-su-bg:var(--tone-orange-tint); --chip-su-fg:var(--tone-orange-fg);  /* SU Surveying */\n  --chip-das-bg:var(--chip-me-bg);      --chip-das-fg:var(--chip-me-fg);     /* legacy alias */\n  /* ---- Document types — neutral outline lozenge (never coloured) ---- */\n  --doctype-fg:#555a66; --doctype-ring:#d5d8de;\n  --chip-mar-bg:transparent; --chip-mar-fg:var(--doctype-fg);\n  --chip-sar-bg:transparent; --chip-sar-fg:var(--doctype-fg);\n  --chip-npd-bg:transparent; --chip-npd-fg:var(--doctype-fg);\n\n  /* ---- Submittal workflow status (tint bg / fg / dot) ---- */\n  --status-draft-bg:var(--tone-gray-tint);        --status-draft-fg:var(--tone-gray-fg);        --status-draft-dot:#9aa0ad;\n  --status-internal-bg:var(--tone-blue-tint);     --status-internal-fg:var(--tone-blue-fg);     --status-internal-dot:var(--tone-blue-solid);\n  --status-resubmitted-bg:var(--tone-amber-tint); --status-resubmitted-fg:var(--tone-amber-fg); --status-resubmitted-dot:var(--tone-amber-solid);\n  --status-pending-bg:var(--tone-violet-tint);    --status-pending-fg:var(--tone-violet-fg);    --status-pending-dot:var(--tone-violet-solid);\n  --status-approved-bg:var(--tone-green-tint);    --status-approved-fg:var(--tone-green-fg);    --status-approved-dot:var(--tone-green-solid);\n  --status-rejected-bg:var(--tone-red-tint);      --status-rejected-fg:var(--tone-red-fg);      --status-rejected-dot:var(--tone-red-solid);\n  --status-cancelled-bg:var(--tone-gray-tint);    --status-cancelled-fg:var(--tone-gray-fg);    --status-cancelled-dot:var(--tone-gray-solid);\n  /* legacy aliases */\n  --status-submitted-bg:var(--status-resubmitted-bg); --status-submitted-fg:var(--status-resubmitted-fg);\n  --status-created-bg:var(--status-internal-bg);      --status-created-fg:var(--status-internal-fg);\n  --status-notstarted-bg:var(--status-draft-bg);      --status-notstarted-fg:var(--status-draft-fg);\n\n  /* ---- Approval codes + revision ---- */\n  --code-a-bg:var(--tone-green-solid); --code-a-fg:#ffffff;              /* Approved — solid */\n  --code-b-bg:var(--tone-green-tint);  --code-b-fg:var(--tone-green-fg); /* Approved as noted */\n  --code-c-bg:var(--tone-amber-tint);  --code-c-fg:var(--tone-amber-fg); /* Revise & resubmit */\n  --code-d-bg:var(--tone-red-solid);   --code-d-fg:#ffffff;              /* Rejected — solid */\n  --code-a-ring:transparent; --code-b-ring:transparent; --code-c-ring:transparent; --code-d-ring:transparent;\n  --rev-pill-bg:var(--tone-tomato-tint); --rev-pill-fg:var(--tone-tomato-fg); /* R1, R2… */\n  --code-pill-bg:var(--code-a-bg);  --code-pill-fg:var(--code-a-fg);\n\n  /* ---- Chip geometry (shared by status, discipline, code) ---- */\n  --chip-h:24px; --chip-r:7px; --chip-px:9px; --chip-fs:12px;\n  --lozenge-h:20px; --lozenge-r:4px;\n\n  /* ============================================================\n     Semantic aliases — reference these in components, not raw ramps\n     ============================================================ */\n  --color-primary:        var(--tomato-600);\n  --color-primary-hover:  var(--tomato-700);\n  --color-primary-soft:   var(--tomato-100);\n  --color-primary-tint:   var(--tomato-50);\n  --color-secondary:      var(--delft-600);\n  --color-accent:         var(--naples-500);\n\n  --text-heading:  #292d32;          /* near-black ink for titles */\n  --text-body:     var(--delft-600); /* default body copy */\n  --text-muted:    var(--delft-300); /* secondary / captions */\n  --text-faint:    var(--gray-700);  /* placeholders / meta */\n  --text-on-primary: var(--white);\n  --text-link:     var(--tomato-600);\n\n  --surface-page:   #fdf9f5;         /* warm off-white app canvas */\n  --surface-card:   var(--white);\n  --surface-subtle: var(--gray-50);\n  --surface-sunken: var(--gray-100);\n  --surface-board:  #f6f7f9;         /* board / workspace canvas behind white columns */\n  --surface-brand-tint: var(--tomato-50);\n\n  --border-default: var(--gray-300);\n  --border-strong:  var(--gray-400);\n  --border-subtle:  var(--gray-200);\n  --border-focus:   var(--tomato-600);\n\n  --icon-default: #292d32;\n  --icon-muted:   var(--delft-300);\n}\n\n/* ============================================================\n   Rabaed — Typography tokens\n   Display / brand : Montserrat        (Montserrat-Arabic in source)\n   UI / product    : IBM Plex Sans     (IBM Plex Sans Arabic)\n   Marker / accent : Caveat            (substitute — see readme)\n   Scale taken from the Figma type sheet (H1 48/52 … notes 11).\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Montserrat', 'Montserrat Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-ui:      'IBM Plex Sans', 'Thmanyah Sans', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-marker:  'Caveat', 'Montserrat', cursive;\n  /* Arabic: Thmanyah Sans for UI, Thmanyah Serif Display for headlines */\n  --font-arabic:  'Thmanyah Sans', 'IBM Plex Sans Arabic', sans-serif;\n  --font-arabic-display: 'Thmanyah Serif Display', 'Thmanyah Sans', serif;\n  --font-arabic-serif: 'Thmanyah Serif Text', 'Thmanyah Sans', serif;\n\n  /* ---- Weights ---- */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extrabold:800; /* @kind font */\n\n  /* ---- Font sizes (px) ---- */\n  --fs-display: 64px;  /* hero / marketing */\n  --fs-h1: 48px;\n  --fs-h2: 40px;\n  --fs-h3: 32px;\n  --fs-h4: 24px;\n  --fs-h5: 20px;\n  --fs-h6: 18px;\n  --fs-lg: 16px;       /* large body */\n  --fs-body: 14px;     /* default UI body */\n  --fs-sm: 13px;\n  --fs-caption: 12px;\n  --fs-notes: 11px;\n  --fs-micro: 10px;\n\n  /* ---- Line heights ---- */\n  --lh-display: 1.05; /* @kind font */\n  --lh-tight: 1.1;     /* @kind font */\n  --lh-snug: 1.3; /* @kind font */\n  --lh-normal: 1.45;   /* @kind font */\n  --lh-relaxed: 1.6; /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-tight: -0.02em; /* @kind font */\n  --ls-normal: 0; /* @kind font */\n  --ls-wide: 0.04em;   /* eyebrows / labels @kind font */\n\n  /* ---- Semantic text roles ---- */\n  --type-display-font: var(--font-display);\n  --type-heading-font: var(--font-display);\n  --type-body-font:    var(--font-ui);\n}\n\n/* ---- Optional helper classes (use tokens directly where you can) ---- */\n.rb-display { font-family: var(--font-display); font-weight: var(--fw-bold);     font-size: var(--fs-display); line-height: var(--lh-display); letter-spacing: var(--ls-tight); color: var(--text-heading); }\n.rb-h1 { font-family: var(--font-display); font-weight: var(--fw-bold);     font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); color: var(--text-heading); }\n.rb-h2 { font-family: var(--font-display); font-weight: var(--fw-bold);     font-size: var(--fs-h2); line-height: var(--lh-tight); color: var(--text-heading); }\n.rb-h3 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-h4 { font-family: var(--font-ui);      font-weight: var(--fw-semibold); font-size: var(--fs-h4); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-h5 { font-family: var(--font-ui);      font-weight: var(--fw-semibold); font-size: var(--fs-h5); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-h6 { font-family: var(--font-ui);      font-weight: var(--fw-semibold); font-size: var(--fs-h6); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-body { font-family: var(--font-ui);    font-weight: var(--fw-regular);  font-size: var(--fs-body); line-height: var(--lh-normal); color: var(--text-body); }\n.rb-caption { font-family: var(--font-ui); font-weight: var(--fw-regular);  font-size: var(--fs-caption); line-height: var(--lh-snug); color: var(--text-muted); }\n.rb-marker { font-family: var(--font-marker); font-weight: var(--fw-bold);  color: var(--text-heading); }\n\n/* ============================================================\n   Rabaed — Spacing, radii, shadows, borders, motion\n   4px base grid. Cards: white, ~12-16px radius, soft shadow + hairline.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 6px;\n  --space-4: 8px;\n  --space-5: 10px;\n  --space-6: 12px;\n  --space-8: 16px;\n  --space-10: 20px;\n  --space-12: 24px;\n  --space-16: 32px;\n  --space-20: 40px;\n  --space-24: 48px;\n  --space-32: 64px;\n  --space-40: 80px;\n\n  /* ---- Radii ---- */\n  --radius-xs: 4px;\n  --radius-sm: 8px;    /* buttons, inputs, chips */\n  --radius-md: 12px;   /* cards, dropdowns */\n  --radius-lg: 16px;   /* large surfaces / KPI cards */\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --border-thin: 1px;\n  --border-thick: 1.5px;\n\n  /* ---- Shadows (warm, low-contrast — sit on the off-white canvas) ---- */\n  --shadow-xs: 0 1px 2px rgba(61, 64, 91, 0.06);\n  --shadow-sm: 0 1px 3px rgba(61, 64, 91, 0.08), 0 1px 2px rgba(61, 64, 91, 0.04);\n  --shadow-md: 0 4px 12px rgba(61, 64, 91, 0.08);\n  --shadow-lg: 0 12px 28px rgba(61, 64, 91, 0.12);\n  --shadow-xl: 0 24px 48px rgba(61, 64, 91, 0.16);\n  --shadow-primary: 0 8px 20px rgba(249, 87, 56, 0.28); /* lifted tomato CTA */\n  --shadow-focus-ring: 0 0 0 3px rgba(249, 87, 56, 0.20);\n\n  /* ---- Layout ---- */\n  --app-rail-w: 72px;       /* slim left icon rail */\n  --app-header-h: 64px;\n  --container-max: 1200px;\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n\n/* ============================================================\n   Rabaed — Form field tokens (surface-aware)\n   Default = white card. Wrap a region in .surface-gray (board canvas)\n   or .theme-dark (navy) and every field/control adapts.\n   ============================================================ */\n:root {\n  --fld-bg: #ffffff;         /* outline field background */\n  --fld-bd: #d5d8de;         /* resting border */\n  --fld-bd-h: #b4b9c3;       /* hover border */\n  --fld-fill: #f1f2f4;       /* filled variant background */\n  --fld-fill-h: #e9ebee;\n  --fld-fill-bd: transparent;\n  --fld-dis: #f6f7f9;\n  --fld-txt: #1f2430;\n  --fld-label: #1f2430;\n  --fld-mut: #6a6e7a;\n  --fld-ph: #9aa0ad;\n  --fld-dis-txt: #a8adb8;\n  --fld-ring: #3b6fd8;\n  --fld-ring-a: rgba(59, 111, 216, .22);\n  --fld-err: #e5484d;\n  --fld-err-a: rgba(229, 72, 77, .20);\n  --fld-ok: #27b86e;\n  --fld-r: 6px;\n  --fld-h: 34px;\n  --fld-h-sm: 28px;\n  --fld-h-inset: 48px;\n  --ctl-off: #c9cdd4;\n  --ctl-on: #f95738;\n  --menu-bg: #ffffff;\n  --menu-bd: #e2e3e7;\n  --menu-hov: #f6f7f9;\n  --ring-offset: #ffffff;\n}\n.surface-gray {\n  --fld-fill: #ffffff;\n  --fld-fill-h: #fbfbfc;\n  --fld-fill-bd: #e7e9ed;\n  --fld-dis: #eef0f3;\n  --ring-offset: #f6f7f9;\n}\n.theme-dark {\n  --fld-bg: #1b2438;\n  --fld-bd: #2f3a55;\n  --fld-bd-h: #46526f;\n  --fld-fill: #1f2940;\n  --fld-fill-h: #253050;\n  --fld-fill-bd: transparent;\n  --fld-dis: #161e31;\n  --fld-txt: #eef0f5;\n  --fld-label: #eef0f5;\n  --fld-mut: #8c94a8;\n  --fld-ph: #6b7488;\n  --fld-dis-txt: #4f5870;\n  --ctl-off: #3a4562;\n  --menu-bg: #1b2438;\n  --menu-bd: #2f3a55;\n  --menu-hov: #243049;\n  --ring-offset: #131b2e;\n}\n\n/* ============================================================\n   Rabaed — UI theme tokens (light default + .theme-dark)\n   Components read --ui-* / --btn-* / --tone-*. Put .theme-dark on\n   <html>, <body> or any region to switch it (and everything inside).\n   ============================================================ */\n:root {\n  --ui-canvas: #f6f7f9;        /* page / board canvas */\n  --ui-surface: #ffffff;       /* cards, header, tabs, columns */\n  --ui-surface-2: #fafbfc;     /* table heads, footers, subtle rows */\n  --ui-border: #e7e9ed;\n  --ui-border-2: #ececef;      /* hairlines inside cards */\n  --ui-border-strong: #d5d8de;\n  --ui-text: #1f2430;\n  --ui-text-2: #3a3f4b;\n  --ui-muted: #6a6e7a;\n  --ui-faint: #9aa0ad;\n  --ui-hover: #f6f7f9;\n  --ui-press: #eef0f3;\n  --ui-overlay: rgba(15, 20, 35, .38);\n  --ui-shadow: 0 1px 2px rgba(31, 36, 48, .05);\n  --ui-shadow-lg: 0 14px 34px rgba(15, 20, 35, .16);\n  --focus-ring: #3b6fd8;\n  --focus-offset: #ffffff;\n\n  --btn-pri: #f95738;  --btn-pri-h: #e84c2e;  --btn-pri-p: #d1492f;  --btn-pri-fg: #ffffff;\n  --btn-sec: #eff0f2;  --btn-sec-h: #e4e6ea;  --btn-sec-p: #d8dbe0;  --btn-sec-fg: #1f2430;\n  --btn-ter: transparent; --btn-ter-h: #eff0f2; --btn-ter-p: #e4e6ea; --btn-ter-fg: #3a3f4b;\n  --btn-dan: #e5484d;  --btn-dan-h: #d63b40;  --btn-dan-p: #bf3136;  --btn-dan-fg: #ffffff;\n  --btn-dis: #eff0f2;  --btn-dis-fg: #a8adb8;\n}\n\n.theme-dark {\n  color-scheme: dark;\n  --ui-canvas: #0f1524;\n  --ui-surface: #
