document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\\ee94\"}\n.ti-calendar-x:before{content:\"\\f832\"}\n.ti-sun:before{content:\"\\eb30\"}\n.ti-message-question:before{content:\"\\f98b\"}\n.ti-checklist:before{content:\"\\f074\"}\n.ti-cloud:before{content:\"\\ea76\"}\n.ti-wind:before{content:\"\\ec34\"}\n.ti-cloud-rain:before{content:\"\\ea72\"}\n.ti-forms:before{content:\"\\ee8f\"}\n.ti-packages:before{content:\"\\f2c9\"}\n.ti-calendar-plus:before{content:\"\\ebba\"}\n.ti-playlist-add:before{content:\"\\f008\"}\n.ti-file-spreadsheet:before{content:\"\\f03e\"}\n.ti-wand:before{content:\"\\ebcb\"}\n.ti-folder-plus:before{content:\"\\eaab\"}\n.ti-file-pencil:before{content:\"\\f039\"}\n.ti-folders:before{content:\"\\eaae\"}\n.ti-file-alert:before{content:\"\\ede6\"}\n.ti-settings-2:before{content:\"\\f5ac\"}\n.ti-cloud-upload:before{content:\"\\ea75\"}\n.ti-file-type-pdf:before{content:\"\\fb10\"}\n.ti-cloud-check:before{content:\"\\f84d\"}\n.ti-device-floppy:before{content:\"\\eb62\"}\n.ti-hand-grab:before{content:\"\\f091\"}\n.ti-arrow-back:before{content:\"\\ea0c\"}\n.ti-replace:before{content:\"\\ebc7\"}\n.ti-hash:before{content:\"\\eabc\"}\n.ti-fingerprint:before{content:\"\\ebd1\"}\n\n/* ============================================================\n   Rabaed — Color tokens\n   Primary  : Tomato  (#F95738)   — dominant brand colour\n   Secondary: Delft Blue (#3D405B) — complements / ink\n   Accent   : Naples Yellow (#F4D35E)\n   Warm     : Orange  (#EE964B)   — gradient partner to Tomato\n   Values lifted from the Rabaed Figma variable collection.\n   ============================================================ */\n\n:root {\n  /* ---- Base neutrals ---- */\n  --white: #ffffff;\n  --black: #121212;\n\n  /* ---- Primary · Tomato ---- */\n  --tomato-50:  #fff4f1;\n  --tomato-100: #feddd7;\n  --tomato-200: #fdc3b7;\n  --tomato-300: #fca898;\n  --tomato-400: #fb8d78;\n  --tomato-500: #fa7258;\n  --tomato-600: #f95738; /* ◀ brand primary */\n  --tomato-700: #d1492f;\n  --tomato-800: #a93b26;\n  --tomato-900: #7e2c1d;\n\n  /* ---- Secondary · Delft Blue ---- */\n  --delft-50:  #eff0f3;\n  --delft-100: #dcdee4;\n  --delft-200: #a8abbe;\n  --delft-300: #80849d;\n  --delft-400: #696f8c;\n  --delft-500: #525677;\n  --delft-600: #3d405b; /* ◀ secondary base */\n  --delft-700: #33364c;\n  --delft-800: #2a2d40;\n  --delft-900: #20212f;\n\n  /* ---- Accent · Naples Yellow ---- */\n  --naples-100: #fdf6df;\n  --naples-300: #f8e192;\n  --naples-500: #f4d35e; /* ◀ accent base */\n  --naples-700: #cdb14f;\n  --naples-800: #a68f40;\n\n  /* ---- Warm · Orange (logo gradient partner) ---- */\n  --orange-100: #fceadb;\n  --orange-200: #f9d9be;\n  --orange-300: #f6c8a1;\n  --orange-500: #f1a768;\n  --orange-600: #ee964b;\n\n  /* ---- Neutral grays ---- */\n  --gray-50:  #f7f7f7;\n  --gray-100: #f2f2f2;\n  --gray-200: #e8e8e8;\n  --gray-300: #dddddd; /* default border / divider */\n  --gray-400: #d2d2d2;\n  --gray-500: #c8c8c8;\n  --gray-600: #9f9f9f;\n  --gray-700: #818181;\n  --gray-800: #626262;\n  --gray-900: #1e1e1e;\n\n  /* ---- Espresso (marketing \"enterprise\" section) ---- */\n  --espresso: #2a1610;\n  --espresso-deep: #1f150f;\n\n  /* ---- Semantic · status ---- */\n  /* Success — a clean, fresh green. Lighter variant (#27b86e, hue ~146°,\n     airy & bright) chosen over the deeper #15a35c after side-by-side. */\n  --success-50:  #eefbf3;\n  --success-100: #dff6e7;\n  --success-200: #bfeccf;  /* tint border (approved card edge) */\n  --success-400: #54cd8a;\n  --success-500: #2fc079;\n  --success-600: #27b86e;  /* ◀ lighter fresh green base — pills, checks, dots */\n  --success-700: #1a9a57;  /* text on light */\n  --success-800: #15803f;\n\n  --danger-100: #f7d4d8;\n  --danger-500: #dd495c;\n  --danger-600: #d81212; /* NCR / reject red */\n\n  --info-500: #0085ff;   /* active / link blue */\n  --blue-action:      #2f6fe0;  /* process blue — \"Pending Approval\" */\n  --blue-action-tint: #e9f0fc;\n\n  --warning-500: #ee964b;\n\n  /* ---- Tonal hue set (chips · status · codes) ----\n     One harmonised set: every hue has a tint (bg), fg (text on tint) and\n     solid (dots, solid pills). Same lightness/chroma across hues. */\n  --tone-green-tint:#e6f7ee;  --tone-green-fg:#16874f;  --tone-green-solid:#27b86e;\n  --tone-amber-tint:#fdf3dc;  --tone-amber-fg:#9a6206;  --tone-amber-solid:#e9a23b;\n  --tone-red-tint:#fdebea;    --tone-red-fg:#c8322b;    --tone-red-solid:#e5484d;\n  --tone-blue-tint:#e8f0fd;   --tone-blue-fg:#2f62c9;   --tone-blue-solid:#3b6fd8;\n  --tone-violet-tint:#f0ecfe; --tone-violet-fg:#6547d6; --tone-violet-solid:#7a5af0;\n  --tone-cyan-tint:#e2f5f8;   --tone-cyan-fg:#0f7688;   --tone-cyan-solid:#1aa3b8;\n  --tone-orange-tint:#fdeee2; --tone-orange-fg:#b8560f; --tone-orange-solid:#ee964b;\n  --tone-gray-tint:#eff0f2;   --tone-gray-fg:#555a66;   --tone-gray-solid:#6a6e7a;\n  --tone-tomato-tint:#fff1ec; --tone-tomato-fg:#c9432a; --tone-tomato-solid:#f95738;\n\n  /* ---- Discipline chips (5 distinct hues) ---- */\n  --chip-cv-bg:var(--tone-amber-tint);  --chip-cv-fg:var(--tone-amber-fg);   /* CV Civil */\n  --chip-ar-bg:var(--tone-violet-tint); --chip-ar-fg:var(--tone-violet-fg);  /* AR Architecture */\n  --chip-el-bg:var(--tone-cyan-tint);   --chip-el-fg:var(--tone-cyan-fg);    /* EL Electrical */\n  --chip-me-bg:var(--tone-green-tint);  --chip-me-fg:var(--tone-green-fg);   /* ME Mechanical */\n  --chip-su-bg:var(--tone-orange-tint); --chip-su-fg:var(--tone-orange-fg);  /* SU Surveying */\n  --chip-das-bg:var(--chip-me-bg);      --chip-das-fg:var(--chip-me-fg);     /* legacy alias */\n  /* ---- Document types — neutral outline lozenge (never coloured) ---- */\n  --doctype-fg:#555a66; --doctype-ring:#d5d8de;\n  --chip-mar-bg:transparent; --chip-mar-fg:var(--doctype-fg);\n  --chip-sar-bg:transparent; --chip-sar-fg:var(--doctype-fg);\n  --chip-npd-bg:transparent; --chip-npd-fg:var(--doctype-fg);\n\n  /* ---- Submittal workflow status (tint bg / fg / dot) ---- */\n  --status-draft-bg:var(--tone-gray-tint);        --status-draft-fg:var(--tone-gray-fg);        --status-draft-dot:#9aa0ad;\n  --status-internal-bg:var(--tone-blue-tint);     --status-internal-fg:var(--tone-blue-fg);     --status-internal-dot:var(--tone-blue-solid);\n  --status-resubmitted-bg:var(--tone-amber-tint); --status-resubmitted-fg:var(--tone-amber-fg); --status-resubmitted-dot:var(--tone-amber-solid);\n  --status-pending-bg:var(--tone-violet-tint);    --status-pending-fg:var(--tone-violet-fg);    --status-pending-dot:var(--tone-violet-solid);\n  --status-approved-bg:var(--tone-green-tint);    --status-approved-fg:var(--tone-green-fg);    --status-approved-dot:var(--tone-green-solid);\n  --status-rejected-bg:var(--tone-red-tint);      --status-rejected-fg:var(--tone-red-fg);      --status-rejected-dot:var(--tone-red-solid);\n  --status-cancelled-bg:var(--tone-gray-tint);    --status-cancelled-fg:var(--tone-gray-fg);    --status-cancelled-dot:var(--tone-gray-solid);\n  /* legacy aliases */\n  --status-submitted-bg:var(--status-resubmitted-bg); --status-submitted-fg:var(--status-resubmitted-fg);\n  --status-created-bg:var(--status-internal-bg);      --status-created-fg:var(--status-internal-fg);\n  --status-notstarted-bg:var(--status-draft-bg);      --status-notstarted-fg:var(--status-draft-fg);\n\n  /* ---- Approval codes + revision ---- */\n  --code-a-bg:var(--tone-green-solid); --code-a-fg:#ffffff;              /* Approved — solid */\n  --code-b-bg:var(--tone-green-tint);  --code-b-fg:var(--tone-green-fg); /* Approved as noted */\n  --code-c-bg:var(--tone-amber-tint);  --code-c-fg:var(--tone-amber-fg); /* Revise & resubmit */\n  --code-d-bg:var(--tone-red-solid);   --code-d-fg:#ffffff;              /* Rejected — solid */\n  --code-a-ring:transparent; --code-b-ring:transparent; --code-c-ring:transparent; --code-d-ring:transparent;\n  --rev-pill-bg:var(--tone-tomato-tint); --rev-pill-fg:var(--tone-tomato-fg); /* R1, R2… */\n  --code-pill-bg:var(--code-a-bg);  --code-pill-fg:var(--code-a-fg);\n\n  /* ---- Chip geometry (shared by status, discipline, code) ---- */\n  --chip-h:24px; --chip-r:7px; --chip-px:9px; --chip-fs:12px;\n  --lozenge-h:20px; --lozenge-r:4px;\n\n  /* ============================================================\n     Semantic aliases — reference these in components, not raw ramps\n     ============================================================ */\n  --color-primary:        var(--tomato-600);\n  --color-primary-hover:  var(--tomato-700);\n  --color-primary-soft:   var(--tomato-100);\n  --color-primary-tint:   var(--tomato-50);\n  --color-secondary:      var(--delft-600);\n  --color-accent:         var(--naples-500);\n\n  --text-heading:  #292d32;          /* near-black ink for titles */\n  --text-body:     var(--delft-600); /* default body copy */\n  --text-muted:    var(--delft-300); /* secondary / captions */\n  --text-faint:    var(--gray-700);  /* placeholders / meta */\n  --text-on-primary: var(--white);\n  --text-link:     var(--tomato-600);\n\n  --surface-page:   #fdf9f5;         /* warm off-white app canvas */\n  --surface-card:   var(--white);\n  --surface-subtle: var(--gray-50);\n  --surface-sunken: var(--gray-100);\n  --surface-board:  #f6f7f9;         /* board / workspace canvas behind white columns */\n  --surface-brand-tint: var(--tomato-50);\n\n  --border-default: var(--gray-300);\n  --border-strong:  var(--gray-400);\n  --border-subtle:  var(--gray-200);\n  --border-focus:   var(--tomato-600);\n\n  --icon-default: #292d32;\n  --icon-muted:   var(--delft-300);\n}\n\n/* ============================================================\n   Rabaed — Typography tokens\n   Display / brand : Montserrat        (Montserrat-Arabic in source)\n   UI / product    : IBM Plex Sans     (IBM Plex Sans Arabic)\n   Marker / accent : Caveat            (substitute — see readme)\n   Scale taken from the Figma type sheet (H1 48/52 … notes 11).\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Montserrat', 'Montserrat Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-ui:      'IBM Plex Sans', 'Thmanyah Sans', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-marker:  'Caveat', 'Montserrat', cursive;\n  /* Arabic: Thmanyah Sans for UI, Thmanyah Serif Display for headlines */\n  --font-arabic:  'Thmanyah Sans', 'IBM Plex Sans Arabic', sans-serif;\n  --font-arabic-display: 'Thmanyah Serif Display', 'Thmanyah Sans', serif;\n  --font-arabic-serif: 'Thmanyah Serif Text', 'Thmanyah Sans', serif;\n\n  /* ---- Weights ---- */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extrabold:800; /* @kind font */\n\n  /* ---- Font sizes (px) ---- */\n  --fs-display: 64px;  /* hero / marketing */\n  --fs-h1: 48px;\n  --fs-h2: 40px;\n  --fs-h3: 32px;\n  --fs-h4: 24px;\n  --fs-h5: 20px;\n  --fs-h6: 18px;\n  --fs-lg: 16px;       /* large body */\n  --fs-body: 14px;     /* default UI body */\n  --fs-sm: 13px;\n  --fs-caption: 12px;\n  --fs-notes: 11px;\n  --fs-micro: 10px;\n\n  /* ---- Line heights ---- */\n  --lh-display: 1.05; /* @kind font */\n  --lh-tight: 1.1;     /* @kind font */\n  --lh-snug: 1.3; /* @kind font */\n  --lh-normal: 1.45;   /* @kind font */\n  --lh-relaxed: 1.6; /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-tight: -0.02em; /* @kind font */\n  --ls-normal: 0; /* @kind font */\n  --ls-wide: 0.04em;   /* eyebrows / labels @kind font */\n\n  /* ---- Semantic text roles ---- */\n  --type-display-font: var(--font-display);\n  --type-heading-font: var(--font-display);\n  --type-body-font:    var(--font-ui);\n}\n\n/* ---- Optional helper classes (use tokens directly where you can) ---- */\n.rb-display { font-family: var(--font-display); font-weight: var(--fw-bold);     font-size: var(--fs-display); line-height: var(--lh-display); letter-spacing: var(--ls-tight); color: var(--text-heading); }\n.rb-h1 { font-family: var(--font-display); font-weight: var(--fw-bold);     font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); color: var(--text-heading); }\n.rb-h2 { font-family: var(--font-display); font-weight: var(--fw-bold);     font-size: var(--fs-h2); line-height: var(--lh-tight); color: var(--text-heading); }\n.rb-h3 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-h4 { font-family: var(--font-ui);      font-weight: var(--fw-semibold); font-size: var(--fs-h4); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-h5 { font-family: var(--font-ui);      font-weight: var(--fw-semibold); font-size: var(--fs-h5); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-h6 { font-family: var(--font-ui);      font-weight: var(--fw-semibold); font-size: var(--fs-h6); line-height: var(--lh-snug); color: var(--text-heading); }\n.rb-body { font-family: var(--font-ui);    font-weight: var(--fw-regular);  font-size: var(--fs-body); line-height: var(--lh-normal); color: var(--text-body); }\n.rb-caption { font-family: var(--font-ui); font-weight: var(--fw-regular);  font-size: var(--fs-caption); line-height: var(--lh-snug); color: var(--text-muted); }\n.rb-marker { font-family: var(--font-marker); font-weight: var(--fw-bold);  color: var(--text-heading); }\n\n/* ============================================================\n   Rabaed — Spacing, radii, shadows, borders, motion\n   4px base grid. Cards: white, ~12-16px radius, soft shadow + hairline.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 6px;\n  --space-4: 8px;\n  --space-5: 10px;\n  --space-6: 12px;\n  --space-8: 16px;\n  --space-10: 20px;\n  --space-12: 24px;\n  --space-16: 32px;\n  --space-20: 40px;\n  --space-24: 48px;\n  --space-32: 64px;\n  --space-40: 80px;\n\n  /* ---- Radii ---- */\n  --radius-xs: 4px;\n  --radius-sm: 8px;    /* buttons, inputs, chips */\n  --radius-md: 12px;   /* cards, dropdowns */\n  --radius-lg: 16px;   /* large surfaces / KPI cards */\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --border-thin: 1px;\n  --border-thick: 1.5px;\n\n  /* ---- Shadows (warm, low-contrast — sit on the off-white canvas) ---- */\n  --shadow-xs: 0 1px 2px rgba(61, 64, 91, 0.06);\n  --shadow-sm: 0 1px 3px rgba(61, 64, 91, 0.08), 0 1px 2px rgba(61, 64, 91, 0.04);\n  --shadow-md: 0 4px 12px rgba(61, 64, 91, 0.08);\n  --shadow-lg: 0 12px 28px rgba(61, 64, 91, 0.12);\n  --shadow-xl: 0 24px 48px rgba(61, 64, 91, 0.16);\n  --shadow-primary: 0 8px 20px rgba(249, 87, 56, 0.28); /* lifted tomato CTA */\n  --shadow-focus-ring: 0 0 0 3px rgba(249, 87, 56, 0.20);\n\n  /* ---- Layout ---- */\n  --app-rail-w: 72px;       /* slim left icon rail */\n  --app-header-h: 64px;\n  --container-max: 1200px;\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n\n/* ============================================================\n   Rabaed — Form field tokens (surface-aware)\n   Default = white card. Wrap a region in .surface-gray (board canvas)\n   or .theme-dark (navy) and every field/control adapts.\n   ============================================================ */\n:root {\n  --fld-bg: #ffffff;         /* outline field background */\n  --fld-bd: #d5d8de;         /* resting border */\n  --fld-bd-h: #b4b9c3;       /* hover border */\n  --fld-fill: #f1f2f4;       /* filled variant background */\n  --fld-fill-h: #e9ebee;\n  --fld-fill-bd: transparent;\n  --fld-dis: #f6f7f9;\n  - 0, 35, .16);\n  --focus-ring: #3b6fd8;\n  --focus-offset: #ffffff;\n\n  --btn-pri: #f95738;  --btn-pri-h: #e84c2e;  --btn-pri-p: #d1492f;  --btn-pri-fg: #ffffff;\n  --btn-sec: #eff0f2;  --btn-sec-h: #e4e6ea;  --btn-sec-p: #d8dbe0;  --btn-sec-fg: #1f2430;\n  --btn-ter: transparent; --btn-ter-h: #eff0f2; --btn-ter-p: #e4e6ea; --btn-ter-fg: #3a3f4b;\n  --btn-dan: #e5484d;  --btn-dan-h: #d63b40;  --btn-dan-p: #bf3136;  --btn-dan-fg: #ffffff;\n  --btn-dis: #eff0f2;  --btn-dis-fg: #a8adb8;\n}\n\n.theme-dark {\n  color-scheme: dark;\n  --ui-canvas: #0f1524;\n  --ui-surface: #161e31;\n  --ui-surface-2: #1a2336;\n  --ui-border: #26314a;\n  --ui-border-2: #222c43;\n  --ui-border-strong: #34405c;\n  --ui-text: #eef0f5;\n  --ui-text-2: #c5cad6;\n  --ui-muted: #8c94a8;\n  --ui-faint: #6b7488;\n  --ui-hover: #1c2539;\n  --ui-press: #232e47;\n  --ui-overlay: rgba(4, 7, 15, .6);\n  --ui-shadow: 0 1px 2px rgba(0, 0, 0, .3);\n  --ui-shadow-lg: 0 16px 40px rgba(0, 0, 0, .45);\n  --focus-ring: #6f97f0;\n  --focus-offset: #161e31;\n\n  --btn-pri: #f95738;  --btn-pri-h: #ff6a4d;  --btn-pri-p: #e0492c;  --btn-pri-fg: #ffffff;\n  --btn-sec: #232e47;  --btn-sec-h: #2b3753;  --btn-sec-p: #33405f;  --btn-sec-fg: #eef0f5;\n  --btn-ter: transparent; --btn-ter-h: #1f2940; --btn-ter-p: #273250; --btn-ter-fg: #c5cad6;\n  --btn-dan: #e5484d;  --btn-dan-h: #f05a5f;  --btn-dan-p: #cc3a3f;  --btn-dan-fg: #ffffff;\n  --btn-dis: #1c2539;  --btn-dis-fg: #4f5870;\n\n  /* tonal hues — translucent tints + lifted text for dark surfaces */\n  --tone-green-tint: rgba(39, 184, 110, .16);  --tone-green-fg: #5ad594;\n  --tone-amber-tint: rgba(233, 162, 59, .16);  --tone-amber-fg: #f2c26b;\n  --tone-red-tint: rgba(229, 72, 77, .18);     --tone-red-fg: #ff8a8d;\n  --tone-blue-tint: rgba(59, 111, 216, .20);   --tone-blue-fg: #8fb2f6;\n  --tone-violet-tint: rgba(122, 90, 240, .20); --tone-violet-fg: #b7a6fb;\n  --tone-cyan-tint: rgba(26, 163, 184, .18);   --tone-cyan-fg: #62d0e1;\n  --tone-orange-tint: rgba(238, 150, =\"${S.lang}\" dir=\"${S.lang==='ar'?'rtl':'ltr'}\" data-act=\"palclose\"><div class=\"pal\" data-stop><div class=\"pal-in\"><i class=\"ti ti-search\"><\u002Fi><input id=\"palq\" placeholder=\"${RS.t('searchPh')}\" value=\"${RS.esc(S.palQ)}\"><kbd>Esc<\u002Fkbd><\u002Fdiv><div class=\"pal-ls\">${ls||`<div class=\"pal-none\">${RS.t('noRes')}<\u002Fdiv>`}<\u002Fdiv><div class=\"pal-ft\"><span><kbd>↑<\u002Fkbd><kbd>↓<\u002Fkbd>${RS.t('nav')}<\u002Fspan><span><kbd>↵<\u002Fkbd>${RS.t('open')}<\u002Fspan><span><kbd>Esc<\u002Fkbd>${RS.t('close')}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>`}\nfunction go(o){S.menu=null;S.pal=false;if(o.project){S.project=o.project;S.tab=o.tab||0}else if(o.page){S.page=o.page;S.project=null}render();scrollTo(0,0)}\nfunction render(){\n const L=(e,a)=>S.lang==='ar'?a:e;\n let ctx,body;\n if(S.project){const p=RP.PROJECTS.find(x=>x.id===S.project);ctx={project:{l:p.l,n:L(p.n,p.na),c:L(p.co,p.coa)}};body=RS.tabs()+`<main class=\"ct\">${RP.project(p,S.tab)}<\u002Fmain>`}\n else{const r=RP[S.page]();ctx={title:r.title,sub:r.sub};body=`<main class=\"ct\">${r.html}<\u002Fmain>`}\n document.documentElement.lang=S.lang;\n const app=document.getElementById('app');\n app.innerHTML=`<div class=\"rs${S.col?' col':''}${S.theme==='light'&&S.mode!=='dark'?' light':''}${S.mode==='dark'?' theme-dark':''}\" lang=\"${S.lang}\" dir=\"${S.lang==='ar'?'rtl':'ltr'}\">${RS.sidebar()}<div class=\"mn\">${RS.header(S,ctx)}${body}<\u002Fdiv><\u002Fdiv>${palette()}`;\n document.body.style.background=S.mode==='dark'?'#0f1524':'';\n document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';\n const pi=document.getElementById('palq');if(pi){pi.focus();pi.setSelectionRange(pi.value.length,pi.value.length)}\n save();\n}\ndocument.addEventListener('click',e=>{\n const b=e.target.closest('button,[data-act]');\n if(!b){if(S.menu){S.menu=null;render()}return}\n const d=b.dataset;\n if(d.nav)return go({page:d.nav});\n if(d.project)return go({project:d.project});\n if(d.toggle){if(S.col){S.col=false;S.open[d.toggle]=true}else S.open[d.toggle]=!S.open[d.toggle];return render()}\n if(d.menu){S.menu=S.menu===d.menu?null:d.menu;return render()}\n if(d.ws){S.ws=+d.ws;S.menu=null;render();return toast(RS.esc(S.lang==='ar'?RS.WS[S.ws].a:RS.WS[S.ws].n))}\n if(d.role){S.role=+d.role;S.menu=null;return render()}\n if(d.lang){S.lang=d.lang;return render()}\n if(d.theme){S.theme=d.theme;return render()}\n if(d.mode){S.mode=d.mode;return render()}\n if(d.tab){S.tab=+d.tab;return render()}\n if(d.pf){RP._pf=d.pf;return render()}\n if(d.roleview){RP._role=+d.roleview;return render()}\n if(d.req){const [k,i]=d.req.split(':');const q=RP._reqs.splice(+i,1)[0];S.joinCount=RP._reqs.length;render();return toast((k==='ok'?(S.lang==='ar'?'تمت الموافقة على ':'Approved '):(S.lang==='ar'?'تم رفض ':'Declined '))+RS.esc(q[0]))}\n if(d.pi!==undefined){const it=palItems()[+d.pi];return go(it.go)}\n if(d.act==='collapse'){S.col=!S.col;S.menu=null;return render()}\n if(d.act==='back')return go({page:'projects'});\n if(d.act==='pal'){S.pal=true;S.palQ='';S.palSel=0;S.menu=null;return render()}\n if(d.act==='palclose'&&!e.target.closest('[data-stop]')){S.pal=false;return render()}\n if(S.menu&&!b.closest('.menu')){S.menu=null;render()}\n});\ndocument.addEventListener('input',e=>{if(e.target.id==='palq'){S.palQ=e.target.value;S.palSel=0;render()}});\ndocument.addEventListener('keydown',e=>{\n if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal=!S.pal;S.palQ='';S.palSel=0;return render()}\n if(e.key==='Escape'&&(S.pal||S.menu)){S.pal=false;S.menu=null;return render()}\n if(S.pal){const n=palItems().length;if(e.key==='ArrowDown'){e.preventDefault();S.palSel=(S.palSel+1)%Math.max(1,n);render()}else if(e.key==='ArrowUp'){e.preventDefault();S.palSel=(S.palSel-1+n)%Math.max(1,n);render()}else if(e.key==='Enter'){const it=palItems()[S.palSel];if(it)go(it.go)}}\n});\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
