<!DOCTYPE html>
<html lang="en">
<head>

<title>Rabaed — Sign in</title>
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);color:var(--ui-text);background:var(--ui-surface);-webkit-font-smoothing:antialiased}

a{color:var(--btn-pri);text-decoration:none;font-weight:600}a:hover{color:var(--tomato-700,#c2410c);text-decoration:underline}
button{font:inherit;cursor:pointer;color:inherit}
.si{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:100vh}
.fp{display:flex;flex-direction:column;padding:28px 48px}
.top{display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;display:block}.brand{display:flex;align-items:center;gap:10px}.bm{width:38px;height:38px;border-radius:11px;background:var(--btn-pri);display:flex;align-items:center;justify-content:center}.bm img{width:21px;height:21px;filter:brightness(0) invert(1)}.brand b{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}html[lang=ar] .brand b{font-family:var(--font-arabic-display)}
.lang{margin-inline-start:auto;display:inline-flex;padding:3px;border-radius:10px;background:var(--ui-surface-2);box-shadow:inset 0 0 0 1px var(--ui-border-2)}
.lang button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ui-muted)}
.lang button.on{background:var(--ui-surface);color:var(--ui-text);box-shadow:0 1px 2px rgba(16,24,40,.1),inset 0 0 0 1px var(--ui-border-2)}
.mid{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}

html[lang=ar] h1{font-family:var(--font-arabic-display);letter-spacing:0}
.sub{margin:-8px 0 0;font-size:15px;color:var(--ui-muted);line-height:1.5;text-wrap:pretty}
.sso{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:11px;border:0;font-size:14.5px;font-weight:600;white-space:nowrap}
.btn.sec{background:var(--ui-surface);box-shadow:inset 0 0 0 1px var(--ui-border)}.btn.sec:hover{background:var(--ui-hover)}
.btn.pri{background:var(--btn-pri);color:#fff;width:100%}.btn.pri:hover{filter:brightness(1.06)}.btn.pri[disabled]{opacity:.7;cursor:default}
.btn .ti{font-size:19px}
.or{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ui-faint)}.or::before,.or::after{content:'';flex:1;height:1px;background:var(--ui-border-2)}
form{display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lb{display:flex;align-items:center;font-size:13px;font-weight:600}
.f .lb a{margin-inline-start:auto;font-size:13px}
.in{position:relative;display:flex;align-items:center}
.in>.ti{position:absolute;inset-inline-start:14px;font-size:18px;color:var(--ui-faint);pointer-events:none}
.in input{width:100%;height:46px;box-sizing:border-box;padding:0 14px 0 42px;padding-inline-start:42px;padding-inline-end:14px;border-radius:11px;border:0;box-shadow:inset 0 0 0 1px var(--ui-border);background:var(--ui-surface);font:inherit;font-size:14.5px;color:var(--ui-text);outline:none;transition:box-shadow .12s}
.in input:focus{box-shadow:inset 0 0 0 1.5px var(--btn-pri),0 0 0 4px var(--tone-tomato-tint)}
.in input[type=email]{direction:ltr;text-align:start}html[lang=ar] .in input[type=email]{text-align:right}html[dir=rtl] .in input[type=email]{padding-right:42px;padding-left:14px}
.in .eye{position:absolute;inset-inline-end:6px;width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--ui-muted);display:flex;align-items:center;justify-content:center}.in .eye:hover{background:var(--ui-hover)}
.in.pw input{padding-inline-end:46px}
.f.er input{box-shadow:inset 0 0 0 1.5px var(--tone-red-solid)}
.em{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tone-red-fg);font-weight:500}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;background:var(--tone-red-tint);color:var(--tone-red-fg);font-size:13.5px;line-height:1.45}.alert .ti{font-size:18px;margin-top:1px}
.alert.ok{background:var(--tone-green-tint);color:var(--tone-green-fg)}
.rem{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ui-text-2);cursor:pointer;user-select:none}
.ck{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--ui-border-strong);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:none}.ck.on{background:var(--btn-pri);box-shadow:none}
.foot{font-size:14px;color:var(--ui-muted);text-align:center}
.legal{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ui-faint)}.legal a{color:var(--ui-muted);font-weight:500}.legal span{margin-inline-end:auto}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;font-size:13.5px;font-weight:600;color:var(--ui-muted);align-self:flex-start}.back:hover{color:var(--ui-text)}
html[lang=ar] .back .ti{transform:scaleX(-1)}
.otp{display:flex;gap:8px;direction:ltr}
.otp input{width:100%;min-width:0;height:56px;border-radius:11px;border:0;box-shadow:inset 0 0 0 1px var(--ui-border);text-align:center;font:700 22px var(--font-ui);color:var(--ui-text);outline:none;background:var(--ui-surface)}
.otp input:focus{box-shadow:inset 0 0 0 1.5px var(--btn-pri),0 0 0 4px var(--tone-tomato-tint)}
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--ui-surface-2);font-size:13.5px}.who b{direction:ltr;unicode-bidi:isolate}.who .ti{color:var(--ui-muted);font-size:18px}.who button{margin-inline-start:auto;border:0;background:transparent;color:var(--btn-pri);font-weight:600;font-size:13px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* visual side — matches rabaedapp.com hero */
.vp{position:relative;margin:16px;border-radius:24px;overflow:hidden;background:#14161C;color:#EDEEF3;display:flex;flex-direction:column;padding:36px 44px 44px;gap:8px}
.vp::before{content:'';position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,rgba(249,87,56,.28),transparent 70%),radial-gradient(50% 50% at 0% 100%,rgba(249,87,56,.08),transparent 70%);pointer-events:none}
html[dir=rtl] .vp::before{background:radial-gradient(70% 60% at 0% 0%,rgba(249,87,56,.28),transparent 70%),radial-gradient(50% 50% at 100% 100%,rgba(249,87,56,.08),transparent 70%)}
.vp>*{position:relative}
.vtop{display:flex;align-items:center;gap:14px}.vtop img{height:34px;width:auto}.vtop span{margin-inline-start:auto;text-align:end;font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.1em;color:#F95738}
html[lang=ar] .vtop span{font-family:var(--font-arabic);letter-spacing:0;font-size:12.5px}
.tri{position:relative;width:100%;max-width:520px;aspect-ratio:600/360;margin:auto auto 0}
.tri svg{position:absolute;inset:0;width:100%;height:100%}
.pty{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.pty span{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:38px;color:#EDEEF3;transition:all .4s}
.pty b{font-size:13px;font-weight:500;color:#9AA0B4;transition:color .4s}
.pty.on span{border-color:#F95738;color:#F95738;background:rgba(249,87,56,.1);box-shadow:0 0 0 8px rgba(249,87,56,.08),0 0 40px rgba(249,87,56,.25)}.pty.on b{color:#EDEEF3}
.doc{position:absolute;transform:translate(-50%,-50%);width:34px;height:40px;border-radius:7px;background:#F95738;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 0 6px #14161C,0 6px 20px rgba(249,87,56,.5);transition:left .9s cubic-bezier(.6,0,.3,1),top .9s cubic-bezier(.6,0,.3,1);z-index:2;margin-top:-58px}
.hst{white-space:nowrap;margin-top:18px;align-self:center;display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 16px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:auto}
.hst i{width:7px;height:7px;border-radius:50%;background:#F95738}.hst b{font-weight:500;font-variant-numeric:tabular-nums}
.vc{display:flex;flex-direction:column;gap:14px}
.vc h2{color:#EDEEF3;margin:0;font-family:var(--font-display);font-size:40px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
html[lang=ar] .vc h2{font-family:'IBM Plex Sans Arabic',var(--font-arabic);letter-spacing:0;line-height:1.35}
.vc h2 em{font-style:normal;color:#F95738}
.vc p{margin:0;font-size:15.5px;line-height:1.6;color:#9AA0B4;max-width:500px;text-wrap:pretty}
@media (max-height:760px){.tri{max-width:400px}.vc h2{font-size:32px}}
@media (max-width:960px){.si{grid-template-columns:1fr}.vp{display:none}.fp{padding:20px 20px}}
@media (max-width:440px){h1{font-size:26px}.sso{grid-template-columns:1fr}}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#f8552f"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#f8552f"/><rect x="30" y="34" width="40" height="8" rx="4" fill="#fff"/><rect x="30" y="48" width="40" height="8" rx="4" fill="#fff" opacity=".6"/><rect x="30" y="62" width="40" height="8" rx="4" fill="#131b2e"/></svg></template>
<div class="si" id="app"></div>
<script>
const st={lang:'en',step:'in',email:'',pw:'',show:false,rem:true,err:null,busy:false,sent:false,act:'ctr',dx:'18%',dy:'80%',stat:'Sent · 07:12'};
const rtlX=p=>(st.lang==='ar'?100-p:p)+'%';
try{const o=JSON.parse(localStorage.getItem('rb-shell-v1')||'{}');if(o.lang)st.lang=o.lang}catch(e){}
const L=(e,a)=>st.lang==='ar'?a:e;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MS='<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>';
function form(){
 if(st.step==='otp')return `<button class="back" data-go="in"><i class="ti ti-arrow-left"></i>${L('Back','رجوع')}</button><div><h1>${L('Check your email','تحقق من بريدك')}</h1></div><p class="sub">${L('We sent a 6-digit code to confirm it’s you. It expires in 10 minutes.','أرسلنا رمزًا من 6 أرقام للتأكد من هويتك. تنتهي صلاحيته خلال 10 دقائق.')}</p>
 <div class="who"><i class="ti ti-mail"></i><b>${esc(st.email||'hafiz@tmc.test')}</b><button data-go="in">${L('Change','تغيير')}</button></div>
 ${st.err?`<div class="alert"><i class="ti ti-alert-circle"></i><span>${st.err}</span></div>`:''}
 <form data-f="otp"><div class="f"><span class="lb">${L('Verification code','رمز التحقق')}</span><div class="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="${L('Digit','رقم')} ${i+1}" data-o="${i}">`).join('')}</div></div>
 <label class="rem" data-rem><span class="ck${st.rem?' on':''}">${st.rem?'<i class="ti ti-check"></i>':''}</span>${L('Trust this device for 30 days','الوثوق بهذا الجهاز لمدة 30 يومًا')}</label>
 <button class="btn pri" ${st.busy?'disabled':''}>${st.busy?'<span class="spin"></span>':''}${L('Verify & sign in','تحقق وسجّل الدخول')}</button></form>
 <p class="foot">${L('Didn’t get it?','لم يصلك؟')} <a href="#" data-resend>${st.sent?L('Sent again','أُعيد الإرسال'):L('Resend code','إعادة إرسال الرمز')}</a></p>`;
 if(st.step==='forgot')return `<button class="back" data-go="in"><i class="ti ti-arrow-left"></i>${L('Back to sign in','العودة لتسجيل الدخول')}</button><div><h1>${L('Reset your password','إعادة تعيين كلمة المرور')}</h1></div><p class="sub">${L('Enter your work email. If it has a Rabaed account, we’ll send a reset link.','أدخل بريد العمل. إن كان لديه حساب في ربائد، سنرسل رابط إعادة التعيين.')}</p>
 ${st.sent?`<div class="alert ok"><i class="ti ti-circle-check"></i><span>${L('Check your inbox — the link is valid for 1 hour.','تحقق من بريدك — الرابط صالح لمدة ساعة.')}</span></div>`:''}
 <form data-f="forgot"><div class="f"><label for="fe">${L('Work email','بريد العمل')}</label><div class="in"><i class="ti ti-mail"></i><input id="fe" type="email" value="${esc(st.email)}" placeholder="name@company.test" autocomplete="email"></div></div><button class="btn pri">${L('Send reset link','إرسال رابط إعادة التعيين')}</button></form>`;
 const eE=st.err==='email',eP=st.err==='pw',eB=st.err==='bad';
 return `<div><h1>${L('Sign in to Rabaed','سجّل الدخول إلى ربائد')}</h1></div><p class="sub">${L('Submittals, inspections and site reports for every party on the project.','التقديمات والفحوصات وتقارير الموقع لكل أطراف المشروع.')}</p>
 <div class="sso"><button class="btn sec" data-sso>${MS}${L('Microsoft','مايكروسوفت')}</button><button class="btn sec" data-sso><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.2z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.2 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.8-.7-4.3s.3-2.9.7-4.3V14H4.5C3 17 2 20.4 2 24s1 7 2.5 10l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.8 4.5 14l7.3 5.7c1.7-5.2 6.5-8.9 12.2-8.9z"/></svg>${L('Google','جوجل')}</button></div>
 <div class="or">${L('or with email','أو بالبريد الإلكتروني')}</div>
 ${eB?`<div class="alert"><i class="ti ti-alert-circle"></i><span>${L('That email and password don’t match. Check them and try again.','البريد وكلمة المرور غير متطابقين. تحقق وحاول مرة أخرى.')}</span></div>`:''}
 <form data-f="in" novalidate>
 <div class="f${eE?' er':''}"><label for="em">${L('Work email','بريد العمل')}</label><div class="in"><i class="ti ti-mail"></i><input id="em" type="email" value="${esc(st.email)}" placeholder="name@company.test" autocomplete="email"></div>${eE?`<span class="em"><i class="ti ti-alert-circle"></i>${L('Enter a valid email','أدخل بريدًا صحيحًا')}</span>`:''}</div>
 <div class="f${eP?' er':''}"><div class="lb"><label for="pw">${L('Password','كلمة المرور')}</label><a href="#" data-go="forgot">${L('Forgot password?','نسيت كلمة المرور؟')}</a></div><div class="in pw"><i class="ti ti-lock"></i><input id="pw" type="${st.show?'text':'password'}" value="${esc(st.pw)}" autocomplete="current-password"><button type="button" class="eye" data-eye aria-label="${st.show?L('Hide password','إخفاء كلمة المرور'):L('Show password','إظهار كلمة المرور')}"><i class="ti ti-${st.show?'eye-off':'eye'}"></i></button></div>${eP?`<span class="em"><i class="ti ti-alert-circle"></i>${L('Enter your password','أدخل كلمة المرور')}</span>`:''}</div>
 <label class="rem" data-rem><span class="ck${st.rem?' on':''}">${st.rem?'<i class="ti ti-check"></i>':''}</span>${L('Keep me signed in','أبقني مسجلًا')}</label>
 <button class="btn pri" ${st.busy?'disabled':''}>${st.busy?'<span class="spin"></span>':''}${L('Sign in','تسجيل الدخول')}</button></form>
 <p class="foot">${L('New to Rabaed? Ask your project admin for an invite.','جديد في ربائد؟ اطلب دعوة من مسؤول المشروع.')}</p>`}
function render(){document.documentElement.lang=st.lang;document.documentElement.dir=st.lang==='ar'?'rtl':'ltr';
 document.getElementById('app').innerHTML=`<section class="fp"><div class="top"><img class="logo" src="../../assets/brand/rabaed-logo-on-light.png" alt="${L('Rabaed','ربائد')}"><div class="lang">${[['en','English'],['ar','العربية']].map(l=>`<button class="${st.lang===l[0]?'on':''}" data-lang="${l[0]}">${l[1]}</button>`).join('')}</div></div>
 <div class="mid"><div class="card">${form()}</div></div>
 <div class="legal"><span>© 2026 Rabaed</span><a href="#">${L('Privacy','الخصوصية')}</a><a href="#">${L('Terms','الشروط')}</a><a href="#">${L('Help','المساعدة')}</a></div></section>
 <aside class="vp"><div class="vtop"><img src="../../assets/brand/rabaed-logo-on-dark.png" alt=""><span>${L('Construction project operating system','نظام تشغيل مشاريع الإنشاء')}</span></div>
 <div class="tri" aria-hidden="true"><svg viewBox="0 0 600 360" fill="none"><g stroke="rgba(255,255,255,.22)" stroke-width="1.6" stroke-dasharray="7 7" stroke-linecap="round"><line x1="210" y1="290" x2="390" y2="290"/><line x1="430" y1="240" x2="330" y2="120"/><line x1="270" y1="120" x2="170" y2="240"/></g></svg>
 ${[['own','ti-building-skyscraper',L('Owner','المالك'),'50%','22%'],['ctr','ti-crane',L('Contractor','المقاول'),rtlX(18),'80%'],['con','ti-ruler-2',L('Consultant','الاستشاري'),rtlX(82),'80%']].map(p=>`<div class="pty ${p[0]}${st.act===p[0]?' on':''}" style="left:${p[3]};top:${p[4]}"><span><i class="ti ${p[1]}"></i></span><b>${p[2]}</b></div>`).join('')}
 <span class="doc" style="left:${st.dx};top:${st.dy}"><i class="ti ti-file-text"></i></span></div>
 <div class="hst"><i></i><b>${st.stat}</b></div>
 <div class="vc"><h2>${L('Three parties.','ثلاثة أطراف.')}<br>${L('One record.','سجل واحد.')}<br><em>${L('Clear accountability.','مسؤولية واضحة.')}</em></h2><p>${L('Owner, consultant and contractor on one platform — every step recorded and dated in the name of whoever took it.','المالك والاستشاري والمقاول على منصة واحدة — وكل خطوة موثّقة ومؤرخة باسم من قام بها.')}</p></div></aside>`;
 const o=document.querySelector('[data-o="0"]');if(o)o.focus()}
const keep=()=>{const e=document.getElementById('em')||document.getElementById('fe'),p=document.getElementById('pw');if(e)st.email=e.value;if(p)st.pw=p.value};
document.addEventListener('click',e=>{const t=e.target.closest('[data-lang],[data-go],[data-eye],[data-rem],[data-sso],[data-resend]');if(!t)return;const d=t.dataset;
 if(t.tagName==='A')e.preventDefault();keep();
 if(d.lang){st.lang=d.lang;tk=Math.max(0,tk-1);setTimeout(tick,0);try{const o=JSON.parse(localStorage.getItem('rb-shell-v1')||'{}');o.lang=d.lang;localStorage.setItem('rb-shell-v1',JSON.stringify(o))}catch(x){}}
 if(d.go){st.step=d.go;st.err=null;st.sent=false}
 if(d.eye!==undefined)st.show=!st.show;
 if(d.rem!==undefined){e.preventDefault();st.rem=!st.rem}
 if(d.sso!==undefined){st.busy=true;render();return setTimeout(()=>{st.busy=false;st.step='otp';st.email=st.email||'hafiz@tmc.test';render()},700)}
 if(d.resend!==undefined)st.sent=true;
 render()});
document.addEventListener('submit',e=>{e.preventDefault();keep();const f=e.target.dataset.f;
 if(f==='in'){st.err=!/^\S+@\S+\.\S+$/.test(st.email)?'email':!st.pw?'pw':st.pw.length<4?'bad':null;if(st.err)return render();st.busy=true;render();setTimeout(()=>{st.busy=false;st.step='otp';render()},700)}
 if(f==='forgot'){st.sent=true;render()}
 if(f==='otp'){const v=[...document.querySelectorAll('[data-o]')].map(i=>i.value).join('');if(v.length<6){st.err=L('Enter all 6 digits.','أدخل الأرقام الستة.');return render()}st.busy=true;render();setTimeout(()=>location.href='saas-shell.html',600)}});
document.addEventListener('input',e=>{const i=e.target.closest('[data-o]');if(!i)return;i.value=i.value.replace(/\D/g,'').slice(-1);if(i.value){const n=document.querySelector(`[data-o="${+i.dataset.o+1}"]`);n?n.focus():null}});
document.addEventListener('keydown',e=>{const i=e.target.closest('[data-o]');if(i&&e.key==='Backspace'&&!i.value){const p=document.querySelector(`[data-o="${+i.dataset.o-1}"]`);if(p)p.focus()}});
document.addEventListener('paste',e=>{const i=e.target.closest('[data-o]');if(!i)return;const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!v)return;e.preventDefault();document.querySelectorAll('[data-o]').forEach((x,k)=>x.value=v[k]||'')});
render();
let tk=0;const SEQ=()=>[['ctr',18,80,L('Sent · 07:12','أُرسل · 07:12')],['con',82,80,L('Reviewed · 09:40','رُوجع · 09:40')],['own',50,22,L('Approved · 12:05','اعتُمد · 12:05')]];
function tick(){const s=SEQ()[tk%3];st.act=s[0];st.dx=rtlX(s[1]);st.dy=s[2]+'%';st.stat=s[3];const d=document.querySelector('.doc'),hs=document.querySelector('.hst b');if(d){d.style.left=st.dx;d.style.top=st.dy}if(hs)hs.textContent=st.stat;document.querySelectorAll('.pty').forEach(p=>p.classList.toggle('on',p.classList.contains(st.act)));tk++}
tick();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(tick,2400);
</script>
</body>
